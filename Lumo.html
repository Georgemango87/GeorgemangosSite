<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCraft — Visual Website Creator</title>
<link rel="icon" type="image/png" sizes="512x512" href="/face.png">
<style>
/* ============================================================
   EDITOR UI STYLES
   ============================================================ */
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --panel3:#252a35;
  --border:#2a2f3a; --text:#e6e9ef; --muted:#8b93a7;
  --accent:#5b8cff; --accent2:#7c5cff; --danger:#ef4444; --ok:#22c55e;
  --radius:8px; --shadow:0 8px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f7f8fb; --panel3:#eceff5;
  --border:#d8dde6; --text:#1c2230; --muted:#6b7280;
  --shadow:0 8px 30px rgba(20,30,60,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;overflow:hidden;
}
button{font-family:inherit;font-size:12px;color:var(--text);background:var(--panel2);
  border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;transition:.12s}
button:hover{background:var(--panel3);border-color:var(--accent)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.1)}
button.mini{padding:2px 6px;font-size:11px;border-radius:5px}
button.icon{padding:6px 8px}
input,select,textarea{font-family:inherit;font-size:12px;color:var(--text);background:var(--panel2);
  border:1px solid var(--border);border-radius:6px;padding:5px 7px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
label{font-size:11px;color:var(--muted)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
#app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.brand{font-weight:700;font-size:14px;letter-spacing:.3px;display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
  background-clip:text;color:transparent;margin-right:6px}
.tb-group{display:flex;gap:4px;align-items:center;padding:2px;border-radius:8px}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.spacer{flex:1}
.devices{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:8px;border:1px solid var(--border)}
.devices button{border:none;background:transparent;padding:4px 9px;border-radius:6px}
.devices button.active{background:var(--accent);color:#fff}
.zoomctl{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:2px 4px}
.zoomctl button{border:none;background:transparent;padding:3px 6px}
.zoomctl span{min-width:38px;text-align:center;font-size:11px;color:var(--muted)}

.main{flex:1;display:flex;min-height:0}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;
  width:230px;flex-shrink:0;min-width:170px}
.sidebar.right{border-right:none;border-left:1px solid var(--border);width:300px;min-width:240px}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tabs button{flex:1;border:none;background:transparent;border-radius:0;padding:9px 6px;color:var(--muted);
  font-size:11px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent);background:var(--panel2)}
.tab-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px}
.hidden{display:none !important}

/* ---------- Palette ---------- */
.pal-cat{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:12px 0 6px;font-weight:700}
.pal-cat:first-child{margin-top:0}
.pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pal-item{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--panel2);
  border:1px solid var(--border);border-radius:7px;cursor:grab;font-size:11px;user-select:none;transition:.12s}
.pal-item:hover{border-color:var(--accent);background:var(--panel3);transform:translateY(-1px)}
.pal-item:active{cursor:grabbing}
.pal-item .ic{font-size:13px;width:16px;text-align:center;opacity:.85}

/* ---------- Layers tree ---------- */
.tree-row{display:flex;align-items:center;gap:4px;padding:4px 5px;border-radius:6px;cursor:pointer;
  font-size:11.5px;user-select:none;position:relative}
.tree-row:hover{background:var(--panel2)}
.tree-row.sel{background:var(--accent);color:#fff}
.tree-row.sel .muted{color:#dbe4ff}
.tree-row .ic{width:14px;text-align:center;font-size:11px;opacity:.8}
.tree-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .acts{display:none;gap:2px}
.tree-row:hover .acts{display:flex}
.tree-row .acts button{padding:1px 4px;font-size:10px;background:transparent;border:none;opacity:.7}
.tree-row .acts button:hover{opacity:1;background:rgba(255,255,255,.15)}
.tree-kids{margin-left:11px;border-left:1px dashed var(--border);padding-left:5px}
.tree-row.dragover-top{box-shadow:inset 0 2px 0 var(--accent)}
.tree-row.dragover-bottom{box-shadow:inset 0 -2px 0 var(--accent)}
.tree-row.dragover-inside{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- Canvas ---------- */
.center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.pagebar{display:flex;align-items:center;gap:5px;padding:6px 10px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.page-tab{padding:4px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);
  font-size:11.5px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.page-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page-tab .x{opacity:.6;font-size:12px}
.page-tab .x:hover{opacity:1}

/* >>> CHANGED: viewport is a block scroller, page lives inside a sized "stage" <<< */
.viewport{flex:1;overflow:auto;padding:24px;display:block;
  background:
    radial-gradient(circle at 1px 1px, rgba(128,140,170,.18) 1px, transparent 0) 0 0/22px 22px,
    var(--bg)}
.stage{position:relative;margin:0 auto}
.canvas-page{position:absolute;top:0;left:0;background:#fff;color:#111;box-shadow:var(--shadow);
  border-radius:4px;min-height:600px;transform-origin:top left}
#canvas-content{position:relative;z-index:1}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:9999;--inv:1}

/* >>> CHANGED: overlay chrome counter-scales so it stays a constant screen size <<< */
.sel-box{position:absolute;border:calc(2px * var(--inv)) solid var(--accent);
  border-radius:calc(2px * var(--inv));pointer-events:none}
.sel-label{position:absolute;background:var(--accent);color:#fff;
  font-size:calc(10px * var(--inv));
  padding:calc(2px * var(--inv)) calc(6px * var(--inv));
  border-radius:calc(4px * var(--inv)) calc(4px * var(--inv)) calc(4px * var(--inv)) 0;
  white-space:nowrap;pointer-events:none;font-weight:600}
.handle{position:absolute;width:calc(9px * var(--inv));height:calc(9px * var(--inv));
  background:#fff;border:calc(2px * var(--inv)) solid var(--accent);
  border-radius:calc(2px * var(--inv));pointer-events:auto}
.handle[data-dir="nw"],.handle[data-dir="se"]{cursor:nwse-resize}
.handle[data-dir="ne"],.handle[data-dir="sw"]{cursor:nesw-resize}
.handle[data-dir="n"],.handle[data-dir="s"]{cursor:ns-resize}
.handle[data-dir="e"],.handle[data-dir="w"]{cursor:ew-resize}
.drop-line{position:absolute;height:calc(3px * var(--inv));background:var(--accent);border-radius:2px;
  pointer-events:none;box-shadow:0 0 0 calc(1px * var(--inv)) rgba(91,140,255,.4)}
.drop-inside{position:absolute;border:calc(2px * var(--inv)) dashed var(--accent);
  background:rgba(91,140,255,.08);border-radius:calc(4px * var(--inv));pointer-events:none}

/* ---------- Canvas element editor affordances ---------- */
.vce-el{transition:outline .08s}
.vce-el:hover{outline:1px dashed rgba(91,140,255,.55);outline-offset:-1px}
.vce-el.vce-locked:hover{outline:1px dashed rgba(239,68,68,.6)}
.vce-el.vce-hidden-el{opacity:.35;filter:grayscale(1)}
.vce-empty{min-height:44px;outline:1px dashed rgba(120,130,160,.45);outline-offset:-2px;
  display:block;position:relative}
.vce-empty::after{content:"Drop here";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:11px;color:rgba(120,130,160,.85);pointer-events:none;
  font-family:system-ui,sans-serif}
.vce-page-root{min-height:100%}

/* ---------- Right panel controls ---------- */
.sec{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:var(--panel2);
  overflow:hidden}
.sec>summary{padding:8px 10px;cursor:pointer;font-weight:600;font-size:11.5px;user-select:none;
  list-style:none;display:flex;align-items:center;gap:6px;color:var(--text)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"▸";font-size:9px;transition:.15s;color:var(--muted)}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec-body{padding:8px 10px 11px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:88px 1fr;gap:7px;align-items:center}
.row>label{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row.full{grid-template-columns:1fr}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.grid4 input{padding:4px 5px;font-size:11px;text-align:center}
.hint{font-size:10.5px;color:var(--muted);line-height:1.5}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.color-wrap{display:flex;gap:5px;align-items:center}
.color-wrap input[type=color]{width:32px;height:26px;padding:1px;border-radius:5px;cursor:pointer;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel3);border:1px solid var(--border);
  border-radius:20px;padding:3px 9px;font-size:11px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.subhead{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;
  margin-top:4px}
.device-banner{background:linear-gradient(135deg,rgba(91,140,255,.18),rgba(124,92,255,.18));
  border:1px solid var(--accent);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;
  font-size:11.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.5}

/* ---------- Interactions ---------- */
.ix-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel2);
  padding:9px;margin-bottom:8px;display:flex;flex-direction:column;gap:7px}
.ix-head{display:flex;align-items:center;gap:6px;font-weight:600;font-size:11.5px}
.ix-head .spacer{flex:1}
.ix-action{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:7px;
  display:flex;flex-direction:column;gap:6px}
.ix-cond{display:grid;grid-template-columns:1fr auto 1fr;gap:5px;align-items:center}

/* ---------- Modals ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.72);display:flex;align-items:center;
  justify-content:center;z-index:10000;backdrop-filter:blur(3px);padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;max-width:96vw;max-height:92vh;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:14px;font-weight:700}
.modal-body{padding:16px;overflow:auto;flex:1}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.modal-close{margin-left:auto;background:transparent;border:none;font-size:18px;line-height:1;opacity:.6}
.modal-close:hover{opacity:1;background:transparent}

.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tpl-card{border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;
  background:var(--panel2);transition:.13s;text-align:center}
.tpl-card:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--panel3)}
.tpl-card .em{font-size:26px;margin-bottom:6px}
.tpl-card .t{font-weight:600;font-size:12px}
.tpl-card .d{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}

.code-tabs{display:flex;gap:4px;margin-bottom:10px}
.code-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
pre.code{background:#0b0e14;color:#c9d1d9;border:1px solid var(--border);border-radius:8px;padding:12px;
  overflow:auto;font-size:11.5px;line-height:1.6;max-height:60vh;margin:0;
  font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre}
iframe.preview-frame{width:100%;height:70vh;border:1px solid var(--border);border-radius:8px;background:#fff}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel3);
  border:1px solid var(--accent);color:var(--text);padding:9px 18px;border-radius:20px;font-size:12px;
  z-index:20000;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

.resizer{width:5px;cursor:col-resize;background:transparent;flex-shrink:0}
.resizer:hover{background:var(--accent)}

/* ============ Docs modal ============ */
#docsNav button{display:flex;gap:8px;align-items:center;text-align:left;padding:8px 10px;
  border-radius:6px;background:transparent;border:none;font-size:12px;color:var(--muted);
  width:100%;cursor:pointer;transition:.12s}
#docsNav button:hover{background:var(--panel3);color:var(--text);border-color:transparent}
#docsNav button.active{background:var(--accent);color:#fff}
#docsContent h2{font-size:20px;margin:0 0 14px;color:var(--text)}
#docsContent h3{font-size:14px;margin:22px 0 8px;color:var(--text)}
#docsContent p{margin:0 0 12px;color:var(--text);line-height:1.65;font-size:13px}
#docsContent ul,#docsContent ol{margin:0 0 14px;padding-left:22px;font-size:13px;line-height:1.7}
#docsContent li{margin-bottom:4px}
#docsContent code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
  background:var(--panel3);padding:1px 6px;border-radius:4px;color:var(--text)}
#docsContent pre{background:#0b0e14;color:#c9d1d9;border:1px solid var(--border);border-radius:8px;
  padding:12px;overflow:auto;font-size:11.5px;line-height:1.6;margin:0 0 14px;
  font-family:ui-monospace,Menlo,monospace;white-space:pre}
#docsContent table{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:12.5px}
#docsContent th,#docsContent td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border)}
#docsContent th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.05em}
#docsContent kbd{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;
  background:var(--panel3);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:5px;padding:2px 7px;color:var(--text);min-width:22px;text-align:center}
.docs-tip{padding:11px 14px;background:rgba(91,140,255,.10);border-left:3px solid var(--accent);
  border-radius:6px;font-size:12.5px;margin:14px 0;color:var(--text);line-height:1.6}
.docs-warn{padding:11px 14px;background:rgba(239,68,68,.08);border-left:3px solid var(--danger);
  border-radius:6px;font-size:12.5px;margin:14px 0;color:var(--text);line-height:1.6}

  /* ============================================================
   MOBILE / TABLET EDITOR LAYOUT
   ============================================================ */
.mobile-only{display:none !important}
.mobile-backdrop{display:none}

@media (max-width: 900px) {
  .mobile-only{display:inline-flex !important;align-items:center;justify-content:center}

  /* Sidebars become off-canvas drawers */
  .sidebar{
    position:fixed; top:0; bottom:0; left:0; z-index:500;
    width:min(320px, 88vw); min-width:0;
    transform:translateX(-105%);
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow);
    border-right:1px solid var(--border);
  }
  .sidebar.right{
    left:auto; right:0;
    transform:translateX(105%);
    border-left:1px solid var(--border);
    border-right:none;
    width:min(360px, 92vw);
  }
  .sidebar.open{transform:translateX(0)}
  .resizer{display:none}

  /* Backdrop */
  .mobile-backdrop{
    position:fixed; inset:0; background:rgba(5,8,14,.55);
    z-index:450; backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .mobile-backdrop.show{display:block; opacity:1; pointer-events:auto}

  /* Toolbar compaction */
  .topbar{padding:6px 8px; gap:5px}
  .topbar .tb-group button{padding:6px 9px; font-size:11.5px}
  .brand{font-size:13px; margin-right:2px}
  .devices button{padding:5px 8px; font-size:11px}
  .devices button .dev-emoji{display:none}
  .viewport{padding:14px 10px}
  .zoomctl span{min-width:34px}

  /* Docs modal: horizontal topic strip */
  #docsNav{
    flex-direction:row !important;
    width:100% !important;
    border-right:none !important;
    border-bottom:1px solid var(--border);
    overflow-x:auto; overflow-y:hidden;
    gap:4px !important;
  }
  #docsNav button{white-space:nowrap; flex-shrink:0}
  #docsNav button span:last-child{display:none}
  #docsNav button span:first-child{font-size:18px}
}

@media (max-width: 640px) {
  .topbar{gap:4px; padding:6px}
  .topbar .tb-group{gap:3px; padding:0}
  .topbar .tb-group button{padding:6px 8px; font-size:11px}
  .tb-sep{display:none}
  .brand{font-size:12px}
  .devices{padding:2px}
  .devices button{padding:5px 6px; font-size:10.5px}
  .viewport{padding:10px 6px}
  .modal-body{padding:12px}
  .modal-head, .modal-foot{padding:10px 12px}
  .row{grid-template-columns:78px 1fr}
  .pal-grid{grid-template-columns:1fr 1fr}
  .pal-item{padding:9px 8px; font-size:12px}
}

@media (max-width: 480px) {
  .brand{display:none}
  .devices button{padding:4px 5px}
  .topbar .tb-group button{padding:5px 7px; font-size:10.5px}
  .pal-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= TOP TOOLBAR ================= -->
  <div class="topbar">
    <button id="openLeftPanel" class="icon mobile-only" title="Elements &amp; Layers">☰</button>
    <div class="brand">◆ WebCraft</div>
    <div class="tb-group">
      <button id="btn-new" title="New project">New</button>
      <button id="btn-undo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="btn-redo" title="Redo (Ctrl+Y)">↷ Redo</button>
      <button id="btn-save" title="Save project JSON (Ctrl+S)">Save</button>
      <button id="btn-load" title="Load project JSON">Load</button>
      <button id="btn-import" title="Import an HTML file">Import</button>
      <button id="btn-docs" title="Help &amp; documentation (F1)">📖 Docs</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button id="btn-preview" title="Preview generated website">▶ Preview</button>
      <button id="btn-code" title="View generated HTML/CSS/JS">Code</button>
      <button id="btn-export" class="primary" title="Export one self-contained HTML file">⬇ Export HTML</button>
    </div>
    <div class="spacer"></div>
    <div class="devices" id="devices">
      <button data-device="desktop" class="active">🖥 Desktop</button>
      <button data-device="tablet">📱 Tablet</button>
      <button data-device="mobile">📱 Mobile</button>
    </div>
    <!-- >>> CHANGED: added a "fit to screen" button <<< -->
    <div class="zoomctl">
      <button id="zoom-out" title="Zoom out">−</button>
      <span id="zoom-val">100%</span>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-fit" title="Fit to screen (Ctrl+0)">⤢</button>
    </div>
    <button id="btn-theme" class="icon" title="Toggle theme">🌙</button>
    <button id="openRightPanel" class="icon mobile-only" title="Properties &amp; Actions">⚙</button>
  </div>

  <!-- ================= MAIN ================= -->
  <div class="main">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="leftSidebar">
      <div class="tabs" id="leftTabs">
        <button data-tab="elements" class="active">Elements</button>

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function escAttr(s) { return esc(s); }

const VOID_TAGS = new Set(['img','hr','br','input','source','area','base','col','embed','link','meta','track','wbr']);

function toHex(c) {
  if (!c) return null;
  c = String(c).trim();
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  if (/^#[0-9a-f]{3}$/i.test(c)) return '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  const m = c.match(/^rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
  if (m) return '#' + [1,2,3].map(i => (+m[i]).toString(16).padStart(2,'0')).join('');
  return null;
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function download(filename, content, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}

const CONTAINER_TYPES = new Set([
  'page','section','container','row','column','grid','centered',

function canContain(node) { return CONTAINER_TYPES.has(node.type) && !node.void; }
function isTextType(node) { return TEXT_TYPES.has(node.type); }

/* ==========================================================================
   3. DOCUMENT MODEL
   ========================================================================== */
function createNode(type, overrides) {
  const def = ELEMENTS[type] || { tag: 'div', label: type };
  const node = {
    id: uid('el'), type,
    name: def.label || type,
    tag: def.tag || 'div',
    text: def.text !== undefined ? def.text : '',
    html: def.html || '',
    attrs: clone(def.attrs || {}),
    styles: clone(def.styles || {}),
    responsive: { tablet: {}, mobile: {} },
    classes: '', customCSS: '',
    children: [], interactions: [],
    locked: false, hidden: false,
    void: !!def.void,
    imported: false
  };
  if (overrides) {
    for (const k in overrides) {
      if (k === 'styles') node.styles = Object.assign({}, node.styles, overrides.styles);
      else if (k === 'attrs') node.attrs = Object.assign({}, node.attrs, overrides.attrs);
      else if (k === 'responsive') node.responsive = Object.assign({ tablet:{}, mobile:{} }, overrides.responsive);
      else node[k] = overrides[k];
    }
  }
  // Auto-build editable children for template elements (Card, Hero, Table, etc.)
  if (def.build && !node.children.length) def.build(node);
  return node;
}

function createPage(name) {
  const root = createNode('page', {
    name: name || 'Page',
    styles: { 'min-height':'100vh', 'padding':'0', 'background':'#ffffff' }
  });
  root.id = uid('page');
  return { id: root.id, name: name || 'Home', root };
}

function walk(node, fn, parent) {
  fn(node, parent);
  if (node.children) for (const c of node.children) walk(c, fn, node);
}

function findNode(id) {
  if (!id) return null;
  for (const page of project.pages) {
    let found = null;
    walk(page.root, n => { if (n.id === id) found = n; });
    if (found) return found;
  }
  return null;
}
function findParent(id) {
  for (const page of project.pages) {
    let found = null;
    walk(page.root, (n, p) => { if (n.id === id) found = p; });
    if (found) return found;
  }
  return null;
}
function findPageOf(id) {
  for (const page of project.pages) {
    let found = false;
    walk(page.root, n => { if (n.id === id) found = true; });
    if (found) return page;
  }
  return null;
}
function isDescendant(ancestorId, id) {
  const a = findNode(ancestorId);
  if (!a) return false;
  let found = false;
  walk(a, n => { if (n.id === id) found = true; });
  return found;
}
function removeNode(id) {
  const p = findParent(id);
  if (!p) return null;
  const idx = p.children.findIndex(c => c.id === id);
  if (idx === -1) return null;
  return p.children.splice(idx, 1)[0];
}
function flattenNodes() {
  const out = [];
  const page = getCurrentPage();
  if (!page) return out;
  walk(page.root, (n, p) => { if (n.type !== 'page') out.push({ node: n, parent: p }); });
  return out;
}
function uniqueElementId(base) {
  let id = base || uid('el');
  let i = 1;
  while (findNode(id)) id = base + '_' + (i++);
  return id;
}

const state = {

function getCurrentPage() {
  if (!project || !project.pages.length) return null;

}
function getSelectedNode() { return state.selectedId ? findNode(state.selectedId) : null; }


/* ==========================================================================
   5. HISTORY
   ========================================================================== */
const undoStack = [];
const redoStack = [];
let histKey = '';
let histTime = 0;

function mutate(key, fn, opts) {
  opts = opts || {};
  const now = Date.now();
  if (key !== histKey || now - histTime > 900) {
    undoStack.push(JSON.stringify(project));
    if (undoStack.length > 120) undoStack.shift();
    redoStack.length = 0;
    histKey = key;
  }
  histTime = now;
  fn();
  updateHistoryButtons();
}

function pushHistory() {
  undoStack.push(JSON.stringify(project));
  if (undoStack.length > 120) undoStack.shift();
  redoStack.length = 0;
  histKey = '';
  updateHistoryButtons();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(project));
  project = JSON.parse(undoStack.pop());
  histKey = '';
  afterHistory();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(project));
  project = JSON.parse(redoStack.pop());
  histKey = '';
  afterHistory();
}
function afterHistory() {
  if (state.selectedId && !findNode(state.selectedId)) state.selectedId = null;
  renderAll();
  updateHistoryButtons();
}
function updateHistoryButtons() {
  $('#btn-undo').disabled = !undoStack.length;
  $('#btn-redo').disabled = !redoStack.length;
  $('#btn-undo').style.opacity = undoStack.length ? 1 : .45;
  $('#btn-redo').style.opacity = redoStack.length ? 1 : .45;
}


/* ==========================================================================
   6. CANVAS RENDERER  (with auto-fit scaling)
   ========================================================================== */
function effectiveStyles(node) {
  const out = Object.assign({}, node.styles);
  if (state.device !== 'desktop' && node.responsive && node.responsive[state.device]) {
    Object.assign(out, node.responsive[state.device]);
  }
  return out;
}

function applyStyles(el, node) {
  el.removeAttribute('style');
  const s = effectiveStyles(node);
  for (const k in s) {
    if (s[k] === '' || s[k] == null) continue;
    try { el.style.setProperty(k, s[k]); } catch (e) { /* ignore invalid */ }
  }
}

const DEVICE_WIDTHS = { desktop: 1200, tablet: 768, mobile: 390 };

/* ---- NEW: auto-fit helpers -------------------------------------------------
   The page is absolutely positioned inside a "stage" whose layout size equals
   the scaled page size. That way scrollbars are correct and the page can be
   centred with `margin: 0 auto` (and stays reachable when it overflows).
   -------------------------------------------------------------------------- */

function computeFitZoom() {
  const vp = $('#viewport');
  // 24px padding each side + a small buffer for the appearing scrollbar
  const avail = Math.max(120, vp.clientWidth - 60);
  const pageW = DEVICE_WIDTHS[state.device];
  return Math.max(0.15, Math.min(1, avail / pageW));
}

/* Apply current zoom to the page element and resize the stage to match. */
function syncZoom() {
  if (state.autoFit) state.zoom = computeFitZoom();

  const pageEl = $('#canvas-page');
  const stage  = $('#stage');
  const w = DEVICE_WIDTHS[state.device];

  pageEl.style.width = w + 'px';
  pageEl.style.transform = 'scale(' + state.zoom + ')';

  // offsetHeight is unaffected by the CSS transform, so it gives us the
  // page's real (unscaled) height.
  const h = pageEl.offsetHeight || 600;

  stage.style.width  = Math.ceil(w * state.zoom) + 'px';
  stage.style.height = Math.ceil(h * state.zoom) + 'px';

  $('#zoom-val').textContent = Math.round(state.zoom * 100) + '%';
  updateOverlay();
}

/* Throttled version, used for window / panel resizing */
let syncRAF = null;
function scheduleSync() {
  if (syncRAF) return;
  syncRAF = requestAnimationFrame(() => {
    syncRAF = null;
    syncZoom();
  });
}

function renderCanvas() {
  const page = getCurrentPage();
  const content = $('#canvas-content');
  const pageEl = $('#canvas-page');

  // Set the width *before* measuring height further down
  pageEl.style.width = DEVICE_WIDTHS[state.device] + 'px';

  content.innerHTML = '';
  if (page) {
    const rootEl = renderNode(page.root);
    rootEl.classList.add('vce-page-root');
    content.appendChild(rootEl);
  }

  syncZoom();
}

function renderNode(node) {
  const def = ELEMENTS[node.type] || {};
  const tag = (node.tag || def.tag || 'div').toLowerCase();
  const el = document.createElement(tag);
  el.setAttribute('data-vce-id', node.id);
  el.classList.add('vce-el');

  for (const k in (node.attrs || {})) {
    const v = node.attrs[k];
    if (v === true || v === '') { try { el.setAttribute(k, ''); } catch(e){} }
    else if (v !== false && v != null && v !== '') { try { el.setAttribute(k, v); } catch(e){} }
  }
  if (tag === 'canvas') {
    if (node.attrs && node.attrs.width) el.width = parseInt(node.attrs.width, 10) || 300;
    if (node.attrs && node.attrs.height) el.height = parseInt(node.attrs.height, 10) || 150;
  }
  if (node.classes) node.classes.split(/\s+/).filter(Boolean).forEach(c => el.classList.add(c));

  applyStyles(el, node);

    const isVoid = VOID_TAGS.has(tag);
  if (node.type === 'customhtml' || node.type === 'svg') {
    el.innerHTML = node.html || '';
  } else if (!isVoid) {
    if (node.children && node.children.length) {
      node.children.forEach(c => el.appendChild(renderNode(c)));
    } else if (node.html) {
      el.innerHTML = node.html;
    } else if (node.text != null && node.text !== '') {
      el.textContent = node.text;
    }
  }

  if (canContain(node) && (!node.children || !node.children.length) && node.type !== 'page') {
    el.classList.add('vce-empty');
  }
  if (node.hidden) el.classList.add('vce-hidden-el');
  if (node.locked) el.classList.add('vce-locked');
  if (node.type === 'page') el.classList.add('vce-page-root-el');

  el.setAttribute('draggable', node.locked ? 'false' : 'true');
  el.setAttribute('title', node.name + '  (' + node.type + ')');
  return el;
}

function applyLiveStyles(node) {
  const el = $('#canvas-content').querySelector('[data-vce-id="' + CSS.escape(node.id) + '"]');
  if (el) applyStyles(el, node);
}


/* ==========================================================================
   7. SELECTION OVERLAY + RESIZE HANDLES
   ========================================================================== */
function selectNode(id) {
  state.selectedId = id;
  renderCanvas();
  renderTree();
  if (state.rightTab === 'design') renderDesign();
  if (state.rightTab === 'interact') renderInteractions();
}

function updateOverlay() {
  const ov = $('#overlay');
  ov.innerHTML = '';
  // Counter-scale factor: overlay chrome keeps a constant *screen* size
  ov.style.setProperty('--inv', (1 / state.zoom).toFixed(4));

  if (state.editingId) return;

  if (state.dropTarget) drawDropIndicator(state.dropTarget);

  const id = state.selectedId;
  if (!id) return;
  const pageEl = $('#canvas-page');
  const el = $('#canvas-content').querySelector('[data-vce-id="' + CSS.escape(id) + '"]');
  if (!el) return;
  const node = findNode(id);
  if (!node) return;

  const pr = pageEl.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const z = state.zoom;

  const left = (r.left - pr.left) / z;
  const top = (r.top - pr.top) / z;
  const w = r.width / z;
  const h = r.height / z;

  const box = document.createElement('div');
  box.className = 'sel-box';
  box.style.left = left + 'px';
  box.style.top = top + 'px';
  box.style.width = w + 'px';
  box.style.height = h + 'px';
  ov.appendChild(box);

  const lbl = document.createElement('div');
  lbl.className = 'sel-label';
  lbl.textContent = (node.name || node.type) + (node.locked ? ' 🔒' : '');
  lbl.style.left = left + 'px';
  lbl.style.top = Math.max(0, top - (20 / z)) + 'px';
  ov.appendChild(lbl);

  if (node.locked || node.type === 'page') return;

  // Handle size is a constant number of *screen* pixels
  const hs = 9 / z;
  const half = hs / 2;

  const positions = {
    nw: [left - half,           top - half],
    n:  [left + w/2 - half,     top - half],
    ne: [left + w - half,       top - half],
    e:  [left + w - half,       top + h/2 - half],
    se: [left + w - half,       top + h - half],
    s:  [left + w/2 - half,     top + h - half],
    sw: [left - half,           top + h - half],
    w:  [left - half,           top + h/2 - half]
  };

  for (const dir in positions) {
    const hd = document.createElement('div');
    hd.className = 'handle';
    hd.dataset.dir = dir;
    hd.style.left = positions[dir][0] + 'px';
    hd.style.top  = positions[dir][1] + 'px';
    hd.addEventListener('pointerdown', e => startResize(e, dir, node));
    ov.appendChild(hd);
  }
}

function drawDropIndicator(dt) {
  const ov = $('#overlay');
  const pageEl = $('#canvas-page');
  const pr = pageEl.getBoundingClientRect();
  const z = state.zoom;

  if (dt.mode === 'inside') {
    const el = $('#canvas-content').querySelector('[data-vce-id="' + CSS.escape(dt.targetId) + '"]');
    if (!el) return;
    const r = el.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'drop-inside';
    d.style.left = ((r.left - pr.left)/z) + 'px';
    d.style.top = ((r.top - pr.top)/z) + 'px';
    d.style.width = (r.width/z) + 'px';
    d.style.height = (r.height/z) + 'px';
    ov.appendChild(d);
  } else {
    const el = $('#canvas-content').querySelector('[data-vce-id="' + CSS.escape(dt.targetId) + '"]');
    if (!el) return;
    const r = el.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'drop-line';
    d.style.left = ((r.left - pr.left)/z) + 'px';
    d.style.width = (r.width/z) + 'px';
    const y = dt.mode === 'before' ? (r.top - pr.top)/z : (r.bottom - pr.top)/z;
    d.style.top = (y - 1.5) + 'px';
    ov.appendChild(d);
  }
}

function startResize(e, dir, node) {
  e.preventDefault();
  e.stopPropagation();
  const startX = e.clientX, startY = e.clientY;
  const el = $('#canvas-content').querySelector('[data-vce-id="' + CSS.escape(node.id) + '"]');
  const r = el.getBoundingClientRect();
  const startW = r.width / state.zoom;
  const startH = r.height / state.zoom;
  const target = state.device === 'desktop' ? node.styles : (node.responsive[state.device] || (node.responsive[state.device] = {}));

  let moved = false;
  const move = ev => {
    const dx = (ev.clientX - startX) / state.zoom;
    const dy = (ev.clientY - startY) / state.zoom;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) moved = true;
    if (dir.includes('e')) target['width'] = Math.max(8, Math.round(startW + dx)) + 'px';
    if (dir.includes('w')) target['width'] = Math.max(8, Math.round(startW - dx)) + 'px';
    if (dir.includes('s')) target['height'] = Math.max(8, Math.round(startH + dy)) + 'px';
    if (dir.includes('n')) target['height'] = Math.max(8, Math.round(startH - dy)) + 'px';
    applyLiveStyles(node);
    syncZoom();   // keep the stage sized to the (possibly new) page height
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    if (moved) {
      pushHistory();
      renderDesign();
    }
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}


/* ==========================================================================
   8. DRAG AND DROP
   ========================================================================== */
function initCanvasDnD() {
  const viewport = $('#viewport');
  const content = $('#canvas-content');

  content.addEventListener('dragstart', e => {
    const el = e.target.closest('[data-vce-id]');
    if (!el || state.editingId) return;
    const node = findNode(el.dataset.vceId);
    if (!node || node.locked || node.type === 'page') { e.preventDefault(); return; }
    dragData = { kind: 'move', id: node.id };
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'vce-move'); } catch (err) {}
    el.style.opacity = '0.45';
  });

  content.addEventListener('dragend', e => {
    $$('[data-vce-id]', content).forEach(el => el.style.opacity = '');
    dragData = null;
    state.dropTarget = null;
    updateOverlay();
  });

  viewport.addEventListener('dragover', e => {
    if (!dragData) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = dragData.kind === 'move' ? 'move' : 'copy';
    state.dropTarget = computeDropTarget(e.clientX, e.clientY);
    updateOverlay();
  });

  viewport.addEventListener('dragleave', e => {
    if (e.target === viewport) {
      state.dropTarget = null;
      updateOverlay();
    }
  });

  viewport.addEventListener('drop', e => {
    if (!dragData || !state.dropTarget) return;
    e.preventDefault();
    performDrop(dragData, state.dropTarget);
    dragData = null;
    state.dropTarget = null;
  });
}

function computeDropTarget(x, y) {
  const page = getCurrentPage();
  const content = $('#canvas-content');
  const stack = document.elementsFromPoint(x, y);

  let el = null;
  for (const e of stack) {
    if (e.dataset && e.dataset.vceId && content.contains(e)) { el = e; break; }
  }

  if (!el) return { mode: 'inside', targetId: page.root.id };

  let node = findNode(el.dataset.vceId);
  if (!node) return { mode: 'inside', targetId: page.root.id };

  if (dragData && dragData.kind === 'move') {
    if (node.id === dragData.id || isDescendant(dragData.id, node.id)) {
      const p = findParent(node.id);
      if (p) node = p; else return { mode: 'inside', targetId: page.root.id };
      el = content.querySelector('[data-vce-id="' + CSS.escape(node.id) + '"]') || el;
    }
  }

  const r = el.getBoundingClientRect();
  const relY = r.height > 0 ? (y - r.top) / r.height : 0.5;

  if (canContain(node) && relY > 0.28 && relY < 0.72) {
    return { mode: 'inside', targetId: node.id };
  }
  if (node.type === 'page') return { mode: 'inside', targetId: node.id };
  return { mode: relY < 0.5 ? 'before' : 'after', targetId: node.id };
}

function performDrop(dd, target) {
  const page = getCurrentPage();
  let node;

  if (dd.kind === 'new') {
    node = createNode(dd.type);
  } else {
    node = findNode(dd.id);
    if (!node) return;
    if (target.mode === 'inside' && (target.targetId === node.id || isDescendant(node.id, target.targetId))) return;
    removeNode(node.id);
  }

  const targetNode = findNode(target.targetId) || page.root;

  if (target.mode === 'inside') {
    if (!targetNode.children) targetNode.children = [];
    if (targetNode.text && targetNode.children.length === 0 && !isTextType(targetNode)) targetNode.text = '';
    targetNode.children.push(node);
  } else {
    const parent = findParent(targetNode.id);
    if (!parent) {
      page.root.children.push(node);
    } else {
      const idx = parent.children.findIndex(c => c.id === targetNode.id);
      parent.children.splice(target.mode === 'before' ? idx : idx + 1, 0, node);
    }
  }

  pushHistory();
  state.selectedId = node.id;
  renderAll();
  if (state.rightTab === 'design') renderDesign();
  if (window.matchMedia('(max-width: 900px)').matches) closeDrawers();
}

function initPaletteDnD() {
  $('#tab-elements').addEventListener('dragstart', e => {
    const item = e.target.closest('.pal-item');
    if (!item) return;
    dragData = { kind: 'new', type: item.dataset.type };
    e.dataTransfer.effectAllowed = 'copy';
    try { e.dataTransfer.setData('text/plain', 'vce-new'); } catch (err) {}
  });
  $('#tab-elements').addEventListener('dragend', () => { dragData = null; });
}

function renderTree() {

function buildTreeRow(node, depth) {
  const wrap = document.createElement('div');

  const row = document.createElement('div');
  row.className = 'tree-row' + (state.selectedId === node.id ? ' sel' : '');
  row.dataset.id = node.id;

  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = node.name || node.type;
  row.appendChild(nm);

  if (node.hidden) { const s = document.createElement('span'); s.className='muted'; s.textContent='🙈'; row.appendChild(s); }
  if (node.locked) { const s = document.createElement('span'); s.className='muted'; s.textContent='🔒'; row.appendChild(s); }

  const acts = document.createElement('span');
  acts.className = 'acts';
  const mk = (txt, title, fn) => {
    const b = document.createElement('button');
    b.textContent = txt; b.title = title;
    b.addEventListener('click', ev => { ev.stopPropagation(); fn(); });
    return b;
  };
  if (node.type !== 'page') {
    acts.appendChild(mk(node.hidden ? '🙈' : '👁', 'Show / hide', () => {
      pushHistory(); node.hidden = !node.hidden; renderAll();
    }));
    acts.appendChild(mk(node.locked ? '🔒' : '🔓', 'Lock / unlock', () => {
      pushHistory(); node.locked = !node.locked; renderAll();
    }));
    acts.appendChild(mk('⧉', 'Duplicate', () => {
      pushHistory(); duplicateNode(node.id); renderAll();
    }));
    acts.appendChild(mk('✕', 'Delete', () => {
      pushHistory();
      removeNode(node.id);
      if (state.selectedId === node.id) state.selectedId = null;
      renderAll();
      if (state.rightTab === 'design') renderDesign();
    }));
  }
  row.appendChild(acts);

  row.addEventListener('click', () => {
    selectNode(node.id);
    if (window.matchMedia('(max-width: 900px)').matches) {
      $('#rightTabs').querySelector('[data-tab="design"]').click();
      openRightDrawer();
    }
  });
  row.addEventListener('dblclick', () => {
    const nn = prompt('Rename element:', node.name);
    if (nn != null && nn.trim()) { pushHistory(); node.name = nn.trim(); renderAll(); }
  });

  row.addEventListener('dragstart', e => {
    if (node.type === 'page' && !dragData) { e.preventDefault(); return; }
    if (!dragData) dragData = { kind: 'move', id: node.id };
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'vce-tree'); } catch (err) {}
  });
  row.addEventListener('dragover', e => {
    if (!dragData) return;
    e.preventDefault();
    const r = row.getBoundingClientRect();
    const rel = (e.clientY - r.top) / r.height;
    row.classList.remove('dragover-top','dragover-bottom','dragover-inside');
    if (canContain(node) && node.type !== 'page' && rel > 0.3 && rel < 0.7) row.classList.add('dragover-inside');
    else if (rel < 0.5) row.classList.add('dragover-top');
    else row.classList.add('dragover-bottom');
  });
  row.addEventListener('dragleave', () => row.classList.remove('dragover-top','dragover-bottom','dragover-inside'));
  row.addEventListener('drop', e => {
    if (!dragData) return;
    e.preventDefault();
    e.stopPropagation();
    const r = row.getBoundingClientRect();
    const rel = (e.clientY - r.top) / r.height;
    let mode;
    if (canContain(node) && node.type !== 'page' && rel > 0.3 && rel < 0.7) mode = 'inside';
    else mode = rel < 0.5 ? 'before' : 'after';
    row.classList.remove('dragover-top','dragover-bottom','dragover-inside');
    performDrop(dragData, { mode, targetId: node.id });
    dragData = null;
  });

  wrap.appendChild(row);

  if (node.children && node.children.length) {
    const kids = document.createElement('div');
    kids.className = 'tree-kids';
    node.children.forEach(c => kids.appendChild(buildTreeRow(c, depth + 1)));
    wrap.appendChild(kids);
  }
  return wrap;
}

function duplicateNode(id) {
  const src = findNode(id);
  const parent = findParent(id);
  if (!src || !parent) return;
  const copy = clone(src);
  (function regen(n) {
    n.id = uid('el');
    if (n.children) n.children.forEach(regen);
  })(copy);
  const idx = parent.children.findIndex(c => c.id === id);
  parent.children.splice(idx + 1, 0, copy);
  state.selectedId = copy.id;
}

function renderPalette() {
  const host = $('#tab-elements');
  host.innerHTML = '';

  const search = document.createElement('input');
  search.type = 'search';
  search.placeholder = '🔍  Search elements…';
  search.style.marginBottom = '10px';
  host.appendChild(search);

  const cats = {};
  for (const key in ELEMENTS) {
    const d = ELEMENTS[key];
    if (d.cat === '_') continue;
    (cats[d.cat] = cats[d.cat] || []).push([key, d]);
  }

  const ordered = ['Text','Formatting','Media','Layout','Semantic','Lists','Tables','Forms','UI Kit','Advanced'];
  ordered.forEach(cat => {
    if (!cats[cat]) return;
    const h = document.createElement('div');
    h.className = 'pal-cat';
    h.textContent = cat;
    host.appendChild(h);

    const grid = document.createElement('div');
    grid.className = 'pal-grid';
    cats[cat].forEach(([key, d]) => {
      const it = document.createElement('div');
      it.className = 'pal-item';
      it.draggable = true;
      it.dataset.type = key;
      it.dataset.search = (d.label + ' ' + key + ' ' + cat).toLowerCase();
      it.title = 'Drag "' + d.label + '" onto the page (or double-click to add)';
      it.innerHTML = '<span class="ic">' + (d.icon || '▢') + '</span><span>' + d.label + '</span>';
      const addToCanvas = () => {
        const page = getCurrentPage();
        const node = createNode(key);
        let target = page.root;
        if (state.selectedId) {
          const sel = findNode(state.selectedId);
          if (sel) target = canContain(sel) ? sel : (findParent(sel.id) || page.root);
        }
        if (!target.children) target.children = [];
        target.children.push(node);
        pushHistory();
        state.selectedId = node.id;
        renderAll();
        if (state.rightTab === 'design') renderDesign();
        // On mobile: auto-close drawers so the user sees the result
        if (window.matchMedia('(max-width: 900px)').matches) closeDrawers();
      };

      it.addEventListener('dblclick', addToCanvas);

      // On mobile, single tap adds (HTML5 drag-drop is unreliable on touch)
      it.addEventListener('click', e => {
        if (!window.matchMedia('(max-width: 900px)').matches) return;
        e.preventDefault();
        addToCanvas();
      });
      grid.appendChild(it);
    });
    host.appendChild(grid);
  });

  const tip = document.createElement('div');
  tip.className = 'hint';
  tip.style.marginTop = '14px';
  tip.innerHTML = '💡 Drag elements onto the page. Double-click text on the canvas to edit it. ' +
                  'Select an element, then change its variant (H1–H6, list type, input type…) in the Design panel.';
  host.appendChild(tip);

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    host.querySelectorAll('.pal-item').forEach(it => {
      it.style.display = (!q || it.dataset.search.indexOf(q) !== -1) ? '' : 'none';
    });
    host.querySelectorAll('.pal-cat').forEach(h => {
      const grid = h.nextElementSibling;
      const anyVisible = grid && grid.children
        ? Array.from(grid.children).some(c => c.style.display !== 'none')
        : false;
      h.style.display = anyVisible ? '' : 'none';
      if (grid) grid.style.display = anyVisible ? '' : 'none';
    });
  });
}

function section(title, open) {
  const d = document.createElement('details');
  d.className = 'sec';
  d.open = open !== false;

  s.textContent = title;
  d.appendChild(s);
  const body = document.createElement('div');
  body.className = 'sec-body';
  d.appendChild(body);
  d.body = body;
  return d;
}
function row(label, control) {
  const r = document.createElement('div');
  r.className = 'row';
  const l = document.createElement('label');
  l.textContent = label;
  r.appendChild(l);
  r.appendChild(control);
  return r;
}
function rowFull(control) {
  const r = document.createElement('div');
  r.className = 'row full';
  r.appendChild(control);
  return r;
}

function getStyleValue(node, prop) {
  if (state.device !== 'desktop') {
    const r = node.responsive[state.device] || {};
    if (r[prop] != null) return r[prop];
  }
  return node.styles[prop] != null ? node.styles[prop] : '';
}

function setStyle(node, prop, val) {
  mutate('style:' + node.id + ':' + prop + ':' + state.device, () => {
    const target = state.device === 'desktop'
      ? node.styles
      : (node.responsive[state.device] || (node.responsive[state.device] = {}));
    if (val === '' || val == null) delete target[prop];
    else target[prop] = val;
    renderCanvas();
  });
}

function styleInput(node, prop, opts) {
  opts = opts || {};
  const type = opts.type || 'text';
  let input;
  if (type === 'select') {
    input = document.createElement('select');
    opts.options.forEach(o => {
      const op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      input.appendChild(op);
    });
  } else {
    input = document.createElement('input');
    input.type = type;
    if (opts.placeholder) input.placeholder = opts.placeholder;
    if (opts.min != null) input.min = opts.min;
    if (opts.max != null) input.max = opts.max;
    if (opts.step != null) input.step = opts.step;
  }
  input.value = getStyleValue(node, prop);
  input.addEventListener('input', () => setStyle(node, prop, input.value));
  input.addEventListener('change', () => { setStyle(node, prop, input.value); renderDesign(); });
  return input;
}

function colorControl(node, prop) {
  const wrap = document.createElement('div');
  wrap.className = 'color-wrap';
  const picker = document.createElement('input');
  picker.type = 'color';
  const txt = document.createElement('input');
  txt.type = 'text';
  txt.placeholder = '#ffffff / transparent';
  const cur = getStyleValue(node, prop);
  txt.value = cur;
  picker.value = toHex(cur) || '#ffffff';

  picker.addEventListener('input', () => {
    txt.value = picker.value;
    setStyle(node, prop, picker.value);
  });
  txt.addEventListener('input', () => {
    setStyle(node, prop, txt.value);
    const h = toHex(txt.value);
    if (h) picker.value = h;
  });
  txt.addEventListener('change', () => { setStyle(node, prop, txt.value); renderDesign(); });

  wrap.appendChild(picker);
  wrap.appendChild(txt);
  return wrap;
}

function spacingControl(node, prefix) {
  const wrap = document.createElement('div');
  wrap.className = 'grid4';
  const props = [prefix + '-top', prefix + '-right', prefix + '-bottom', prefix + '-left'];
  const labels = ['T','R','B','L'];
  const inputs = [];
  props.forEach((p, i) => {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = labels[i];
    inp.value = getStyleValue(node, p);
    inp.title = p;
    inp.addEventListener('input', () => {
      setStyle(node, p, inp.value);
      if (wrap.dataset.linked === '1') {
        inputs.forEach((o, j) => { if (j !== i) { o.value = inp.value; setStyle(node, props[j], inp.value); } });
      }
    });
    inp.addEventListener('change', () => { setStyle(node, p, inp.value); });
    inputs.push(inp);
    wrap.appendChild(inp);
  });
  wrap.dataset.linked = '1';
  return wrap;
}

  appSec.body.appendChild(row('Border width', styleInput(node, 'border-width', { placeholder:'1px' })));
  appSec.body.appendChild(row('Border color', colorControl(node, 'border-color')));
  appSec.body.appendChild(row('Roundness', styleInput(node, 'border-radius', { placeholder:'8px' })));
  appSec.body.appendChild(row('Shadow', styleInput(node, 'box-shadow', { type:'select', options:[
    ['','None'],
    ['0 1px 2px rgba(0,0,0,.08)','Subtle'],
    ['0 4px 12px rgba(0,0,0,.12)','Medium'],
    ['0 12px 32px rgba(0,0,0,.20)','Large'],
    ['0 0 0 3px rgba(91,140,255,.35)','Focus ring'],
    ['inset 0 2px 6px rgba(0,0,0,.15)','Inset']]})));
  const op = document.createElement('input');
  op.type = 'range'; op.min = '0'; op.max = '1'; op.step = '0.05';
  op.value = getStyleValue(node, 'opacity') || '1';
  op.addEventListener('input', () => setStyle(node, 'opacity', op.value));
  appSec.body.appendChild(row('Opacity', op));
  appSec.body.appendChild(row('Overflow', styleInput(node, 'overflow', { type:'select', options:[

  /* ---------------- TYPOGRAPHY ---------------- */
  if (TEXT_TYPES.has(node.type) || node.type === 'input' || node.type === 'textarea' ||
      node.type === 'select' || node.type === 'page' || canContain(node)) {
    const typoSec = section('Text style', false);
    typoSec.body.appendChild(row('Font', styleInput(node, 'font-family', { type:'select', options: FONT_FAMILIES })));
    typoSec.body.appendChild(row('Font size', styleInput(node, 'font-size', { placeholder:'16px' })));
    typoSec.body.appendChild(row('Weight', styleInput(node, 'font-weight', { type:'select', options:[
      ['','Default'],['300','Light'],['400','Normal'],['500','Medium'],['600','Semi-bold'],['700','Bold'],['800','Extra bold']]})));
    typoSec.body.appendChild(row('Colour', colorControl(node, 'color')));
    typoSec.body.appendChild(row('Line height', styleInput(node, 'line-height', { placeholder:'1.5 / 24px' })));
    typoSec.body.appendChild(row('Letter spacing', styleInput(node, 'letter-spacing', { placeholder:'0.5px' })));
    typoSec.body.appendChild(row('Align', styleInput(node, 'text-align', { type:'select', options:[
      ['','Default'],['left','Left'],['center','Center'],['right','Right'],['justify','Justify']]})));
    typoSec.body.appendChild(row('Decoration', styleInput(node, 'text-decoration', { type:'select', options:[
      ['','None'],['underline','Underline'],['line-through','Strikethrough'],['overline','Overline']]})));
    typoSec.body.appendChild(row('Transform', styleInput(node, 'text-transform', { type:'select', options:[
      ['','None'],['uppercase','UPPERCASE'],['lowercase','lowercase'],['capitalize','Capitalize']]})));

  }

  /* ---------------- EFFECTS ---------------- */
  const fxSec = section('Effects & motion', false);
  fxSec.body.appendChild(row('Rotate', styleInput(node, 'transform', { placeholder:'rotate(45deg)' })));
  fxSec.body.appendChild(row('Transition', styleInput(node, 'transition', { placeholder:'all .3s ease' })));
  fxSec.body.appendChild(row('Blur / filter', styleInput(node, 'filter', { placeholder:'blur(4px)' })));
  fxSec.body.appendChild(row('Cursor', styleInput(node, 'cursor', { type:'select', options:[
    ['','Default'],['pointer','Pointer (hand)'],['text','Text'],['move','Move'],['not-allowed','Not allowed']]})));
  host.appendChild(fxSec);

  /* ---------------- ADVANCED ---------------- */
  const advSec = section('Advanced', false);
  const clsInp = document.createElement('input');
  clsInp.type = 'text'; clsInp.value = node.classes || '';
  clsInp.placeholder = 'class-one class-two';
  clsInp.addEventListener('input', () => { node.classes = clsInp.value; });
  clsInp.addEventListener('change', () => { pushHistory(); renderCanvas(); });
  advSec.body.appendChild(row('CSS classes', clsInp));

  const ariaInp = document.createElement('input');
  ariaInp.type = 'text'; ariaInp.value = node.attrs['aria-label'] || '';
  ariaInp.addEventListener('input', () => { mutate('aria:' + node.id, () => { node.attrs['aria-label'] = ariaInp.value; }); });
  advSec.body.appendChild(row('ARIA label', ariaInp));

  const tagInp = document.createElement('input');
  tagInp.type = 'text'; tagInp.value = node.tag;
  tagInp.addEventListener('change', () => {
    const t = tagInp.value.trim().toLowerCase().replace(/[^\w-]/g, '');
    if (!t) { tagInp.value = node.tag; return; }
    pushHistory(); node.tag = t; renderAll();
  });
  advSec.body.appendChild(row('HTML tag', tagInp));

  const cssTa = document.createElement('textarea');
  cssTa.rows = 4;
  cssTa.placeholder = '#myId { backdrop-filter: blur(10px); }';
  cssTa.value = node.customCSS || '';
  cssTa.addEventListener('input', () => { node.customCSS = cssTa.value; });
  cssTa.addEventListener('change', () => { pushHistory(); });
  const cssLbl = document.createElement('div');
  cssLbl.className = 'subhead'; cssLbl.textContent = 'Custom CSS for this element';
  advSec.body.appendChild(cssLbl);
  advSec.body.appendChild(rowFull(cssTa));

  const rawBtn = document.createElement('button');
  rawBtn.textContent = '⚙ Show raw CSS declarations';
  rawBtn.addEventListener('click', () => {
    const eff = effectiveStyles(node);
    const txt = Object.keys(eff).map(k => k + ': ' + eff[k] + ';').join('\n');
    const nn = prompt('CSS declarations for #' + node.id + ' (edit to apply):', txt);
    if (nn == null) return;
    pushHistory();
    const target = state.device === 'desktop'
      ? node.styles
      : (node.responsive[state.device] || (node.responsive[state.device] = {}));
    for (const k in target) delete target[k];
    nn.split('\n').forEach(line => {
      const m = line.match(/^\s*([\w-]+)\s*:\s*(.+?);?\s*$/);
      if (m) target[m[1]] = m[2];
    });
    renderCanvas(); renderDesign();
  });
  advSec.body.appendChild(rowFull(rawBtn));
  host.appendChild(advSec);

  /* ---------------- Delete ---------------- */
  if (node.type !== 'page') {
    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑 Delete element';
    delBtn.style.borderColor = 'var(--danger)';
    delBtn.addEventListener('click', () => {
      pushHistory();
      removeNode(node.id);
      state.selectedId = null;
      renderAll(); renderDesign();
    });
    host.appendChild(delBtn);

    const dupBtn = document.createElement('button');
    dupBtn.textContent = '⧉ Duplicate element';
    dupBtn.style.marginTop = '6px';
    dupBtn.addEventListener('click', () => {
      pushHistory();
      duplicateNode(node.id);
      renderAll();
    });
    host.appendChild(dupBtn);
  }
}

   12. INTERACTIONS PANEL
   ========================================================================== */
const ACTIONS = {
  show:       { label:'Show element',        params:[['target','element']] },
  hide:       { label:'Hide element',        params:[['target','element']] },
  toggle:     { label:'Toggle visibility',   params:[['target','element']] },
  setText:    { label:'Change text',         params:[['target','element'],['value','text']] },
  setImage:   { label:'Change image',        params:[['target','element'],['value','text']] },
  setStyle:   { label:'Change style',        params:[['target','element'],['prop','text'],['value','text']] },
  addClass:   { label:'Add CSS class',       params:[['target','element'],['value','text']] },
  removeClass:{ label:'Remove CSS class',    params:[['target','element'],['value','text']] },
  navigate:   { label:'Go to URL',           params:[['value','text']] },
  goPage:     { label:'Go to page',          params:[['value','page']] },
  scrollTo:   { label:'Scroll to element',   params:[['target','element']] },
  play:       { label:'Play media',          params:[['target','element']] },
  animate:    { label:'Play animation',      params:[['target','element'],['value','anim']] },
  setVar:     { label:'Set variable',        params:[['name','var'],['value','text']] },
  changeVar:  { label:'Change variable',     params:[['name','var'],['op','op'],['value','text']] },
  saveData:   { label:'Save to browser',     params:[['key','text'],['value','text']] },
  loadData:   { label:'Load from browser',   params:[['key','text'],['target','element']] },
  runJS:      { label:'Run JavaScript',      params:[['value','code']] },
  alert:      { label:'Show alert',          params:[['value','text']] },
};

const EVENTS = [
  ['click','Clicked'],['dblclick','Double-clicked'],['mouseenter','Mouse enters'],
  ['mouseleave','Mouse leaves'],['load','Page loads'],['input','Value changes (live)'],
  ['change','Value changes'],['submit','Form submitted'],['keydown','Key pressed']
];

const CONDITION_OPS = [
  ['==','is equal to'],['!=','is not equal to'],['>','is greater than'],['<','is less than'],
  ['>=','is greater than or equal to'],['<=','is less than or equal to'],
  ['contains','contains'],['empty','is empty'],['true','is true'],['false','is false']
];

function elementOptions() {
  const out = [['','— choose element —']];
  flattenNodes().forEach(({ node, parent }) => {
    let path = node.name;
    let p = parent;
    while (p && p.type !== 'page') { path = p.name + ' › ' + path; p = findParent(p.id); }
    out.push([node.id, path + '  (#' + node.id + ')']);
  });
  return out;
}

function renderInteractions() {
  const host = $('#tab-interact');
  host.innerHTML = '';
  const node = getSelectedNode();

  const head = document.createElement('div');
  head.className = 'hint';
  head.style.marginBottom = '10px';
  head.innerHTML = 'Attach behaviour to elements: <b>when</b> something happens, <b>do</b> these actions.';
  host.appendChild(head);

  if (!node) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Select an element to give it behaviour.';
    host.appendChild(e);
    return;
  }

  const banner = document.createElement('div');
  banner.className = 'chip';
  banner.textContent = '⚡ ' + node.name + '  (#' + node.id + ')';
  banner.style.marginBottom = '10px';
  host.appendChild(banner);

  node.interactions = node.interactions || [];

  node.interactions.forEach((ix, ixIdx) => {
    host.appendChild(buildInteractionCard(node, ix, ixIdx));
  });

  const add = document.createElement('button');
  add.className = 'primary';
  add.textContent = '+ Add interaction';
  add.style.width = '100%';
  add.addEventListener('click', () => {
    pushHistory();
    node.interactions.push({
      id: uid('ix'),
      event: 'click',
      logic: 'and',
      conditions: [],
      actions: [{ type: 'setText', target: '', value: 'Hello!' }]
    });
    renderInteractions();
  });
  host.appendChild(add);
}

function buildInteractionCard(node, ix, ixIdx) {
  const card = document.createElement('div');
  card.className = 'ix-card';

  const head = document.createElement('div');
  head.className = 'ix-head';
  const whenLbl = document.createElement('span');
  whenLbl.textContent = 'WHEN';
  head.appendChild(whenLbl);

  const evSel = document.createElement('select');
  evSel.style.width = 'auto';
  EVENTS.forEach(e => {
    const o = document.createElement('option'); o.value = e[0]; o.textContent = e[1]; evSel.appendChild(o);
  });
  evSel.value = ix.event;
  evSel.addEventListener('change', () => { pushHistory(); ix.event = evSel.value; renderInteractions(); });
  head.appendChild(evSel);

  const sp = document.createElement('span');
  sp.className = 'spacer';
  head.appendChild(sp);

  const del = document.createElement('button');
  del.className = 'mini';
  del.textContent = '✕';
  del.addEventListener('click', () => {
    pushHistory();
    node.interactions.splice(ixIdx, 1);
    renderInteractions();
  });
  head.appendChild(del);
  card.appendChild(head);

  ix.conditions = ix.conditions || [];
  if (ix.conditions.length) {
    const logicRow = document.createElement('div');
    logicRow.style.display = 'flex';
    logicRow.style.gap = '6px';
    logicRow.style.alignItems = 'center';
    const lg = document.createElement('select');
    lg.style.width = 'auto';
    [['and','ALL of these are true'],['or','ANY of these is true']].forEach(o => {
      const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; lg.appendChild(op);
    });
    lg.value = ix.logic || 'and';
    lg.addEventListener('change', () => { ix.logic = lg.value; });
    logicRow.appendChild(lg);
    card.appendChild(logicRow);
  }

  ix.conditions.forEach((c, ci) => {
    const r = document.createElement('div');
    r.className = 'ix-cond';
    r.appendChild(condSideInput(c, 'left', ix));
    const opSel = document.createElement('select');
    CONDITION_OPS.forEach(o => {
      const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; opSel.appendChild(op);
    });
    opSel.value = c.op || '==';
    opSel.style.width = 'auto';
    opSel.addEventListener('change', () => { c.op = opSel.value; renderInteractions(); });
    r.appendChild(opSel);
    if (c.op === 'empty' || c.op === 'true' || c.op === 'false') {
      r.appendChild(document.createElement('span'));
    } else {
      r.appendChild(condSideInput(c, 'right', ix));
    }
    const rm = document.createElement('button');
    rm.className = 'mini';
    rm.textContent = '✕';
    rm.style.gridColumn = '1 / -1';
    rm.style.justifySelf = 'end';
    rm.addEventListener('click', () => { ix.conditions.splice(ci, 1); renderInteractions(); });
    r.appendChild(rm);
    card.appendChild(r);
  });

  const addCond = document.createElement('button');
  addCond.className = 'mini';
  addCond.textContent = '+ Add condition (IF…)';
  addCond.style.alignSelf = 'flex-start';
  addCond.addEventListener('click', () => {
    ix.conditions.push({ left: '', op: '==', right: '' });
    renderInteractions();
  });
  card.appendChild(addCond);

  const doLbl = document.createElement('div');
  doLbl.className = 'subhead';
  doLbl.textContent = 'THEN';
  card.appendChild(doLbl);

  ix.actions.forEach((a, ai) => {
    card.appendChild(buildActionRow(node, ix, a, ai));
  });

  const addAct = document.createElement('button');
  addAct.className = 'mini';
  addAct.textContent = '+ Add action';
  addAct.style.alignSelf = 'flex-start';
  addAct.addEventListener('click', () => {
    ix.actions.push({ type: 'show', target: '' });
    renderInteractions();
  });
  card.appendChild(addAct);

  return card;
}

function condSideInput(c, side, ix) {
  const wrap = document.createElement('div');
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.value = c[side] || '';
  inp.placeholder = side === 'left' ? 'variable or value' : 'value';
  inp.addEventListener('input', () => { c[side] = inp.value; });
  inp.setAttribute('list', 'vce-varnames');
  wrap.appendChild(inp);
  return wrap;
}

function buildActionRow(node, ix, a, ai) {
  const box = document.createElement('div');
  box.className = 'ix-action';

  const top = document.createElement('div');
  top.style.display = 'flex';
  top.style.gap = '5px';

  const sel = document.createElement('select');
  Object.keys(ACTIONS).forEach(k => {
    const o = document.createElement('option'); o.value = k; o.textContent = ACTIONS[k].label; sel.appendChild(o);
  });
  sel.value = a.type;
  sel.addEventListener('change', () => { pushHistory(); a.type = sel.value; renderInteractions(); });
  top.appendChild(sel);

  const rm = document.createElement('button');
  rm.className = 'mini';
  rm.textContent = '✕';
  rm.addEventListener('click', () => { pushHistory(); ix.actions.splice(ai, 1); renderInteractions(); });
  top.appendChild(rm);
  box.appendChild(top);

  const params = ACTIONS[a.type] ? ACTIONS[a.type].params : [];
  params.forEach(([key, kind]) => {
    const lbl = document.createElement('label');
    lbl.textContent = key;
    lbl.style.fontSize = '10px';

    let ctl;
    if (kind === 'element') {
      ctl = document.createElement('select');
      elementOptions().forEach(o => {
        const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; ctl.appendChild(op);
      });
      ctl.value = a[key] || '';
    } else if (kind === 'page') {
      ctl = document.createElement('select');
      project.pages.forEach(p => {
        const op = document.createElement('option'); op.value = p.name; op.textContent = p.name; ctl.appendChild(op);
      });
      ctl.value = a[key] || '';
    } else if (kind === 'anim') {
      ctl = document.createElement('select');
      ANIMATIONS.forEach(o => {
        const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; ctl.appendChild(op);
      });
      ctl.value = a[key] || 'fadeIn';
    } else if (kind === 'op') {
      ctl = document.createElement('select');
      [['+','Increase by'],['-','Decrease by'],['*','Multiply by'],['/','Divide by'],['=','Set to']].forEach(o => {
        const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; ctl.appendChild(op);
      });
      ctl.value = a[key] || '+';
    } else if (kind === 'var') {
      ctl = document.createElement('select');
      (project.variables || []).forEach(v => {
        const op = document.createElement('option'); op.value = v.name; op.textContent = v.name; ctl.appendChild(op);
      });
      if (!project.variables.length) {
        const op = document.createElement('option'); op.value = ''; op.textContent = '(no variables yet)';
        ctl.appendChild(op);
      }
      ctl.value = a[key] || '';
    } else if (kind === 'code') {
      ctl = document.createElement('textarea');
      ctl.rows = 3;
      ctl.value = a[key] || '';
      ctl.placeholder = 'console.log("hi");';
    } else {
      ctl = document.createElement('input');
      ctl.type = 'text';
      ctl.value = a[key] || '';
    }
    ctl.addEventListener('input', () => { a[key] = ctl.value; });
    ctl.addEventListener('change', () => { a[key] = ctl.value; });

    const r = document.createElement('div');
    r.className = 'row';
    r.appendChild(lbl);
    r.appendChild(ctl);
    box.appendChild(r);
  });

  return box;
}

function renderVariables() {
  const host = $('#tab-vars');
  host.innerHTML = '';

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.style.marginBottom = '10px';
  hint.innerHTML = 'Variables store values (numbers, text, true/false, lists). ' +
    'Use <code>{{name}}</code> in any text to display a variable. ' +
    'Change them from the <b>Actions</b> tab.';
  host.appendChild(hint);

  const dl = document.createElement('datalist');
  dl.id = 'vce-varnames';
  host.appendChild(dl);

  project.variables = project.variables || [];

  project.variables.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'ix-card';

    const nameRow = document.createElement('div');
    nameRow.className = 'row';
    const nLbl = document.createElement('label'); nLbl.textContent = 'Name';
    const nInp = document.createElement('input');
    nInp.type = 'text'; nInp.value = v.name;
    nInp.addEventListener('input', () => { v.name = nInp.value.replace(/[^\w]/g, '_'); renderVarDatalist(); });
    nInp.addEventListener('change', () => { pushHistory(); renderVariables(); });
    nameRow.appendChild(nLbl); nameRow.appendChild(nInp);
    card.appendChild(nameRow);

    const typeRow = document.createElement('div');
    typeRow.className = 'row';
    const tLbl = document.createElement('label'); tLbl.textContent = 'Type';
    const tSel = document.createElement('select');
    [['number','Number'],['text','Text'],['boolean','True / false'],['json','List / object (JSON)']].forEach(o => {
      const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; tSel.appendChild(op);
    });
    tSel.value = v.type || 'number';
    tSel.addEventListener('change', () => { pushHistory(); v.type = tSel.value; renderVariables(); });
    typeRow.appendChild(tLbl); typeRow.appendChild(tSel);
    card.appendChild(typeRow);

    const valRow = document.createElement('div');
    valRow.className = 'row';
    const vLbl = document.createElement('label'); vLbl.textContent = 'Value';
    let vInp;
    if (v.type === 'boolean') {
      vInp = document.createElement('select');
      [['true','true'],['false','false']].forEach(o => {
        const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; vInp.appendChild(op);
      });
      vInp.value = String(v.value);
    } else {
      vInp = document.createElement('input');
      vInp.type = v.type === 'number' ? 'number' : 'text';
      vInp.value = v.value;
    }
    vInp.addEventListener('input', () => { v.value = vInp.value; renderVarDatalist(); });
    vInp.addEventListener('change', () => { pushHistory(); });
    valRow.appendChild(vLbl); valRow.appendChild(vInp);
    card.appendChild(valRow);

    const del = document.createElement('button');
    del.className = 'mini';
    del.textContent = '🗑 Delete variable';
    del.style.alignSelf = 'flex-start';
    del.addEventListener('click', () => {
      pushHistory();
      project.variables.splice(i, 1);
      renderVariables();
    });
    card.appendChild(del);

    host.appendChild(card);
  });

  const add = document.createElement('button');
  add.className = 'primary';
  add.style.width = '100%';
  add.textContent = '+ Add variable';
  add.addEventListener('click', () => {
    pushHistory();
    project.variables.push({ name: 'myVar' + (project.variables.length + 1), type: 'number', value: 0 });
    renderVariables();
  });
  host.appendChild(add);

  renderVarDatalist();
}

function renderVarDatalist() {
  const dl = $('#vce-varnames');
  if (!dl) return;
  dl.innerHTML = '';
  (project.variables || []).forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    dl.appendChild(o);
  });
}
