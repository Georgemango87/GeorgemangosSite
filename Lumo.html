const BASE_CSS = `*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;color:#1f2937;-webkit-font-smoothing:antialiased}
img,video,canvas,svg{max-width:100%}
button,input,select,textarea{font-family:inherit}
a{color:inherit}
.vce-hidden{display:none !important}
.vce-page{display:none}
.vce-page.active{display:block}
@keyframes vce-fadeIn{from{opacity:0}to{opacity:1}}
@keyframes vce-fadeOut{from{opacity:1}to{opacity:0}}
@keyframes vce-slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes vce-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vce-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes vce-bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(-6px)}}
@keyframes vce-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}`;

function styleDecls(styles) {
  if (!styles) return '';
  let out = '';
  for (const k in styles) {
    const v = styles[k];
    if (v === '' || v == null) continue;
    out += k + ':' + v + ';';
  }
  return out;
}

function generateCSS() {
  const rules = [];
  const tabletRules = [];
  const mobileRules = [];

  for (const page of project.pages) {
    walk(page.root, node => {
      const sel = '#' + node.id;
      const base = styleDecls(node.styles);
      if (base) rules.push(sel + '{' + base + '}');

      const t = styleDecls(node.responsive && node.responsive.tablet);
      if (t) tabletRules.push(sel + '{' + t + '}');
      const m = styleDecls(node.responsive && node.responsive.mobile);
      if (m) mobileRules.push(sel + '{' + m + '}');

      if (node.customCSS && node.customCSS.trim()) {
        rules.push('/* ' + (node.name || node.type) + ' */\n' + node.customCSS);
      }
    });
  }

  let css = BASE_CSS + '\n';
  if (project.globalCSS_bodyBg) css += 'body{background:' + project.globalCSS_bodyBg + ';}\n';
  css += rules.join('\n') + '\n';
  if (tabletRules.length) css += '@media (max-width: 900px){\n' + tabletRules.join('\n') + '\n}\n';
  if (mobileRules.length) css += '@media (max-width: 600px){\n' + mobileRules.join('\n') + '\n}\n';
  if (project.customCSS && project.customCSS.trim()) {
    css += '\n/* === Custom CSS === */\n' + project.customCSS + '\n';
  }
  return css;
}

let bindings = {};

function generateHTMLBody() {
  const out = [];
  for (const page of project.pages) {
    const active = page.id === project.currentPageId ? ' active' : '';
    const decls = styleDecls(page.root.styles);
    const cls = ['vce-page' + active];
    if (page.root.classes) cls.push(page.root.classes);
    const styleAttr = decls ? ' style="' + escAttr(decls) + '"' : '';
    out.push('<div id="' + escAttr(page.root.id) + '" class="' + cls.join(' ') + '"' +
             ' data-page-name="' + escAttr(page.name) + '"' + styleAttr + '>');
    (page.root.children || []).forEach(c => out.push(generateNode(c, 1)));
    out.push('</div>');
  }
  return out.join('\n');
}

function generateNode(node, depth) {
  const pad = '  '.repeat(depth);
  const tag = (node.tag || 'div');

  if (node.type === 'customhtml' || node.type === 'svg') {
    const raw = (node.html || '').split('\n').map(l => pad + l).join('\n');
    if (node.hidden) {
      return pad + '<div id="' + escAttr(node.id) + '" class="vce-hidden">\n' + raw + '\n' + pad + '</div>';
    }
    return raw;
  }

  const attrs = [];
  if (node.id) attrs.push('id="' + escAttr(node.id) + '"');

  const classes = [];
  if (node.classes) classes.push(node.classes);
  if (node.hidden) classes.push('vce-hidden');
  if (classes.length) attrs.push('class="' + escAttr(classes.join(' ')) + '"');

  for (const k in (node.attrs || {})) {
    const v = node.attrs[k];
    if (v === true || v === '') attrs.push(k);
    else if (v !== false && v != null && v !== '') attrs.push(k + '="' + escAttr(v) + '"');
  }

  const openTag = '<' + tag + (attrs.length ? ' ' + attrs.join(' ') : '') + '>';

  if (VOID_TAGS.has(tag)) return pad + openTag;

  let inner = '';
  if (node.children && node.children.length) {
    inner = '\n' + node.children.map(c => generateNode(c, depth + 1)).join('\n') + '\n' + pad;
  } else if (node.html) {
    inner = node.html;
  } else if (node.text != null && node.text !== '') {
    if (/\{\{/.test(node.text)) {
      bindings[node.id] = node.text;
    }
    inner = esc(node.text);
  }

  return pad + openTag + inner + '</' + tag + '>';
}

function generateJS() {
  const varsObj = {};
  (project.variables || []).forEach(v => {
    let val = v.value;
    if (v.type === 'number') val = parseFloat(val) || 0;
    else if (v.type === 'boolean') val = (val === true || val === 'true');
    else if (v.type === 'json') { try { val = JSON.parse(val); } catch (e) { val = []; } }
    varsObj[v.name] = val;
  });

  const lines = [];
  lines.push('(function(){');
  lines.push('  "use strict";');
  lines.push('  var VARS = ' + JSON.stringify(varsObj) + ';');
  lines.push('  var BINDS = ' + JSON.stringify(bindings) + ';');
  lines.push('  var PAGES = ' + JSON.stringify(project.pages.map(p => ({ id: p.id, name: p.name }))) + ';');
  lines.push(`
  function byId(id){ return document.getElementById(id); }
  function interpolate(str){
    return String(str).replace(/\\{\\{\\s*([\\w.]+)\\s*\\}\\}/g, function(m, k){
      return (VARS[k] !== undefined && VARS[k] !== null) ? VARS[k] : m;
    });
  }
  function refresh(){
    for (var id in BINDS){
      var el = byId(id);
      if (el) el.textContent = interpolate(BINDS[id]);
    }
  }
  function setVar(name, value){ VARS[name] = value; refresh(); }
  function show(id){ var e = byId(id); if (e) e.classList.remove('vce-hidden'); }
  function hide(id){ var e = byId(id); if (e) e.classList.add('vce-hidden'); }
  function toggle(id){ var e = byId(id); if (e) e.classList.toggle('vce-hidden'); }
  function setText(id, v){ var e = byId(id); if (e) e.textContent = interpolate(String(v)); }
  function setImage(id, v){ var e = byId(id); if (e) e.setAttribute('src', v); }
  function setStyle(id, prop, v){ var e = byId(id); if (e && e.style) { try { e.style.setProperty(prop, v); } catch(err){} } }
  function addClass(id, c){ var e = byId(id); if (e && c) e.classList.add(c); }
  function removeClass(id, c){ var e = byId(id); if (e && c) e.classList.remove(c); }
  function navigate(url){ if (url) window.location.href = url; }
  function goPage(name){
    var pages = document.querySelectorAll('.vce-page');
    for (var i = 0; i < pages.length; i++){
      var match = pages[i].getAttribute('data-page-name') === name;
      pages[i].classList.toggle('active', match);
    }
    window.scrollTo(0, 0);
  }
  function scrollToEl(id){ var e = byId(id); if (e) e.scrollIntoView({behavior:'smooth', block:'start'}); }
  function play(id){ var e = byId(id); if (e && e.play) { try { e.play(); } catch(err){} } }
  function animate(id, name){
    var e = byId(id); if (!e) return;
    e.style.animation = 'vce-' + name + ' .65s ease both';
    setTimeout(function(){ e.style.animation = ''; }, 800);
  }
  function store(key, value){
    try { localStorage.setItem('vce:' + key, typeof value === 'string' ? value : JSON.stringify(value)); } catch(e){}
  }
  function load(key, targetId){
    var v = null;
    try { v = localStorage.getItem('vce:' + key); } catch(e){}
    if (v !== null && targetId) setText(targetId, v);
    return v;
  }
  function evalCond(left, op, right){
    var l = VARS[left] !== undefined ? VARS[left] : left;
    var r = VARS[right] !== undefined ? VARS[right] : right;
    var numL = parseFloat(l), numR = parseFloat(r);
    var bothNum = !isNaN(numL) && !isNaN(numR);
    switch(op){
      case '==': return String(l) == String(r);
      case '!=': return String(l) != String(r);
      case '>':  return bothNum ? numL > numR : String(l) > String(r);
      case '<':  return bothNum ? numL < numR : String(l) < String(r);
      case '>=': return bothNum ? numL >= numR : String(l) >= String(r);
      case '<=': return bothNum ? numL <= numR : String(l) <= String(r);
      case 'contains': return String(l).indexOf(String(r)) !== -1;
      case 'empty': return l === '' || l === null || l === undefined;
      case 'true': return l === true || l === 'true';
      case 'false': return l === false || l === 'false';
    }
    return false;
  }
  function checkConditions(ix){
    if (!ix.conditions || !ix.conditions.length) return true;
    var results = ix.conditions.map(function(c){ return evalCond(c.left, c.op, c.right); });
    return ix.logic === 'or' ? results.some(Boolean) : results.every(Boolean);
  }
  function val(v){ return VARS[v] !== undefined ? VARS[v] : v; }

  var VCE = {
    vars: VARS,
    get: byId, show: show, hide: hide, toggle: toggle,
    setText: setText, setImage: setImage, setStyle: setStyle,
    addClass: addClass, removeClass: removeClass,
    setVar: setVar, refresh: refresh, interpolate: interpolate,
    goPage: goPage, store: store, load: load, animate: animate,
    evalCond: evalCond
  };
  window.VCE = VCE;
`);

  const handlers = [];

  for (const pg of project.pages) {
    walk(pg.root, node => {
      if (!node.interactions || !node.interactions.length) return;
      node.interactions.forEach((ix) => {
        const body = [];
        body.push('      if (!checkConditions(ix)) return;');
        (ix.actions || []).forEach(a => body.push('      ' + actionToJS(a)));
        handlers.push(
          '    (function(){\n' +
          '      var el = byId(' + JSON.stringify(node.id) + ');\n' +
          '      if (!el) return;\n' +
          '      var ix = ' + JSON.stringify({ conditions: ix.conditions || [], logic: ix.logic || 'and' }) + ';\n' +
          '      el.addEventListener(' + JSON.stringify(ix.event || 'click') + ', function(ev){\n' +
          '      try {\n' +
          body.join('\n') + '\n' +
          '      } catch(err){ console.error(err); }\n' +
          '      });\n' +
          '    })();'
        );
      });
    });
  }

  lines.push('  /* ---- Visual interactions ---- */');
  lines.push(handlers.join('\n'));

  lines.push('  /* ---- On load ---- */');
  lines.push('  refresh();');

  if (project.customJS && project.customJS.trim()) {
    lines.push('  /* ---- Custom JavaScript ---- */');
    lines.push('  try {');
    lines.push(project.customJS.split('\n').map(l => '    ' + l).join('\n'));
    lines.push('  } catch(err){ console.error("Custom JS error:", err); }');
  }

  lines.push('})();');
  return lines.join('\n');
}

function actionToJS(a) {
  const t = (s) => JSON.stringify(s == null ? '' : s);
  switch (a.type) {
    case 'show':        return 'show(' + t(a.target) + ');';
    case 'hide':        return 'hide(' + t(a.target) + ');';
    case 'toggle':      return 'toggle(' + t(a.target) + ');';
    case 'setText':     return 'setText(' + t(a.target) + ', interpolate(val(' + t(a.value) + ')));';
    case 'setImage':    return 'setImage(' + t(a.target) + ', val(' + t(a.value) + '));';
    case 'setStyle':    return 'setStyle(' + t(a.target) + ', ' + t(a.prop) + ', val(' + t(a.value) + '));';
    case 'addClass':    return 'addClass(' + t(a.target) + ', ' + t(a.value) + ');';
    case 'removeClass': return 'removeClass(' + t(a.target) + ', ' + t(a.value) + ');';
    case 'navigate':    return 'navigate(val(' + t(a.value) + '));';
    case 'goPage':      return 'goPage(' + t(a.value) + ');';
    case 'scrollTo':    return 'scrollToEl(' + t(a.target) + ');';
    case 'play':        return 'play(' + t(a.target) + ');';
    case 'animate':     return 'animate(' + t(a.target) + ', ' + t(a.value) + ');';
    case 'setVar':      return 'setVar(' + t(a.name) + ', val(' + t(a.value) + '));';
    case 'changeVar': {
      const op = a.op || '+';
      const n = t(a.name);
      if (op === '=') return 'setVar(' + n + ', val(' + t(a.value) + '));';
      const sym = op === '+' ? '+' : op === '-' ? '-' : op === '*' ? '*' : '/';
      return 'setVar(' + n + ', (parseFloat(VARS[' + n + ']) || 0) ' + sym + ' (parseFloat(val(' + t(a.value) + ')) || 0));';
    }
    case 'saveData':    return 'store(' + t(a.key) + ', val(' + t(a.value) + '));';
    case 'loadData':    return 'load(' + t(a.key) + ', ' + t(a.target) + ');';
    case 'alert':       return 'window.alert(val(' + t(a.value) + '));';
    case 'runJS':       return '(new Function("VCE","vars","el","ev", ' + t(a.value) + '))(VCE, VARS, el, ev);';
    default:            return '/* unknown action */';
  }
}

function generateFullHTML() {
  bindings = {};
  const body = generateHTMLBody();
  const css = generateCSS();
  const js = generateJS();
  const title = esc(project.name || 'My Website');

  return '<!DOCTYPE html>\n' +
'<html lang="en">\n' +
'<head>\n' +
'  <meta charset="UTF-8">\n' +
'  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
'  <title>' + title + '</title>\n' +
'  <style>\n' +
css + '\n' +
'  </style>\n' +
'</head>\n' +
'<body>\n' +
body + '\n' +
'  <script>\n' +
js + '\n' +
'  <\/script>\n' +
'</body>\n' +
'</html>';
}

function openPreview() {

function openCode() {
  bindings = {};
  const html = generateFullHTML();

  const body = generateHTMLBody();
  const js = generateJS();

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML =
    '<div class="modal" style="width:min(1000px,95vw)">' +
      '<div class="modal-head"><h3>&lt;/&gt; Generated code</h3>' +
      '<span class="hint">Read-only — this is what the visual editor produced.</span>' +
      '<button class="modal-close">✕</button></div>' +
      '<div class="modal-body">' +
        '<div class="code-tabs">' +
          '<button data-c="html" class="active">HTML</button>' +
          '<button data-c="css">CSS</button>' +
          '<button data-c="js">JavaScript</button>' +
          '<button data-c="full">Full file</button>' +
        '</div>' +
        '<pre class="code" id="code-out"></pre>' +
      '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn-copy">📋 Copy</button>' +
        '<button class="primary btn-export-now">⬇ Export HTML</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(bg);

  const out = $('#code-out', bg);
  let current = body;
  const setCode = c => { current = c; out.textContent = c; };
  setCode(body);

  $$('.code-tabs button', bg).forEach(b => {
    b.addEventListener('click', () => {
      $$('.code-tabs button', bg).forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      const k = b.dataset.c;
      if (k === 'html') setCode(body);
      else if (k === 'css') setCode(css);
      else if (k === 'js') setCode(js);
      else setCode(html);
    });
  });

  const close = () => bg.remove();
  $('.modal-close', bg).addEventListener('click', close);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  $('.btn-copy', bg).addEventListener('click', () => {
    navigator.clipboard.writeText(current).then(() => toast('Copied to clipboard'));
  });
  $('.btn-export-now', bg).addEventListener('click', exportHTML);
}

function exportHTML() {
  const html = generateFullHTML();
  const fname = (project.name || 'website').replace(/[^\w\-]+/g, '_').toLowerCase() + '.html';
  download(fname, html, 'text/html');
  toast('Exported ' + fname + ' — open it in any browser!');
}

function saveProject() {
  const data = JSON.stringify(project, null, 2);
  const fname = (project.name || 'project').replace(/[^\w\-]+/g, '_').toLowerCase() + '.json';
  download(fname, data, 'application/json');
  toast('Project saved as ' + fname);
}

function loadProjectFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.pages || !data.pages.length) throw new Error('Not a WebCraft project');
      project = data;
      project.variables = project.variables || [];
      project.customCSS = project.customCSS || '';
      project.customJS = project.customJS || '';
      if (!project.pages.find(p => p.id === project.currentPageId)) {
        project.currentPageId = project.pages[0].id;
      }
      undoStack.length = 0; redoStack.length = 0;
      state.selectedId = null;
      renderAll();
      toast('Project loaded');
    } catch (e) {
      alert('Could not load this file: ' + e.message);
    }
  };
  reader.readAsText(file);
}

function importHTMLFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const doc = new DOMParser().parseFromString(reader.result, 'text/html');
      const page = importDocument(doc);
      pushHistory();
      project.pages = [page];
      project.currentPageId = page.id;

      const styles = Array.from(doc.querySelectorAll('style')).map(s => s.textContent).join('\n');
      if (styles.trim()) project.customCSS = (project.customCSS ? project.customCSS + '\n' : '') + styles;

      const scripts = Array.from(doc.querySelectorAll('script'))
        .filter(s => !s.src && s.textContent.trim() && s.textContent.indexOf('window.VCE') === -1)
        .map(s => s.textContent).join('\n\n');
      if (scripts.trim()) project.customJS = (project.customJS ? project.customJS + '\n\n' : '') + scripts;

      state.selectedId = null;
      renderAll();
      toast('HTML imported — check the Layers panel');
    } catch (e) {
      alert('Import failed: ' + e.message);
    }
  };
  reader.readAsText(file);
}

function importDocument(doc) {
  const page = createPage(doc.title || 'Imported Page');
  const body = doc.body;
  Array.from(body.childNodes).forEach(child => {
    const n = importNode(child);
    if (n) page.root.children.push(n);
  });
  if (!page.root.children.length) {
    page.root.children.push(createNode('heading', { text: 'Imported page (empty)' }));
  }
  return page;
}

function importNode(domNode) {
  if (domNode.nodeType === 3) {
    const txt = domNode.textContent.trim();
    if (!txt) return null;
    return createNode('paragraph', { text: txt });
  }
  if (domNode.nodeType !== 1) return null;

  const tag = domNode.tagName.toLowerCase();
  if (tag === 'script' || tag === 'style' || tag === 'link' || tag === 'meta') return null;

  const KNOWN = {
    h1:'heading', h2:'heading', h3:'heading', h4:'heading', h5:'heading', h6:'heading',
    p:'paragraph', span:'text', button:'button', a:'link', img:'image',
    video:'video', audio:'audio', hr:'divider', input:'input', textarea:'textarea',
    select:'select', form:'form', label:'label', nav:'nav', ul:'list', ol:'list', li:'listitem',
    iframe:'iframe', canvas:'canvas', table:'table', section:'section', div:'container',
    header:'section', footer:'section', main:'section', article:'section', aside:'section'
  };

  const type = KNOWN[tag];
  if (!type) {
    return createNode('customhtml', { html: domNode.outerHTML });
  }

  const overrides = { tag: tag, name: tag.charAt(0).toUpperCase() + tag.slice(1) };

  const styles = {};
  if (domNode.style && domNode.style.length) {
    for (let i = 0; i < domNode.style.length; i++) {
      const prop = domNode.style[i];
      styles[prop] = domNode.style.getPropertyValue(prop);
    }
  }
  const attrs = {};
  ['src','alt','href','placeholder','type','name','value','width','height','target','id'].forEach(a => {
    if (domNode.hasAttribute(a)) attrs[a] = domNode.getAttribute(a);
  });
  const cls = domNode.getAttribute('class');
  if (cls) overrides.classes = cls;

  const children = Array.from(domNode.childNodes).map(importNode).filter(Boolean);
  const isTextOnly = ['heading','text','paragraph','button','link','label','listitem'].includes(type);

  const node = createNode(type, {
    styles: styles,
    attrs: attrs,
    name: overrides.name
  });
  if (overrides.classes) node.classes = overrides.classes;
  node.tag = tag;
  node.id = domNode.id || uid('el');

  if (isTextOnly) {
    node.text = domNode.textContent.trim();
  } else if (children.length) {
    node.children = children;
  } else if (domNode.children.length === 0) {
    const t = domNode.textContent.trim();
    if (t) node.text = t;
  }
  return node;
}

function pickAsset(kind, cb) {
  const picker = $('#assetPicker');
  picker.value = '';
  picker.accept = kind === 'audio' ? 'audio/*' : kind === 'video' ? 'video/*' : 'image/*';
  picker.onchange = () => {
    const f = picker.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => cb(reader.result);
    reader.readAsDataURL(f);
  };
  picker.click();
}

function openDocs() {
  ensureDocsStyles();

  const bg = document.createElement('div');
  bg.className = 'vce-docs-bg';

  bg.innerHTML =
    '<div class="vce-docs-modal" role="dialog" aria-label="WebCraft documentation">' +
      '<div class="vce-docs-head">' +
        '<h3>📖 WebCraft — How it works</h3>' +
        '<span class="sub">Everything you can do, explained.</span>' +
        '<button class="vce-docs-close" title="Close">✕</button>' +
      '</div>' +
      '<div class="vce-docs-layout">' +
        '<nav class="vce-docs-nav" id="vceDocsNav"></nav>' +
        '<div class="vce-docs-content" id="vceDocsContent"></div>' +
      '</div>' +
    '</div>';

  document.body.appendChild(bg);

  const nav     = bg.querySelector('#vceDocsNav');
  const content = bg.querySelector('#vceDocsContent');
  const order   = Object.keys(DOCS);
  let current   = order[0];

  order.forEach(key => {
    const b = document.createElement('button');
    b.dataset.key = key;
    b.innerHTML = '<span class="ic">' + DOCS[key].icon + '</span>' +
                  '<span class="lbl">' + DOCS[key].title + '</span>';
    b.addEventListener('click', () => show(key));
    nav.appendChild(b);
  });

  function show(key) {
    current = key;
    nav.querySelectorAll('button').forEach(x =>
      x.classList.toggle('active', x.dataset.key === key));
    content.innerHTML = DOCS[key].html;
    content.scrollTop = 0;
    // After switching topic, scroll the active button into view on mobile
    const activeBtn = nav.querySelector('button.active');
    if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  show(current);

  const close = () => bg.remove();
  bg.querySelector('.vce-docs-close').addEventListener('click', close);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.tabIndex = 0;
  bg.addEventListener('keydown', e => {
    const i = order.indexOf(current);
    if (e.key === 'ArrowDown' && i < order.length - 1) { show(order[i + 1]); e.preventDefault(); }
    if (e.key === 'ArrowUp' && i > 0) { show(order[i - 1]); e.preventDefault(); }
    if (e.key === 'Escape') close();
  });
  bg.focus();
}

  ];
  bg.innerHTML =
    '<div class="modal" style="width:min(760px,95vw)">' +
      '<div class="modal-head"><h3>Start a new project</h3><button class="modal-close">✕</button></div>' +
      '<div class="modal-body"><div class="tpl-grid"></div></div>' +
    '</div>';
      // On mobile, switch the docs layout to a vertical stack
  if (window.matchMedia('(max-width: 900px)').matches) {
    $('#docsLayout', bg).style.flexDirection = 'column';
  }
  document.body.appendChild(bg);
  const grid = $('.tpl-grid', bg);
  list.forEach(([key, emoji, title, desc]) => {
    const c = document.createElement('div');
    c.className = 'tpl-card';
    c.innerHTML = '<div class="em">' + emoji + '</div><div class="t">' + title + '</div><div class="d">' + desc + '</div>';
    c.addEventListener('click', () => {
      project = TEMPLATES[key]();
      undoStack.length = 0; redoStack.length = 0;
      state.selectedId = null;
      state.autoFit = true;
      bg.remove();
      renderAll();
      toast('Template "' + title + '" loaded');
    });
    grid.appendChild(c);
  });
  const close = () => bg.remove();
  $('.modal-close', bg).addEventListener('click', close);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
}


/* ==========================================================================
   19. PAGES BAR
   ========================================================================== */
function renderPages() {
  const bar = $('#pagebar');
  bar.innerHTML = '';
  project.pages.forEach(p => {
    const t = document.createElement('div');
    t.className = 'page-tab' + (p.id === project.currentPageId ? ' active' : '');
    const nm = document.createElement('span');
    nm.textContent = p.name;
    t.appendChild(nm);
    if (project.pages.length > 1) {
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '✕';
      x.title = 'Delete page';
      x.addEventListener('click', e => {
        e.stopPropagation();
        pushHistory();
        const idx = project.pages.indexOf(p);
        project.pages.splice(idx, 1);
        if (project.currentPageId === p.id) project.currentPageId = project.pages[0].id;
        state.selectedId = null;
        renderAll();
      });
      t.appendChild(x);
    }
    t.addEventListener('click', () => {
      project.currentPageId = p.id;
      state.selectedId = null;
      renderAll();
    });
    t.addEventListener('dblclick', () => {
      const nn = prompt('Page name:', p.name);
      if (nn && nn.trim()) { pushHistory(); p.name = nn.trim(); renderAll(); }
    });
    bar.appendChild(t);
  });
  const add = document.createElement('div');
  add.className = 'page-tab';
  add.textContent = '+ New page';
  add.addEventListener('click', () => {
    pushHistory();
    const p = createPage('Page ' + (project.pages.length + 1));
    project.pages.push(p);
    project.currentPageId = p.id;
    state.selectedId = null;
    renderAll();
  });
  bar.appendChild(add);
}


/* ==========================================================================
   RENDER ALL
   ========================================================================== */
function renderAll() {
  renderPages();
  renderCanvas();
  renderTree();
  if (state.rightTab === 'design') renderDesign();
  if (state.rightTab === 'interact') renderInteractions();
  if (state.rightTab === 'vars') renderVariables();
  if (state.rightTab === 'global') renderGlobal();
  updateHistoryButtons();
}

/* ==========================================================================
   MOBILE DRAWERS
   ========================================================================== */
function openLeftDrawer()  { closeDrawers(); $('#leftSidebar').classList.add('open');  $('#mobileBackdrop').classList.add('show'); }
function openRightDrawer() { closeDrawers(); $('#rightSidebar').classList.add('open'); $('#mobileBackdrop').classList.add('show'); }
function closeDrawers()    { $('#leftSidebar').classList.remove('open'); $('#rightSidebar').classList.remove('open'); $('#mobileBackdrop').classList.remove('show'); }


/* ==========================================================================
   INITIALISATION
   ========================================================================== */
function init() {
  /* ---------- tabs ---------- */
  $('#leftTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#leftTabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.leftTab = b.dataset.tab;
    $('#tab-elements').classList.toggle('hidden', state.leftTab !== 'elements');
    $('#tab-layers').classList.toggle('hidden', state.leftTab !== 'layers');
  });
  $('#rightTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#rightTabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.rightTab = b.dataset.tab;
    ['design','interact','vars','global'].forEach(t => {
      $('#tab-' + t).classList.toggle('hidden', state.rightTab !== t);
    });
    if (state.rightTab === 'design') renderDesign();
    if (state.rightTab === 'interact') renderInteractions();
    if (state.rightTab === 'vars') renderVariables();
    if (state.rightTab === 'global') renderGlobal();
  });

  /* ---------- toolbar ---------- */
  $('#btn-new').addEventListener('click', openTemplates);
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-redo').addEventListener('click', redo);
  $('#btn-save').addEventListener('click', saveProject);
  $('#btn-load').addEventListener('click', () => {
    const p = $('#filePicker');
    p.accept = '.json,application/json';
    p.onchange = () => { if (p.files[0]) loadProjectFile(p.files[0]); p.value = ''; };
    p.click();
  });
  $('#btn-import').addEventListener('click', () => {
    const p = $('#filePicker');
    p.accept = '.html,.htm,text/html';
    p.onchange = () => { if (p.files[0]) importHTMLFile(p.files[0]); p.value = ''; };
    p.click();
  });
    $('#btn-docs').addEventListener('click', openDocs);
  $('#btn-preview').addEventListener('click', openPreview);
  $('#btn-code').addEventListener('click', openCode);
  $('#btn-export').addEventListener('click', exportHTML);

  /* ---------- device preview ---------- */
  $('#devices').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#devices button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.device = b.dataset.device;
    renderCanvas();
    renderDesign();
  });

  /* ---------- zoom (auto-fit aware) ---------- */
  const setZoom = z => {
    state.autoFit = false;
    state.zoom = Math.min(2, Math.max(0.15, Math.round(z * 100) / 100));
    syncZoom();
  };
  $('#zoom-in').addEventListener('click', () => setZoom(state.zoom + 0.1));
  $('#zoom-out').addEventListener('click', () => setZoom(state.zoom - 0.1));
  $('#zoom-fit').addEventListener('click', () => {
    state.autoFit = true;
    syncZoom();
    toast('Zoom: fit to screen');
  });
  $('#zoom-val').style.cursor = 'pointer';
  $('#zoom-val').title = 'Click to fit to screen';
  $('#zoom-val').addEventListener('click', () => {
    state.autoFit = true;
    syncZoom();
  });

    /* ---------- mobile drawers ---------- */
  $('#openLeftPanel').addEventListener('click', () => {
    if ($('#leftSidebar').classList.contains('open')) closeDrawers();
    else openLeftDrawer();
  });
  $('#openRightPanel').addEventListener('click', () => {
    if ($('#rightSidebar').classList.contains('open')) closeDrawers();
    else openRightDrawer();
  });
  $('#mobileBackdrop').addEventListener('click', closeDrawers);

  /* ---------- theme ---------- */
  $('#btn-theme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    $('#btn-theme').textContent = next === 'dark' ? '🌙' : '☀️';
  });

  /* ---------- canvas interaction ---------- */
  const content = $('#canvas-content');

  content.addEventListener('mousedown', e => {
    if (state.editingId) return;
    const el = e.target.closest('[data-vce-id]');
    if (!el) { selectNode(null); return; }
    if (state.selectedId !== el.dataset.vceId) selectNode(el.dataset.vceId);
  });

  /* On mobile, tapping an element also opens the Design drawer for immediate editing. */
  content.addEventListener('pointerdown', e => {
    if (!window.matchMedia('(max-width: 900px)').matches) return;
    if (state.editingId) return;
    const el = e.target.closest('[data-vce-id]');
    if (!el) return;
    if (state.selectedId !== el.dataset.vceId) {
      selectNode(el.dataset.vceId);
      $('#rightTabs').querySelector('[data-tab="design"]').click();
      openRightDrawer();
    }
  });

  content.addEventListener('dblclick', e => {
    const el = e.target.closest('[data-vce-id]');
    if (!el) return;
    const node = findNode(el.dataset.vceId);
    if (!node || !isTextType(node) || node.locked) return;
    e.preventDefault();
    e.stopPropagation();

    const original = el.textContent;
    el.setAttribute('contenteditable', 'true');
    el.setAttribute('draggable', 'false');
    el.spellcheck = false;
    el.focus();

    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    state.editingId = node.id;
    updateOverlay();

    const finish = () => {
      el.removeAttribute('contenteditable');
      el.setAttribute('draggable', 'true');
      state.editingId = null;
      const newText = el.textContent;
      if (newText !== original) {
        mutate('inline-text:' + node.id, () => { node.text = newText; });
      }
      renderCanvas();
      renderDesign();
    };
    el.addEventListener('blur', finish, { once: true });
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Escape') { el.textContent = original; el.blur(); }
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); el.blur(); }
    });
  });

  /* ---------- overlay refresh + auto-fit on resize ---------- */
  $('#viewport').addEventListener('scroll', updateOverlay, { passive: true });

  // Images load asynchronously — remeasure the page height when they do.
  content.addEventListener('load', () => scheduleSync(), true);

  window.addEventListener('resize', () => {
    scheduleSync();
    if (!window.matchMedia('(max-width: 900px)').matches) closeDrawers();
  });

  /* ---------- keyboard shortcuts ---------- */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

    if (e.key === 'F1') { e.preventDefault(); openDocs(); return; }

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      e.preventDefault(); undo(); return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
      e.preventDefault(); redo(); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault(); saveProject(); return;
    }
    // >>> NEW: Ctrl+0 = fit to screen <<<
    if ((e.ctrlKey || e.metaKey) && e.key === '0') {
      e.preventDefault(); state.autoFit = true; syncZoom(); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
      if (state.selectedId && !typing) {
        e.preventDefault();
        const n = findNode(state.selectedId);
        if (n && n.type !== 'page') { pushHistory(); duplicateNode(n.id); renderAll(); }
      }
      return;
    }
    if (typing) return;

    if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedId) {
      const n = findNode(state.selectedId);
      if (n && n.type !== 'page') {
        e.preventDefault();
        pushHistory();
        removeNode(n.id);
        state.selectedId = null;
        renderAll();
        if (state.rightTab === 'design') renderDesign();
      }
    }
    if (e.key === 'Escape') {
      closeDrawers();
      state.selectedId = null;
      renderAll();
    }
  });

  /* ---------- panel resizers (also re-fit the canvas) ---------- */
  $$('.resizer').forEach(rz => {
    rz.addEventListener('pointerdown', e => {
      const target = document.getElementById(rz.dataset.target);
      const isRight = target.classList.contains('right');
      const startX = e.clientX;
      const startW = target.getBoundingClientRect().width;
      const move = ev => {
        const dx = ev.clientX - startX;
        const w = Math.max(170, Math.min(520, isRight ? startW - dx : startW + dx));
        target.style.width = w + 'px';
        scheduleSync();   // >>> CHANGED: was updateOverlay(); keeps fit correct <<<
      };
      const up = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
      e.preventDefault();
    });
  });

  /* ---------- drag & drop ---------- */
  initPaletteDnD();
  initCanvasDnD();

  /* ---------- boot ---------- */
  project = TEMPLATES.blank();
  state.autoFit = true;
  renderPalette();
  renderAll();
  // Re-measure once fonts/layout settle
  requestAnimationFrame(() => scheduleSync());
  updateHistoryButtons();

  console.log('%c◆ WebCraft ready', 'color:#5b8cff;font-weight:bold;font-size:14px');
  console.log('Canvas auto-fits the screen. Use the ⤢ button (or Ctrl+0) to re-fit after zooming.');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
