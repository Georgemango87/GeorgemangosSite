            --muted-text: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh; /* Changed from min-height to lock height */
            overflow: hidden; /* Removes scroll wheel / scrolling */
            touch-action: manipulation; /* Prevents double-tap zoom delay */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2rem;
        }

        header { text-align: center; margin-bottom: 1.5rem; }
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p { color: var(--muted-text); font-size: 1rem; }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 3rem 2rem;
            width: 100%;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .card-counter {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            font-size: 0.75rem;
            color: var(--muted-text);
        }

        #starter-text { font-size: 1.3rem; line-height: 1.6; font-weight: 500; }

        .controls { display: flex; gap: 1rem; width: 100%; flex-wrap: wrap; }
        .btn {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text-color);
            padding: 0.9rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-grow: 1;
        }
        .btn:hover { background-color: #334155; }
        .next-btn {
            background-color: var(--accent-color);
            border: none;
            color: white;
            flex-grow: 2;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        .next-btn:hover { background-color: var(--accent-hover); }
        .next-btn:active { transform: scale(0.98); }

        footer { margin-top: 2rem; color: var(--muted-text); font-size: 0.8rem; text-align: center; }
    </style>
</head>
