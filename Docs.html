<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Docs — Write anything</title>
<style>
:root{
  --bg:#f1f3f4; --surface:#fff; --surface-2:#f8f9fa; --surface-3:#eef1f5;
  --text:#202124; --muted:#5f6368; --border:#dadce0;
  --accent:#1a73e8; --accent-soft:#e8f0fe; --danger:#d93025;
  --shadow:0 1px 3px rgba(60,64,67,.16),0 4px 10px rgba(60,64,67,.08);
  --shadow-lg:0 8px 32px rgba(60,64,67,.22);
  --radius:10px;
  --page-w:816px; --page-min-h:1056px;
  --page-pad-t:88px; --page-pad-r:92px; --page-pad-b:120px; --page-pad-l:92px;
}
[data-theme="dark"]{
  --bg:#1b1c1d; --surface:#2a2b2d; --surface-2:#333537; --surface-3:#3c3e41;
  --text:#e8eaed; --muted:#9aa0a6; --border:#48494b;
  --accent:#8ab4f8; --accent-soft:#2b3c55; --danger:#f28b82;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select{max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}

/* Mobile drawer backdrop */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}

/* Sidebar */
.sidebar{width:264px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;gap:12px;transition:margin-left .25s ease}
.sidebar.collapsed{margin-left:-264px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 2px}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;background:linear-gradient(135deg,var(--accent),#7c4dff);color:#fff;box-shadow:var(--shadow)}
.brand-name{font-weight:600;font-size:15px;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--muted)}
.new-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:24px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:.15s}
.new-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.new-btn span{font-size:17px;line-height:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:8px 10px;border:1px solid transparent;transition:.15s}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search span{font-size:13px;opacity:.6}
.search input{flex:1;border:none;background:none;outline:none;font-size:13.5px;min-width:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:0 20px 20px 0;font-size:13.5px;color:var(--muted);text-align:left;transition:.12s;margin-left:-12px;padding-left:16px}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item em{margin-left:auto;font-style:normal;font-size:11px;opacity:.7;font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px solid var(--border)}
.ghost-btn{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--muted);text-align:left;transition:.12s}
.ghost-btn:hover{background:var(--surface-2);color:var(--text)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}
.view{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.hidden{display:none !important}

#homeView{overflow-y:auto;padding:26px 34px 60px;-webkit-overflow-scrolling:touch}
.home-header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.home-header h1{font-size:22px;margin:0;font-weight:500;letter-spacing:-.2px}
.home-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;cursor:pointer}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{padding:7px 12px;font-size:13px;color:var(--muted);transition:.12s}
.seg button.active{background:var(--accent-soft);color:var(--accent)}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}
.doc-grid.list{grid-template-columns:1fr;gap:8px}
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.16s;position:relative;display:flex;flex-direction:column}
.doc-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:transparent}
.doc-grid.list .doc-card{flex-direction:row;align-items:center;border-radius:8px}
.card-preview{height:158px;background:var(--surface);border-bottom:1px solid var(--border);padding:16px;overflow:hidden;font-size:6.5px;line-height:1.5;position:relative;pointer-events:none;font-family:Arial,sans-serif;color:var(--text)}
.card-preview::after{content:'';position:absolute;inset:auto 0 0 0;height:44px;background:linear-gradient(transparent,var(--surface))}
.card-preview h1{font-size:12px;margin:0 0 5px}
.card-preview h2{font-size:10px;margin:4px 0 3px}
.card-preview h3{font-size:8.5px;margin:3px 0 2px}
.card-preview table{border-collapse:collapse}
.card-preview td,.card-preview th{border:1px solid var(--border);padding:1px 3px}
.card-preview.placeholder{display:grid;place-items:center;color:var(--muted);font-size:34px;opacity:.25}
.doc-grid.list .card-preview{display:none}
.card-body{padding:11px 14px 13px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.doc-grid.list .card-body{padding:10px 14px}
.card-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:3px;opacity:0;transition:.15s}
.doc-card:hover .card-actions,.doc-card:focus-within .card-actions{opacity:1}
.mini-btn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted);transition:.12s}
.mini-btn:hover{background:var(--surface-3);color:var(--text)}
.mini-btn.on{color:#f9ab00}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:80px 20px;color:var(--muted);text-align:center}
.empty-state .big{font-size:52px;opacity:.35}

.editor-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:30}
.doc-title-input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:16px;font-weight:500;padding:7px 8px;border-radius:6px}
.doc-title-input:hover{background:var(--surface-2)}
.doc-title-input:focus{background:var(--surface-2)}
.top-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--muted);transition:.12s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.on{color:#f9ab00}
.icon-btn.rec{color:var(--danger);animation:pulse 1.2s infinite}
.icon-btn:disabled{opacity:.35;cursor:default}

.menubar{display:flex;align-items:center;gap:1px;padding:2px 8px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:28;position:relative;overflow-x:auto;scrollbar-width:none}
.menubar::-webkit-scrollbar{display:none}
.menu-btn{padding:8px 12px;border-radius:6px;font-size:13.5px;color:var(--text);transition:.1s;white-space:nowrap;flex-shrink:0}
.menu-btn:hover{background:var(--surface-2)}
.menu-btn.open{background:var(--accent-soft);color:var(--accent)}
.menu-dropdown{position:absolute;top:100%;left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);min-width:260px;max-width:min(94vw,320px);padding:6px;z-index:200;animation:pop .12s ease;max-height:70vh;overflow-y:auto}
.menu-dropdown button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;border-radius:7px;font-size:13.5px;color:var(--text);transition:.1s}
.menu-dropdown button:hover{background:var(--surface-2)}
.menu-dropdown .div{height:1px;background:var(--border);margin:5px 8px}
.menu-dropdown .short{margin-left:auto;font-size:11.5px;color:var(--muted);padding-left:12px}
.menu-dropdown .ico{width:18px;display:inline-block;text-align:center;flex-shrink:0}

/* Toolbar (streamlined + touch friendly) */
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;z-index:25;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.toolbar::-webkit-scrollbar{height:5px}
.tb-group{display:flex;align-items:center;gap:1px;flex-shrink:0}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 6px;flex-shrink:0}
.tb{min-width:34px;height:34px;padding:0 6px;border-radius:6px;display:grid;place-items:center;font-size:14px;color:var(--text);transition:.1s;flex-shrink:0;line-height:1}
.tb:hover{background:var(--surface-3)}
.tb.active{background:var(--accent-soft);color:var(--accent)}
.tb-select{height:34px;border:1px solid transparent;background:transparent;border-radius:6px;padding:0 8px;font-size:12.5px;outline:none;cursor:pointer;max-width:130px;flex-shrink:0}
.tb-select:hover{background:var(--surface-3)}
.color-btn{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:0;align-items:center;justify-content:center;min-width:36px}
.color-btn input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.color-bar{width:18px;height:3px;border-radius:2px;margin-top:-1px}
.size-input{
  width:56px;height:34px;border:1px solid transparent;background:transparent;border-radius:6px;
  padding:0 6px;font-size:13px;outline:none;text-align:center;-moz-appearance:textfield;
}
.size-input::-webkit-outer-spin-button,.size-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.size-input:hover,.size-input:focus{background:var(--surface-3);border-color:var(--border)}
#hiliteToggle{font-size:15px}

/* Table toolbar */
.table-toolbar{position:fixed;display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:120;gap:2px;align-items:center;animation:pop .12s ease;flex-wrap:wrap;max-width:96vw}
.table-toolbar.show{display:flex}
.table-toolbar button{min-width:32px;height:32px;padding:0 8px;border-radius:5px;font-size:13px;color:var(--text);transition:.1s;white-space:nowrap}
.table-toolbar button:hover{background:var(--surface-2)}
.table-toolbar .sep{width:1px;height:20px;background:var(--border);margin:0 4px}

/* Find bar */
.findbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.findbar input{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:7px 10px;font-size:13px;outline:none;width:180px;max-width:100%}
.findbar input:focus{border-color:var(--accent)}
.findbar .count{font-size:12px;color:var(--muted);min-width:62px}
.sm-btn{padding:7px 12px;border-radius:6px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);transition:.12s}
.sm-btn:hover{background:var(--surface-3)}
.sm-btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.sm-btn.primary:hover{filter:brightness(1.08)}

/* Editor body */
.editor-body{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
.editor-scroll{flex:1;overflow-y:auto;overflow-x:auto;background:var(--bg);scroll-behavior:smooth;position:relative;-webkit-overflow-scrolling:touch}
.page{width:var(--page-w);min-height:var(--page-min-h);margin:22px auto 90px;background:var(--surface);box-shadow:var(--shadow);padding:var(--page-pad-t) var(--page-pad-r) var(--page-pad-b) var(--page-pad-l);border-radius:2px;transition:box-shadow .2s, width .2s;position:relative}
[data-theme="dark"] .page{border:1px solid var(--border)}
body.pageless .page{box-shadow:none;margin:0;padding:32px max(40px, calc((100% - 816px) / 2));min-height:100%;width:100%;max-width:none;background:var(--surface)}
#editor{outline:none;font-family:var(--doc-font,Arial,sans-serif);font-size:16px;line-height:1.65;color:var(--text);min-height:70vh;word-wrap:break-word;caret-color:var(--accent)}
#editor:empty::before{content:attr(data-placeholder);color:var(--muted);opacity:.65;pointer-events:none}
#editor p{margin:0 0 12px}
#editor h1{font-size:30px;margin:26px 0 12px;font-weight:600;line-height:1.3}
#editor h2{font-size:24px;margin:22px 0 10px;font-weight:600;line-height:1.3}
#editor h3{font-size:20px;margin:18px 0 8px;font-weight:600}
#editor h4{font-size:17px;margin:16px 0 6px;font-weight:600}
#editor h5{font-size:15px;margin:14px 0 6px;font-weight:600}
#editor h6{font-size:14px;margin:14px 0 6px;font-weight:600;color:var(--muted)}
#editor ul,#editor ol{margin:0 0 12px;padding-left:28px}
#editor li{margin:4px 0}
#editor blockquote{border-left:3px solid var(--accent);margin:14px 0;padding:4px 0 4px 16px;color:var(--muted);font-style:italic}
#editor pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'Roboto Mono',Consolas,monospace;font-size:13.5px;white-space:pre-wrap;margin:0 0 12px;overflow-x:auto}
#editor code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:.9em}
#editor a{color:var(--accent);text-decoration:underline;cursor:pointer}
#editor img{max-width:100%;height:auto;border-radius:6px;margin:6px 0}
#editor hr{border:none;border-top:1px solid var(--border);margin:22px 0}
#editor table{border-collapse:collapse;width:100%;margin:14px 0;table-layout:fixed}
#editor td,#editor th{border:1px solid var(--border);padding:7px 10px;vertical-align:top;min-width:40px;position:relative}
#editor th{background:var(--surface-2);font-weight:600}
#editor font[size="1"]{font-size:10px}
#editor font[size="2"]{font-size:13px}
#editor font[size="3"]{font-size:16px}
#editor font[size="4"]{font-size:19px}
#editor font[size="5"]{font-size:24px}
#editor font[size="6"]{font-size:32px}
#editor font[size="7"]{font-size:44px}

/* Checklist */
#editor ul.task-list{list-style:none;padding-left:6px}
#editor ul.task-list li{display:flex;align-items:flex-start;gap:8px;margin:4px 0;padding-left:0}
#editor .task-check{
  flex-shrink:0;width:16px;height:16px;margin-top:5px;
  border:2px solid var(--muted);border-radius:3px;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;transition:.12s;position:relative;
}
#editor .task-check:hover{border-color:var(--accent)}
#editor .task-check.checked{background:var(--accent);border-color:var(--accent)}
#editor .task-check.checked::after{
  content:'';width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px);
}
#editor ul.task-list li.checked{color:var(--muted);text-decoration:line-through}

#editor mark[data-find]{background:#ffe066;color:#000;border-radius:2px}
#editor mark[data-find].current{background:#ff8f00;color:#fff}
[data-theme="dark"] #editor mark[data-find]{background:#8a6d00;color:#fff}
[data-theme="dark"] #editor mark[data-find].current{background:#ff8f00;color:#000}
#editor .comment-anchor{background:rgba(255,193,7,.35);border-bottom:2px solid #f9ab00;cursor:pointer;border-radius:2px}
#editor .comment-anchor.resolved{background:transparent;border-bottom:none;cursor:default}
#editor .bookmark-anchor{display:inline-block;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--accent);vertical-align:middle;margin:0 3px;cursor:pointer}
#editor .page-break{display:block;border-top:2px dashed var(--accent);margin:24px 0;position:relative;height:0}
#editor .page-break::after{content:'Page break';position:absolute;top:-9px;right:0;background:var(--accent-soft);color:var(--accent);font-size:10.5px;padding:1px 7px;border-radius:4px}

.ruler{position:sticky;top:0;height:22px;background:var(--surface-2);border-bottom:1px solid var(--border);z-index:22;overflow:hidden;flex-shrink:0}
.ruler-inner{height:100%;margin:0 auto;position:relative;max-width:var(--page-w);padding:0 var(--page-pad-l) 0 var(--page-pad-l)}
.ruler-ticks{position:absolute;left:var(--page-pad-l);right:var(--page-pad-r);top:0;bottom:0;background-image:repeating-linear-gradient(to right,var(--border) 0 1px,transparent 1px 40px),repeating-linear-gradient(to right,var(--border) 0 1px,transparent 1px 8px);background-position:0 60%,0 70%;background-size:100% 40%,100% 30%;background-repeat:repeat-x}
.ruler-margin{position:absolute;top:0;bottom:0;width:10px;background:var(--surface-3);cursor:ew-resize;z-index:2;touch-action:none}
.ruler-margin.left{left:0;border-right:1px solid var(--border)}
.ruler-margin.right{right:0;border-left:1px solid var(--border)}
.ruler-margin:hover{background:var(--accent-soft)}

.side-panel{width:0;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);overflow:hidden;transition:width .22s ease;display:flex;flex-direction:column}
.side-panel.open{width:280px;overflow-y:auto}
.side-panel h4{margin:16px 16px 8px;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.side-panel h4 .pill{margin-left:auto;background:var(--accent-soft);color:var(--accent);font-size:10.5px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:0}
.side-panel h4 .close-x{margin-left:6px;font-size:16px;color:var(--muted);width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.side-panel h4 .close-x:hover{background:var(--surface-2);color:var(--text)}
.outline-item{display:block;width:100%;text-align:left;padding:8px 16px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid transparent;transition:.12s}
.outline-item:hover{background:var(--surface-2);color:var(--text)}
.outline-item.lv1{padding-left:16px;font-weight:600;color:var(--text)}
.outline-item.lv2{padding-left:28px}
.outline-item.lv3{padding-left:40px}
.outline-item.lv4,.outline-item.lv5,.outline-item.lv6{padding-left:52px}
.outline-empty{padding:6px 16px;font-size:12.5px;color:var(--muted);opacity:.7}
.comment-card{margin:0 12px 10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);transition:.12s;cursor:pointer}
.comment-card:hover{border-color:var(--accent)}
.comment-card.resolved{opacity:.55}
.comment-card .head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.comment-card .avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c4dff);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.comment-card .author{font-size:12.5px;font-weight:600}
.comment-card .time{font-size:10.5px;color:var(--muted);margin-left:auto}
.comment-card .quote{font-size:11.5px;color:var(--muted);border-left:2px solid var(--border);padding-left:8px;margin:4px 0 6px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment-card .body{font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.comment-card .acts{display:flex;gap:6px;margin-top:8px}
.comment-card .acts button{font-size:11.5px;padding:5px 10px;border-radius:5px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.comment-card .acts button:hover{background:var(--surface-3);color:var(--text)}
.comment-card .acts button.resolve{color:var(--accent);border-color:var(--accent)}

.statusbar{display:flex;align-items:center;gap:14px;padding:5px 16px;background:var(--surface);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);flex-shrink:0;z-index:20;flex-wrap:wrap}
.statusbar .spacer{flex:1}
.statusbar .stat{cursor:pointer;padding:2px 6px;border-radius:4px}
.statusbar .stat:hover{background:var(--surface-2);color:var(--text)}
.save-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34a853;margin-right:6px;transition:.3s}
.save-dot.saving{background:#fbbc04;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.zoom-ctl{display:flex;align-items:center;gap:6px}
.zoom-ctl button{font-size:14px;width:24px;height:24px;border-radius:4px;color:var(--muted)}
.zoom-ctl button:hover{background:var(--surface-2);color:var(--text)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;z-index:200;padding:16px;animation:fade .15s ease;overflow-y:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;padding:18px 22px 12px;font-size:17px;font-weight:600;flex-shrink:0}
.modal-head button{margin-left:auto;font-size:20px;color:var(--muted);width:32px;height:32px;border-radius:50%}
.modal-head button:hover{background:var(--surface-2)}
.modal-body{padding:0 22px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-foot{padding:12px 22px 18px;display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row.three{grid-template-columns:1fr 1fr 1fr}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tpl{border:1px solid var(--border);border-radius:10px;padding:16px 14px;text-align:left;transition:.15s;background:var(--surface-2)}
.tpl:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.tpl .ico{font-size:22px;margin-bottom:6px}
.tpl .nm{font-size:13.5px;font-weight:600}
.tpl .ds{font-size:11.5px;color:var(--muted);margin-top:3px}
.hist-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;transition:.12s}
.hist-item:hover{background:var(--surface-2);border-color:var(--accent)}
.hist-item .t{font-size:13px;font-weight:500}
.hist-item .d{font-size:11.5px;color:var(--muted)}
.menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);min-width:216px;padding:6px;z-index:150;animation:pop .12s ease}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:7px;font-size:13.5px;color:var(--text);transition:.1s}
.menu button:hover{background:var(--surface-2)}
.menu .div{height:1px;background:var(--border);margin:5px 8px}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:92vw}
.toast{background:#323639;color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;box-shadow:var(--shadow-lg);animation:toastIn .22s ease;max-width:92vw;text-align:center;line-height:1.4}
[data-theme="dark"] .toast{background:#e8eaed;color:#202124}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}}

.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;max-height:340px;overflow-y:auto;padding:4px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.char-cell{aspect-ratio:1;display:grid;place-items:center;font-size:18px;border-radius:6px;cursor:pointer;transition:.1s;border:none;background:transparent}
.char-cell:hover{background:var(--accent-soft);color:var(--accent)}
.chars-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.chars-tab{padding:7px 12px;border-radius:6px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.chars-tab.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}

.font-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;padding:2px}
.font-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.font-row .name{font-size:13.5px;font-weight:500}
.font-row .sample{font-size:13px;color:var(--muted);margin-left:6px;flex:1;min-width:100px}
.font-row .spacer{flex:1}
.font-row button{font-size:11.5px;padding:5px 10px;border-radius:5px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.font-row button:hover{color:var(--danger);border-color:var(--danger)}

.voice-indicator{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:12px 22px;border-radius:24px;box-shadow:var(--shadow-lg);font-size:13.5px;display:flex;align-items:center;gap:10px;z-index:300;animation:toastIn .22s ease;cursor:pointer;max-width:92vw}
.voice-indicator .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s infinite;flex-shrink:0}
.voice-indicator .live{opacity:.85;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}

.comment-popover{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:12px;width:min(300px,92vw);z-index:180;animation:pop .12s ease}

.comment-popover textarea:focus{border-color:var(--accent)}

/* ============ MOBILE ============ */

  .field-row,.field-row.three{grid-template-columns:1fr}

  .table-toolbar{left:6px!important;right:6px;max-width:none;top:auto!important;bottom:80px;justify-content:center;flex-wrap:wrap}
  .table-toolbar button{font-size:12px;padding:0 6px;min-width:30px;height:30px}
  .voice-indicator{font-size:12.5px;padding:10px 16px;bottom:20px;gap:8px}

}

<div class="app">

  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">

      <div class="logo">✎</div>

    </div>

      <button class="ghost-btn" id="templatesBtn"><span>✨</span> Templates</button>

  <main class="main">

          <select class="select" id="sortSelect">

          <button class="icon-btn" id="historyBtn" title="Version history">🕘</button>
          <button class="icon-btn" id="outlineBtn" title="Outline">☰</button>

      <div class="menubar" id="menubar">

        <button class="menu-btn" data-menu="view">View</button>

        <div class="tb-group">

<script>
"use strict";
/* ============================================================
   UTILITIES
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const isMobile = () => window.matchMedia('(max-width: 760px)').matches;
const fmtDate = ts => {
  const d = new Date(ts), now = new Date(), diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
  if (d.toDateString() === now.toDateString()) return 'Today ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return d.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
};
const stripTags = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent || ''; };

function sanitize(html) {
  const t = document.createElement('div');
  t.innerHTML = html || '';
  t.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
  t.querySelectorAll('*').forEach(n => {
    Array.from(n.attributes).forEach(a => {
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      if ((a.name === 'href' || a.name === 'src') && /^\s*(javascript|data:text\/html)/i.test(a.value)) n.removeAttribute(a.name);
    });
  });
  t.querySelectorAll('ul li input[type=checkbox]').forEach(input => {
    const span = document.createElement('span');
    span.className = 'task-check' + (input.checked ? ' checked' : '');
    span.setAttribute('contenteditable', 'false');
    input.replaceWith(span);
    const ul = input.closest('ul');
    if (ul && !ul.classList.contains('task-list')) ul.classList.add('task-list');
  });
  return t.innerHTML;
}

function download(filename, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function toast(msg, ms = 2200) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('#toastWrap').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(10px)'; }, ms - 300);
  setTimeout(() => el.remove(), ms);
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem('docs-app-v3') || localStorage.getItem('docs-app-v2');

      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.docs)) {
        state.docs = parsed.docs.map(d => {
          const doc = { comments: [], pageSetup: JSON.parse(JSON.stringify(state.settings.pageSetup)), ...d };
          if (doc.html) doc.html = sanitize(doc.html);
          return doc;
        });
        state.settings = Object.assign(state.settings, parsed.settings || {});
      }
    }
  } catch (e) { console.warn('Load failed', e); }
  if (!state.docs.length) seed();
}

function renderHome() {
  const grid = $('#docGrid');

  let docs = state.docs.filter(d => currentFilter === 'trash' ? d.trashed : !d.trashed);
  if (currentFilter === 'starred') docs = docs.filter(d => d.starred);
  if (q) docs = docs.filter(d => d.title.toLowerCase().includes(q) || stripTags(d.html).toLowerCase().includes(q));

  const sort = state.settings.sort;
  docs.sort((a, b) => sort === 'title' ? a.title.localeCompare(b.title)
    : sort === 'created' ? b.created - a.created
    : sort === 'words' ? wordCount(b.html) - wordCount(a.html)
    : b.updated - a.updated);

  grid.className = 'doc-grid' + (state.settings.view === 'list' ? ' list' : '');

    card.innerHTML = `

function flushSave() {

  const html = editor.innerHTML;

function maybeSnapshot(doc) {
  doc.history = doc.history || [];
  const last = doc.history[doc.history.length - 1];
  if (last && last.html === doc.html) return;
  const now = Date.now();
  if (last && now - last.ts < 120000) return;
  doc.history.push({ ts: now, html: doc.html, title: doc.title });
  if (doc.history.length > 30) doc.history.shift();
}

const editor = $('#editor');
let savedRange = null;
let zoom = 1;

document.execCommand('defaultParagraphSeparator', false, 'p');
document.execCommand('styleWithCSS', false, false);

function captureSelection() {
  const sel = window.getSelection();
  if (sel.rangeCount && sel.anchorNode && editor.contains(sel.anchorNode)) {
    savedRange = sel.getRangeAt(0).cloneRange();
    return true;
  }
  return false;
}
document.addEventListener('selectionchange', () => {
  if (captureSelection()) { updateToolbarState(); updateTableToolbar(); }
});
function ensureEditorCaret() {
  if (!editor.innerHTML.trim()) editor.innerHTML = '<p><br></p>';
  if (document.activeElement !== editor) {
    try { editor.focus({ preventScroll: true }); } catch (e) { editor.focus(); }
  }
  const sel = window.getSelection();
  if (sel.rangeCount && sel.anchorNode && editor.contains(sel.anchorNode)) return sel.getRangeAt(0);
  if (savedRange && editor.contains(savedRange.startContainer)) {
    sel.removeAllRanges();
    try { sel.addRange(savedRange); return sel.getRangeAt(0); } catch (e) {}
  }
  const r = document.createRange();
  r.selectNodeContents(editor); r.collapse(false);
  sel.removeAllRanges(); sel.addRange(r);
  return r;
}
function exec(cmd, val = null, useCSS = false) {
  ensureEditorCaret();
  document.execCommand('styleWithCSS', false, !!useCSS);
  let ok = false;
  try { ok = document.execCommand(cmd, false, val); } catch (e) {}
  document.execCommand('styleWithCSS', false, false);
  captureSelection(); scheduleSave(); updateToolbarState(); buildOutline();
  return ok;
}
function rgbToHex(rgb) {
  if (!rgb) return '';
  if (rgb.startsWith('#')) return rgb;
  const m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '';
  return '#' + [m[1], m[2], m[3]].map(n => (+n).toString(16).padStart(2, '0')).join('');
}
function isTransparent(c) {
  return !c || c === 'transparent' || c === 'rgba(0, 0, 0, 0)' || c === 'rgba(0,0,0,0)';
}
function getSelectionHighlight() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if (range.collapsed) return null;
  const colors = new Set();
  const walker = document.createTreeWalker(range.commonAncestorContainer, NodeFilter.SHOW_TEXT);
  let node, found = false;
  while ((node = walker.nextNode())) {
    if (!range.intersectsNode(node)) continue;
    found = true;
    let el = node.parentElement;
    let bg = 'rgba(0, 0, 0, 0)';
    while (el && el !== editor) {
      const c = getComputedStyle(el).backgroundColor;
      if (!isTransparent(c)) { bg = c; break; }
      el = el.parentElement;
    }
    colors.add(bg);
  }
  if (!found) return null;
  if (colors.size === 1) return [...colors][0];
  return null;
}
function updateToolbarState() {
  const states = { bold:'bold', italic:'italic', underline:'underline', strikeThrough:'strikeThrough',
    insertUnorderedList:'insertUnorderedList', insertOrderedList:'insertOrderedList',
    superscript:'superscript', subscript:'subscript' };
  for (const [cmd, key] of Object.entries(states)) {
    const btn = $(`.tb[data-cmd="${cmd}"]`);
    if (!btn) continue;
    let on = false;
    try { on = document.queryCommandState(key); } catch (e) {}
    btn.classList.toggle('active', on);
  }
  try {
    let block = (document.queryCommandValue('formatBlock') || 'p').toUpperCase();
    if (block === 'DIV') block = 'P';
    const sel = $('#styleSelect');
    if ([...sel.options].some(o => o.value === block)) sel.value = block;
  } catch (e) {}

  // Font size — reflect at caret
  try {
    const sel = window.getSelection();
    let px = null;
    if (sel.rangeCount) {
      let node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentNode;
      if (node && editor.contains(node)) {
        const cs = parseFloat(getComputedStyle(node).fontSize);
        if (cs && !isNaN(cs)) px = Math.round(cs);
      }
    }
    const input = $('#sizeInput');
    if (px && document.activeElement !== input) input.value = px;
    else if (!px && document.activeElement !== input && !pendingFontSize) input.value = '';
  } catch (e) {}

  // Font family
  try {
    const fn = (document.queryCommandValue('fontName') || '').replace(/^["']|["']$/g, '').trim();
    const sel = $('#fontSelect');
    if (fn) {
      const match = [...sel.options].find(o => o.value.replace(/^["']|["']$/g, '').trim().toLowerCase() === fn.toLowerCase());
      if (match) sel.value = match.value;
    }
  } catch (e) {}

  // Fore colour swatch
  try {
    const fc = document.queryCommandValue('foreColor');
    if (fc) {
      const hex = rgbToHex(fc);
      if (hex && document.activeElement !== $('#foreColor')) {
        $('#foreColorBar').style.background = hex;
      }
    }
  } catch (e) {}

  // Highlight toggle button state
  try {
    const sel = window.getSelection();
    let isOn = false;
    if (sel.rangeCount) {
      if (sel.isCollapsed) {
        isOn = !!pendingHighlight || document.queryCommandState('hiliteColor');
      } else {
        const cur = getSelectionHighlight();
        isOn = cur && !isTransparent(cur);
      }
    }
    $('#hiliteToggle').classList.toggle('active', !!isOn);
  } catch (e) {}
}

function normalizeTaskLists(root) {
  root.querySelectorAll('ul li input[type=checkbox]').forEach(input => {
    const span = document.createElement('span');
    span.className = 'task-check' + (input.checked ? ' checked' : '');
    span.setAttribute('contenteditable', 'false');
    input.replaceWith(span);
    const ul = input.closest('ul');
    if (ul && !ul.classList.contains('task-list')) ul.classList.add('task-list');
    const li = input.closest('li');
    if (li && span.classList.contains('checked')) li.classList.add('checked');
  });
}

/* Font size — custom pixel value */
function applyFontSize(px) {
  px = Math.max(6, Math.min(200, Math.round(px)));
  ensureEditorCaret();
  const sel = window.getSelection();
  if (!sel.rangeCount) return;

  if (sel.isCollapsed) {
    // Insert a size-styled span and place caret inside it
    const range = sel.getRangeAt(0);
    const span = document.createElement('span');
    span.style.fontSize = px + 'px';
    const zws = document.createTextNode('\u200B');
    span.appendChild(zws);
    range.deleteContents();
    range.insertNode(span);
    const r = document.createRange();
    r.setStart(zws, 1); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
    pendingFontSize = px;
  } else {
    const range = sel.getRangeAt(0);
    const span = document.createElement('span');
    span.style.fontSize = px + 'px';
    try { range.surroundContents(span); }
    catch (e) {
      const frag = range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);
    }
    // Re-select the wrapped content
    const newRange = document.createRange();
    newRange.selectNodeContents(span);
    sel.removeAllRanges(); sel.addRange(newRange);
  }
  captureSelection();
  scheduleSave();
  updateStatus();
}
$('#sizeInput').addEventListener('change', e => {
  const v = parseInt(e.target.value, 10);
  if (isNaN(v)) return;
  applyFontSize(v);
  e.target.blur();
});

/* Highlight toggle button — applies/removes the current highlight colour */
function toggleHighlight() {
  ensureEditorCaret();
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const color = $('#hiliteColor').value;

  if (!sel.isCollapsed) {
    const current = getSelectionHighlight();
    const isOn = current && !isTransparent(current);
    document.execCommand('styleWithCSS', false, true);
    if (isOn) {
      document.execCommand('hiliteColor', false, 'transparent');
    } else {
      document.execCommand('hiliteColor', false, color);
    }
    document.execCommand('styleWithCSS', false, false);
    toast(isOn ? 'Highlight removed' : 'Highlight applied');
  } else {
    // Toggle typing highlight
    if (pendingHighlight) {
      pendingHighlight = null;
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('hiliteColor', false, 'transparent');
      document.execCommand('styleWithCSS', false, false);
      toast('Highlight off for new text');
    } else {
      pendingHighlight = color;
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('hiliteColor', false, color);
      document.execCommand('styleWithCSS', false, false);
      toast('Highlight on for new text');
    }
  }
  captureSelection();
  scheduleSave();
  updateToolbarState();
}

function insertLink() {
  const sel = window.getSelection();
  const selected = sel && sel.toString();
  const url = prompt('Link URL:', 'https://');
  if (!url) return;
  ensureEditorCaret();
  if (selected) exec('createLink', url, false);
  else exec('insertHTML', `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`);
}
function insertTaskList() {
  const html = '<ul class="task-list"><li><span class="task-check" contenteditable="false"></span> First task</li><li><span class="task-check" contenteditable="false"></span> Second task</li></ul><p><br></p>';
  exec('insertHTML', html);
  setTimeout(() => {
    const firstLi = editor.querySelector('ul.task-list li');
    if (!firstLi) return;
    const walker = document.createTreeWalker(firstLi, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    let n; while ((n = walker.nextNode())) textNodes.push(n);
    if (!textNodes.length) return;
    const last = textNodes[textNodes.length - 1];
    const r = document.createRange();
    r.setStart(last, 0);
    r.setEnd(last, last.nodeValue.length);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    captureSelection();
  }, 0);
}

/* ---- Checklist click + keyboard ---- */
editor.addEventListener('click', e => {
  const check = e.target.closest('.task-check');
  if (check) {
    e.preventDefault(); e.stopPropagation();
    check.classList.toggle('checked');
    const li = check.closest('li');
    if (li) li.classList.toggle('checked', check.classList.contains('checked'));
    scheduleSave();
    return;
  }
  if (e.target.tagName === 'A' && e.ctrlKey) window.open(e.target.href, '_blank', 'noopener');
  if (e.target.classList.contains('comment-anchor')) openCommentPopover(e.target);
  if (e.target.classList.contains('bookmark-anchor')) toast('🔖 Bookmark: ' + (e.target.dataset.label || 'unnamed'));
});

editor.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;

  if (e.key === 'Enter' && !e.shiftKey && !mod) {
    const sel = window.getSelection();
    if (sel.rangeCount) {
      let node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentNode;
      const li = node?.closest?.('li');
      const ul = li?.closest?.('ul.task-list');
      if (li && ul) {
        e.preventDefault();
        const textContent = li.textContent.replace(/[\s\u00a0\u200B]/g, '');
        if (!textContent) {
          const p = document.createElement('p');
          p.innerHTML = '<br>';
          ul.parentNode.insertBefore(p, ul.nextSibling);
          li.remove();
          if (!ul.children.length) ul.remove();
          placeCaretIn(p);
        } else {
          const newLi = document.createElement('li');
          newLi.innerHTML = '<span class="task-check" contenteditable="false"></span> ';
          li.parentNode.insertBefore(newLi, li.nextSibling);
          const walker = document.createTreeWalker(newLi, NodeFilter.SHOW_TEXT);
          const textNodes = [];
          let n; while ((n = walker.nextNode())) textNodes.push(n);
          if (textNodes.length) {
            const last = textNodes[textNodes.length - 1];
            const r = document.createRange();
            r.setStart(last, last.nodeValue.length); r.collapse(true);
            const s = window.getSelection();
            s.removeAllRanges(); s.addRange(r);
          }
        }
        scheduleSave();
        return;
      }
    }
  }

  if (e.key === 'Backspace' && !mod) {
    const sel = window.getSelection();
    if (sel.rangeCount && sel.isCollapsed && sel.anchorOffset === 0) {
      let node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentNode;
      const li = node?.closest?.('li');
      const ul = li?.closest?.('ul.task-list');
      if (li && ul) {
        const textContent = li.textContent.replace(/[\s\u00a0\u200B]/g, '');
        if (!textContent) {
          e.preventDefault();
          const p = document.createElement('p');
          p.innerHTML = '<br>';
          ul.parentNode.insertBefore(p, ul.nextSibling);
          li.remove();
          if (!ul.children.length) ul.remove();
          placeCaretIn(p);
          scheduleSave();
          return;
        }
      }
    }
  }

  if (mod && e.key.toLowerCase() === 's' && !e.shiftKey) { e.preventDefault(); flushSave(); toast('💾 Saved'); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); toggleVoice(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'h') { e.preventDefault(); toggleHighlight(); return; }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); insertLink(); return; }
  if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(); return; }
  if (mod && e.key === '\\') { e.preventDefault(); exec('removeFormat'); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'c') { e.preventDefault(); showWordCount(); return; }
  if (mod && e.altKey && e.key.toLowerCase() === 'm') { e.preventDefault(); addComment(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'v') { e.preventDefault(); menuAction('pastePlain'); return; }
  if (mod && e.shiftKey && e.key === '7') { e.preventDefault(); exec('insertOrderedList'); return; }
  if (mod && e.shiftKey && e.key === '8') { e.preventDefault(); exec('insertUnorderedList'); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'x') { e.preventDefault(); exec('strikeThrough'); return; }
  if (mod && e.key === 'Enter') { e.preventDefault(); exec('insertHTML', '<div class="page-break" contenteditable="false"></div><p><br></p>'); return; }

  if (e.key === 'Tab') {
    const inList = !!window.getSelection().anchorNode?.parentElement?.closest('li');
    const inTable = getCurrentCell();
    if (inTable) {
      e.preventDefault();
      const cells = Array.from(getCurrentTable().querySelectorAll('td,th'));
      const idx = cells.indexOf(inTable);
      const target = cells[idx + (e.shiftKey ? -1 : 1)];
      if (target) placeCaretIn(target);
      return;
    }
    if (inList) { e.preventDefault(); exec(e.shiftKey ? 'outdent' : 'indent'); }
    else if (!e.shiftKey) { e.preventDefault(); exec('insertHTML', '&nbsp;&nbsp;&nbsp;&nbsp;'); }
  }
  if (e.key === 'Enter' && !e.shiftKey && !mod) {
    const block = document.queryCommandValue('formatBlock');
    if (block && /^h[1-6]$/i.test(block)) setTimeout(() => exec('formatBlock', 'P'), 0);
  }
});

function placeCaretIn(el) {
  const r = document.createRange();
  r.selectNodeContents(el);
  r.collapse(false);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  editor.focus();
  captureSelection();
}

/* When the user moves the caret somewhere else, clear pending typing styles
   that are no longer active at the new position. */
document.addEventListener('mousedown', e => {
  if (e.target.closest('#toolbar')) return;
  if (!editor.contains(e.target) && e.target !== editor) return;
  setTimeout(() => {
    // If the browser reports the caret has no highlight, clear our pending flag
    try {
      const has = document.queryCommandState('hiliteColor');
      if (!has && pendingHighlight) {
        pendingHighlight = null;
      }
    } catch (err) {}
    // Clear pending font size if the caret's font size differs from it
    try {
      const sel = window.getSelection();
      if (sel.rangeCount && pendingFontSize) {
        let node = sel.anchorNode;
        if (node && node.nodeType === 3) node = node.parentNode;
        if (node && editor.contains(node)) {
          const px = Math.round(parseFloat(getComputedStyle(node).fontSize));
          if (px !== pendingFontSize) pendingFontSize = null;
        }
      }
    } catch (err) {}
    updateToolbarState();
  }, 0);
}, true);

  }).join('');

   TABLE EDITING
   ============================================================ */
const tableToolbar = $('#tableToolbar');
function getSelectionBlock() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  let node = sel.anchorNode;
  if (node && node.nodeType === 3) node = node.parentNode;
  return node;
}
function getCurrentTable() { const node = getSelectionBlock(); return node ? node.closest('table') : null; }
function getCurrentCell() { const node = getSelectionBlock(); return node ? node.closest('td,th') : null; }
function getCellIndex(cell) { return Array.from(cell.parentNode.children).indexOf(cell); }
function getRowIndex(cell) {
  const table = cell.closest('table');
  const rows = Array.from(table.querySelectorAll('tr'));
  let r = 0;
  for (const row of rows) { if (row.contains(cell)) return r; r++; }
  return -1;
}
function updateTableToolbar() {
  const table = getCurrentTable();
  if (!table) { tableToolbar.classList.remove('show'); return; }
  if (isMobile()) {
    tableToolbar.classList.add('show');
    return;
  }
  const rect = table.getBoundingClientRect();
  tableToolbar.classList.add('show');
  const tbRect = tableToolbar.getBoundingClientRect();
  let top = rect.top - tbRect.height - 8;
  if (top < 80) top = rect.bottom + 8;
  let left = rect.left + Math.max(0, (rect.width - tbRect.width) / 2);
  left = Math.max(10, Math.min(window.innerWidth - tbRect.width - 10, left));
  tableToolbar.style.top = top + 'px';
  tableToolbar.style.left = left + 'px';
}
window.addEventListener('scroll', () => { if (tableToolbar.classList.contains('show')) updateTableToolbar(); }, true);
window.addEventListener('resize', () => { if (tableToolbar.classList.contains('show')) updateTableToolbar(); });
tableToolbar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); captureSelection(); });
tableToolbar.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const t = btn.dataset.t;
  const cell = getCurrentCell();
  if (!cell && t !== 'delTable') { toast('Place the cursor inside a table first'); return; }
  switch (t) {
    case 'rowAbove': insertRow(cell, true); break;
    case 'rowBelow': insertRow(cell, false); break;
    case 'delRow': deleteRow(cell); break;
    case 'colLeft': insertColumn(cell, true); break;
    case 'colRight': insertColumn(cell, false); break;
    case 'delCol': deleteColumn(cell); break;
    case 'merge': mergeCells(); break;
    case 'split': splitCell(cell); break;
    case 'bgColor': pickCellColor(cell); break;
    case 'borderColor': pickBorderColor(cell); break;
    case 'alignLeft': setCellAlign(cell, 'left'); break;
    case 'alignCenter': setCellAlign(cell, 'center'); break;
    case 'alignRight': setCellAlign(cell, 'right'); break;
    case 'delTable': deleteTable(); break;
  }
  scheduleSave(); updateTableToolbar(); captureSelection();
});
function insertRow(cell, above) {
  const row = cell.parentNode;
  const newRow = document.createElement('tr');
  Array.from(row.children).forEach(c => {
    const newCell = document.createElement(c.tagName.toLowerCase());
    newCell.innerHTML = '<br>';
    if (c.colSpan > 1) newCell.colSpan = c.colSpan;
    newRow.appendChild(newCell);
  });
  if (above) row.parentNode.insertBefore(newRow, row);
  else row.parentNode.insertBefore(newRow, row.nextSibling);
  placeCaretIn(newRow.cells[Math.min(getCellIndex(cell), newRow.cells.length - 1)]);
}
function deleteRow(cell) {
  const row = cell.parentNode;
  const table = row.closest('table');
  if (table.querySelectorAll('tr').length <= 1) { table.remove(); return; }
  row.remove();
}
function insertColumn(cell, left) {
  const table = cell.closest('table');
  const idx = getCellIndex(cell);
  const at = left ? idx : idx + 1;
  table.querySelectorAll('tr').forEach(row => {
    const refCell = row.children[Math.min(idx, row.children.length - 1)];
    const newCell = document.createElement(refCell && refCell.tagName === 'TH' ? 'th' : 'td');
    newCell.innerHTML = '<br>';
    if (at >= row.children.length) row.appendChild(newCell);
    else row.insertBefore(newCell, row.children[at]);
  });
}
function deleteColumn(cell) {
  const table = cell.closest('table');
  const idx = getCellIndex(cell);
  if (table.querySelector('tr').children.length <= 1) { table.remove(); return; }
  table.querySelectorAll('tr').forEach(row => { if (row.children[idx]) row.children[idx].remove(); });
}
function deleteTable() {
  const table = getCurrentTable();
  if (!table) return;
  if (!confirm('Delete this table?')) return;
  table.remove();
  tableToolbar.classList.remove('show');
}
function mergeCells() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const table = getCurrentTable();
  if (!table) return;
  const cells = Array.from(table.querySelectorAll('td,th')).filter(c => range.intersectsNode(c));
  if (cells.length < 2) { toast('Select two or more cells to merge'); return; }
  const coords = cells.map(c => ({ cell: c, r: getRowIndex(c), c: getCellIndex(c) }));
  const minR = Math.min(...coords.map(x => x.r)), maxR = Math.max(...coords.map(x => x.r));
  const minC = Math.min(...coords.map(x => x.c)), maxC = Math.max(...coords.map(x => x.c));
  const expected = (maxR - minR + 1) * (maxC - minC + 1);
  if (cells.length !== expected) { toast('Selection must be a rectangle'); return; }
  const anchor = cells.find(c => getRowIndex(c) === minR && getCellIndex(c) === minC);
  let html = '';
  cells.forEach(c => { if (c !== anchor) html += (c.innerHTML || '') + ' '; });
  anchor.innerHTML = (anchor.innerHTML || '') + (html ? ' ' + html : '');
  anchor.colSpan = maxC - minC + 1;
  anchor.rowSpan = maxR - minR + 1;
  cells.forEach(c => { if (c !== anchor) c.remove(); });
  placeCaretIn(anchor);
}
function splitCell(cell) {
  const rowspan = cell.rowSpan || 1, colspan = cell.colSpan || 1;
  if (rowspan === 1 && colspan === 1) { toast('Cell is not merged'); return; }
  const table = cell.closest('table');
  const rows = Array.from(table.querySelectorAll('tr'));
  const startRow = getRowIndex(cell), startCol = getCellIndex(cell);
  const content = cell.innerHTML;
  cell.rowSpan = 1; cell.colSpan = 1; cell.innerHTML = content;
  for (let c = 0; c < colspan; c++) {
    for (let r = 0; r < rowspan; r++) {
      if (r === 0 && c === 0) continue;
      const row = rows[startRow + r];
      if (!row) continue;
      const newCell = document.createElement(cell.tagName.toLowerCase());
      newCell.innerHTML = '<br>';
      const refIndex = startCol + c;
      if (refIndex >= row.children.length) row.appendChild(newCell);
      else row.insertBefore(newCell, row.children[refIndex]);
    }
  }
}
function pickCellColor(cell) {
  const input = document.createElement('input');
  input.type = 'color'; input.value = '#ffff00';
  input.style.position = 'fixed'; input.style.opacity = '0';

    cells.forEach(c => c.style.background = input.value);

}

}
function setCellAlign(cell, align) {

function addComment() {
  if (!activeId) return;
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { toast('Select some text to comment on'); return; }
  const text = sel.toString().trim();
  if (!text) { toast('Select some text to comment on'); return; }
  const doc = getDoc(activeId);
  const id = uid();
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  span.className = 'comment-anchor';
  span.dataset.comment = id;
  try { range.surroundContents(span); }
  catch (e) {
    const frag = range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
  }
  sel.removeAllRanges();
  doc.comments.push({ id, quote: text, text: '', author: 'You', created: Date.now(), resolved: false });
  doc.updated = Date.now();
  persist(); renderComments();
  $('#commentsPanel').classList.add('open');
  $('#outlinePanel').classList.remove('open');
  scheduleSave();
  setTimeout(() => {
    const card = document.querySelector(`[data-comment-id="${id}"]`);
    if (card) { card.scrollIntoView({ block:'center', behavior:'smooth' }); card.querySelector('textarea')?.focus(); }
  }, 60);
}
function renderComments() {
  const list = $('#commentsList');
  const doc = getDoc(activeId);
  const comments = doc ? (doc.comments || []) : [];
  $('#commentCount').textContent = comments.filter(c => !c.resolved).length;
  if (!comments.length) {
    list.innerHTML = '<div class="outline-empty">No comments yet. Select text and press 💬 to add one.</div>';
    return;
  }
  const sorted = [...comments].sort((a,b) => (a.resolved - b.resolved) || (b.created - a.created));
  list.innerHTML = sorted.map(c => `
    <div class="comment-card ${c.resolved ? 'resolved' : ''}" data-comment-id="${c.id}">
      <div class="head">
        <div class="avatar">${esc((c.author || 'Y')[0].toUpperCase())}</div>
        <div class="author">${esc(c.author || 'You')}</div>
        <div class="time">${fmtDate(c.created)}</div>
      </div>
      <div class="quote">"${esc(c.quote).slice(0, 80)}"</div>
      ${c.text
        ? `<div class="body">${esc(c.text)}</div>`
        : `<textarea class="comment-input" placeholder="Write a comment…" style="width:100%;min-height:52px;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12.5px;resize:vertical;outline:none;background:var(--surface)"></textarea>`}
      <div class="acts">
        ${!c.text ? '<button class="resolve save-c" data-save>Save</button>' : ''}
        ${c.resolved ? '<button class="resolve" data-unresolve>Reopen</button>' : '<button class="resolve" data-resolve>Resolve</button>'}
        <button data-delete>Delete</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('.comment-card').forEach(card => {
    const id = card.dataset.commentId;
    card.addEventListener('click', e => {
      if (e.target.closest('button, textarea')) return;
      const anchor = editor.querySelector(`.comment-anchor[data-comment="${id}"]`);
      if (anchor) anchor.scrollIntoView({ block:'center', behavior:'smooth' });
    });
    card.querySelector('[data-resolve]')?.addEventListener('click', e => { e.stopPropagation(); setCommentResolved(id, true); });
    card.querySelector('[data-unresolve]')?.addEventListener('click', e => { e.stopPropagation(); setCommentResolved(id, false); });
    card.querySelector('[data-delete]')?.addEventListener('click', e => { e.stopPropagation(); deleteComment(id); });
    card.querySelector('[data-save]')?.addEventListener('click', e => {
      e.stopPropagation();
      const ta = card.querySelector('textarea');
      if (ta) saveCommentText(id, ta.value);
    });
    const ta = card.querySelector('textarea');
    if (ta) {
      ta.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); saveCommentText(id, ta.value); }
      });
      ta.addEventListener('blur', () => { if (ta.value.trim()) saveCommentText(id, ta.value); });
    }
  });
}
function saveCommentText(id, text) {
  const doc = getDoc(activeId);
  if (!doc) return;
  const c = doc.comments.find(x => x.id === id);
  if (!c) return;
  c.text = text.trim();
  doc.updated = Date.now();
  persist(); renderComments(); scheduleSave();
}
function setCommentResolved(id, resolved) {
  const doc = getDoc(activeId);
  if (!doc) return;
  const c = doc.comments.find(x => x.id === id);
  if (!c) return;
  c.resolved = resolved;
  doc.updated = Date.now();
  const anchor = editor.querySelector(`.comment-anchor[data-comment="${id}"]`);
  if (anchor) anchor.classList.toggle('resolved', resolved);

}
function deleteComment(id) {
  const doc = getDoc(activeId);
  if (!doc) return;
  if (!confirm('Delete this comment?')) return;
  doc.comments = doc.comments.filter(c => c.id !== id);
  const anchor = editor.querySelector(`.comment-anchor[data-comment="${id}"]`);
  if (anchor) {
    const parent = anchor.parentNode;
    while (anchor.firstChild) parent.insertBefore(anchor.firstChild, anchor);
    parent.removeChild(anchor); parent.normalize();
  }
  doc.updated = Date.now();
  persist(); renderComments(); scheduleSave();
}
function openCommentPopover(anchorEl) {
  $$('.comment-popover').forEach(p => p.remove());
  const id = anchorEl.dataset.comment;
  const doc = getDoc(activeId);
  if (!doc) return;
  const c = doc.comments.find(x => x.id === id);
  if (!c) return;
  const rect = anchorEl.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'comment-popover';
  if (isMobile()) {
    // Fixed bottom sheet on mobile
    pop.style.bottom = '16px'; pop.style.left = '8px'; pop.style.right = '8px';
    pop.style.top = 'auto'; pop.style.width = 'auto';
  } else {
    pop.style.top = (rect.bottom + 8) + 'px';
    pop.style.left = Math.max(8, Math.min(window.innerWidth - 300, rect.left)) + 'px';
  }
  pop.innerHTML = `
    <div class="head">${esc(c.author)} · ${fmtDate(c.created)}</div>
    <textarea placeholder="Write a comment…">${esc(c.text || '')}</textarea>
    <div class="acts">
      <button class="sm-btn" data-close>Close</button>
      ${c.resolved ? '<button class="sm-btn" data-unresolve>Reopen</button>' : '<button class="sm-btn primary" data-save>Save</button>'}
    </div>`;
  document.body.appendChild(pop);
  const ta = pop.querySelector('textarea');
  ta.focus();
  pop.querySelector('[data-close]').addEventListener('click', () => pop.remove());
  pop.querySelector('[data-save]')?.addEventListener('click', () => { saveCommentText(id, ta.value); pop.remove(); });
  pop.querySelector('[data-unresolve]')?.addEventListener('click', () => { setCommentResolved(id, false); pop.remove(); });
  setTimeout(() => {
    document.addEventListener('click', function off(ev) {
      if (!pop.contains(ev.target) && ev.target !== anchorEl) { pop.remove(); document.removeEventListener('click', off); }
    });
  }, 0);
}

/* ============================================================
   VOICE TYPING — clear errors
   ============================================================ */
let voiceRecognition = null;
let voiceActive = false;
let voiceIndicator = null;
let voiceRestartTimer = null;

function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast('⚠️ Voice typing needs Chrome, Edge or Safari', 4000);
    return;
  }
  if (!navigator.onLine) {
    toast('⚠️ Voice typing needs an internet connection', 4000);
    return;
  }
  if (voiceActive) { stopVoice(); return; }

  try { voiceRecognition = new SR(); }
  catch (e) { toast('⚠️ Could not start speech recognition', 4000); return; }

  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = true;
  voiceRecognition.lang = navigator.language || 'en-US';
  voiceRecognition.maxAlternatives = 1;

  voiceRecognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const transcript = e.results[i][0].transcript;
      if (e.results[i].isFinal) insertVoiceText(transcript);
      else interim += transcript;
    }
    if (voiceIndicator) {
      const live = voiceIndicator.querySelector('.live');
      if (live) live.textContent = interim;
    }
  };

  voiceRecognition.onerror = (e) => {
    console.warn('Speech error:', e.error);
    switch (e.error) {
      case 'not-allowed':
      case 'service-not-allowed':
        toast('⚠️ Microphone access denied — allow it in your browser settings', 4500);
        stopVoice();
        break;
      case 'no-speech':
        // Silent — auto-restart in onend
        break;
      case 'audio-capture':
        toast('⚠️ No microphone detected', 4000);
        stopVoice();
        break;
      case 'network':
        toast('⚠️ Network error — Web Speech needs internet access. In a sandboxed preview or VS Code webview, it may be blocked.', 6000);
        stopVoice();
        break;
      case 'aborted':
        break;
      default:
        toast('Voice error: ' + e.error, 4000);
    }
  };

  voiceRecognition.onend = () => {
    if (voiceActive) {
      clearTimeout(voiceRestartTimer);
      voiceRestartTimer = setTimeout(() => {
        if (!voiceActive) return;
        try { voiceRecognition.start(); } catch (e) {}
      }, 250);
    }
  };

  try {
    voiceRecognition.start();
    voiceActive = true;
    $('#voiceBtn').classList.add('rec');
    showVoiceIndicator();
    if (document.activeElement !== editor) {
      try { editor.focus({ preventScroll: true }); } catch (e) { editor.focus(); }
    }
    toast('🎤 Voice typing on — click the red banner to stop', 3000);
  } catch (e) {
    console.warn(e);
    toast('⚠️ Could not start: ' + (e.message || 'unknown'), 4000);
    stopVoice();
  }
}

function insertVoiceText(text) {
  if (!text) return;
  if (document.activeElement !== editor) {
    try { editor.focus({ preventScroll: true }); } catch (e) { editor.focus(); }
  }
  ensureEditorCaret();
  const ok = document.execCommand('insertText', false, text + ' ');
  if (!ok) {
    const sel = window.getSelection();
    if (sel.rangeCount) {
      const range = sel.getRangeAt(0);
      const node = document.createTextNode(text + ' ');
      range.insertNode(node);
      range.setStartAfter(node); range.collapse(true);
      sel.removeAllRanges(); sel.addRange(range);
    }
  }
  captureSelection();
  scheduleSave();
  updateStatus();
}

function showVoiceIndicator() {
  if (voiceIndicator) voiceIndicator.remove();
  voiceIndicator = document.createElement('div');
  voiceIndicator.className = 'voice-indicator';
  voiceIndicator.title = 'Click to stop';
  voiceIndicator.innerHTML = `<span class="dot"></span> Listening… <span class="live"></span>`;
  voiceIndicator.addEventListener('click', stopVoice);
  document.body.appendChild(voiceIndicator);
}

function stopVoice() {
  voiceActive = false;
  clearTimeout(voiceRestartTimer);
  if (voiceRecognition) {
    try { voiceRecognition.abort(); } catch (e) {}
    try { voiceRecognition.stop(); } catch (e) {}
    voiceRecognition = null;
  }
  $('#voiceBtn')?.classList.remove('rec');
  if (voiceIndicator) { voiceIndicator.remove(); voiceIndicator = null; }
}

function insertTOC() {
  const heads = editor.querySelectorAll('h1,h2,h3,h4,h5,h6');
  if (!heads.length) { toast('Add headings to build a table of contents'); return; }
  let html = '<div class="toc" style="border:1px dashed var(--border);border-radius:8px;padding:12px 18px;margin:14px 0;background:var(--surface-2)">';
  html += '<div style="font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Table of contents</div>';
  heads.forEach((h, i) => {
    if (!h.id) h.id = 'h-' + i;
    const lvl = +h.tagName[1];
    const indent = (lvl - 1) * 14;
    html += `<div style="padding-left:${indent}px;font-size:${13 - (lvl - 1)}px;margin:2px 0"><a href="#${h.id}" data-toc>${esc(h.textContent.trim() || '(empty)')}</a></div>`;

function applyLineSpacing(mult) {
  const sel = window.getSelection();
  if (!sel.rangeCount) { toast('Place the cursor in a paragraph'); return; }
  const range = sel.getRangeAt(0);
  const blocks = new Set();
  const start = range.startContainer.nodeType === 3 ? range.startContainer.parentNode : range.startContainer;
  const end = range.endContainer.nodeType === 3 ? range.endContainer.parentNode : range.endContainer;
  if (start === end) {
    const b = start.closest('p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,div');
    if (b) blocks.add(b);
  } else {
    editor.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,blockquote,pre').forEach(el => {
      if (range.intersectsNode(el)) blocks.add(el);
    });
  }
  blocks.forEach(b => { b.style.lineHeight = mult; });
  scheduleSave();
  toast('Line spacing ' + mult);
}
function transformSelection(mode) {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { toast('Select some text first'); return; }
  const text = sel.toString();
  const out = mode === 'upper' ? text.toUpperCase()
    : mode === 'lower' ? text.toLowerCase()
    : text.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());
  ensureEditorCaret();
  document.execCommand('insertText', false, out);
  scheduleSave();
}

$('#fontFileInput').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (!files.length) return;
  for (const file of files) {
    try {
      const dataURL = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result); r.onerror = rej;
        r.readAsDataURL(file);
      });
      const name = file.name.replace(/\.(ttf|otf|woff2?|TTF|OTF|WOFF2?)$/, '').replace(/[-_]/g, ' ');
      const face = new FontFace(name, `url(${dataURL})`);
      await face.load();
      document.fonts.add(face);
      state.settings.customFonts = state.settings.customFonts || [];
      state.settings.customFonts.push({ name, dataURL });
      toast('✅ Loaded ' + name);
    } catch (err) { toast('⚠️ Could not load ' + file.name); }
  }
  persist(); rebuildFontDropdown();
  if (window._refreshFontList) window._refreshFontList();
});

/* ============================================================
   FIND & REPLACE
   ============================================================ */
let findMarks = [], findIndex = -1;
function openFind() { $('#findBar').classList.remove('hidden'); $('#findInput').focus(); $('#findInput').select(); }
function closeFind() { $('#findBar').classList.add('hidden'); clearFind(); editor.focus(); }
function clearFind() {
  editor.querySelectorAll('mark[data-find]').forEach(m => {
    const p = m.parentNode;
    while (m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m); p.normalize();
  });
  findMarks = []; findIndex = -1; updateFindCount();
}
function updateFindCount() {
  const c = $('#findCount');
  c.textContent = findMarks.length ? `${findIndex + 1} / ${findMarks.length}` : '0 results';
}
function runFind() {
  const q = $('#findInput').value;
  clearFind();
  if (!q) return;
  const lower = q.toLowerCase();
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentNode.closest('mark[data-find]') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const text = node.nodeValue, lowerText = text.toLowerCase();
    let idx = lowerText.indexOf(lower);
    if (idx === -1) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    while (idx !== -1) {
      frag.appendChild(document.createTextNode(text.slice(last, idx)));
      const mark = document.createElement('mark');
      mark.dataset.find = '1';
      mark.textContent = text.slice(idx, idx + q.length);
      frag.appendChild(mark); findMarks.push(mark);
      last = idx + q.length; idx = lowerText.indexOf(lower, last);
    }
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
  if (findMarks.length) { findIndex = 0; highlightCurrent(); }
  updateFindCount();
}
function highlightCurrent() {
  findMarks.forEach((m, i) => m.classList.toggle('current', i === findIndex));
  const cur = findMarks[findIndex];
  if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
  updateFindCount();
}
function findStep(delta) {
  if (!findMarks.length) return;
  findIndex = (findIndex + delta + findMarks.length) % findMarks.length;
  highlightCurrent();
}
function replaceOne() {
  if (!findMarks.length) { runFind(); if (!findMarks.length) return; }
  const rep = $('#replaceInput').value;
  const mark = findMarks[findIndex];
  if (!mark) return;
  const tn = document.createTextNode(rep);
  mark.parentNode.replaceChild(tn, mark);
  mark.parentNode.normalize();
  const keep = findIndex;
  runFind();
  if (findMarks.length) { findIndex = Math.min(keep, findMarks.length - 1); highlightCurrent(); }
  scheduleSave();
}
function replaceAll() {
  const q = $('#findInput').value;
  if (!q) return;
  runFind();
  if (!findMarks.length) return;
  const rep = $('#replaceInput').value;
  const count = findMarks.length;
  findMarks.forEach(m => { const tn = document.createTextNode(rep); m.parentNode.replaceChild(tn, m); });
  editor.normalize();
  findMarks = []; findIndex = -1; updateFindCount();
  scheduleSave(); buildOutline();
  toast(`✅ Replaced ${count} occurrence${count === 1 ? '' : 's'}`);
}

function htmlToMarkdown(html) {
  const root = document.createElement('div');
  root.innerHTML = html;
  let out = '';
  function inline(node) {
    let s = '';
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) { s += n.nodeValue.replace(/\s+/g, ' '); return; }
      if (n.nodeType !== 1) return;
      const t = n.tagName.toLowerCase(); const inner = inline(n);
      switch (t) {
        case 'b': case 'strong': s += '**' + inner + '**'; break;
        case 'i': case 'em': s += '*' + inner + '*'; break;
        case 'u': s += '<u>' + inner + '</u>'; break;
        case 's': case 'strike': case 'del': s += '~~' + inner + '~~'; break;
        case 'code': s += '`' + inner + '`'; break;
        case 'a': s += '[' + inner + '](' + (n.getAttribute('href') || '') + ')'; break;
        case 'img': s += '![' + (n.getAttribute('alt') || 'image') + '](' + (n.getAttribute('src') || '') + ')'; break;
        case 'br': s += '  \n'; break;
        case 'sup': s += '^' + inner + '^'; break;
        case 'sub': s += '~' + inner + '~'; break;
        default: s += inner;
      }
    });
    return s;
  }
  function block(node, depth) {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) { const t = n.nodeValue.trim(); if (t) out += t + '\n\n'; return; }
      if (n.nodeType !== 1) return;
      const t = n.tagName.toLowerCase();
      if (/^h[1-6]$/.test(t)) out += '#'.repeat(+t[1]) + ' ' + inline(n).trim() + '\n\n';
      else if (t === 'p') { const c = inline(n).trim(); if (c) out += c + '\n\n'; }
      else if (t === 'blockquote') out += inline(n).trim().split('\n').map(l => '> ' + l).join('\n') + '\n\n';
      else if (t === 'pre') out += '```\n' + n.textContent.replace(/\n$/, '') + '\n```\n\n';
      else if (t === 'ul' || t === 'ol') {
        const ordered = t === 'ol';
        Array.from(n.children).filter(li => li.tagName === 'LI').forEach((li, i) => {
          const check = li.querySelector('.task-check, input[type=checkbox]');
          const box = check ? (check.classList.contains('checked') || check.checked ? '[x] ' : '[ ] ') : '';
          const marker = check ? '' : (ordered ? (i + 1) + '. ' : '- ');
          const clone = li.cloneNode(true);
          clone.querySelectorAll('.task-check, input[type=checkbox]').forEach(c => c.remove());
          out += '  '.repeat(depth) + marker + box + inline(clone).trim() + '\n';
        });
        out += '\n';
      }
      else if (t === 'hr') out += '---\n\n';
      else if (t === 'table') {
        Array.from(n.querySelectorAll('tr')).forEach((tr, ri) => {
          const cells = Array.from(tr.children).map(td => inline(td).trim().replace(/\|/g, '\\|'));
          out += '| ' + cells.join(' | ') + ' |\n';
          if (ri === 0) out += '| ' + cells.map(() => '---').join(' | ') + ' |\n';
        });
        out += '\n';
      }
      else if (t === 'div') block(n, depth);
      else { const c = inline(n).trim(); if (c) out += c + '\n\n'; }
    });
  }
  block(root, 0);
  return out.replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function docHTML(doc) {
  const ps = doc.pageSetup || state.settings.pageSetup;
  const size = PAGE_SIZES[ps.size] || PAGE_SIZES['Letter'];
  let w = size.w, h = size.h;

<html lang="en"><head><meta charset="utf-8"><title>${esc(doc.title)}</title>
<style>

  @media print{body{margin:0;max-width:none}}
</style></head><body>${doc.html || '<p></p>'}</body></html>`;
}
function handleExport(kind) {
  const doc = getDoc(activeId);
  if (!doc) return;
  const base = (doc.title || 'document').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
  switch (kind) {
    case 'html': download(base + '.html', docHTML(doc), 'text/html;charset=utf-8'); toast('📄 HTML downloaded'); break;
    case 'md': download(base + '.md', '# ' + doc.title + '\n\n' + htmlToMarkdown(doc.html), 'text/markdown;charset=utf-8'); toast('📝 Markdown downloaded'); break;
    case 'txt': download(base + '.txt', doc.title + '\n' + '='.repeat(doc.title.length) + '\n\n' + stripTags(doc.html), 'text/plain;charset=utf-8'); toast('📃 Text downloaded'); break;
    case 'print': printDoc(doc); break;
    case 'clip': copyRichText(doc); break;
    case 'duplicate': duplicateDoc(doc); break;
  }
  $('#exportMenu').classList.add('hidden');
}
function printDoc(doc) {
  const w = window.open('', '_blank', 'width=900,height=700');

  w.document.write(docHTML(doc));
  w.document.close();

}
async function copyRichText(doc) {
  try {
    const blobHtml = new Blob([doc.html], { type: 'text/html' });
    const blobText = new Blob([stripTags(doc.html)], { type: 'text/plain' });
    await navigator.clipboard.write([new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })]);
    toast('📋 Copied as rich text');
  } catch (e) {
    try { await navigator.clipboard.writeText(stripTags(doc.html)); toast('📋 Copied as plain text'); }
    catch (err) { toast('⚠️ Copy failed'); }
  }
}
function duplicateDoc(doc) {
  const copy = newDocObj(doc.title + ' (copy)', doc.html);

  state.docs.push(copy); persist();

}

function applySubstitutions(e) {
  if (!e || !e.inputType || e.inputType !== 'insertText') return;
  const subs = state.settings.substitutions || [];
  if (!subs.length) return;
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const node = sel.anchorNode;
  if (!node || node.nodeType !== 3) return;
  const text = node.nodeValue, caret = sel.anchorOffset;
  const before = text.slice(0, caret);
  for (const s of subs) {
    if (before.endsWith(s.from)) {
      const start = caret - s.from.length;
      const after = text.slice(caret);
      node.nodeValue = text.slice(0, start) + s.to + after;
      const newCaret = start + s.to.length;
      const r = document.createRange();
      r.setStart(node, newCaret); r.collapse(true);
      sel.removeAllRanges(); sel.addRange(r);
      scheduleSave();
      break;
    }
  }
}

    exec('insertHTML', esc(text).replace(/\n/g, '<br>'));

  }
  if (html) { e.preventDefault(); exec('insertHTML', sanitize(html)); }
  else if (text) { e.preventDefault(); exec('insertHTML', esc(text).replace(/\n/g, '<br>')); }
  setTimeout(() => { updateStatus(); buildOutline(); updateTableToolbar(); normalizeTaskLists(editor); }, 30);

  await loadCustomFonts();
  rebuildFontDropdown();

  $('#sortSelect').value = state.settings.sort;
  if (state.settings.view === 'list') { $('#listBtn').classList.add('active'); $('#gridBtn').classList.remove('active'); }

  if (isMobile()) { openSidebar(); }
  else { $('#sidebar').classList.remove('collapsed'); }
  setZoom(1);
  renderHome();

  window.addEventListener('beforeunload', flushSave);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
}
init();
</script>
</body>
</html>
