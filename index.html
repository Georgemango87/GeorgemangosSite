<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Georgemango's Arcade</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="icon" type="image/png" href="face.png">
    <link rel="apple-touch-icon" href="./faceiphoneIcon.png?v=2">


    <style>
      :root {
        --bg-color: #f4f6f9;
        --card-bg: #ffffff;
        --text-main: #333333;
        --border-color: #b0bec5;
        --thick-border: #37474f;
        --primary: #3f51b5;
        --primary-hover: #303f9f;
      }

      /* ==========================================
         GLOBAL ARCADE STYLES
         ========================================== */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      header {
        margin-bottom: 20px;
        text-align: center;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
      }

      header h1 {
        font-size: 1.8rem;
        margin: 0;
        font-weight: 500;
      }

      /* ==========================================
         APP GRID
         ========================================== */
      .app-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        max-width: 500px;
        width: 100%;
        padding: 10px;
      }

      @media (max-width: 480px) {
        .app-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .app-icon {
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        padding: 0;
        color: white;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
        position: relative;
      }

      .icon-graphic {
        width: 64px;
        height: 64px;
        background-color: #333;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: transform 0.1s ease;
      }

      .app-icon:active .icon-graphic {
        transform: scale(0.92);
      }

      .app-name {
        font-size: 0.75rem;
        margin-top: 6px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        text-align: center;
      }

      /* Favorite star */
.app-icon .favorite-btn {
  position: absolute;
  top: -6px;
  left: -6px;
  width: 20px;
  height: 20px;
  background: rgba(0, 0, 0, 0.65);
  color: #6b7280;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  font-size: 12px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  padding: 0;
  z-index: 2;
  user-select: none;
}
.app-icon .favorite-btn:hover {
  background: rgba(0, 0, 0, 0.9);
  color: #fbbf24;
  transform: scale(1.15);
}
.app-icon.favorited .favorite-btn {
  color: #fbbf24;
  background: rgba(251, 191, 36, 0.2);
  border-color: rgba(251, 191, 36, 0.6);
}
.app-icon.favorited .icon-graphic {
  box-shadow: 0 0 14px rgba(251, 191, 36, 0.4), 0 4px 10px rgba(0, 0, 0, 0.3);
}

/* Usage counter */
.app-icon .usage-count {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 18px;
  height: 18px;
  background: rgba(59, 130, 246, 0.9);
  color: white;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  z-index: 2;
  pointer-events: none;
}
.app-icon .usage-count.visible {
  display: flex;
}

/* Make app icons clickable divs behave like buttons */
.app-icon {
  user-select: none;
  -webkit-user-select: none;
  outline: none;
}
.app-icon:focus-visible .icon-graphic {
  outline: 2px solid #3b82f6;
  outline-offset: 2px;
}

      /* ==========================================
         GAME MODAL STYLES
         ========================================== */
      .game-modal {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 10px;
        box-sizing: border-box;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .game-modal-content {
        background-color: #f0f2f5;
        color: #333;
        width: min(100%, 760px);
        max-height: min(90vh, 860px);
        overflow-y: auto;
        border-radius: 12px;
        padding: 18px;
        position: relative;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        box-sizing: border-box;
      }

      .close-modal-btn {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 1100;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #e74c3c;
        color: white;
        border: 2px solid white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        transition: background 0.2s;
        padding: 0;
        line-height: 1;
      }

      .close-modal-btn:hover {
        background: #c0392b;
      }

      /* ==========================================
         GAME 1: COLOR CONTEXTO
         ========================================== */
      #game1-container h2 {
        text-align: center;
        color: #2c3e50;
        margin-top: 0;
      }
      #game1-container .game-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
        justify-content: center;
        align-items: center;
      }
      #game1-container input[type="color"] {
        border: none;
        width: 50px;
        height: 40px;
        cursor: pointer;
        border-radius: 4px;
      }
      #game1-container input[type="text"] {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 150px;
        text-align: center;
      }
      #game1-container button.action-btn {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #game1-container button.action-btn:hover {
        background-color: #2980b9;
      }
      #game1-container button.give-up {
        background-color: #e74c3c;
      }
      #game1-container button.give-up:hover {
        background-color: #c0392b;
      }
      #game1-container button.new-game {
        background-color: #2ecc71;
        display: none;
      }
      #game1-container button.new-game:hover {
        background-color: #27ae60;
      }
      #game1-container button:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
      }
      #game1-container .message {
        text-align: center;
        font-weight: bold;
        margin-bottom: 20px;
        min-height: 24px;
      }
      #game1-container .guesses-container {
        margin-top: 20px;
      }
      #game1-container .guess-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        padding: 10px 15px;
        margin-bottom: 8px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      }
      #game1-container .swatch {
        width: 30px;
        height: 30px;
        border-radius: 4px;
        border: 1px solid #ddd;
      }

      /* ==========================================
         MOBILE
         ========================================== */
      @media (max-width: 520px) {
        body {
          padding: 0;
        }
        .app-grid {
          gap: 14px;
        }
        .game-modal {
          align-items: flex-start;
          justify-content: flex-start;
          padding: 8px;
        }
        .game-modal-content {
          padding: 12px;
          max-width: 100%;
          width: 100%;
          margin-top: 16px;
          border-radius: 14px;
        }
      }
    </style>
  </head>

    <script>
  /* ==========================================
     ARCADE STATE PERSISTENCE
     ========================================== */
  const ARCADE_KEY = 'georgemango_arcade_state_v1';

  const APP_IDS = {
    'game1-modal': 'color-contexto',
    'game2-modal': 'atom-forge',
    'game3-modal': 'sparktalk',
    'game4-modal': 'webcraft',
    'game5-modal': 'neural-net',
    'game6-modal': 'mathlab',
    'game7-modal': 'logic-gates'
  };

  let arcadeState = {
    version: 1,
    favorites: {},   // { appId: true }
    usage: {}        // { appId: { count, lastOpened } }
  };

  function loadArcadeState() {
    try {
      const saved = localStorage.getItem(ARCADE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        arcadeState.favorites = parsed.favorites || {};
        arcadeState.usage = parsed.usage || {};
      }
    } catch (e) {
      console.warn('Arcade: could not load saved state', e);
    }
  }

  function saveArcadeState() {
    try {
      localStorage.setItem(ARCADE_KEY, JSON.stringify(arcadeState));
    } catch (e) {
      console.warn('Arcade: could not save state', e);
    }
  }

  function trackAppOpen(appId) {
    if (!appId) return;
    if (!arcadeState.usage[appId]) arcadeState.usage[appId] = { count: 0 };
    arcadeState.usage[appId].count++;
    arcadeState.usage[appId].lastOpened = Date.now();
    saveArcadeState();
    updateAppUI();
  }

  function toggleFavorite(appId) {
    if (!appId) return;
    if (arcadeState.favorites[appId]) {
      delete arcadeState.favorites[appId];
    } else {
      arcadeState.favorites[appId] = true;
    }
    saveArcadeState();
    updateAppUI();
  }

  function isFavorite(appId) {
    return !!arcadeState.favorites[appId];
  }

  function updateAppUI() {
    const grid = document.getElementById('appGrid');
    if (!grid) return;

    grid.querySelectorAll('.app-icon[data-app]').forEach(el => {
      const appId = el.dataset.app;

      // Favorite star state
      const fav = isFavorite(appId);
      el.classList.toggle('favorited', fav);
      const star = el.querySelector('.favorite-btn');
      if (star) star.textContent = fav ? '★' : '☆';

      // Usage counter
      const counter = el.querySelector('.usage-count');
      if (counter) {
        const count = (arcadeState.usage[appId] || {}).count || 0;
        if (count > 0) {
          counter.textContent = count > 99 ? '99+' : String(count);
          counter.classList.add('visible');
        } else {
          counter.classList.remove('visible');
        }
      }
    });

    // Re-order: favorites first, then original order
    const apps = Array.from(grid.querySelectorAll('.app-icon'));
    const originalIndex = new Map(apps.map((el, i) => [el, i]));
    apps.sort((a, b) => {
      const aFav = isFavorite(a.dataset.app) ? 1 : 0;
      const bFav = isFavorite(b.dataset.app) ? 1 : 0;
      if (aFav !== bFav) return bFav - aFav;
      return originalIndex.get(a) - originalIndex.get(b);
    });
    apps.forEach(el => grid.appendChild(el));
  }

  function resetArcadeData() {
    if (!confirm('Reset all arcade data?\n\nThis clears your favorites and usage stats.\nApp data inside each sub-app is NOT affected.')) return;
    arcadeState = { version: 1, favorites: {}, usage: {} };
    saveArcadeState();
    updateAppUI();
  }

  /* ==========================================
     MODAL CONTROLLER
     ========================================== */
  function openGameModal(modalId) {
    document.getElementById(modalId).style.display = 'flex';

    // Lazy-load iframe
    const iframe = document.getElementById(modalId.replace('-modal', '-iframe'));
    if (iframe && !iframe.src && iframe.dataset.src) {
      iframe.src = iframe.dataset.src;
    }

    // Track usage
    const appId = APP_IDS[modalId];
    if (appId) trackAppOpen(appId);
  }

  function closeGameModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
  }

  window.onclick = function(event) {
    if (event.target.classList.contains('game-modal')) {
      event.target.style.display = 'none';
    }
  };

  /* ==========================================
     INIT
     ========================================== */
  loadArcadeState();
  updateAppUI();
</script>
  </body>
