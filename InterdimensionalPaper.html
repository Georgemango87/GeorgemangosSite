  const fontOptions = [{ value: "", label: "— use character's hand —" }]
    .concat(FONTS.map((f) => ({ value: f.stack, label: f.label })));
  if (m.fontOverride && !FONTS.some((f) => f.stack === m.fontOverride)) {
    fontOptions.push({ value: m.fontOverride, label: "Custom font" });
  }

  const fx = m.effects || {};

  return '' +
    '<div class="insp-head">' +
      '<span class="insp-title">Message</span>' +
      '<span class="insp-sub">#' + (msgIndexById(m.id) + 1) + ' of ' + project.messages.length + '</span>' +
    '</div>' +

    '<div class="section"><div class="section-body" style="padding-top:11px">' +
      fieldSelect("Written by", "message", "characterId", m.characterId, charOptions) +
      '<label class="field"><span class="flabel">Text</span>' +
        '<textarea data-scope="message" data-field="text" rows="7" ' +
          'placeholder="What does the paper say? Use the button below to drop a drawing beside the text.">' +
          esc(m.text) + '</textarea></label>' +
      '<div class="insp-actions" style="margin-top:0">' +
        '<button class="btn small" data-action="insert-inline-drawing">✎ Insert drawing at cursor</button>' +
      '</div>' +
      '<div style="height:8px"></div>' +
      fieldText("Stage direction", "message", "direction", m.direction,
        "e.g. The pencil stops moving.") +
      '<div class="hint">Shown as a subtle caption, never as dialogue.</div>' +
    '</div></div>' +

    inlineDrawingsListHTML(m) +

    '<details class="section" open><summary>Timing</summary><div class="section-body">' +
      fieldRange("Delay before writing", "message", "delay", m.delay, 0, 6000, 50, " ms") +
      fieldRange("Pause after writing", "message", "pause", m.pause, 0, 6000, 50, " ms") +
      fieldCheck("Mark as an important story moment", "message", "important", m.important) +
    '</div></details>' +

    '<details class="section"><summary>Storytelling effects</summary><div class="section-body">' +
      fieldCheck("Hesitation — pauses mid-sentence", "message", "effects.hesitate", fx.hesitate) +
      fieldCheck("Unusually slow writing", "message", "effects.slow", fx.slow) +
      fieldCheck("Crossed out after writing", "message", "effects.crossed", fx.crossed) +
      fieldCheck("Ink fades / smudges", "message", "effects.faded", fx.faded) +
      fieldCheck("Written over the previous message", "message", "effects.overwrite", fx.overwrite) +
    '</div></details>' +

    '<details class="section"><summary>Handwriting override</summary><div class="section-body">' +
      fieldSelect("Font", "message", "fontOverride", m.fontOverride, fontOptions) +
      '<div class="field"><span class="flabel">Ink colour</span>' +
        '<div class="frow">' +
          '<input type="color" value="' + toHex6(m.colorOverride || "#1b2a4a") +
            '" data-scope="message" data-field="colorOverride">' +
          '<button class="btn small" data-action="clear-color">Use character ink</button>' +
        '</div>' +
      '</div>' +
    '</div></details>' +

    '<div class="insp-actions">' +
      '<button class="btn small" data-action="msg-up">↑ Move up</button>' +
      '<button class="btn small" data-action="msg-down">↓ Move down</button>' +
      '<button class="btn small" data-action="msg-dup">Duplicate</button>' +
      '<button class="btn small danger" data-action="msg-del">Delete</button>' +
    '</div>';
}

function drawingInspectorHTML(m) {
  const charOptions = project.characters.map((c) => ({ value: c.id, label: c.name }));
  const fx = m.effects || {};

  return '' +
    '<div class="insp-head">' +
      '<span class="insp-title">Drawing (legacy)</span>' +
      '<span class="insp-sub">#' + (msgIndexById(m.id) + 1) + ' of ' + project.messages.length + '</span>' +
    '</div>' +

    '<div class="section"><div class="section-body" style="padding-top:11px">' +
      '<div class="hint">This is a standalone drawing from an older project. New drawings are inserted inline within a text message via the + Drawing button.</div>' +
      '<div class="field">' +
        '<span class="flabel">Preview</span>' +
        '<div class="drawing-preview" data-role="drawing-preview"></div>' +
      '</div>' +
      '<div class="insp-actions" style="margin-top:6px">' +
        '<button class="btn small" data-action="redraw">Redraw</button>' +

function setNested(obj, path, value) {
  const parts = path.split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (typeof cur[parts[i]] !== "object" || cur[parts[i]] === null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}

function updateCharacterPreviewChip(ch) {
  const chip = $("#inspector .hand-chip");
  if (!chip) return;
  chip.style.fontFamily = ch.font;
  chip.style.color = ch.color;
  chip.style.fontSize = Math.min(ch.fontSize, 22) + "px";
  chip.style.letterSpacing = ch.letterSpacing + "px";
}

function onInspectorInput(e) {
  const t = e.target;
  const field = t.dataset.field;
  const scope = t.dataset.scope;
  if (!field || !scope) return;

  let value;
  if (t.type === "checkbox") value = t.checked;
  else if (t.type === "range" || t.type === "number") value = num(t.value, 0);
  else value = t.value;

  if (t.type === "range") {
    const out = t.parentElement.querySelector(".val");
    if (out) {
      const unit = out.textContent.replace(/^[-0-9.]+/, "");
      out.textContent = value + unit;
    }
  }

  if (scope === "character") {
    const ch = getChar(ui.selection.id);
    if (!ch) return;
    if (field === "preset") {
      const p = PRESETS[value];
      if (p) {
        ch.preset = value;
        ch.font = p.font;
        ch.fontSize = p.size;
        ch.speed = p.speed;
        ch.lineSpacing = p.lineSpacing;
        ch.letterSpacing = p.letterSpacing;
        ch.jitter = p.jitter;
      } else {
        ch.preset = "custom";
      }
      renderInspector();
    } else {
      setNested(ch, field, value);
      if (field !== "description" && field !== "name") ch.preset = "custom";
      updateCharacterPreviewChip(ch);
    }
    scheduleRefresh();
    saveLibrary();

  } else if (scope === "message") {
    const m = getMessage(ui.selection.id);
    if (!m) return;
    setNested(m, field, value);
    scheduleRefresh();
    saveLibrary();

  } else if (scope === "settings") {
    project.settings[field] = value;
    scheduleRefresh();
    saveLibrary();

  } else if (scope === "project") {
    if (field === "name") {
      project.name = value;
      $("#storyTitle").value = value;
      renderStorySelect();
      saveLibrary();
    }
  }
}

function onInspectorClick(e) {
  const swatch = e.target.closest(".swatch");
  if (swatch) {
    const scope = swatch.dataset.scope;
    const val = swatch.dataset.value;
    if (scope === "character") {
      const ch = getChar(ui.selection.id);
      if (!ch) return;
      ch.color = val;
      ch.preset = "custom";
      renderInspector();
      onDataChanged();
    }
    return;
  }

  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === "dup-character") duplicateCharacter(ui.selection.id);
  else if (action === "del-character") deleteCharacter(ui.selection.id);
  else if (action === "msg-up") handleMessageAction("up", ui.selection.id);
  else if (action === "msg-down") handleMessageAction("down", ui.selection.id);
  else if (action === "msg-dup") handleMessageAction("dup", ui.selection.id);
  else if (action === "msg-del") handleMessageAction("del", ui.selection.id);
  else if (action === "clear-color") {
    const m = getMessage(ui.selection.id);
    if (m) { m.colorOverride = ""; renderInspector(); onDataChanged(); }
  }
  else if (action === "insert-inline-drawing") {
    const m = getMessage(ui.selection.id);
    if (!m) return;
    const ta = $("#inspector textarea[data-field=\"text\"]");
    let cursor = (m.text || "").length;
    if (ta && typeof ta.selectionStart === "number") cursor = ta.selectionStart;
    openDrawModalInline(m.id, null, cursor);
  }
  else if (action === "edit-inline-drawing") {
    const drawingId = btn.dataset.drawingId;
    openDrawModalInline(ui.selection.id, drawingId, 0);
  }
  else if (action === "delete-inline-drawing") {
    const drawingId = btn.dataset.drawingId;
    const m = getMessage(ui.selection.id);
    if (!m || !m.inlineDrawings) return;
    if (!confirm("Delete this drawing and remove its token from the text?")) return;
    delete m.inlineDrawings[drawingId];
    m.text = (m.text || "").split("{{d:" + drawingId + "}}").join("");
    onDataChanged();
    renderInspector();
  }
  else if (action === "redraw") {
    const m = getMessage(ui.selection.id);
    if (m && m.kind === "drawing") openDrawModalStandalone(m.id);
  }
  else if (action === "clear-strokes") {
    const m = getMessage(ui.selection.id);
    if (m && confirm("Remove all strokes from this drawing?")) {
      m.strokes = [];
      renderInspector();
      onDataChanged();
    }
  }
  else if (action === "export") exportProject();
  else if (action === "import") $("#fileInput").click();
}

/* ==========================================================================
   SECTION 10 — GLOBAL DATA CHANGE HANDLER
   ========================================================================== */
function stopPlaybackIfActive() {
  if (play.playing || play.phase === "write" || play.phase === "delay" || play.phase === "hold") {
    resetPlaybackState();
    updateTransportUI();
  }
}

function refreshAll() {
  stopPlaybackIfActive();

  const scroller = $("#paperScroll");
  const st = scroller ? scroller.scrollTop : 0;

  renderPaperFull();

  if (scroller) scroller.scrollTop = st;

  renderCharacters();
  renderMessages();
}

function onDataChanged(opts) {
  refreshAll();
  renderInspector();
  saveLibrary();
}

let refreshTimer = null;
let lastRefreshTime = 0;

function scheduleRefresh() {
  if (refreshTimer) return;
  const elapsed = Date.now() - lastRefreshTime;
  const wait = Math.max(0, 100 - elapsed);
  refreshTimer = setTimeout(() => {
    refreshTimer = null;
    lastRefreshTime = Date.now();
    refreshAll();
  }, wait);
}

/* ==========================================================================
   SECTION 12 — DRAWING MODAL
   ========================================================================== */
const drawState = {
  open: false,
  mode: "inline-create",
  targetMessageId: null,
  targetDrawingId: null,
  cursorPos: 0,
  strokes: [],
  current: null,
  drawing: false,
  color: "#1b2a4a",
  size: 3,
  canvas: null,
  ctx: null
};

function defaultInk() {
  if (ui.selection.type === "message") {
    const m = getMessage(ui.selection.id);
    const c = m && getChar(m.characterId);
    if (c) return c.color;
  }
  if (project.characters[0]) return project.characters[0].color;
  return "#1b2a4a";
}

function openDrawModalInline(messageId, drawingId, cursorPos) {
  const m = getMessage(messageId);
  if (!m) return;

  drawState.mode = drawingId ? "inline-edit" : "inline-create";
  drawState.targetMessageId = messageId;
  drawState.targetDrawingId = drawingId || null;
  drawState.cursorPos = cursorPos || 0;

  if (drawingId && m.inlineDrawings && m.inlineDrawings[drawingId]) {
    drawState.strokes = deepCopy(m.inlineDrawings[drawingId]);
  } else {
    drawState.strokes = [];
  }

  finishOpeningModal();
}

function openDrawModalStandalone(messageId) {
  const m = getMessage(messageId);
  if (!m) return;

  drawState.mode = "standalone-edit";
  drawState.targetMessageId = messageId;
  drawState.targetDrawingId = null;
  drawState.cursorPos = 0;
  drawState.strokes = deepCopy(m.strokes || []);

  finishOpeningModal();
}

function finishOpeningModal() {
  drawState.current = null;
  drawState.drawing = false;

  const canvas = $("#drawCanvas");
  drawState.canvas = canvas;
  drawState.ctx = canvas.getContext("2d");

  const initialColor = (drawState.strokes[0] && drawState.strokes[0].color) || defaultInk();
  drawState.color = initialColor;

  $("#drawTitle").textContent =
    drawState.mode === "inline-edit" ? "Edit inline drawing" :
    drawState.mode === "standalone-edit" ? "Edit drawing" :
    "Insert inline drawing";
  $("#drawColor").value = toHex6(drawState.color);
  $("#drawSize").value = drawState.size;
  highlightDrawSwatch(drawState.color);

  $("#drawBackdrop").hidden = false;
  drawState.open = true;

  redrawCanvas();
}

function closeDrawModal() {
  $("#drawBackdrop").hidden = true;
  drawState.open = false;
  drawState.targetMessageId = null;
  drawState.targetDrawingId = null;
  drawState.strokes = [];
  drawState.current = null;
  drawState.drawing = false;
  const canvas = drawState.canvas;
  if (canvas) {
    const ctx = canvas.getContext("2d");
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function highlightDrawSwatch(color) {
  $$("#drawSwatches .swatch").forEach((sw) => {
    sw.style.outline = sw.dataset.value === color ? "2px solid #e8d3a6" : "none";
    sw.style.outlineOffset = "2px";
  });
}

function canvasPoint(e) {
  const c = drawState.canvas;
  const r = c.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (c.width / r.width),
    y: (e.clientY - r.top) * (c.height / r.height)
  };
}

function drawDot(p, s) {
  const ctx = drawState.ctx;
  if (!ctx) return;
  ctx.beginPath();
  ctx.arc(p.x, p.y, Math.max(0.6, (s.size || 3) / 2), 0, Math.PI * 2);
  ctx.fillStyle = s.color;
  ctx.fill();
}

function drawIncomingSegment(stroke) {
  const ctx = drawState.ctx;
  if (!ctx) return;
  const pts = stroke.points;
  const n = pts.length;
  if (n < 2) return;

  ctx.strokeStyle = stroke.color;
  ctx.lineWidth = stroke.size;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (n === 2) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.stroke();
    return;
  }

  const a = pts[n - 3], b = pts[n - 2], c = pts[n - 1];
  const mid1x = (a.x + b.x) / 2, mid1y = (a.y + b.y) / 2;
  const mid2x = (b.x + c.x) / 2, mid2y = (b.y + c.y) / 2;
  ctx.beginPath();
  ctx.moveTo(mid1x, mid1y);
  ctx.quadraticCurveTo(b.x, b.y, mid2x, mid2y);
  ctx.stroke();
}

function strokePathToCtx(ctx, pts) {
  if (!pts.length) return;
  if (pts.length === 1) {
    ctx.beginPath();
    ctx.arc(pts[0].x, pts[0].y, 0.6, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  if (pts.length === 2) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.stroke();
    return;
  }
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2;
    const my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const last = pts[pts.length - 1];
  ctx.lineTo(last.x, last.y);
  ctx.stroke();
}

function redrawCanvas() {
  const canvas = drawState.canvas;
  const ctx = drawState.ctx;
  if (!canvas || !ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawState.strokes.forEach((s) => {
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = s.size;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    strokePathToCtx(ctx, s.points || []);
  });
}

function insertDrawing() {
  const strokes = deepCopy(drawState.strokes).filter((s) => s.points && s.points.length);
  if (!strokes.length) { toast("Draw something first."); return; }

  const msg = getMessage(drawState.targetMessageId);
  if (!msg) { closeDrawModal(); return; }

  if (drawState.mode === "standalone-edit") {
    msg.strokes = strokes;
  } else {
    if (!msg.inlineDrawings) msg.inlineDrawings = {};

    if (drawState.mode === "inline-edit" && drawState.targetDrawingId) {
      msg.inlineDrawings[drawState.targetDrawingId] = strokes;
    } else {
      const newId = uid("d");
      msg.inlineDrawings[newId] = strokes;
      const token = "{{d:" + newId + "}}";
      const baseText = msg.text || "";
      const cursor = clamp(drawState.cursorPos, 0, baseText.length);
      msg.text = baseText.slice(0, cursor) + token + baseText.slice(cursor);
    }
  }

  closeDrawModal();
  onDataChanged();
  renderInspector();
  toast(drawState.mode === "inline-edit" ? "Drawing updated." : "Drawing inserted.");
}

function wireDrawingModal() {
  const canvas = $("#drawCanvas");

  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    const p = canvasPoint(e);
    const stroke = { color: drawState.color, size: drawState.size, points: [p] };
    drawState.strokes.push(stroke);
    drawState.current = stroke;
    drawState.drawing = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    drawDot(p, stroke);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!drawState.drawing) return;
    e.preventDefault();
    const p = canvasPoint(e);
    const s = drawState.current;
    if (!s) return;
    const pts = s.points;
    const lastP = pts[pts.length - 1];
    if (Math.hypot(p.x - lastP.x, p.y - lastP.y) < 0.7) return;
    pts.push(p);
    drawIncomingSegment(s);
  });

  const endStroke = () => {
    drawState.drawing = false;
    drawState.current = null;
  };
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("pointerleave", (e) => {
    if (drawState.drawing && e.pointerType !== "mouse") endStroke();
  });

  $("#drawColor").addEventListener("input", (e) => {
    drawState.color = e.target.value;
    highlightDrawSwatch(drawState.color);
  });

  $("#drawSize").addEventListener("input", (e) => {
    drawState.size = num(e.target.value, 3);
  });

  const sw = $("#drawSwatches");
  INKS.forEach((c) => {
    const el = document.createElement("span");
    el.className = "swatch";
    el.dataset.value = c;
    el.style.background = c;
    el.title = c;
    el.addEventListener("click", () => {
      drawState.color = c;
      $("#drawColor").value = toHex6(c);
      highlightDrawSwatch(c);
    });
    sw.appendChild(el);
  });

  $("#drawUndo").addEventListener("click", () => {
    if (!drawState.strokes.length) return;
    drawState.strokes.pop();
    redrawCanvas();
  });

  $("#drawClear").addEventListener("click", () => {
    drawState.strokes = [];
    redrawCanvas();
  });

  $("#drawCancel").addEventListener("click", closeDrawModal);
  $("#drawInsert").addEventListener("click", insertDrawing);

  $("#drawBackdrop").addEventListener("pointerdown", (e) => {
    if (e.target === $("#drawBackdrop")) closeDrawModal();
  });
}

/* ==========================================================================
   SECTION 13 — PROJECT / STORY MANAGEMENT
   ========================================================================== */
function switchToStory(id) {
  if (!library.stories[id]) return;
  library.currentId = id;
  project = library.stories[id];
  resetPlaybackState();
  ui.selection = { type: "paper", id: null };
  renderEverything();
  saveLibrary();
}

function newStory() {
  if (!confirm("Start a new, empty story?\n\nThe current story stays in your library (use the story menu to return to it).")) return;
  const p = makeProject("Untitled Story");
  p.characters = [makeCharacter("neat", "Character One")];
  p.messages = [];
  library.stories[p.id] = p;
  library.currentId = p.id;
  project = p;
  resetPlaybackState();
  ui.selection = { type: "paper", id: null };
  renderEverything();
  saveLibrary();
  toast("New story created.");
}

function duplicateStory() {
  const copy = deepCopy(project);
  copy.id = uid("story");
  copy.name = (project.name || "Untitled") + " (copy)";

  const map = {};
  copy.characters.forEach((c) => {
    const old = c.id;
    const nid = uid("ch");
    map[old] = nid;
    c.id = nid;
  });
  copy.messages.forEach((m) => {
    m.id = uid("msg");
    if (map[m.characterId]) m.characterId = map[m.characterId];
  });

  library.stories[copy.id] = copy;
  library.currentId = copy.id;
  project = copy;
  resetPlaybackState();
  ui.selection = { type: "paper", id: null };
  renderEverything();
  saveLibrary();
  toast("Story duplicated.");
}

function clearProject() {
  if (!confirm("Clear this story?\n\nThis removes all characters and messages from the current story. This cannot be undone (export first if you're unsure).")) return;

  project.messages = [];
  project.characters = [makeCharacter("neat", "Character One")];
  resetPlaybackState();
  ui.selection = { type: "paper", id: null };
  renderEverything();
  saveLibrary();
  toast("Story cleared.");
}

/* ==========================================================================
   SECTION 14 — PRESENTATION MODE
   ========================================================================== */
function togglePresentation(on) {
  ui.presenting = on === undefined ? !ui.presenting : !!on;
  document.body.classList.toggle("present", ui.presenting);

  if (ui.presenting) {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    Paper.scrollToElement(Paper.current ? Paper.current.firstElementChild : null);
  } else {
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
    renderEverything();
  }
}

/* ==========================================================================
   SECTION 15 — EVENT WIRING
   ========================================================================== */
function wireEvents() {
  $$(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      ui.tab = tab.dataset.tab;
      renderTabs();
    });
  });

  $("#btnAddChar").addEventListener("click", addCharacter);
  $("#btnAddMsg").addEventListener("click", addMessage);
  $("#btnAddDrawing").addEventListener("click", addMessageWithDrawing);

  const insp = $("#inspector");
  insp.addEventListener("input", onInspectorInput);
  insp.addEventListener("change", onInspectorInput);
  insp.addEventListener("click", onInspectorClick);

  $("#storyTitle").addEventListener("input", (e) => {
    project.name = e.target.value;
    renderStorySelect();
    saveLibrary();
  });
  $("#storySelect").addEventListener("change", (e) => switchToStory(e.target.value));

  $("#btnNew").addEventListener("click", newStory);
  $("#btnDup").addEventListener("click", duplicateStory);
  $("#btnExport").addEventListener("click", exportProject);
  $("#btnImport").addEventListener("click", () => $("#fileInput").click());
  $("#btnClear").addEventListener("click", clearProject);
  $("#fileInput").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importProjectFile(f);
    e.target.value = "";
  });

  $("#btnPresent").addEventListener("click", () => togglePresentation(true));
  $("#btnExitPresent").addEventListener("click", () => togglePresentation(false));

  $("#btnPlay").addEventListener("click", () => {
    if (play.playing) pausePlayback();
    else if (play.phase === "idle" || play.phase === "done") startPlayback(0);
    else resumePlayback();
  });

  $("#btnRestart").addEventListener("click", () => {
    startPlayback(0);
  });

  $("#btnPrev").addEventListener("click", () => {
    if (!project.messages.length) return;
    pausePlayback();
    const target = Math.max(0, (play.idx < 0 ? 0 : play.idx) - 1);
    jumpTo(target);
  });

  $("#btnNext").addEventListener("click", () => {
    if (!project.messages.length) return;
    if (play.playing) {
      const msg = project.messages[play.idx];
      if (msg) {
        const st = Paper.blocks.get(msg.id);
        if (st) {
          if (msg.kind === "drawing") Paper.showDrawing(msg.id);
          else Paper.reveal(msg.id, st.chars.length);
          finishMessageVisual(msg);
        }
      }
      play.elapsed = 0;
      advanceMessage();
    } else {
      const target = Math.min(project.messages.length - 1, (play.idx < 0 ? -1 : play.idx) + 1);
      jumpTo(target);
    }
  });

  $("#btnEnd").addEventListener("click", () => {
    if (!project.messages.length) return;
    stopPlayback();
    play.idx = project.messages.length - 1;
    play.phase = "done";
    renderPaperFull();
    updateTransportUI();
    const scroller = $("#paperScroll");
    scroller.scrollTop = scroller.scrollHeight;
  });

  $("#speedSel").addEventListener("change", (e) => {
    play.speed = num(e.target.value, 1) || 1;
  });

  document.addEventListener("keydown", (e) => {
    if (drawState.open) {
      if (e.key === "Escape") { e.preventDefault(); closeDrawModal(); }
      return;
    }

    const tag = (e.target.tagName || "").toLowerCase();
    const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
    if (typing) return;

    if (e.code === "Space") {
      e.preventDefault();
      $("#btnPlay").click();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      $("#btnNext").click();
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      $("#btnPrev").click();
    } else if (e.key.toLowerCase() === "r") {
      $("#btnRestart").click();
    } else if (e.key === "Escape" && ui.presenting) {
      togglePresentation(false);
    } else if (e.key.toLowerCase() === "f") {
      if (ui.presenting) togglePresentation(true);
    }
  });

  window.addEventListener("beforeunload", () => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(library)); } catch (err) {}
  });
}

/* ==========================================================================
   SECTION 16 — BOOT
   ========================================================================== */
function boot() {
  loadLibrary();
  project = library.stories[library.currentId];

  Paper.init();
  wireEvents();
  wireDrawingModal();

  play.speed = num($("#speedSel").value, 1) || 1;

  renderEverything();
  updateTransportUI();

  $("#paperScroll").scrollTop = 0;

  const onResize = debounce(() => {
    if (play.playing) return;
    if (project.settings.pageMode === "pages") renderPaperFull();
  }, 260);
  window.addEventListener("resize", onResize);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      if (!play.playing) renderPaperFull();
    }).catch(() => {});
  }
}

document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
