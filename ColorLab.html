<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColorLab — Experiment with color.</title>
<style>
:root{
  --bg:#0b0d10; --panel:#13161b; --panel2:#191d24; --panel3:#1f242c;
  --line:#262c36; --text:#e8ebf1; --muted:#8a93a5; --accent:#5b8cff;
  --accent2:#a78bfa; --good:#3ddc84; --bad:#ff5f6d; --warn:#ffc371;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
h1,h2,h3,h4{margin:0 0 8px;font-weight:650;letter-spacing:.2px}
h2{font-size:16px}
h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
p{margin:0 0 10px;color:var(--muted)}
a{color:var(--accent)}
code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(11,13,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.app-header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:12px 18px 8px}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.6px;
  background:linear-gradient(90deg,#ff5f6d,#ffc371,#4ade80,#38bdf8,#a78bfa,#ff5f6d);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:hueSlide 14s linear infinite;}
@keyframes hueSlide{to{background-position:300% 0}}
.brand p{margin:0;color:var(--muted);font-size:12px;letter-spacing:.4px}
.header-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.current-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer}
.current-chip .dot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.current-chip span{font-family:ui-monospace,monospace;font-size:12px;color:var(--text)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;padding:8px 14px 10px;overflow-x:auto;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:#2a3140;border-radius:3px}
.tabs button{
  flex:0 0 auto;background:var(--panel2);color:var(--muted);border:1px solid var(--line);
  padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:550;
  transition:.18s;white-space:nowrap;font-family:inherit;
}
.tabs button:hover{color:var(--text);border-color:#39414f;transform:translateY(-1px)}
.tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 16px -6px var(--accent)}

/* ---------- layout ---------- */
main{max-width:1500px;margin:0 auto;padding:20px 18px 40px}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cols-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card.tight{padding:12px}
.card h2{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.divider{height:1px;background:var(--line);margin:12px 0}

/* ---------- buttons & inputs ---------- */
.btn{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:9px;
  padding:7px 12px;cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:550;transition:.15s}
.btn:hover{background:#2a313c;border-color:#3a4351;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.btn.small{padding:4px 8px;font-size:11.5px}
.btn.icon{padding:4px 7px;font-size:13px;line-height:1}
input[type=text],input[type=number],select,textarea{
  background:#0e1116;border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:6px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;outline:none;transition:.15s}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
select{font-family:inherit;cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#262c36}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2px solid var(--accent);margin-top:-5px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#262c36}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:#0e1116;cursor:pointer}
label{font-size:12px;color:var(--muted)}

/* ---------- sliders rows ---------- */
.slider-row{display:grid;grid-template-columns:130px 1fr 72px;gap:10px;align-items:center;margin-bottom:6px}
.slider-row label{font-size:12px;color:var(--muted)}
.slider-row input[type=number]{width:100%;text-align:right;padding:4px 6px;font-size:12px}

/* ---------- swatches ---------- */
.swatch{border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,.13);transition:transform .15s,box-shadow .15s;position:relative}
.swatch:hover{transform:scale(1.045);box-shadow:0 6px 20px -6px rgba(0,0,0,.8);z-index:2}
.swatch.sm{width:36px;height:36px}
.swatch.md{width:56px;height:56px}
.swatch.lg{width:100%;height:96px}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- info ---------- */
.info-grid{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:12.5px}
.info-grid .k{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px}
.info-grid .v{font-family:ui-monospace,Menlo,monospace;color:var(--text);word-break:break-all}
.info-grid .c{opacity:.5;cursor:pointer;font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.info-grid .c:hover{opacity:1;color:var(--text);border-color:var(--accent)}

/* ---------- picker ---------- */
.sv-wrap{position:relative;width:100%;border-radius:10px;border:1px solid var(--line);line-height:0;touch-action:none}
.sv-wrap canvas{width:100%;height:auto;display:block;cursor:crosshair;border-radius:9px}
.strip-wrap{position:relative;width:100%;border-radius:8px;border:1px solid var(--line);margin-top:10px;line-height:0;touch-action:none}
.strip-wrap canvas{width:100%;height:auto;display:block;cursor:pointer;border-radius:7px}
.cursor-ring{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
.cursor-bar{position:absolute;top:-3px;bottom:-3px;width:6px;border-radius:4px;border:2px solid #fff;
  background:rgba(0,0,0,.25);box-shadow:0 0 0 1px rgba(0,0,0,.7);transform:translateX(-50%);pointer-events:none}
.big-swatch{width:100%;height:120px;border-radius:12px;border:1px solid var(--line);margin-bottom:14px;
  background-image:linear-gradient(45deg,#2a2f38 25%,transparent 25%),linear-gradient(-45deg,#2a2f38 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#2a2f38 75%),linear-gradient(-45deg,transparent 75%,#2a2f38 75%);
  background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;position:relative;overflow:hidden}
.big-swatch .fill{position:absolute;inset:0}

/* ---------- misc ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:650;letter-spacing:.3px}
.badge.pass{background:rgba(61,220,132,.15);color:var(--good);border:1px solid rgba(61,220,132,.35)}
.badge.fail{background:rgba(255,95,109,.15);color:var(--bad);border:1px solid rgba(255,95,109,.35)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 12px;
  border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:550;transition:.15s}
.subtabs button.active{background:var(--panel3);color:var(--text);border-color:#39414f}
.subpanel{display:none}
.subpanel.active{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.formula{background:#0d1015;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#b9c4d6;white-space:pre-wrap;line-height:1.7;overflow-x:auto}
.formula .hl{color:var(--accent)}
.formula .res{color:var(--good)}

/* ---------- history bar ---------- */
.history-bar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(13,16,20,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center}
.history-bar .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;flex:0 0 auto}
.history-scroll{display:flex;gap:6px;overflow-x:auto;padding:2px;flex:1}
.history-scroll::-webkit-scrollbar{height:5px}
.history-scroll::-webkit-scrollbar-thumb{background:#2a3140;border-radius:3px}
.hchip{flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:.15s}
.hchip:hover{transform:scale(1.12) translateY(-2px)}
.fav-chip{flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.14);cursor:pointer;position:relative}
.fav-chip:hover::after{content:'★';position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff;text-shadow:0 0 3px #000}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,6,9,.75);backdrop-filter:blur(6px);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal-backdrop.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;
  padding:20px;position:relative;box-shadow:0 30px 80px -20px #000;animation:pop .22s ease;max-height:90vh;overflow-y:auto}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:22px;
  cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--text)}
.modal .swatch-preview{width:100%;height:110px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line)}
.send-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#232a35;
  color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:300;opacity:0;pointer-events:none;
  transition:.25s;border:1px solid #39414f;box-shadow:0 10px 30px -8px #000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- palette ---------- */
.palette-grid{display:flex;gap:10px;flex-wrap:wrap;min-height:110px}
.palette-item{width:104px;display:flex;flex-direction:column;gap:5px;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:7px;cursor:grab;transition:.18s}
.palette-item.dragging{opacity:.35}
.palette-item.dragover{border-color:var(--accent);transform:translateY(-2px)}
.palette-item .sw{height:64px;border-radius:7px;border:1px solid rgba(255,255,255,.12);cursor:pointer}
.palette-item .hx{font-size:10.5px;text-align:center;font-family:ui-monospace,monospace;color:var(--muted)}
.palette-item .tools{display:flex;gap:3px;justify-content:center}
.palette-item .tools button{background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:6px;cursor:pointer;font-size:11px;padding:2px 5px;line-height:1.3}
.palette-item .tools button:hover{color:var(--text);border-color:var(--accent)}
.palette-item.locked{box-shadow:inset 0 0 0 1px rgba(255,195,113,.4)}

/* ---------- sort ---------- */
.sort-stage{position:relative;height:150px;background:#0e1116;border-radius:10px;border:1px solid var(--line);overflow:hidden}
.sort-item{position:absolute;top:18px;width:26px;height:114px;border-radius:6px;transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .4s;border:1px solid rgba(255,255,255,.1)}

/* ---------- image lab ---------- */
.canvas-frame{background:#0e1116;border:1px solid var(--line);border-radius:10px;padding:8px;display:inline-block;max-width:100%;overflow:auto}
.canvas-frame canvas{display:block;max-width:100%;height:auto;border-radius:6px;cursor:crosshair}
.hist{display:flex;align-items:flex-end;gap:2px;height:70px;background:#0e1116;border-radius:8px;padding:6px;border:1px solid var(--line)}
.hist div{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s}

/* ---------- gradient ---------- */
.grad-track{
  position:relative;
  height:44px;
  border-radius:10px;
  border:1px solid var(--line);
  cursor:copy;
  margin-bottom:8px;
}
.grad-track canvas{
  width:100%;height:100%;display:block;
  border-radius:9px;
}
.grad-stop{
  position:absolute;
  top:50%;
  width:16px;height:16px;
  border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.75),
             0 2px 8px rgba(0,0,0,.6);
  transform:translate(-50%,-50%);
  cursor:grab;
  z-index:3;
}
.grad-stop.sel{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent),
             0 0 14px var(--accent);
  transform:translate(-50%,-50%) scale(1.15);
}
.grad-preview{width:100%;height:180px;border-radius:12px;border:1px solid var(--line);overflow:hidden;line-height:0}
.grad-preview canvas{width:100%;height:100%;display:block}

/* ---------- experiments ---------- */
.exp-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.exp-card h3{color:var(--text);text-transform:none;letter-spacing:0;font-size:15px;margin-bottom:6px}
.perception-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pbox{border-radius:10px;padding:26px;display:grid;place-items:center;border:1px solid var(--line)}
.pbox .inner{width:74px;height:74px;border-radius:10px;border:1px solid rgba(255,255,255,.12)}
.context-strip{display:flex;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.context-strip div{flex:1;display:grid;place-items:center}
.context-strip .mid{flex:0 0 64px}

/* ---------- tables ---------- */
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th,table.cmp td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
table.cmp th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.7px}
table.cmp td.mono{font-family:ui-monospace,monospace}

/* ---------- responsive ---------- */
/* ---------- responsive ---------- */
@media(max-width:860px){
  body{ padding-bottom: 78px; }
  .app-header{
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 14px 8px;
  }
  .brand{ text-align: center; }
  .brand h1{ font-size: 21px; }
  .brand p{ font-size: 11.5px; }
  .header-actions{
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 6px;
    padding-bottom: 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .header-actions::-webkit-scrollbar{ display: none; }
  .header-actions .btn{
    flex: 0 0 auto;
    padding: 9px 12px;
    font-size: 12px;
    min-height: 38px;
  }
  .current-chip{
    align-self: center;
    padding: 5px 14px 5px 6px;
  }
  .tabs{ padding: 8px 12px 10px; gap: 5px; }
  .tabs button{
    padding: 9px 14px;
    font-size: 12.5px;
    min-height: 38px;
  }
  main{ padding: 14px 12px 30px; }
  .card{ padding: 13px; margin-bottom: 12px; }
  .card h2{ font-size: 15px; }
  .grid{ gap: 12px; }
  .cols-2, .cols-3, .cols-4{ grid-template-columns: 1fr; }
  .slider-row{
    grid-template-columns: 104px 1fr 68px;
    gap: 8px;
    margin-bottom: 8px;
  }
  .slider-row input[type="number"]{ padding: 6px 8px; }
  .btn{ min-height: 36px; padding: 9px 12px; }
  .btn.small{ min-height: 30px; padding: 5px 9px; }
  input[type="color"]{ width: 48px; height: 36px; }
  .palette-item{ width: 96px; }
  .history-bar{ padding: 7px 10px; gap: 6px; }
  .history-bar .label{ display: none; }
  .hchip, .fav-chip{ width: 28px; height: 28px; }
  .modal{ padding: 16px; border-radius: 14px; }
  .modal .swatch-preview{ height: 90px; }
  .send-grid{ grid-template-columns: 1fr; }
  .sort-stage{ height: 130px; }
  .sort-item{ top: 14px; height: 100px; }
  .subtabs button{ padding: 9px 14px; min-height: 38px; }
  .canvas-frame{ padding: 6px; }
  .formula{ font-size: 11.5px; padding: 10px; }
  .info-grid{ grid-template-columns: auto 1fr auto; font-size: 12px; }
}
@media(max-width:480px){
  .brand h1{ font-size: 19px; }
  .slider-row{
    grid-template-columns: 1fr 62px;
    grid-template-areas:
      "label label"
      "range number";
    gap: 5px 8px;
    row-gap: 2px;
  }
  .slider-row label{ grid-area: label; font-size: 11.5px; }
  .slider-row input[type="range"]{ grid-area: range; }
  .slider-row input[type="number"]{ grid-area: number; }
  .perception-grid{ grid-template-columns: 1fr 1fr; }
  .palette-item{ width: calc(50% - 5px); }
  .palette-grid{ gap: 8px; }
  .ctx-row{ gap: 6px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="app-header">
    <div class="brand">
      <h1>ColorLab</h1>
      <p>Experiment with color.</p>
    </div>
    <div class="header-actions">
      <div class="current-chip" id="currentChip" title="Current color — click for details">
        <div class="dot" id="currentDot"></div><span id="currentHex">#4A72E8</span>
      </div>
      <input type="color" id="quickColor" value="#4a72e8"
       title="Quick color picker — directly changes the current color"
       style="width:44px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:#0e1116;cursor:pointer">
      <button class="btn" id="btnFavorites">★ Favorites</button>
      <button class="btn" id="btnSave">Save</button>
      <button class="btn" id="btnLoad">Load</button>
      <button class="btn" id="btnExport">Export</button>
      <button class="btn" id="btnImport">Import</button>
      <button class="btn" id="btnReset">Reset</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none">
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>

<main id="main"></main>

<div class="history-bar">
  <div class="label">History</div>
  <div class="history-scroll" id="historyScroll"></div>
  <button class="btn small" id="btnClearHistory">Clear</button>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================================
   SECTION 1 — UTILITIES
   ========================================================================= */
const $  = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const clamp = (v,a,b) => Math.min(b===undefined?255:b, Math.max(a===undefined?0:a, v));
const round = (v,d) => { const m = Math.pow(10,d||0); return Math.round(v*m)/m; };

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Copied: '+text)).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copied: '+text); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}
let toastTimer=null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* =========================================================================
   SECTION 2 — COLOR MATH / CONVERSIONS
   ========================================================================= */

/* --- HEX --- */
function rgbToHex(c){
  const h = x => clamp(Math.round(x),0,255).toString(16).padStart(2,'0');
  return '#' + h(c.r) + h(c.g) + h(c.b);
}
function hexToRgb(hex){
  let s = String(hex||'').trim().replace(/^#/,'');
  if(s.length === 3) s = s.split('').map(ch=>ch+ch).join('');
  let a = 1;
  if(s.length === 8){ a = parseInt(s.slice(6,8),16)/255; s = s.slice(0,6); }
  if(s.length !== 6 || /[^0-9a-fA-F]/.test(s)) return null;
  return { r:parseInt(s.slice(0,2),16), g:parseInt(s.slice(2,4),16), b:parseInt(s.slice(4,6),16), a:a };
}

/* --- HSL --- */
function rgbToHsl(c){
  let r=c.r/255, g=c.g/255, b=c.b/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  const l=(max+min)/2; const d=max-min;
  let h=0, s=0;
  if(d !== 0){
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if(max === r)      h = (g-b)/d + (g<b ? 6 : 0);
    else if(max === g) h = (b-r)/d + 2;
    else               h = (r-g)/d + 4;
    h *= 60;
  }
  return { h:h, s:s*100, l:l*100 };
}
function hslToRgb(h,s,l){
  h = ((h%360)+360)%360; s = clamp(s,0,100)/100; l = clamp(l,0,100)/100;
  const c = (1-Math.abs(2*l-1))*s;
  const x = c*(1-Math.abs((h/60)%2-1));
  const m = l - c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return { r:Math.round((r+m)*255), g:Math.round((g+m)*255), b:Math.round((b+m)*255) };
}

/* --- HSV --- */
function rgbToHsv(c){
  const r=c.r/255, g=c.g/255, b=c.b/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d !== 0){
    if(max === r)      h = (g-b)/d + (g<b ? 6 : 0);
    else if(max === g) h = (b-r)/d + 2;
    else               h = (r-g)/d + 4;
    h *= 60;
  }
  return { h:h, s:(max===0?0:d/max)*100, v:max*100 };
}
function hsvToRgb(h,s,v){
  h = ((h%360)+360)%360; s = clamp(s,0,100)/100; v = clamp(v,0,100)/100;
  const c = v*s;
  const x = c*(1-Math.abs((h/60)%2-1));
  const m = v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return { r:Math.round((r+m)*255), g:Math.round((g+m)*255), b:Math.round((b+m)*255) };
}

/* --- CMYK --- */
function rgbToCmyk(c){
  const r=c.r/255, g=c.g/255, b=c.b/255;
  const k = 1 - Math.max(r,g,b);
  if(k >= 1) return { c:0, m:0, y:0, k:100 };
  return {
    c:(1-r-k)/(1-k)*100, m:(1-g-k)/(1-k)*100,
    y:(1-b-k)/(1-k)*100, k:k*100
  };
}
function cmykToRgb(c,m,y,k){
  c/=100; m/=100; y/=100; k/=100;
  return {
    r: Math.round(255*(1-c)*(1-k)),
    g: Math.round(255*(1-m)*(1-k)),
    b: Math.round(255*(1-y)*(1-k))
  };
}

/* --- XYZ / CIELAB (D65) --- */
const REF_X = 0.95047, REF_Y = 1.0, REF_Z = 1.08883;
function srgbToLinear(v){ v/=255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
function linearToSrgb(v){
  const s = v <= 0.0031308 ? 12.92*v : 1.055*Math.pow(Math.max(v,0), 1/2.4) - 0.055;
  return clamp(Math.round(s*255),0,255);
}
function rgbToXyz(c){
  const R=srgbToLinear(c.r), G=srgbToLinear(c.g), B=srgbToLinear(c.b);
  return {
    x: R*0.4124564 + G*0.3575761 + B*0.1804375,
    y: R*0.2126729 + G*0.7151522 + B*0.0721750,
    z: R*0.0193339 + G*0.1191920 + B*0.9503041
  };
}
function xyzToRgb(p){
  const R = p.x* 3.2404542 + p.y*-1.5371385 + p.z*-0.4985314;
  const G = p.x*-0.9692660 + p.y* 1.8760108 + p.z* 0.0415560;
  const B = p.x* 0.0556434 + p.y*-0.2040259 + p.z* 1.0572252;
  return { r:linearToSrgb(R), g:linearToSrgb(G), b:linearToSrgb(B) };
}
function xyzToLab(p){
  const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787*t + 16/116);
  const fx=f(p.x/REF_X), fy=f(p.y/REF_Y), fz=f(p.z/REF_Z);
  return { L:116*fy - 16, a:500*(fx-fy), b:200*(fy-fz) };
}
function labToXyz(lab){
  const fy=(lab.L+16)/116, fx=fy + lab.a/500, fz=fy - lab.b/200;
  const finv = t => { const t3=t*t*t; return t3 > 0.008856 ? t3 : (t-16/116)/7.787; };
  return { x:REF_X*finv(fx), y:REF_Y*finv(fy), z:REF_Z*finv(fz) };
}
function rgbToLab(c){ return xyzToLab(rgbToXyz(c)); }
function labToRgb(lab){ return xyzToRgb(labToXyz(lab)); }

/* --- OKLab (Björn Ottosson) --- */
function rgbToOklab(c){
  const r=srgbToLinear(c.r), g=srgbToLinear(c.g), b=srgbToLinear(c.b);
  const l = 0.4122214708*r + 0.5363325363*g + 0.0514459929*b;
  const m = 0.2119034982*r + 0.6806995451*g + 0.1073969566*b;
  const s = 0.0883024619*r + 0.2817188376*g + 0.6299787005*b;
  const l_=Math.cbrt(l), m_=Math.cbrt(m), s_=Math.cbrt(s);
  return {
    L: 0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_,
    a: 1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_,
    b: 0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_
  };
}
function oklabToRgb(lab){
  const l_ = lab.L + 0.3963377774*lab.a + 0.2158037573*lab.b;
  const m_ = lab.L - 0.1055613458*lab.a - 0.0638541728*lab.b;
  const s_ = lab.L - 0.0894841775*lab.a - 1.2914855480*lab.b;
  const l=l_*l_*l_, m=m_*m_*m_, s=s_*s_*s_;
  const R =  4.0767416621*l - 3.3077115913*m + 0.2309699292*s;
  const G = -1.2684380046*l + 2.6097574011*m - 0.3413193965*s;
  const B = -0.0041960863*l - 0.7034186147*m + 1.7076147010*s;
  return { r:linearToSrgb(R), g:linearToSrgb(G), b:linearToSrgb(B) };
}
function oklabToOklch(lab){
  const C = Math.sqrt(lab.a*lab.a + lab.b*lab.b);
  let H = Math.atan2(lab.b, lab.a) * 180/Math.PI;
  if(H < 0) H += 360;
  return { L:lab.L, C:C, H:H };
}
function oklchToOklab(lch){
  const rad = lch.H * Math.PI/180;
  return { L:lch.L, a:lch.C*Math.cos(rad), b:lch.C*Math.sin(rad) };
}

/* --- RYB (Gossett & Chen approximation) --- */
function rgbToRyb(c){
  let r=c.r/255, g=c.g/255, b=c.b/255;
  const w = Math.min(r,g,b);
  r -= w; g -= w; b -= w;
  const mg = Math.max(r,g,b);
  let y = Math.min(r,g);
  r -= y; g -= y;
  if(b > 0 && g > 0){ b /= 2; g /= 2; }
  y += g; b += g;
  const my = Math.max(r,y,b);
  if(my > 0){ const n = mg/my; r*=n; y*=n; b*=n; }
  return { r:r, y:y, b:b, w:w };
}
function rybToRgb(ryb){
  let r=ryb.r, y=ryb.y, b=ryb.b;
  const w = Math.min(r,y,b);
  r -= w; y -= w; b -= w;
  const my = Math.max(r,y,b);
  let g = Math.min(y,b);
  y -= g; b -= g;
  if(b > 0 && g > 0){ b *= 2; g *= 2; }
  r += y; g += y;
  const mg = Math.max(r,g,b);
  if(mg > 0){ const n = my/mg; r*=n; g*=n; b*=n; }
  r += w; g += w; b += w;
  return { r:clamp(Math.round(r*255),0,255), g:clamp(Math.round(g*255),0,255), b:clamp(Math.round(b*255),0,255) };
}

/* --- luminance & contrast --- */
function relLum(c){
  const f = v => { v/=255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(c.r) + 0.7152*f(c.g) + 0.0722*f(c.b);
}
function contrastRatio(a,b){
  const l1 = relLum(a), l2 = relLum(b);
  const hi = Math.max(l1,l2), lo = Math.min(l1,l2);
  return (hi + 0.05) / (lo + 0.05);
}
function perceivedBrightness(c){ return (c.r*299 + c.g*587 + c.b*114) / 1000; }

/* --- distances --- */
function distRGB(a,b){
  const dr=a.r-b.r, dg=a.g-b.g, db=a.b-b.b;
  return Math.sqrt(dr*dr+dg*dg+db*db);
}
function distLab(a,b){
  const A=rgbToLab(a), B=rgbToLab(b);
  return Math.sqrt((A.L-B.L)**2 + (A.a-B.a)**2 + (A.b-B.b)**2);
}
function distOklab(a,b){
  const A=rgbToOklab(a), B=rgbToOklab(b);
  return Math.sqrt((A.L-B.L)**2 + (A.a-B.a)**2 + (A.b-B.b)**2);
}

/* --- interpolation helpers --- */
function lerp(a,b,t){ return a + (b-a)*t; }
function lerpHue(a,b,t){
  let d = ((b-a) % 360 + 540) % 360 - 180;   // shortest path
  return ((a + d*t) % 360 + 360) % 360;
}
function mixColors(a, b, t, mode){
  t = clamp(t,0,1);
  switch(mode){
    case 'rgb':
      return { r:Math.round(lerp(a.r,b.r,t)), g:Math.round(lerp(a.g,b.g,t)), b:Math.round(lerp(a.b,b.b,t)) };
    case 'hsl': {
      const A=rgbToHsl(a), B=rgbToHsl(b);
      return hslToRgb(lerpHue(A.h,B.h,t), lerp(A.s,B.s,t), lerp(A.l,B.l,t));
    }
    case 'hsv': {
      const A=rgbToHsv(a), B=rgbToHsv(b);
      return hsvToRgb(lerpHue(A.h,B.h,t), lerp(A.s,B.s,t), lerp(A.v,B.v,t));
    }
    case 'oklab': {
      const A=rgbToOklab(a), B=rgbToOklab(b);
      return oklabToRgb({ L:lerp(A.L,B.L,t), a:lerp(A.a,B.a,t), b:lerp(A.b,B.b,t) });
    }
    case 'lab': {
      const A=rgbToLab(a), B=rgbToLab(b);
      return labToRgb({ L:lerp(A.L,B.L,t), a:lerp(A.a,B.a,t), b:lerp(A.b,B.b,t) });
    }
    case 'ryb': {
      const A=rgbToRyb(a), B=rgbToRyb(b);
      return rybToRgb({ r:lerp(A.r,B.r,t), y:lerp(A.y,B.y,t), b:lerp(A.b,B.b,t), w:lerp(A.w,B.w,t) });
    }
    case 'multiply':
      return { r:Math.round(a.r*b.r/255), g:Math.round(a.g*b.g/255), b:Math.round(a.b*b.b/255) };
    case 'screen':
      return { r:Math.round(255-(255-a.r)*(255-b.r)/255),
               g:Math.round(255-(255-a.g)*(255-b.g)/255),
               b:Math.round(255-(255-a.b)*(255-b.b)/255) };
    case 'additive':
      return { r:clamp(Math.round(a.r + b.r*t),0,255), g:clamp(Math.round(a.g + b.g*t),0,255), b:clamp(Math.round(a.b + b.b*t),0,255) };
    default:
      return { r:Math.round(lerp(a.r,b.r,t)), g:Math.round(lerp(a.g,b.g,t)), b:Math.round(lerp(a.b,b.b,t)) };
  }
}

/* --- harmonies --- */
const HARMONIES = {
  complementary:      { name:'Complementary',       offsets:[0,180],                 hue:true },
  analogous:          { name:'Analogous',           offsets:[-30,-15,0,15,30],       hue:true },
  triadic:            { name:'Triadic',             offsets:[0,120,240],             hue:true },
  tetradic:           { name:'Tetradic (rectangle)',offsets:[0,60,180,240],          hue:true },
  square:             { name:'Square',              offsets:[0,90,180,270],          hue:true },
  'split-complementary':{ name:'Split Complementary', offsets:[0,150,210],            hue:true },
  monochromatic:      { name:'Monochromatic',       offsets:[0], special:'mono' }
};
function harmonyColors(base, type){
  const h = HARMONIES[type];
  if(!h) return [];
  const hsl = rgbToHsl(base);
  if(h.special === 'mono'){
    const levels = [15, 30, 45, 60, 75, 90];
    return levels.map(l => hslToRgb(hsl.h, hsl.s, l));
  }
  return h.offsets.map(off => hslToRgb(((hsl.h + off)%360+360)%360, hsl.s, hsl.l));
}
function harmonyLabels(type){
  const h = HARMONIES[type];
  if(!h) return [];
  if(h.special === 'mono') return [15,30,45,60,75,90].map(l=>'L '+l+'%');
  return h.offsets.map(o => (o>0?'+':'') + o + '°');
}

/* =========================================================================
   SECTION 3 — GLOBAL STATE
   ========================================================================= */
const CL = {
  current: { r:74, g:114, b:232 },
  sourceSpace: null,   // e.g. 'sp-oklab' — the space the current color came from
  alpha: 1,
  hue: 222,                       // preserved hue for achromatic colors
  history: [],
  favorites: [],
  palettes: [],
  activePalette: 0,
  tab: 'picker',
  sub: {},
  grad: {
    type:'linear', angle:90, mode:'rgb',
    stops:[ {p:0, color:{r:255,g:87,b:51}}, {p:0.5, color:{r:106,g:90,b:205}}, {p:1, color:{r:51,g:102,b:255}} ]
  },
  mix: { a:{r:255,g:0,b:0}, b:{r:0,g:0,b:255}, t:0.5, mode:'rgb' },
  math: { a:{r:255,g:100,b:50}, b:{r:50,g:100,b:255}, op:'difference' },
  contrast: { fg:{r:255,g:255,b:255}, bg:{r:16,g:18,b:22}, target:4.5 },
  distance: { a:{r:255,g:87,b:51}, b:{r:51,g:102,b:255} },
  sort: { colors:[], method:'hue' },
  wheel: { harmony:'triadic', value:100 },
  random: { history: [] }
};

function currentHex(){ return rgbToHex(CL.current); }

/* =========================================================================
   SECTION 4 — PERSISTENCE
   ========================================================================= */
const LS_KEY = 'colorlab.v1';
let saveTimer = null;
function saveState(){
  const data = {
    version: 1,
    current: CL.current, alpha: CL.alpha, hue: CL.hue,
    history: CL.history, favorites: CL.favorites,
    palettes: CL.palettes, activePalette: CL.activePalette,
    grad: CL.grad, tab: CL.tab
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
}
function saveStateDebounced(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d.current) CL.current = d.current;
    if(typeof d.alpha === 'number') CL.alpha = d.alpha;
    if(typeof d.hue === 'number') CL.hue = d.hue;
    if(Array.isArray(d.history)) CL.history = d.history;
    if(Array.isArray(d.favorites)) CL.favorites = d.favorites;
    if(Array.isArray(d.palettes) && d.palettes.length) CL.palettes = d.palettes;
    if(typeof d.activePalette === 'number') CL.activePalette = d.activePalette;
    if(d.grad && Array.isArray(d.grad.stops)) CL.grad = d.grad;
    if(d.tab) CL.tab = d.tab;
    return true;
  }catch(e){ return false; }
}

/* =========================================================================
   SECTION 5 — HISTORY / FAVORITES
   ========================================================================= */
function pushHistory(hex){
  if(CL.history[0] === hex) return;
  CL.history = [hex].concat(CL.history.filter(h=>h!==hex)).slice(0,40);
  renderHistory();
  saveStateDebounced();
}

// Only record a color once the user stops moving for a moment.
// This is what prevents a single drag from flooding the history bar.
let _historyTimer = null;
function scheduleHistory(){
  clearTimeout(_historyTimer);
  _historyTimer = setTimeout(()=>{
    _historyTimer = null;
    pushHistory(rgbToHex(CL.current));
  }, 500);
}
function renderHistory(){
  const el = $('#historyScroll');
  el.innerHTML = '';
  if(!CL.history.length){
    el.innerHTML = '<span class="hint" style="padding:6px">Colors you pick will appear here.</span>';
    return;
  }
  CL.history.forEach(hex=>{
    const d = document.createElement('div');
    d.className = 'hchip'; d.style.background = hex; d.dataset.color = hex;
    d.title = hex;
    el.appendChild(d);
  });
}
function renderFavorites(){
  const el = $('#favScroll');
  if(!el) return;
  el.innerHTML = '';
  if(!CL.favorites.length){
    el.innerHTML = '<span class="hint">No favorites yet. Open any color and press ★ Favorite.</span>';
    return;
  }
  CL.favorites.forEach(hex=>{
    const d = document.createElement('div');
    d.className = 'fav-chip'; d.style.background = hex; d.dataset.color = hex; d.title = hex + ' — click for options';
    el.appendChild(d);
  });
}
function toggleFavorite(hex){
  const i = CL.favorites.indexOf(hex);
  if(i >= 0){ CL.favorites.splice(i,1); toast('Removed from favorites'); }
  else { CL.favorites.unshift(hex); if(CL.favorites.length>60) CL.favorites.pop(); toast('Added to favorites ★'); }
  renderFavorites(); saveStateDebounced();
}

/* =========================================================================
   SECTION 6 — PALETTE DATA
   ========================================================================= */
function ensurePalette(){
  if(!CL.palettes.length){
    CL.palettes = [{
      name:'Palette 1',
      colors:[
        {hex:'#FF5733', locked:false},
        {hex:'#33FF57', locked:false},
        {hex:'#3357FF', locked:false},
        {hex:'#F3FF33', locked:false},
        {hex:'#9B33FF', locked:false}
      ]
    }];
  }
  if(!CL.palettes[CL.activePalette]) CL.activePalette = 0;
}
function activePalette(){ ensurePalette(); return CL.palettes[CL.activePalette]; }

function addToPalette(hex){
  const p = activePalette();
  if(p.colors.length >= 12){ toast('Palette is full (12 max)'); return; }
  p.colors.push({ hex:hex, locked:false });
  renderPalette(); saveStateDebounced();
  toast('Added ' + hex + ' to ' + p.name);
}

/* =========================================================================
   SECTION 7 — CURRENT COLOR MANAGEMENT
   ========================================================================= */
let refreshHooks = [];
function onCurrentChange(fn){ refreshHooks.push(fn); }

// Coalesce multiple setCurrent() calls in the same frame into one refresh pass.
let _refreshScheduled = false;
function scheduleRefresh(){
  if(_refreshScheduled) return;
  _refreshScheduled = true;
  requestAnimationFrame(()=>{
    _refreshScheduled = false;
    for(let i=0;i<refreshHooks.length;i++){
      try{ refreshHooks[i](); }catch(e){ console.error(e); }
    }
  });
}

function isActiveTab(id){
  const p = document.querySelector('.panel[data-tab="' + id + '"]');
  return !!p && p.classList.contains('active');
}

// opts.fast      → skip the (heavy) refresh hooks entirely, for drag handlers
// opts.noHistory → do not schedule a history entry
function setCurrent(rgb, alpha, opts){
  opts = opts || {};
  CL.sourceSpace = null;
  CL.current = {
    r: clamp(Math.round(rgb.r),0,255),
    g: clamp(Math.round(rgb.g),0,255),
    b: clamp(Math.round(rgb.b),0,255)
  };
  if(typeof alpha === 'number') CL.alpha = clamp(alpha,0,1);
  const hsv = rgbToHsv(CL.current);
  if(hsv.s > 1 && hsv.v > 1) CL.hue = hsv.h;

  // Cheap, always-on UI update (top bar)
  const hex = rgbToHex(CL.current);
  $('#currentDot').style.background = hex;
  $('#currentHex').textContent = hex;
  const qc = $('#quickColor');
  if(qc && qc.value.toLowerCase() !== hex.toLowerCase()) qc.value = hex;

  if(!opts.fast)    scheduleRefresh();
  if(!opts.noHistory) scheduleHistory();
  saveStateDebounced();
}

/* =========================================================================
   SECTION 8 — COLOR INFO RENDERING
   ========================================================================= */
function colorInfoHTML(c, alpha, opts){
  opts = opts || {};
  const hsl = rgbToHsl(c), hsv = rgbToHsv(c), cmyk = rgbToCmyk(c);
  const lab = rgbToLab(c), oklab = rgbToOklab(c), oklch = oklabToOklch(oklab);
  const lum = relLum(c);
  const a = (typeof alpha === 'number') ? alpha : 1;
  const rows = [
    ['HEX', rgbToHex(c).toUpperCase()],
    ['RGB', 'rgb(' + c.r + ', ' + c.g + ', ' + c.b + ')'],
    ['RGBA', 'rgba(' + c.r + ', ' + c.g + ', ' + c.b + ', ' + round(a,2) + ')'],
    ['HSL', round(hsl.h) + '°, ' + round(hsl.s) + '%, ' + round(hsl.l) + '%'],
    ['HSV', round(hsv.h) + '°, ' + round(hsv.s) + '%, ' + round(hsv.v) + '%'],
    ['CMYK', round(cmyk.c) + '%, ' + round(cmyk.m) + '%, ' + round(cmyk.y) + '%, ' + round(cmyk.k) + '%'],
    ['OKLab', 'L ' + round(oklab.L,3) + '  a ' + round(oklab.a,3) + '  b ' + round(oklab.b,3)],
    ['OKLCH', 'L ' + round(oklch.L,3) + '  C ' + round(oklch.C,3) + '  H ' + round(oklch.H,1) + '°'],
    ['CIELAB', 'L ' + round(lab.L,1) + '  a ' + round(lab.a,1) + '  b ' + round(lab.b,1)],
    ['Luminance', round(lum,4) + '  (' + round(lum*100,2) + '%)'],
    ['Brightness', round(perceivedBrightness(c)) + ' / 255']
  ];
  let html = '<div class="info-grid">';
  rows.forEach(([k,v])=>{
    html += '<div class="k">' + k + '</div><div class="v">' + v + '</div>' +
            '<button class="c" data-copy-text="' + v.replace(/"/g,'&quot;') + '">copy</button>';
  });
  html += '</div>';
  return html;
}

function showConfirm(message, onConfirm, opts){
  opts = opts || {};
  const body = $('#modalBody');
  body.innerHTML =
    '<h2>' + (opts.title || 'Are you sure?') + '</h2>' +
    '<p style="color:var(--text)">' + message + '</p>' +

    '</div>';
  $('#confirmCancel').onclick = closeModal;
  $('#confirmOk').onclick = ()=>{
    closeModal();

  };
  $('#modalBackdrop').classList.add('open');
}

/* =========================================================================
   SECTION 10 — SEND-TO ROUTER
   ========================================================================= */
function sendTo(target, hex){
  const c = hexToRgb(hex);
  if(!c) return;
  switch(target){
    case 'picker':
      pickerApplyHex(hex); showTab('picker'); break;
    case 'mixer-a': CL.mix.a = c; renderMixer(); showTab('mixer'); break;
    case 'mixer-b': CL.mix.b = c; renderMixer(); showTab('mixer'); break;
    case 'contrast-fg': CL.contrast.fg = c; renderContrast(); showTab('contrast'); break;
    case 'contrast-bg': CL.contrast.bg = c; renderContrast(); showTab('contrast'); break;
    case 'math-a': CL.math.a = c; renderMath(); showTab('math'); break;
    case 'math-b': CL.math.b = c; renderMath(); showTab('math'); break;
    case 'distance-a': CL.distance.a = c; renderDistance(); showTab('palettes','distance'); break;
    case 'distance-b': CL.distance.b = c; renderDistance(); showTab('palettes','distance'); break;
    case 'wheel':
      pickerApplyHex(hex); showTab('wheel'); break;
    case 'palette':
      addToPalette(rgbToHex(c)); showTab('palettes','builder'); break;
    case 'gradient':
      CL.grad.stops.push({ p:0.5, color:c });
      CL.grad.stops.sort((x,y)=>x.p-y.p);
      renderGradient(); showTab('gradients'); break;
    default: break;
  }
  closeModal();
}
document.addEventListener('click', function(e){
  const sendBtn = e.target.closest('[data-send]');
  if(sendBtn){
    const hex = sendBtn.dataset.sendColor || currentHex();
    sendTo(sendBtn.dataset.send, hex);
    return;
  }
  const copyBtn = e.target.closest('[data-copy-text]');
  if(copyBtn){ copyText(copyBtn.dataset.copyText); return; }
  const sw = e.target.closest('[data-color]');
  if(sw && !e.target.closest('[data-no-modal]')){ openColorModal(sw.dataset.color); }
});

function sliderHTML(id, label, min, max, step, val){
  return '<div class="slider-row">' +
    '<label for="' + id + '">' + label + '</label>' +
    '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '">' +
    '<input type="number" id="' + id + 'N" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '">' +
    '</div>';
}
function bindSlider(id, cb){
  const r = document.getElementById(id), n = document.getElementById(id + 'N');
  if(!r || !n) return;
  function handle(v){
    v = parseFloat(v);
    if(isNaN(v)) return;
    r.value = v; n.value = round(v,2);
    cb(v);
  }
  r.addEventListener('input', ()=>handle(r.value));
  n.addEventListener('input', ()=>handle(n.value));
  n.addEventListener('change', ()=>handle(n.value));
}
function setSlider(id, v){
  const r = document.getElementById(id), n = document.getElementById(id + 'N');
  if(!r) return;
  r.value = v; n.value = round(v,2);
}

/* Build the panels into <main> */
function buildPanels(){
  const main = $('#main');
  let html = '';
  Object.keys(PANEL_HTML).forEach(key=>{
    if(key === 'favorites') return;
    html += '<section class="panel" data-tab="' + key + '">' + PANEL_HTML[key] + '</section>';
  });
  main.innerHTML = html;
}

/* Build nav tabs */
function buildTabs(){
  const nav = $('#tabs');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.tab = t.id;
    b.onclick = ()=>showTab(t.id);
    nav.appendChild(b);
  });
}

function showTab(id, sub){
  CL.tab = id;
  $$('.panel').forEach(p => p.classList.toggle('active', p.dataset.tab === id));
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  if(sub){
    const host = document.querySelector('.panel[data-tab="' + id + '"]');
    if(host){
      $$('.subtabs button', host).forEach(b => b.classList.toggle('active', b.dataset.sub === sub));
      $$('.subpanel', host).forEach(p => p.classList.toggle('active', p.dataset.sub === sub));
    }
  }
    // Lazy draws — refresh whichever panel is becoming visible.
  if(id === 'wheel')       { drawWheel(); renderWheelSwatches(); }
  if(id === 'gradients')   renderGradient();
  if(id === 'palettes')    { renderPalette(); renderSort(); renderDistance(); renderCompare(); }
  if(id === 'image')       drawImageCanvases();
  if(id === 'perception')  renderPerception();
  if(id === 'experiments') renderExperiments();
  if(id === 'favorites')   renderFavorites();
  if(id === 'theory')      updateTheory();
  if(id === 'spaces')      { CL.sourceSpace = null; updateSpaces(); }
  if(id === 'contrast')    renderContrast();
  if(id === 'mixer')       renderMixer();
  if(id === 'math')        renderMath();
  if(id === 'convert')     { if(window.updateConverterOutputs) window.updateConverterOutputs(); }
  if(id === 'picker')      setPickerFromRGB(CL.current, CL.alpha);
  saveStateDebounced();
}

/* =========================================================================
   SECTION 13 — PICKER
   ========================================================================= */
const P = { h:222, s:68, v:91, hs:77, l:60, a:1 };
// True while the user is actively dragging a picker control. During a drag,
// P.h / P.s / P.v are the source of truth and must not be re-derived from RGB.
let _pickerDragActive = false;

function pickerApplyHex(hex){
  const c = hexToRgb(hex);
  if(!c) return;
  setPickerFromRGB(c, c.a);
  setCurrent(CL.current, CL.alpha);
}
function setPickerFromRGB(rgb, alpha){
  CL.current = { r:clamp(Math.round(rgb.r),0,255), g:clamp(Math.round(rgb.g),0,255), b:clamp(Math.round(rgb.b),0,255) };
  if(typeof alpha === 'number') CL.alpha = clamp(alpha,0,1);
  const hsv = rgbToHsv(CL.current);
  const hsl = rgbToHsl(CL.current);
  if(hsv.s > 1 && hsv.v > 1) P.h = hsv.h;
  P.s = hsv.s; P.v = hsv.v; P.hs = hsl.s; P.l = hsl.l; P.a = CL.alpha;
  updatePickerUI();
}
function updatePickerUI(opts){
  opts = opts || {};
  const c = CL.current;
  setSlider('pH', P.h); setSlider('pS', P.s); setSlider('pV', P.v);
  setSlider('pSL', P.hs); setSlider('pL', P.l);
  setSlider('pR', c.r); setSlider('pG', c.g); setSlider('pB', c.b);
  setSlider('pA', P.a);
  $('#hexInput').value = rgbToHex(c).toUpperCase();
  $('#pickPreview').style.background = 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + P.a + ')';
  // Rebuilding the info grid is the most expensive part — skip it during drags.
  if(!opts.skipInfo) $('#pickInfo').innerHTML = colorInfoHTML(c, P.a);
  drawSV(); drawHue(); drawAlpha();
}
function commitFromPicker(){
  CL.alpha = P.a;
  setCurrent(CL.current, CL.alpha);
  updatePickerUI();
}

function drawSV(){
  const cv = $('#svCanvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const pure = hsvToRgb(P.h, 100, 100);
  ctx.fillStyle = rgbToHex(pure);
  ctx.fillRect(0,0,W,H);
  let g = ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const cur = $('#svCursor');
  cur.style.left = (P.s) + '%';
  cur.style.top = (100 - P.v) + '%';
}
function drawHue(){
  const cv = $('#hueCanvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const g = ctx.createLinearGradient(0,0,W,0);
  for(let i=0;i<=6;i++){
    g.addColorStop(i/6, rgbToHex(hsvToRgb(i*60,100,100)));
  }
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  $('#hueCursor').style.left = (P.h/360*100) + '%';
}
function drawAlpha(){
  const cv = $('#alphaCanvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  // checkerboard
  const s = 8;
  for(let y=0;y<H;y+=s) for(let x=0;x<W;x+=s){
    ctx.fillStyle = ((x/s + y/s) % 2 === 0) ? '#2a2f38' : '#1b2028';
    ctx.fillRect(x,y,s,s);
  }
  const c = CL.current;
  const g = ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',0)');
  g.addColorStop(1, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',1)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  $('#alphaCursor').style.left = (P.a*100) + '%';
}

function initPicker(){
  const defs = [
    ['pH','Hue (shared)',0,360,1],
    ['pS','Saturation (HSV)',0,100,1],
    ['pV','Value (HSV)',0,100,1],
    ['pSL','Saturation (HSL)',0,100,1],
    ['pL','Lightness (HSL)',0,100,1],
    ['pR','Red',0,255,1],
    ['pG','Green',0,255,1],
    ['pB','Blue',0,255,1],
    ['pA','Alpha',0,1,0.01]
  ];
  let html = '';
  defs.forEach(d => { html += sliderHTML(d[0], d[1], d[2], d[3], d[4], 0); });
  $('#pickerSliders').innerHTML = html;

  bindSlider('pH', v => { P.h = v; const rgb = hsvToRgb(P.h, P.s, P.v); P._lockH = true; applyPickerRGB(rgb); });
  bindSlider('pS', v => { P.s = v; applyPickerRGB(hsvToRgb(P.h, P.s, P.v)); });
  bindSlider('pV', v => { P.v = v; applyPickerRGB(hsvToRgb(P.h, P.s, P.v)); });
  bindSlider('pSL', v => { P.hs = v; applyPickerRGB(hslToRgb(P.h, P.hs, P.l)); });
  bindSlider('pL', v => { P.l = v; applyPickerRGB(hslToRgb(P.h, P.hs, P.l)); });
  bindSlider('pR', v => { applyPickerRGB({r:v, g:CL.current.g, b:CL.current.b}); });
  bindSlider('pG', v => { applyPickerRGB({r:CL.current.r, g:v, b:CL.current.b}); });
  bindSlider('pB', v => { applyPickerRGB({r:CL.current.r, g:CL.current.g, b:v}); });
  bindSlider('pA', v => { P.a = v; commitFromPicker(); });

      function applyPickerRGB(rgb, fast){
    CL.current = { r:clamp(Math.round(rgb.r),0,255), g:clamp(Math.round(rgb.g),0,255), b:clamp(Math.round(rgb.b),0,255) };
    const hsl = rgbToHsl(CL.current);

    // Only resync HSV state when the color came from somewhere else.
    // During a drag P.h/P.s/P.v are already the user's intended values;
    // roundtripping through RGB snaps the cursor to a corner when S or V hit 0.
    if(!_pickerDragActive){
      const hsv = rgbToHsv(CL.current);
      if(!P._lockH && hsv.s > 1 && hsv.v > 1) P.h = hsv.h;
      P.s = hsv.s; P.v = hsv.v;
    }
    P._lockH = false;
    P.hs = hsl.s; P.l = hsl.l;
    CL.alpha = P.a;

    if(fast){
      const hex = rgbToHex(CL.current);
      $('#currentDot').style.background = hex;
      $('#currentHex').textContent = hex;
      updatePickerUI({ skipInfo:true });
      saveStateDebounced();
    } else {
      setCurrent(CL.current, CL.alpha);
      updatePickerUI();
    }
  }

      // SV canvas dragging
  const svWrap = $('#svWrap'), svCv = $('#svCanvas');
  function svFromEvent(e){
    const r = svCv.getBoundingClientRect();
    const x = clamp((e.clientX - r.left)/r.width, 0, 1);
    const y = clamp((e.clientY - r.top)/r.height, 0, 1);
    P.s = x*100; P.v = (1-y)*100;
    applyPickerRGB(hsvToRgb(P.h, P.s, P.v), true);
  }
  let dragging = false;
  svWrap.addEventListener('pointerdown', e => {
    dragging = true;
    _pickerDragActive = true;
    svWrap.setPointerCapture(e.pointerId);
    svFromEvent(e);
  });
  svWrap.addEventListener('pointermove', e => { if(dragging) svFromEvent(e); });
  svWrap.addEventListener('pointerup', e => {
    if(dragging){
      svFromEvent(e);                 // final position from the pointer
      // Commit the drag: run the heavy refresh hooks once, and leave P alone.
      setCurrent(CL.current, CL.alpha);
      updatePickerUI();
    }
    dragging = false;
    _pickerDragActive = false;
  });
  svWrap.addEventListener('pointercancel', ()=>{ dragging = false; _pickerDragActive = false; });

  // Hue strip
  const hueWrap = $('#hueWrap'), hueCv = $('#hueCanvas');
  function hueFromEvent(e){
    const r = hueCv.getBoundingClientRect();
    const x = clamp((e.clientX - r.left)/r.width, 0, 1);
    P.h = x*360;
    P._lockH = true;
    applyPickerRGB(hsvToRgb(P.h, P.s, P.v), true);
  }
  let hdrag = false;
  hueWrap.addEventListener('pointerdown', e => {
    hdrag = true;
    _pickerDragActive = true;
    hueWrap.setPointerCapture(e.pointerId);
    hueFromEvent(e);
  });
  hueWrap.addEventListener('pointermove', e => { if(hdrag) hueFromEvent(e); });
  hueWrap.addEventListener('pointerup', e => {
    if(hdrag){
      hueFromEvent(e);
      setCurrent(CL.current, CL.alpha);
      updatePickerUI();
    }
    hdrag = false;
    _pickerDragActive = false;
  });
  hueWrap.addEventListener('pointercancel', ()=>{ hdrag = false; _pickerDragActive = false; });

  // Alpha strip
  const aWrap = $('#alphaWrap'), aCv = $('#alphaCanvas');
  function alphaFromEvent(e){
    const r = aCv.getBoundingClientRect();
    P.a = clamp((e.clientX - r.left)/r.width, 0, 1);
    CL.alpha = P.a;
    applyPickerRGB(CL.current, true);
  }
  let adrag = false;
  aWrap.addEventListener('pointerdown', e => { adrag = true; aWrap.setPointerCapture(e.pointerId); alphaFromEvent(e, true); });
  aWrap.addEventListener('pointermove', e => { if(adrag) alphaFromEvent(e, true); });
  aWrap.addEventListener('pointerup',   e => { if(adrag) alphaFromEvent(e, false); adrag = false; });
  aWrap.addEventListener('pointercancel', ()=>{ adrag = false; });

  // HEX input
  $('#hexApply').onclick = ()=>{ const c = hexToRgb($('#hexInput').value); if(c) pickerApplyHex(rgbToHex(c)); else toast('Invalid HEX'); };
  $('#hexInput').addEventListener('keydown', e => { if(e.key === 'Enter') $('#hexApply').click(); });
  $('#hexInput').addEventListener('input', ()=>{
    const c = hexToRgb($('#hexInput').value);
    if(c) pickerApplyHex(rgbToHex(c));
  });

  // Send buttons
  $('#pickerSend').innerHTML =
    '<button class="btn" data-send="mixer-a">Mixer A</button>' +
    '<button class="btn" data-send="mixer-b">Mixer B</button>' +
    '<button class="btn" data-send="wheel">Color Wheel</button>' +
    '<button class="btn" data-send="math-a">Math A</button>' +
    '<button class="btn" data-send="contrast-fg">Contrast FG</button>' +
    '<button class="btn" data-send="contrast-bg">Contrast BG</button>' +
    '<button class="btn" data-send="distance-a">Distance A</button>' +
    '<button class="btn primary" data-send="palette">Add to Palette</button>';

  // initial
  P.h = CL.hue; 
  setPickerFromRGB(CL.current, CL.alpha);
}

   ========================================================================= */
const MIX_FORMULAS = {
  rgb: 'Linear interpolation between the two RGB values.\n\nR = A.r + (B.r − A.r) × t',
  additive: 'Adding light: the channels are summed and clipped.\n\nR = min(255, A.r + B.r × t)',
  ryb: 'Subtractive pigment mixing approximated in RYB space.\n\nR, Y, B are interpolated, then converted back to RGB.',
  hsl: 'Interpolating hue along the shortest path, plus saturation and lightness.\n\nH = A.h + shortestDelta × t',
  hsv: 'Same idea as HSL but in HSV space.',
  oklab: 'Interpolation in OKLab — a perceptually uniform space.\n\nL, a, b are interpolated, then converted back to sRGB.',
  lab: 'Interpolation in CIELAB.',
  multiply: 'Channel-wise multiplication.\n\nR = A.r × B.r / 255',
  screen: 'Inverse multiply — lightens.\n\nR = 255 − (255 − A.r)(255 − B.r) / 255'
};

function renderMixer(){
  const a = CL.mix.a, b = CL.mix.b, t = CL.mix.t, mode = CL.mix.mode;
  const result = mixColors(a, b, t, mode);

  $('#mixSwatchA').style.background = rgbToHex(a);
  $('#mixSwatchB').style.background = rgbToHex(b);
  $('#mixHexA').textContent = rgbToHex(a).toUpperCase();
  $('#mixHexB').textContent = rgbToHex(b).toUpperCase();
  $('#mixSendA').dataset.sendColor = rgbToHex(a);
  $('#mixSendB').dataset.sendColor = rgbToHex(b);
  $('#mixResult').style.background = rgbToHex(result);
  $('#mixResultHex').textContent = rgbToHex(result).toUpperCase() + '  rgb(' + result.r + ',' + result.g + ',' + result.b + ')';
  $('#mixAmountLabel').textContent = Math.round(t*100) + '%';

  // Formula
  let f = MIX_FORMULAS[mode] + '\n\n';
  f += 'Color A  rgb(' + a.r + ', ' + a.g + ', ' + a.b + ')\n';
  f += 'Color B  rgb(' + b.r + ', ' + b.g + ', ' + b.b + ')\n';
  f += 't = ' + t.toFixed(2) + '\n\n';
  if(mode === 'rgb'){
    f += 'R = ' + a.r + ' + (' + b.r + ' − ' + a.r + ') × ' + t.toFixed(2) + ' = ' + result.r + '\n';
    f += 'G = ' + a.g + ' + (' + b.g + ' − ' + a.g + ') × ' + t.toFixed(2) + ' = ' + result.g + '\n';
    f += 'B = ' + a.b + ' + (' + b.b + ' − ' + a.b + ') × ' + t.toFixed(2) + ' = ' + result.b + '\n';
  } else if(mode === 'additive'){
    f += 'R = min(255, ' + a.r + ' + ' + b.r + ' × ' + t.toFixed(2) + ') = ' + result.r + '\n';
    f += 'G = min(255, ' + a.g + ' + ' + b.g + ' × ' + t.toFixed(2) + ') = ' + result.g + '\n';
    f += 'B = min(255, ' + a.b + ' + ' + b.b + ' × ' + t.toFixed(2) + ') = ' + result.b + '\n';
  } else if(mode === 'multiply'){
    f += 'R = ' + a.r + ' × ' + b.r + ' / 255 = ' + result.r + '\n';
    f += 'G = ' + a.g + ' × ' + b.g + ' / 255 = ' + result.g + '\n';
    f += 'B = ' + a.b + ' × ' + b.b + ' / 255 = ' + result.b + '\n';
  } else if(mode === 'screen'){
    f += 'R = 255 − (255 − ' + a.r + ')(255 − ' + b.r + ')/255 = ' + result.r + '\n';
    f += 'G = 255 − (255 − ' + a.g + ')(255 − ' + b.g + ')/255 = ' + result.g + '\n';
    f += 'B = 255 − (255 − ' + a.b + ')(255 − ' + b.b + ')/255 = ' + result.b + '\n';
  } else if(mode === 'hsl' || mode === 'hsv'){
    const A = mode === 'hsl' ? rgbToHsl(a) : rgbToHsv(a);
    const B = mode === 'hsl' ? rgbToHsl(b) : rgbToHsv(b);
    f += 'A: H ' + round(A.h,1) + '°  S ' + round(A.s,1) + '%  ' + (mode==='hsl'?'L':'V') + ' ' + round(A.l || A.v,1) + '%\n';
    f += 'B: H ' + round(B.h,1) + '°  S ' + round(B.s,1) + '%  ' + (mode==='hsl'?'L':'V') + ' ' + round(B.l || B.v,1) + '%\n';
    f += '→ interpolated along the shortest hue path\n';
  } else if(mode === 'oklab' || mode === 'lab'){
    const A = mode === 'oklab' ? rgbToOklab(a) : rgbToLab(a);
    const B = mode === 'oklab' ? rgbToOklab(b) : rgbToLab(b);
    f += 'A: L ' + round(A.L,3) + '  a ' + round(A.a,3) + '  b ' + round(A.b,3) + '\n';
    f += 'B: L ' + round(B.L,3) + '  a ' + round(B.a,3) + '  b ' + round(B.b,3) + '\n';
    f += 'Interpolated linearly, then converted back to sRGB.\n';
  } else if(mode === 'ryb'){
    const A = rgbToRyb(a), B = rgbToRyb(b);
    f += 'A → RYB(' + round(A.r,3) + ', ' + round(A.y,3) + ', ' + round(A.b,3) + ')\n';
    f += 'B → RYB(' + round(B.r,3) + ', ' + round(B.y,3) + ', ' + round(B.b,3) + ')\n';
    f += 'Interpolated in RYB, then converted back to RGB.\n';
  }
  f += '\nResult  <span class="res">' + rgbToHex(result).toUpperCase() + '</span>  rgb(' + result.r + ', ' + result.g + ', ' + result.b + ')';
  $('#mixFormula').innerHTML = f;
}
function initMixer(){
  $('#mixMethod').value = CL.mix.mode;
  $('#mixMethod').onchange = e => { CL.mix.mode = e.target.value; renderMixer(); };
  $('#mixAmount').addEventListener('input', e => { CL.mix.t = e.target.value/100; renderMixer(); });
  $('#mixSwatchA').onclick = ()=>openColorModal(rgbToHex(CL.mix.a));
  $('#mixSwatchB').onclick = ()=>openColorModal(rgbToHex(CL.mix.b));
  $('#mixToPicker').onclick = ()=>{
    const r = mixColors(CL.mix.a, CL.mix.b, CL.mix.t, CL.mix.mode);
    pickerApplyHex(rgbToHex(r)); setCurrent(r); showTab('picker');
  };
  $('#mixToPalette').onclick = ()=>{
    const r = mixColors(CL.mix.a, CL.mix.b, CL.mix.t, CL.mix.mode);
    addToPalette(rgbToHex(r));
  };
  $('#mixSwap').onclick = ()=>{
    const t = CL.mix.a; CL.mix.a = CL.mix.b; CL.mix.b = t;
    CL.mix.t = 1 - CL.mix.t;
    $('#mixAmount').value = CL.mix.t*100;
    renderMixer();
  };
  $('#mixRandom').onclick = ()=>{
    CL.mix.a = randomRGB(); CL.mix.b = randomRGB();
    renderMixer();
  };
  renderMixer();
}

/* =========================================================================
   SECTION 15 — COLOR WHEEL
   ========================================================================= */
// The wheel bitmap is expensive to generate (per-pixel atan2 + HSV→RGB).
// It only depends on CL.wheel.value, so cache it and reuse for marker redraws.
let _wheelCache = null;
let _wheelCacheValue = -1;
let _wheelCacheSize = 0;

function getWheelBitmap(size){
  if(_wheelCache && _wheelCacheValue === CL.wheel.value && _wheelCacheSize === size){
    return _wheelCache;
  }
  const W = size, H = size;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const d = img.data;
  const cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 8;
  const R2 = R*R;
  const V = CL.wheel.value;

  for(let y=0;y<H;y++){
    const dy = y - cy;
    const dy2 = dy*dy;
    for(let x=0;x<W;x++){
      const dx = x - cx;
      const dist2 = dx*dx + dy2;
      const i = (y*W + x)*4;
      if(dist2 > R2){ d[i+3] = 0; continue; }
      let ang = Math.atan2(dy, dx) * 180/Math.PI;
      if(ang < 0) ang += 360;
      const s = Math.sqrt(dist2)/R*100;
      const rgb = hsvToRgb(ang, s, V);
      d[i] = rgb.r; d[i+1] = rgb.g; d[i+2] = rgb.b; d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  _wheelCache = cv;
  _wheelCacheValue = CL.wheel.value;
  _wheelCacheSize = size;
  return cv;
}

function drawWheel(){
  const cv = $('#wheelCanvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 8;

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(getWheelBitmap(W), 0, 0);

  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 2; ctx.stroke();

  // Harmony markers
  const base = CL.current;
  const colors = harmonyColors(base, CL.wheel.harmony);
  const hs = colors.map(c => rgbToHsv(c));

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 1.5;
  const pts = hs.map(h => {
    const ang = h.h * Math.PI/180;
    const rad = (h.s/100) * R;
    return { x: cx + Math.cos(ang)*rad, y: cy + Math.sin(ang)*rad };
  });
  if(pts.length > 1){
    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    if(pts.length > 2) ctx.closePath();
    ctx.stroke();
  }
  pts.forEach((p,i)=>{
    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI*2);
    ctx.fillStyle = rgbToHex(colors[i]); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
  });
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
  ctx.restore();
}

function renderWheel(){
  const sel = $('#wheelHarmony');
  if(sel && !sel.options.length){
    Object.keys(HARMONIES).forEach(k=>{
      const o = document.createElement('option');
      o.value = k; o.textContent = HARMONIES[k].name;
      sel.appendChild(o);
    });
    sel.value = CL.wheel.harmony;
    sel.onchange = ()=>{ CL.wheel.harmony = sel.value; drawWheel(); renderWheelSwatches(); };
  }
  $('#wheelValue').addEventListener('input', e => {
    CL.wheel.value = +e.target.value;
    $('#wheelValueLabel').textContent = CL.wheel.value + '%';
    drawWheel();
  });
  $('#wheelValueLabel').textContent = CL.wheel.value + '%';
  drawWheel();
  renderWheelSwatches();
}
function renderWheelSwatches(){
  const host = $('#wheelSwatches'); if(!host) return;
  const base = CL.current;
  const colors = harmonyColors(base, CL.wheel.harmony);
  const labels = harmonyLabels(CL.wheel.harmony);
  const hsl = rgbToHsl(base);
  host.innerHTML = '';
  colors.forEach((c,i)=>{
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML =
      '<div class="swatch md" data-color="' + rgbToHex(c) + '" style="background:' + rgbToHex(c) + '"></div>' +
      '<div><div class="mono" style="font-size:12px">' + rgbToHex(c).toUpperCase() + '</div>' +
      '<div class="hint">' + (labels[i] || '') + ' · hsl(' + round(rgbToHsl(c).h) + '°, ' +
      round(rgbToHsl(c).s) + '%, ' + round(rgbToHsl(c).l) + '%)</div></div>' +
      '<div class="spacer"></div>' +
      '<button class="btn small" data-send="picker" data-send-color="' + rgbToHex(c) + '">Use</button>' +
      '<button class="btn small" data-send="palette" data-send-color="' + rgbToHex(c) + '">+Palette</button>';
    host.appendChild(div);
  });
  const info = $('#wheelInfo');
  if(info){
    info.innerHTML = '<h3>Base color</h3>' + colorInfoHTML(base, 1) +
      '<div class="hint" style="margin-top:10px">Base hue ' + round(hsl.h) + '° · ' +
      HARMONIES[CL.wheel.harmony].name + '</div>';
  }
}
function initWheel(){
  const cv = $('#wheelCanvas');
  function fromEvent(e, fast){
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left)/r.width * cv.width;
    const y = (e.clientY - r.top)/r.height * cv.height;
    const cx = cv.width/2, cy = cv.height/2;
    const dx = x - cx, dy = y - cy;
    const R = Math.min(cv.width, cv.height)/2 - 8;
    let dist = Math.sqrt(dx*dx+dy*dy);
    if(dist > R) dist = R;
    let ang = Math.atan2(dy,dx)*180/Math.PI;
    if(ang < 0) ang += 360;
    const s = dist/R*100;

    const rgb = hsvToRgb(ang, s, CL.wheel.value);
    CL.current = rgb;

    // Keep the picker sliders in sync so switching tabs feels correct.
    const hsv = rgbToHsv(rgb), hsl = rgbToHsl(rgb);
    P.h = hsv.h; P.s = hsv.s; P.v = hsv.v;
    P.hs = hsl.s; P.l = hsl.l;
    P._lockH = true;

    const hex = rgbToHex(rgb);
    $('#currentDot').style.background = hex;
    $('#currentHex').textContent = hex;

    // Redraw only the (cached-bitmap) wheel + markers — cheap now.
    drawWheel();

    if(fast){
      saveStateDebounced();
    } else {
      setCurrent(rgb, CL.alpha);
      renderWheelSwatches();
    }
  }
  let dragging = false;
  cv.addEventListener('pointerdown', e=>{ dragging = true; cv.setPointerCapture(e.pointerId); fromEvent(e); });
  cv.addEventListener('pointermove', e=>{ if(dragging) fromEvent(e); });
  cv.addEventListener('pointerup', ()=>{ dragging=false; });
  cv.addEventListener('pointercancel', ()=>{ dragging=false; });
  renderWheel();
}

function buildTheory(){
  const grid = $('#theoryGrid'); if(!grid) return;
  let html = '';
  Object.keys(HARMONIES).forEach(key=>{
    html += '<div class="card" data-harmony="' + key + '">' +
      '<h2>' + HARMONIES[key].name + '</h2>' +
      '<div class="swatch-row" id="th-sw-' + key + '"></div>' +
      '<div class="divider"></div>' +
      '<div class="formula" id="th-fx-' + key + '"></div>' +
      '</div>';
  });
  grid.innerHTML = html;
}
function updateTheory(){
  const base = CL.current;
  const hsl = rgbToHsl(base);
  $('#theoryCurrentHex').textContent = rgbToHex(base).toUpperCase();
  Object.keys(HARMONIES).forEach(key=>{
    const colors = harmonyColors(base, key);
    const labels = harmonyLabels(key);
    const sw = document.getElementById('th-sw-' + key);
    if(sw){
      sw.innerHTML = colors.map((c,i)=>
        '<div style="text-align:center">' +
        '<div class="swatch md" data-color="' + rgbToHex(c) + '" style="background:' + rgbToHex(c) + '"></div>' +
        '<div class="hint" style="margin-top:5px;font-size:10.5px">' + (labels[i]||'') + '</div>' +
        '<div class="mono" style="font-size:10px;color:var(--muted)">' + rgbToHex(c).toUpperCase() + '</div>' +
        '</div>'
      ).join('');
    }
    const fx = document.getElementById('th-fx-' + key);
    if(fx){
      let text = 'Base  hsl(' + round(hsl.h) + '°, ' + round(hsl.s) + '%, ' + round(hsl.l) + '%)\n\n';
      if(key === 'monochromatic'){
        text += 'Keep H and S constant. Vary L:\n';
        [15,30,45,60,75,90].forEach(l=>{
          text += '  L = ' + l + '%  →  ' + rgbToHex(hslToRgb(hsl.h, hsl.s, l)).toUpperCase() + '\n';
        });
      } else {
        HARMONIES[key].offsets.forEach((off,i)=>{
          const nh = ((hsl.h + off)%360+360)%360;
          text += 'H = (' + round(hsl.h) + '° ' + (off>=0?'+':'−') + ' ' + Math.abs(off) + '°) mod 360 = ' +
                  round(nh) + '°  →  ' + rgbToHex(colors[i]).toUpperCase() + '\n';
        });
      }
      fx.textContent = text;
    }
  });
}
function initTheory(){
  buildTheory();
  $('#theoryUseCurrent').onclick = ()=>{ updateTheory(); toast('Using current color'); };
  updateTheory();
}

  { id:'sp-rgb', name:'RGB', desc:'The native language of screens. Three additive channels: red, green and blue light. Simple, but two colors with similar RGB values can look very different.',
    sliders:[['R','R',0,255,1],['G','G',0,255,1],['B','B',0,255,1]] },
