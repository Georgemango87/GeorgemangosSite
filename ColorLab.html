    sliders:[['H','H',0,360,1],['S','S',0,100,1],['L','L',0,100,1]] },
  { id:'sp-hsv', name:'HSV / HSB', desc:'Hue, Saturation, Value. Similar to HSL but Value behaves like a dimmer switch — very common in design tools.',
    sliders:[['H','H',0,360,1],['S','S',0,100,1],['V','V',0,100,1]] },
  { id:'sp-cmyk', name:'CMYK', desc:'Subtractive, used for print. The K channel carries black so the other inks stay clean.',
    sliders:[['C','C',0,100,1],['M','M',0,100,1],['Y','Y',0,100,1],['K','K',0,100,1]] },
  { id:'sp-lab', name:'CIELAB', desc:'Designed to be perceptually uniform. L is lightness, a is green↔red, b is blue↔yellow. Useful for measuring perceived difference.',
    sliders:[['L','L',0,100,0.1],['a','a',-128,127,0.1],['b','b',-128,127,0.1]] },
  { id:'sp-oklab', name:'OKLab', desc:'A modern perceptual space. Excellent for gradients and palette blending because it avoids the muddy middle and preserves perceived lightness.',
    sliders:[['L','L',0,1,0.001],['a','a',-0.4,0.4,0.001],['b','b',-0.4,0.4,0.001]] },
  { id:'sp-oklch', name:'OKLCH', desc:'The cylindrical form of OKLab: Lightness, Chroma and Hue. Very handy for building palettes with consistent perceived lightness.',
    sliders:[['L','L',0,1,0.001],['C','C',0,0.4,0.001],['H','H',0,360,1]] }
];
let spacesUpdating = false;
// `CL.sourceSpace` is the space the color was last set from. While it is set,
// updateSpaces() does not write back to that space — the round-trip through
// 8-bit RGB is lossy and would nudge the value out from under the user.
// It is cleared by setCurrent(), so changing the color anywhere else
// (picker, wheel, mixer, quick color, import…) causes a full resync.

function buildSpaces(){
  const grid = $('#spacesGrid'); if(!grid) return;
  let html = '';
  SPACES.forEach(sp=>{
    html += '<div class="card"><h2>' + sp.name + '</h2><p class="hint" style="min-height:52px">' + sp.desc + '</p>';
    sp.sliders.forEach(sl=>{
      html += sliderHTML(sp.id + '-' + sl[0], sl[1], sl[2], sl[3], sl[4], 0);
    });
    html += '</div>';
  });
  grid.innerHTML = html;

  SPACES.forEach(sp=>{
    sp.sliders.forEach(sl=>{
      const id = sp.id + '-' + sl[0];
      const rangeEl = document.getElementById(id);
      const numEl   = document.getElementById(id + 'N');
      if(!rangeEl || !numEl) return;

      rangeEl.addEventListener('input', ()=>{
        const v = parseFloat(rangeEl.value);
        if(!isNaN(v) && document.activeElement !== numEl) numEl.value = round(v, 2);
        applySpace(sp);
      });

      const numHandler = ()=>{
        const v = parseFloat(numEl.value);
        if(isNaN(v)) return;
        const min = parseFloat(numEl.min), max = parseFloat(numEl.max);
        rangeEl.value = clamp(v, min, max);
        applySpace(sp);
      };
      numEl.addEventListener('input',  numHandler);
      numEl.addEventListener('change', numHandler);
    });
  });
}

function applySpace(sp){
  if(spacesUpdating) return;
  const get = k => parseFloat(document.getElementById(sp.id + '-' + k).value);
  let rgb;
  if(sp.id === 'sp-rgb')        rgb = { r:get('R'), g:get('G'), b:get('B') };
  else if(sp.id === 'sp-hsl')   rgb = hslToRgb(get('H'), get('S'), get('L'));
  else if(sp.id === 'sp-hsv')   rgb = hsvToRgb(get('H'), get('S'), get('V'));
  else if(sp.id === 'sp-cmyk')  rgb = cmykToRgb(get('C'), get('M'), get('Y'), get('K'));
  else if(sp.id === 'sp-lab')   rgb = labToRgb({ L:get('L'), a:get('a'), b:get('b') });
  else if(sp.id === 'sp-oklab') rgb = oklabToRgb({ L:get('L'), a:get('a'), b:get('b') });
  else if(sp.id === 'sp-oklch') rgb = oklabToRgb(oklchToOklab({ L:get('L'), C:get('C'), H:get('H') }));

  if(!rgb || !isFinite(rgb.r) || !isFinite(rgb.g) || !isFinite(rgb.b)) return;

  CL.current = {
    r: clamp(Math.round(rgb.r), 0, 255),
    g: clamp(Math.round(rgb.g), 0, 255),
    b: clamp(Math.round(rgb.b), 0, 255)
  };
  // Remember where this color came from so updateSpaces() leaves this space alone.
  CL.sourceSpace = sp.id;

  // Keep the picker's internal hue/sat state in sync so switching to Picker
  // doesn't show stale slider positions. We don't call updatePickerUI here —
  // it rebuilds the info grid, which is expensive, and the picker will be
  // refreshed on tab switch anyway.
  const hsv = rgbToHsv(CL.current);
  const hsl = rgbToHsl(CL.current);
  if(hsv.s > 1 && hsv.v > 1) P.h = hsv.h;
  P.s = hsv.s; P.v = hsv.v; P.hs = hsl.s; P.l = hsl.l;

  const hex = rgbToHex(CL.current);
  $('#currentDot').style.background = hex;
  $('#currentHex').textContent = hex;
  const qc = $('#quickColor');
  if(qc && qc.value.toLowerCase() !== hex.toLowerCase()) qc.value = hex;
  saveStateDebounced();

  const sw = $('#spacesSwatch');
  if(sw) sw.style.background = hex;
  const hx = $('#spacesHex');
  if(hx) hx.textContent = hex.toUpperCase();

  updateSpaces();
}

function updateSpaces(){
  spacesUpdating = true;
  try{
    const c = CL.current;
    const hsl   = rgbToHsl(c);
    const hsv   = rgbToHsv(c);
    const cmyk  = rgbToCmyk(c);
    const lab   = rgbToLab(c);
    const oklab = rgbToOklab(c);
    const oklch = oklabToOklch(oklab);

    // Never write to the space the color was last set from. This is what
    // keeps the slider you just dragged exactly where you left it, instead
    // of snapping to the (slightly different) value that RGB round-trips to.
    const skip = CL.sourceSpace ? (CL.sourceSpace + '-') : null;
    const setIf = (id, v) => {
      if(skip && id.startsWith(skip)) return;
      setSlider(id, v);
    };

    // --- RGB ---------------------------------------------------------
    setIf('sp-rgb-R', c.r); setIf('sp-rgb-G', c.g); setIf('sp-rgb-B', c.b);

    // --- HSL / HSV ---------------------------------------------------
    // Hue and saturation are undefined for grays, black, white. Writing
    // them blindly would erase the user's intent every time the color
    // passed through a neutral value.
    const hslChromatic = hsl.s >= 0.5 && hsl.l > 0.001 && hsl.l < 0.999;
    const hsvChromatic = hsv.s >= 0.5 && hsv.v > 0.001;
    setIf('sp-hsl-L', hsl.l);
    if(hslChromatic){ setIf('sp-hsl-H', hsl.h); setIf('sp-hsl-S', hsl.s); }
    setIf('sp-hsv-V', hsv.v);
    if(hsvChromatic){ setIf('sp-hsv-H', hsv.h); setIf('sp-hsv-S', hsv.s); }

    // --- CMYK --------------------------------------------------------
    setIf('sp-cmyk-C', cmyk.c); setIf('sp-cmyk-M', cmyk.m);
    setIf('sp-cmyk-Y', cmyk.y); setIf('sp-cmyk-K', cmyk.k);

    // --- CIELAB ------------------------------------------------------
    setIf('sp-lab-L', lab.L);
    if(lab.L > 0.5){ setIf('sp-lab-a', lab.a); setIf('sp-lab-b', lab.b); }

    // --- OKLab / OKLCH -----------------------------------------------
    setIf('sp-oklab-L', oklab.L);
    if(oklab.L > 0.002){ setIf('sp-oklab-a', oklab.a); setIf('sp-oklab-b', oklab.b); }
    setIf('sp-oklch-L', oklch.L);
    if(oklch.C >= 0.0005 && oklch.L > 0.002 && oklch.L < 0.998){
      setIf('sp-oklch-C', oklch.C); setIf('sp-oklch-H', oklch.H);
    }

    const sw = $('#spacesSwatch');
    if(sw) sw.style.background = rgbToHex(c);
    const hx = $('#spacesHex');
    if(hx) hx.textContent = rgbToHex(c).toUpperCase();
  } finally {
    spacesUpdating = false;
  }
}

function initSpaces(){
  buildSpaces();
  $('#spacesRandom').onclick = ()=>{ pickerApplyHex(rgbToHex(randomRGB())); };
  updateSpaces();
}

/* =========================================================================
   SECTION 18 — COLOR MATH
   ========================================================================= */
function applyMathOp(op, a, b){
  const ch = (x,y,fn) => clamp(Math.round(fn(x,y)),0,255);
  switch(op){
    case 'add':        return { r:ch(a.r,b.r,(x,y)=>x+y), g:ch(a.g,b.g,(x,y)=>x+y), b:ch(a.b,b.b,(x,y)=>x+y) };
    case 'subtract':   return { r:ch(a.r,b.r,(x,y)=>x-y), g:ch(a.g,b.g,(x,y)=>x-y), b:ch(a.b,b.b,(x,y)=>x-y) };
    case 'multiply':   return { r:ch(a.r,b.r,(x,y)=>x*y/255), g:ch(a.g,b.g,(x,y)=>x*y/255), b:ch(a.b,b.b,(x,y)=>x*y/255) };
    case 'average':    return { r:ch(a.r,b.r,(x,y)=>(x+y)/2), g:ch(a.g,b.g,(x,y)=>(x+y)/2), b:ch(a.b,b.b,(x,y)=>(x+y)/2) };
    case 'difference': return { r:ch(a.r,b.r,(x,y)=>Math.abs(x-y)), g:ch(a.g,b.g,(x,y)=>Math.abs(x-y)), b:ch(a.b,b.b,(x,y)=>Math.abs(x-y)) };
    case 'invert':     return { r:255-a.r, g:255-a.g, b:255-a.b };
    case 'screen':     return { r:ch(a.r,b.r,(x,y)=>255-(255-x)*(255-y)/255), g:ch(a.g,b.g,(x,y)=>255-(255-x)*(255-y)/255), b:ch(a.b,b.b,(x,y)=>255-(255-x)*(255-y)/255) };
    case 'overlay':    return { r:ch(a.r,b.r,overlayF), g:ch(a.g,b.g,overlayF), b:ch(a.b,b.b,overlayF) };
    case 'darken':     return { r:Math.min(a.r,b.r), g:Math.min(a.g,b.g), b:Math.min(a.b,b.b) };
    case 'lighten':    return { r:Math.max(a.r,b.r), g:Math.max(a.g,b.g), b:Math.max(a.b,b.b) };
    case 'exclusion':  return { r:ch(a.r,b.r,(x,y)=>x+y-2*x*y/255), g:ch(a.g,b.g,(x,y)=>x+y-2*x*y/255), b:ch(a.b,b.b,(x,y)=>x+y-2*x*y/255) };
    default: return a;
  }
}
function overlayF(x,y){
  const b = y/255;
  const xr = x/255;
  return b <= 0.5 ? 2*xr*b*255 : (1 - 2*(1-xr)*(1-b))*255;
}
const MATH_FORMULAS = {
  add:'R = A.r + B.r', subtract:'R = A.r − B.r', multiply:'R = A.r × B.r / 255',
  average:'R = (A.r + B.r) / 2', difference:'R = |A.r − B.r|', invert:'R = 255 − A.r',
  screen:'R = 255 − (255 − A.r)(255 − B.r) / 255',
  overlay:'R = B.r < 0.5 ? 2·A.r·B.r : 1 − 2(1−A.r)(1−B.r)',
  darken:'R = min(A.r, B.r)', lighten:'R = max(A.r, B.r)',
  exclusion:'R = A.r + B.r − 2·A.r·B.r / 255'
};
function renderMath(){
  const a = CL.math.a, b = CL.math.b, op = CL.math.op;
  $('#mathSwatchA').style.background = rgbToHex(a);
  $('#mathSwatchB').style.background = rgbToHex(b);
  $('#mathHexA').textContent = rgbToHex(a).toUpperCase();
  $('#mathHexB').textContent = rgbToHex(b).toUpperCase();
  $('#mathOp').value = op;

  const result = applyMathOp(op, a, b);
  $('#mathResult').style.background = rgbToHex(result);
  $('#mathResultHex').textContent = rgbToHex(result).toUpperCase() + '  rgb(' + result.r + ', ' + result.g + ', ' + result.b + ')';

  const f = [];
  f.push('Color A  rgb(' + a.r + ', ' + a.g + ', ' + a.b + ')');
  f.push('Color B  rgb(' + b.r + ', ' + b.g + ', ' + b.b + ')');
  f.push('');
  f.push(MATH_FORMULAS[op] || '');
  f.push('');
  if(op === 'invert'){
    f.push('R = 255 − ' + a.r + ' = ' + result.r);
    f.push('G = 255 − ' + a.g + ' = ' + result.g);
    f.push('B = 255 − ' + a.b + ' = ' + result.b);
  } else if(op === 'add'){
    f.push('R = ' + a.r + ' + ' + b.r + ' = ' + result.r + (a.r+b.r > 255 ? '  (clamped to 255)' : ''));
    f.push('G = ' + a.g + ' + ' + b.g + ' = ' + result.g + (a.g+b.g > 255 ? '  (clamped to 255)' : ''));
    f.push('B = ' + a.b + ' + ' + b.b + ' = ' + result.b + (a.b+b.b > 255 ? '  (clamped to 255)' : ''));
  } else if(op === 'subtract'){
    f.push('R = ' + a.r + ' − ' + b.r + ' = ' + result.r + (a.r-b.r < 0 ? '  (clamped to 0)' : ''));
    f.push('G = ' + a.g + ' − ' + b.g + ' = ' + result.g + (a.g-b.g < 0 ? '  (clamped to 0)' : ''));
    f.push('B = ' + a.b + ' − ' + b.b + ' = ' + result.b + (a.b-b.b < 0 ? '  (clamped to 0)' : ''));
  } else if(op === 'difference'){
    f.push('R = |' + a.r + ' − ' + b.r + '| = ' + result.r);
    f.push('G = |' + a.g + ' − ' + b.g + '| = ' + result.g);
    f.push('B = |' + a.b + ' − ' + b.b + '| = ' + result.b);
  } else if(op === 'multiply'){
    f.push('R = ' + a.r + ' × ' + b.r + ' / 255 = ' + result.r);
    f.push('G = ' + a.g + ' × ' + b.g + ' / 255 = ' + result.g);
    f.push('B = ' + a.b + ' × ' + b.b + ' / 255 = ' + result.b);
  } else if(op === 'average'){
    f.push('R = (' + a.r + ' + ' + b.r + ') / 2 = ' + result.r);
    f.push('G = (' + a.g + ' + ' + b.g + ') / 2 = ' + result.g);
    f.push('B = (' + a.b + ' + ' + b.b + ') / 2 = ' + result.b);
  } else if(op === 'darken' || op === 'lighten'){
    const fn = op === 'darken' ? 'min' : 'max';
    f.push('R = ' + fn + '(' + a.r + ', ' + b.r + ') = ' + result.r);
    f.push('G = ' + fn + '(' + a.g + ', ' + b.g + ') = ' + result.g);
    f.push('B = ' + fn + '(' + a.b + ', ' + b.b + ') = ' + result.b);
  } else {
    f.push('R → ' + result.r);
    f.push('G → ' + result.g);
    f.push('B → ' + result.b);
  }
  f.push('');
  f.push('Result  <span class="res">' + rgbToHex(result).toUpperCase() + '</span>');
  $('#mathFormula').innerHTML = f.join('\n');
}
function initMath(){
  $('#mathOp').onchange = e => { CL.math.op = e.target.value; renderMath(); };
  $('#mathSwatchA').onclick = ()=>openColorModal(rgbToHex(CL.math.a));
  $('#mathSwatchB').onclick = ()=>openColorModal(rgbToHex(CL.math.b));
  $('#mathToPicker').onclick = ()=>{
    const r = applyMathOp(CL.math.op, CL.math.a, CL.math.b);
    pickerApplyHex(rgbToHex(r)); setCurrent(r); showTab('picker');
  };
  $('#mathToPalette').onclick = ()=>{
    const r = applyMathOp(CL.math.op, CL.math.a, CL.math.b);
    addToPalette(rgbToHex(r));
  };
  $('#mathSwap').onclick = ()=>{ const t = CL.math.a; CL.math.a = CL.math.b; CL.math.b = t; renderMath(); };
  renderMath();
}

function renderContrast(){
  const fg = CL.contrast.fg, bg = CL.contrast.bg;
  const ratio = contrastRatio(fg, bg);
  $('#contrastFG').style.background = rgbToHex(fg);
  $('#contrastBG').style.background = rgbToHex(bg);
  $('#contrastFGHex').textContent = rgbToHex(fg).toUpperCase();
  $('#contrastBGHex').textContent = rgbToHex(bg).toUpperCase();
  $('#contrastRatio').textContent = ratio.toFixed(2) + ' : 1';

  const checks = [
    ['AA normal (4.5:1)', ratio >= 4.5],
    ['AA large (3:1)',    ratio >= 3],
    ['AAA normal (7:1)',  ratio >= 7],
    ['AAA large (4.5:1)', ratio >= 4.5]
  ];
  $('#contrastBadges').innerHTML = checks.map(([label, pass])=>
    '<span class="badge ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '✓ ' : '✕ ') + label + '</span>'
  ).join('');

  $('#contrastExplain').textContent =
    'Relative luminance: FG ' + round(relLum(fg),3) + ', BG ' + round(relLum(bg),3) +
    '  →  (L1 + 0.05) / (L2 + 0.05) = ' + ratio.toFixed(2);

  const fx = rgbToHex(fg), bx = rgbToHex(bg);
  $('#contrastPreview').style.background = bx;
  $('#contrastPreview').innerHTML =
    '<p style="color:' + fx + ';font-size:14px;margin:0 0 10px">Normal text — 14px. The quick brown fox jumps over the lazy dog.</p>' +
    '<p style="color:' + fx + ';font-size:20px;font-weight:700;margin:0 0 10px">Large bold text — 20px</p>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button style="background:' + fx + ';color:' + bx + ';border:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:default">Primary button</button>' +
      '<button style="background:transparent;color:' + fx + ';border:2px solid ' + fx + ';border-radius:8px;padding:9px 16px;font-weight:600;cursor:default">Outline</button>' +
      '<span style="display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid ' + fx + ';color:' + fx + '">Badge</span>' +
    '</div>' +
    '<div style="margin-top:14px;color:' + fx + '">' +
      '<div style="font-size:11px;opacity:.9">Disabled / hint text at 80% opacity</div>' +
      '<div style="margin-top:10px;height:2px;background:' + fx + ';opacity:.6"></div>' +
      '<div style="margin-top:8px;display:inline-block;padding:6px 12px;border:2px dashed ' + fx + ';border-radius:6px">Focus indicator demo</div>' +
    '</div>';
}
function findAccessibleFG(fg, bg, target){
  // Move fg toward white or black until the target ratio is reached.
  const lumBG = relLum(bg);
  const goLight = lumBG < 0.18;   // dark background → lighten text
  let best = { r:fg.r, g:fg.g, b:fg.b };
  const steps = 200;
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    const c = goLight
      ? { r: lerp(fg.r, 255, t), g: lerp(fg.g, 255, t), b: lerp(fg.b, 255, t) }
      : { r: lerp(fg.r, 0, t),   g: lerp(fg.g, 0, t),   b: lerp(fg.b, 0, t) };
    best = { r:Math.round(c.r), g:Math.round(c.g), b:Math.round(c.b) };
    if(contrastRatio(best, bg) >= target) break;
  }
  return best;
}
function initContrast(){
  CL.contrast.fg = hexToRgb('#FFFFFF');
  CL.contrast.bg = hexToRgb('#101216');
  $('#contrastFG').onclick = ()=>openColorModal(rgbToHex(CL.contrast.fg));
  $('#contrastBG').onclick = ()=>openColorModal(rgbToHex(CL.contrast.bg));
  $('#contrastSwap').onclick = ()=>{ const t = CL.contrast.fg; CL.contrast.fg = CL.contrast.bg; CL.contrast.bg = t; renderContrast(); };
  $('#contrastTarget').onchange = ()=>{ CL.contrast.target = parseFloat($('#contrastTarget').value); };
  $('#contrastFix').addEventListener('input', e=>{
    const amt = e.target.value/100;
    $('#contrastFixLabel').textContent = e.target.value + '%';
    const target = parseFloat($('#contrastTarget').value);
    const base = CL.contrast._origFG || CL.contrast.fg;
    if(!CL.contrast._origFG) CL.contrast._origFG = { r:CL.contrast.fg.r, g:CL.contrast.fg.g, b:CL.contrast.fg.b };
    const goal = findAccessibleFG(base, CL.contrast.bg, target);
    CL.contrast.fg = {
      r: Math.round(lerp(base.r, goal.r, amt)),
      g: Math.round(lerp(base.g, goal.g, amt)),
      b: Math.round(lerp(base.b, goal.b, amt))
    };
    renderContrast();
  });
  $('#contrastReset').onclick = ()=>{
    if(CL.contrast._origFG){ CL.contrast.fg = { r:CL.contrast._origFG.r, g:CL.contrast._origFG.g, b:CL.contrast._origFG.b }; }
    CL.contrast._origFG = null;
    $('#contrastFix').value = 0;
    $('#contrastFixLabel').textContent = '0%';
    renderContrast();
  };
  renderContrast();
}

function renderPerception(){
  const c = CL.current;
  const hex = rgbToHex(c);
  const p = $('#percHex'); if(p) p.textContent = hex.toUpperCase();

  // 1. Same color different backgrounds
  const bgs = ['#000000', '#ffffff', '#ff0000', '#00ff00', '#0000ff', '#ffcc00', '#00ccff', '#808080'];
  const host = $('#percBackgrounds');
  if(host){
    host.innerHTML = bgs.map(bg =>
      '<div class="pbox" style="background:' + bg + '"><div class="inner" data-color="' + hex + '" style="background:' + hex + '"></div></div>'
    ).join('');
  }

  // 2. Simultaneous contrast
  const host2 = $('#percSimultaneous');
  if(host2){
    const pairs = [['#111111','#eeeeee'],['#ff2222','#22ff22'],['#2222ff','#ffff22'],['#000000','#ffffff']];
    host2.innerHTML = pairs.map(([a,b])=>{
      const dark = '#3a3a3a';
      return '<div class="pbox" style="background:' + a + ';padding:22px">' +
             '<div class="inner" style="width:56px;height:56px;background:' + dark + '"></div></div>' +
             '<div class="pbox" style="background:' + b + ';padding:22px">' +
             '<div class="inner" style="width:56px;height:56px;background:' + dark + '"></div></div>';
    }).join('');
  }

  // 3. Afterimage
  const afterSwatch = $('#afterSwatch');
  if(afterSwatch) afterSwatch.style.background = hex;

  // 4. Color context
  const host4 = $('#percContext');
  if(host4){
    const palettes = [
      ['#0b0d10','#1b1f27','#2c3340','#3d4655'],
      ['#fff5e6','#ffe0b3','#ffc266','#ffa31a'],
      ['#e6f7ff','#b3e6ff','#66ccff','#1a99e6'],
      ['#1a0b1f','#3d1a4d','#6b2d85','#a24dc4']
    ];
    host4.innerHTML = palettes.map(pal=>{
      let strip = '<div class="context-strip">';

function renderPalette(){
  ensurePalette();
  const p = activePalette();
  const grid = $('#paletteGrid'); if(!grid) return;
  grid.innerHTML = p.colors.map((item, i) =>
    '<div class="palette-item' + (item.locked ? ' locked' : '') + '" draggable="true" data-index="' + i + '">' +
      '<div class="sw" data-color="' + item.hex + '" style="background:' + item.hex + '"></div>' +
      '<div class="hx">' + item.hex.toUpperCase() + '</div>' +
      '<div class="tools" data-no-modal="1">' +
        '<button data-act="lock" title="Lock">' + (item.locked ? '🔒' : '🔓') + '</button>' +
        '<button data-act="dup" title="Duplicate">⧉</button>' +
        '<button data-act="edit" title="Send to picker">✎</button>' +
        '<button data-act="del" title="Remove">✕</button>' +
      '</div>' +
    '</div>'
  ).join('');

  // tool buttons
  $$('#paletteGrid .tools button').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const idx = +btn.closest('.palette-item').dataset.index;
      const item = p.colors[idx];
      const act = btn.dataset.act;
      if(act === 'lock'){ item.locked = !item.locked; }
      else if(act === 'dup'){ p.colors.splice(idx+1, 0, { hex:item.hex, locked:false }); }
      else if(act === 'del'){ p.colors.splice(idx,1); }
      else if(act === 'edit'){ pickerApplyHex(item.hex); showTab('picker'); return; }
      renderPalette(); saveStateDebounced();
    };
  });

  // drag & drop
  let dragIndex = null;
  $$('#paletteGrid .palette-item').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      dragIndex = +el.dataset.index;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', String(dragIndex)); }catch(err){}
    });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('dragover'));
    el.addEventListener('drop', e=>{
      e.preventDefault(); el.classList.remove('dragover');
      const to = +el.dataset.index;
      if(dragIndex === null || dragIndex === to) return;
      const moved = p.colors.splice(dragIndex, 1)[0];
      p.colors.splice(to, 0, moved);
      dragIndex = null;
      renderPalette(); saveStateDebounced();
    });
  });
}
function paletteExport(kind){

function randomRGB(){
  return { r: Math.floor(Math.random()*256), g: Math.floor(Math.random()*256), b: Math.floor(Math.random()*256) };
}
function generatePalette(method, count, seed){
  const base = seed || CL.current;
  const hsl = rgbToHsl(base);
  const out = [];
  function push(c){ out.push({ hex: rgbToHex(c), locked:false }); }
  switch(method){
    case 'random':
      for(let i=0;i<count;i++) push(randomRGB());
      break;
    case 'complementary': {
      const hues = [hsl.h, (hsl.h+180)%360];
      for(let i=0;i<count;i++){
        const h = hues[i % 2];
        push(hslToRgb(h, clamp(hsl.s + (Math.random()*30-15), 10, 100), clamp(25 + (i/count)*55, 10, 90)));
      }
      break;
    }
    case 'analogous': {
      for(let i=0;i<count;i++){
        const off = (i - (count-1)/2) * 22;
        push(hslToRgb(((hsl.h+off)%360+360)%360, hsl.s, hsl.l));
      }
      break;
    }
    case 'triadic': {
      const hues = [hsl.h, (hsl.h+120)%360, (hsl.h+240)%360];
      for(let i=0;i<count;i++) push(hslToRgb(hues[i%3], hsl.s, clamp(30 + (i/count)*50, 10, 90)));
      break;
    }
    case 'monochromatic': {
      for(let i=0;i<count;i++) push(hslToRgb(hsl.h, hsl.s, 12 + (i/(count-1))*78));
      break;
    }
    case 'tetradic': {
      const hues = [hsl.h, (hsl.h+60)%360, (hsl.h+180)%360, (hsl.h+240)%360];
      for(let i=0;i<count;i++) push(hslToRgb(hues[i%4], hsl.s, clamp(28 + (i/count)*52, 10, 90)));
      break;
    }
    case 'warm': {
      for(let i=0;i<count;i++){
        const h = 0 + Math.random()*70;
        push(hslToRgb(h, 55 + Math.random()*40, 30 + Math.random()*45));
      }
      break;
    }
    case 'cool': {
      for(let i=0;i<count;i++){
        const h = 160 + Math.random()*120;
        push(hslToRgb(h % 360, 40 + Math.random()*45, 30 + Math.random()*45));
      }
      break;
    }
    case 'highcontrast': {
      for(let i=0;i<count;i++){
        const l = (i % 2 === 0) ? 8 + Math.random()*12 : 82 + Math.random()*15;
        push(hslToRgb((hsl.h + i*47)%360, 70 + Math.random()*30, l));
      }
      break;
    }
    case 'lowcontrast': {
      for(let i=0;i<count;i++){
        push(hslToRgb(((hsl.h + i*12)%360+360)%360, 18 + Math.random()*18, 48 + Math.random()*14));
      }
      break;
    }
  }
  return out.slice(0, count);
}

function shuffleArray(a){
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
}
function makeSortColors(){
  CL.sort.colors = [];
  for(let i=0;i<26;i++) CL.sort.colors.push(randomRGB());
  layoutSort();

function layoutSort(){
  const stage = $('#sortStage'); if(!stage) return;
  const W = stage.clientWidth || 600;
  const n = CL.sort.colors.length;
  const gap = 2;
  const itemW = Math.max(10, Math.min(30, (W - 20)/n - gap));
  stage.innerHTML = CL.sort.colors.map((c,i)=>{
    const d = document.createElement('div');
    d.className = 'sort-item';
    d.style.background = rgbToHex(c);
    d.style.width = itemW + 'px';
    d.style.transform = 'translateX(' + (i*(itemW+gap) + 10) + 'px)';
    d.dataset.color = rgbToHex(c);
    return d.outerHTML;
  }).join('');
  // apply sort immediately after layout
  requestAnimationFrame(sortColors);
}
function sortColors(){
  const stage = $('#sortStage'); if(!stage) return;
  const items = $$('.sort-item', stage);
  const method = CL.sort.method;
  const arr = CL.sort.colors.slice();
  const keyFn = {
    hue: c => rgbToHsl(c).h,
    sat: c => rgbToHsl(c).s,
    bright: c => Math.max(c.r,c.g,c.b),
    light: c => rgbToHsl(c).l,
    r: c => c.r,
    g: c => c.g,
    b: c => c.b,
    lum: c => perceivedBrightness(c),
    okl: c => rgbToOklab(c).L
  }[method] || (c => rgbToHsl(c).h);
  arr.sort((a,b)=> keyFn(a) - keyFn(b));

  const W = stage.clientWidth || 600;
  const n = arr.length;
  const gap = 2;
  const itemW = Math.max(10, Math.min(30, (W - 20)/n - gap));

  // Map each color to its new index. Because duplicates are possible we
  // re-render positions directly by rebuilding the transform list.
  const oldNodes = items.slice();
  const used = new Array(oldNodes.length).fill(false);
  arr.forEach((c, newIndex)=>{
    const hex = rgbToHex(c);
    // find an unused node with this color
    let found = -1;
    for(let i=0;i<oldNodes.length;i++){
      if(!used[i] && oldNodes[i].dataset.color === hex){ found = i; break; }
    }
    if(found < 0){ for(let i=0;i<oldNodes.length;i++){ if(!used[i]){ found = i; break; } } }
    used[found] = true;
    const node = oldNodes[found];
    node.style.transform = 'translateX(' + (newIndex*(itemW+gap) + 10) + 'px)';
  });
  CL.sort.colors = arr;
}
function generateAtDistance(from, space, amount){
  // Move away from the color in the chosen space by a normalised amount.
  if(space === 'rgb'){
    const dir = { r: Math.random()*2-1, g: Math.random()*2-1, b: Math.random()*2-1 };
    const len = Math.sqrt(dir.r*dir.r + dir.g*dir.g + dir.b*dir.b) || 1;
    const d = amount * 4.42 / 100 * 255;   // 100 → max RGB distance
    return {
      r: clamp(Math.round(from.r + dir.r/len*d),0,255),
      g: clamp(Math.round(from.g + dir.g/len*d),0,255),
      b: clamp(Math.round(from.b + dir.b/len*d),0,255)
    };
  } else if(space === 'lab'){
    const A = rgbToLab(from);
    const ang = Math.random()*Math.PI*2;
    const d = amount/100 * 100;
    return labToRgb({ L: clamp(A.L + Math.cos(ang)*d*0.5, 0, 100),
                      a: A.a + Math.cos(ang)*d*0.6,
                      b: A.b + Math.sin(ang)*d*0.6 });
  } else {
    const A = rgbToOklab(from);
    const ang = Math.random()*Math.PI*2;
    const d = amount/100 * 0.5;
    return oklabToRgb({ L: clamp(A.L + Math.cos(ang)*d*0.5, 0, 1),
                        a: A.a + Math.cos(ang)*d,
                        b: A.b + Math.sin(ang)*d });
  }
}
function renderDistance(){
  const a = CL.distance.a, b = CL.distance.b;
  const elA = $('#distA'), elB = $('#distB');
  if(!elA) return;
  elA.style.background = rgbToHex(a);
  elB.style.background = rgbToHex(b);
  $('#distAHex').textContent = rgbToHex(a).toUpperCase();
  $('#distBHex').textContent = rgbToHex(b).toUpperCase();
  const dr = distRGB(a,b), dl = distLab(a,b), do_ = distOklab(a,b);
  const dE = Math.sqrt(dl*dl); // CIE76 == euclidean in Lab
  $('#distOut').innerHTML =
    'RGB distance\n  ' + round(dr,1) + '\n\n' +
    'CIELAB ΔE (CIE76)\n  ' + round(dE,1) + '\n\n' +
    'OKLab distance\n  ' + round(do_,3) + '\n\n' +
    'Weighted RGB (redmean)\n  ' + round(redmeanDistance(a,b),1);
}
function redmeanDistance(a,b){
  const rmean = (a.r + b.r)/2;
  const dr = a.r-b.r, dg = a.g-b.g, db = a.b-b.b;
  return Math.sqrt((2 + rmean/256)*dr*dr + 4*dg*dg + (2 + (255-rmean)/256)*db*db);
}
function renderCompare(){

    ['HSV', c => { const h = rgbToHsv(c); return round(h.h) + '°, ' + round(h.s) + '%, ' + round(h.v) + '%'; }],
    ['Hue', c => round(rgbToHsl(c).h) + '°'],

    ['Luminance', c => round(relLum(c),4)],
    ['Brightness', c => round(perceivedBrightness(c))],
    ['OKLab L', c => round(rgbToOklab(c).L,3)]
  ];
  rows.forEach(([label, fn])=>{
    html += '<tr><td>' + label + '</td>' + colors.map(h=>'<td class="mono">' + fn(hexToRgb(h)) + '</td>').join('') + '</tr>';
  });

  ).join('') + '</tr>';
  html += '<tr><td>Distance vs first (OKLab)</td>' + colors.map((h,i)=>
    '<td class="mono">' + (i===0 ? '—' : round(distOklab(hexToRgb(colors[0]), hexToRgb(h)),3)) + '</td>'
  ).join('') + '</tr>';
  html += '</table>';
  $('#cmpTable').innerHTML = html;
}

const VISION_MATRICES = {
  protanopia:   [0.152286,1.052583,-0.204868, 0.114503,0.786281,0.099216, -0.003882,-0.048116,1.051998],
  deuteranopia: [0.367322,0.860646,-0.227968, 0.280085,0.672501,0.047413, -0.011820,0.042940,0.968881],
  tritanopia:   [1.255528,-0.076749,-0.178779, -0.078411,0.930809,0.147602, 0.004733,0.691367,0.303900],
  achromatopsia:[0.2126,0.7152,0.0722, 0.2126,0.7152,0.0722, 0.2126,0.7152,0.0722]
};
let imageLoaded = false;

function drawImageCanvases(){
  if(!imageLoaded) return;
  const src = $('#imageCanvas');
  const nrm = $('#visionNormal');
  const out = $('#visionOut');
  if(nrm){
    const ctx = nrm.getContext('2d');
    nrm.width = src.width; nrm.height = src.height;
    ctx.drawImage(src, 0, 0);
  }
  applyVision();
}
function applyVision(){
  const src = $('#imageCanvas');
  const out = $('#visionOut');
  if(!out || !imageLoaded) return;
  out.width = src.width; out.height = src.height;
  const sctx = src.getContext('2d');
  const octx = out.getContext('2d');
  const img = sctx.getImageData(0,0,src.width,src.height);
  const d = img.data;
  const type = $('#visionType').value;
  const sev = (+$('#visionSeverity').value)/100;
  const m = VISION_MATRICES[type];
  for(let i=0;i<d.length;i+=4){
    const r = srgbToLinear(d[i]), g = srgbToLinear(d[i+1]), b = srgbToLinear(d[i+2]);
    const nr = m[0]*r + m[1]*g + m[2]*b;
    const ng = m[3]*r + m[4]*g + m[5]*b;
    const nb = m[6]*r + m[7]*g + m[8]*b;
    d[i]   = linearToSrgb(lerp(r, nr, sev));
    d[i+1] = linearToSrgb(lerp(g, ng, sev));
    d[i+2] = linearToSrgb(lerp(b, nb, sev));
  }
  octx.putImageData(img, 0, 0);
}
function loadImageToCanvas(img){
  const cv = $('#imageCanvas');
  const maxW = 480;
  const scale = Math.min(1, maxW / img.width);
  cv.width = Math.max(1, Math.round(img.width * scale));
  cv.height = Math.max(1, Math.round(img.height * scale));
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  imageLoaded = true;
  analyzeImage();
  drawImageCanvases();
}
function analyzeImage(){
  const cv = $('#imageCanvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const data = ctx.getImageData(0,0,W,H).data;

  // ---- bucket quantisation (4 bits per channel) ----
  const buckets = new Map();
  let sumR=0,sumG=0,sumB=0,count=0;
  let brightest = {r:0,g:0,b:0}, darkest = {r:255,g:255,b:255}, brightL=-1, darkL=2;
  const hueHist = new Array(12).fill(0);
  const satHist = new Array(10).fill(0);

  const step = Math.max(1, Math.floor(Math.sqrt((W*H)/20000)));
  for(let y=0;y<H;y+=step){
    for(let x=0;x<W;x+=step){
      const i = (y*W + x)*4;
      const r = data[i], g = data[i+1], b = data[i+2];
      sumR += r; sumG += g; sumB += b; count++;
      const key = ((r>>4)<<8) | ((g>>4)<<4) | (b>>4);
      let e = buckets.get(key);
      if(!e){ e = { r:0,g:0,b:0,n:0 }; buckets.set(key, e); }
      e.r += r; e.g += g; e.b += b; e.n++;
      const lum = relLum({r:r,g:g,b:b});
      if(lum > brightL){ brightL = lum; brightest = {r:r,g:g,b:b}; }
      if(lum < darkL){ darkL = lum; darkest = {r:r,g:g,b:b}; }
      const hsv = rgbToHsv({r:r,g:g,b:b});
      if(hsv.s > 12 && hsv.v > 12){
        hueHist[Math.min(11, Math.floor(hsv.h/30))]++;
      }
      satHist[Math.min(9, Math.floor(hsv.s/10))]++;
    }
  }
  const arr = Array.from(buckets.values())
    .map(e => ({ r: Math.round(e.r/e.n), g: Math.round(e.g/e.n), b: Math.round(e.b/e.n), n: e.n }))
    .sort((a,b)=> b.n - a.n);

  // dedupe by distance
  const dominant = [];
  for(const c of arr){
    if(dominant.length >= 10) break;
    if(dominant.every(d => distRGB(d, c) > 42)) dominant.push(c);
  }
  while(dominant.length < 6 && arr.length > dominant.length){
    const c = arr[dominant.length];
    if(c) dominant.push(c); else break;
  }

  const host = $('#imgDominant');
  if(host){
    host.innerHTML = dominant.map(c =>
      '<div class="palette-item"><div class="sw" data-color="' + rgbToHex(c) + '" style="background:' + rgbToHex(c) + ';height:56px"></div>' +
      '<div class="hx">' + rgbToHex(c).toUpperCase() + '</div>' +
      '<div class="tools" data-no-modal="1"><button data-act="use">→ Picker</button><button data-act="add">+Palette</button></div></div>'
    ).join('');
    $$('#imgDominant button').forEach(b=>{
      b.onclick = ()=>{
        const hex = b.closest('.palette-item').querySelector('.sw').dataset.color;
        if(b.dataset.act === 'use'){ pickerApplyHex(hex); showTab('picker'); }
        else addToPalette(hex);
      };
    });
  }

  const avg = count ? { r: Math.round(sumR/count), g: Math.round(sumG/count), b: Math.round(sumB/count) } : {r:0,g:0,b:0};
  const summary = $('#imgSummary');
  if(summary){
    summary.innerHTML =
      '<div class="row" style="margin-bottom:8px"><div class="swatch sm" data-color="' + rgbToHex(avg) + '" style="background:' + rgbToHex(avg) + '"></div>' +
      '<span class="hint">Average color — <span class="mono">' + rgbToHex(avg).toUpperCase() + '</span></span></div>' +
      '<div class="row" style="margin-bottom:8px"><div class="swatch sm" data-color="' + rgbToHex(brightest) + '" style="background:' + rgbToHex(brightest) + '"></div>' +
      '<span class="hint">Brightest — <span class="mono">' + rgbToHex(brightest).toUpperCase() + '</span></span></div>' +
      '<div class="row"><div class="swatch sm" data-color="' + rgbToHex(darkest) + '" style="background:' + rgbToHex(darkest) + '"></div>' +
      '<span class="hint">Darkest — <span class="mono">' + rgbToHex(darkest).toUpperCase() + '</span></span></div>';
  }

  const hueHost = $('#imgHueHist');
  if(hueHost){
    const maxH = Math.max.apply(null, hueHist) || 1;
    hueHost.innerHTML = hueHist.map((v,i)=>{
      const col = rgbToHex(hsvToRgb(i*30 + 15, 90, 90));
      return '<div style="height:' + Math.max(2, v/maxH*100) + '%;background:' + col + '" title="' + (i*30) + '°–' + (i*30+30) + '°: ' + v + '"></div>';
    }).join('');
  }
  const satHost = $('#imgSatHist');
  if(satHost){
    const maxS = Math.max.apply(null, satHist) || 1;
    satHost.innerHTML = satHist.map((v,i)=>{
      const l = 20 + i*7;
      return '<div style="height:' + Math.max(2, v/maxS*100) + '%;background:rgb(' + l + ',' + l + ',' + l + ')" title="' + (i*10) + '–' + (i*10+10) + '%: ' + v + '"></div>';
    }).join('');
  }
}

let gradSelected = 0;
let gradRAF = null;
function gradColorAt(t){
  const stops = CL.grad.stops.slice().sort((a,b)=>a.p-b.p);
  if(!stops.length) return { r:0,g:0,b:0 };
  if(t <= stops[0].p) return stops[0].color;
  if(t >= stops[stops.length-1].p) return stops[stops.length-1].color;
  for(let i=0;i<stops.length-1;i++){
    const a = stops[i], b = stops[i+1];
    if(t >= a.p && t <= b.p){
      const local = (b.p - a.p) < 1e-6 ? 0 : (t - a.p)/(b.p - a.p);
      return mixColors(a.color, b.color, local, CL.grad.mode);
    }
  }
  return stops[stops.length-1].color;
}
function renderGradient(){
  if(gradRAF) cancelAnimationFrame(gradRAF);
  gradRAF = requestAnimationFrame(()=>{
    // bar
    const bar = $('#gradBar');
    if(bar){
      const ctx = bar.getContext('2d');
      const W = bar.width, H = bar.height;
      const img = ctx.createImageData(W, 1);
      for(let x=0;x<W;x++){
        const c = gradColorAt(x/(W-1));
        img.data[x*4] = c.r; img.data[x*4+1] = c.g; img.data[x*4+2] = c.b; img.data[x*4+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      // stretch vertically
      const tmp = document.createElement('canvas');
      tmp.width = W; tmp.height = 1;
      tmp.getContext('2d').putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tmp, 0, 0, W, 1, 0, 0, W, H);
    }
    // handles
    const host = $('#gradStopHandles');
    if(host){
      host.innerHTML = CL.grad.stops.map((s,i)=>
        '<div class="grad-stop' + (i===gradSelected ? ' sel' : '') + '" data-i="' + i + '" ' +
        'style="left:' + (s.p*100) + '%;background:' + rgbToHex(s.color) + '"></div>'
      ).join('');
      $$('#gradStopHandles .grad-stop').forEach(el=>{
        el.addEventListener('pointerdown', e=>{
          e.preventDefault();
          gradSelected = +el.dataset.i;
          const track = $('#gradTrack');
          const rect = track.getBoundingClientRect();
          const move = ev=>{
            const p = clamp((ev.clientX - rect.left)/rect.width, 0, 1);
            CL.grad.stops[gradSelected].p = p;
            renderGradient();
          };
          const up = ()=>{
            document.removeEventListener('pointermove', move);
            document.removeEventListener('pointerup', up);
            CL.grad.stops.sort((a,b)=>a.p-b.p);
            renderGradient();
          };
          document.addEventListener('pointermove', move);
          document.addEventListener('pointerup', up);
          renderGradient();
        });
      });
    }
    // selected stop color input
    const sc = $('#gradStopColor');
    if(sc && CL.grad.stops[gradSelected]) sc.value = rgbToHex(CL.grad.stops[gradSelected].color);

    // preview
    const pv = $('#gradPreview');
    if(pv){
      const ctx = pv.getContext('2d');
      const W = pv.width, H = pv.height;
      const img = ctx.createImageData(W, H);
      const d = img.data;
      const ang = (CL.grad.angle) * Math.PI/180;
      const dx = Math.cos(ang), dy = Math.sin(ang);
      const cx = W/2, cy = H/2;
      const maxProj = Math.abs(dx)*W/2 + Math.abs(dy)*H/2;
      const maxR = Math.sqrt(W*W + H*H)/2;
      for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){
          let t;
          if(CL.grad.type === 'linear'){
            t = ((x-cx)*dx + (y-cy)*dy) / (2*maxProj) + 0.5;
          } else {
            t = Math.sqrt((x-cx)*(x-cx) + (y-cy)*(y-cy)) / maxR;
          }
          t = clamp(t,0,1);
          const c = gradColorAt(t);
          const i = (y*W+x)*4;
          d[i] = c.r; d[i+1] = c.g; d[i+2] = c.b; d[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // CSS
    const stopsCss = CL.grad.stops.slice().sort((a,b)=>a.p-b.p)
      .map(s => rgbToHex(s.color).toUpperCase() + ' ' + Math.round(s.p*100) + '%').join(', ');
    const css = CL.grad.type === 'linear'
      ? 'background: linear-gradient(' + CL.grad.angle + 'deg,\n  ' + stopsCss + '\n);'
      : 'background: radial-gradient(circle at 50% 50%,\n  ' + stopsCss + '\n);';
    const cssEl = $('#gradCSS');
    if(cssEl) cssEl.textContent = css + '\n\n/* interpolation mode: ' + CL.grad.mode + ' (approximate in CSS; this canvas is exact) */';
  });
}
function initGradients(){
  $('#gradType').onchange = e => { CL.grad.type = e.target.value; renderGradient(); };
  $('#gradMode').onchange = e => { CL.grad.mode = e.target.value; renderGradient(); };
  $('#gradAngle').addEventListener('input', e=>{

  let _gradJustDragged = 0;
  $('#gradTrack').addEventListener('click', e=>{

    if(Date.now() - _gradJustDragged < 250) return;   // suppress the click that follows a drag
    const r = e.currentTarget.getBoundingClientRect();
    const p = clamp((e.clientX - r.left)/r.width, 0, 1);
    const c = gradColorAt(p);
    CL.grad.stops.push({ p:p, color:c });
    CL.grad.stops.sort((a,b)=>a.p-b.p);
    gradSelected = CL.grad.stops.findIndex(s => s.p === p);

  $('#gradRemoveStop').onclick = ()=>{

  };
  $('#gradCopyCss').onclick = ()=>{
    const cssEl = $('#gradCSS');

function initConverter(){
  const inputs = [
    ['hex','HEX','#4A72E8'],
    ['rgb','RGB (r, g, b)','74, 114, 232'],
    ['hsl','HSL (h, s%, l%)','222, 77, 60'],
    ['hsv','HSV (h, s%, v%)','222, 68, 91'],
    ['cmyk','CMYK (c, m, y, k)','68, 51, 0, 9'],
    ['lab','CIELAB (L, a, b)','50, 10, -60'],
    ['oklab','OKLab (L, a, b)','0.55, -0.02, -0.20'],
    ['oklch','OKLCH (L, C, H)','0.55, 0.20, 264']
  ];
  let html = '';
  inputs.forEach(([id,label,ph])=>{
    html += '<div class="row" style="margin-bottom:10px">' +
      '<label style="min-width:150px;font-size:12px">' + label + '</label>' +
      '<input type="text" id="conv-' + id + '" value="" placeholder="' + ph + '" style="flex:1;min-width:120px">' +
      '</div>';
  });
  $('#convInputs').innerHTML = html;

  function parseNums(str){
    return String(str).split(/[^0-9.\-]+/).filter(s=>s !== '' && s !== '-').map(Number).filter(n=>!isNaN(n));
  }
  function applyFrom(id){
    const raw = $('#conv-' + id).value;
    let rgb = null;
    if(id === 'hex') rgb = hexToRgb(raw);
    else {
      const n = parseNums(raw);
      if(id === 'rgb' && n.length >= 3) rgb = { r:n[0], g:n[1], b:n[2] };
      else if(id === 'hsl' && n.length >= 3) rgb = hslToRgb(n[0], n[1], n[2]);
      else if(id === 'hsv' && n.length >= 3) rgb = hsvToRgb(n[0], n[1], n[2]);
      else if(id === 'cmyk' && n.length >= 4) rgb = cmykToRgb(n[0], n[1], n[2], n[3]);
      else if(id === 'lab' && n.length >= 3) rgb = labToRgb({ L:n[0], a:n[1], b:n[2] });
      else if(id === 'oklab' && n.length >= 3) rgb = oklabToRgb({ L:n[0], a:n[1], b:n[2] });
      else if(id === 'oklch' && n.length >= 3) rgb = oklabToRgb(oklchToOklab({ L:n[0], C:n[1], H:n[2] }));
    }
    if(!rgb) return;
    setCurrent(rgb);
    updatePickerUI();
    updateConverterOutputs();
  }
  inputs.forEach(([id])=>{
    const el = $('#conv-' + id);
    el.addEventListener('input', ()=>applyFrom(id));
    el.addEventListener('change', ()=>applyFrom(id));
  });

  window.updateConverterOutputs = function(){
    const c = CL.current;
    const hsl = rgbToHsl(c), hsv = rgbToHsv(c), cmyk = rgbToCmyk(c);
    const lab = rgbToLab(c), oklab = rgbToOklab(c), oklch = oklabToOklch(oklab);
    const set = (id, v) => { const el = $('#conv-' + id); if(el && document.activeElement !== el) el.value = v; };
    set('hex', rgbToHex(c).toUpperCase());
    set('rgb', c.r + ', ' + c.g + ', ' + c.b);
    set('hsl', round(hsl.h) + ', ' + round(hsl.s) + ', ' + round(hsl.l));
    set('hsv', round(hsv.h) + ', ' + round(hsv.s) + ', ' + round(hsv.v));
    set('cmyk', round(cmyk.c) + ', ' + round(cmyk.m) + ', ' + round(cmyk.y) + ', ' + round(cmyk.k));
    set('lab', round(lab.L,2) + ', ' + round(lab.a,2) + ', ' + round(lab.b,2));
    set('oklab', round(oklab.L,4) + ', ' + round(oklab.a,4) + ', ' + round(oklab.b,4));
    set('oklch', round(oklch.L,4) + ', ' + round(oklch.C,4) + ', ' + round(oklch.H,2));

    $('#convOutputs').innerHTML = colorInfoHTML(c, CL.alpha);
    $('#convSwatch').style.background = rgbToHex(c);
  };
  window.updateConverterOutputs();
}

      const tmp = document.createElement('canvas');
      tmp.width = W; tmp.height = 1;
      tmp.getContext('2d').putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tmp, 0, 0, W, 1, 0, 0, W, H);
    });
  }

  // --- two colors look similar ---
  const sim = $('#expSimilar');
  if(sim){
    sim.style.background = $('#expBg').value;
    sim.innerHTML =
      '<div style="display:flex;gap:30px;justify-content:center">' +
      '<div style="width:110px;height:110px;border-radius:12px;background:#4a72e8"></div>' +
      '<div style="width:110px;height:110px;border-radius:12px;background:#4a72e8"></div>' +
      '</div>' +
      '<div class="hint" style="text-align:center;margin-top:12px">Both squares are #4A72E8</div>';
  }

  // --- levels ramp ---
  updateLevelsRamp();

  // --- spinning wheel ---
  renderSpinSwatches();

  // --- formula ---
  if($('#expFormulaResult')) $('#expFormulaResult').style.background = rgbToHex(CL.current);

  // --- layers ---
  if(!CL._layers){
    CL._layers = [
      { color:'#ff5733', alpha:0.7, mode:'multiply' },
      { color:'#3357ff', alpha:0.6, mode:'screen' }
    ];
  }
  renderLayers();
}
function updateLevelsRamp(){
  const host = $('#expLevelsRamp'); if(!host) return;
  const n = +$('#expLevels').value;
  $('#expLevelsLabel').textContent = n + '³ = ' + (n*n*n).toLocaleString() + ' colors';
  const canvas = document.createElement('canvas');
  canvas.width = 600; canvas.height = 60;
  canvas.style.width = '100%'; canvas.style.height = '60px';
  canvas.style.borderRadius = '10px';
  canvas.style.border = '1px solid var(--line)';
  const ctx = canvas.getContext('2d');
  const step = 255/(n-1);
  for(let y=0;y<60;y++){
    for(let x=0;x<600;x++){
      const t = x/599;
      const r = Math.round(Math.round(t*(n-1)) * step);
      const g = Math.round(Math.round((1-t)*(n-1)) * step);
      const b = Math.round(Math.round(((x*7)%600)/599*(n-1)) * step);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(x, y, 1, 1);
    }
  }
  host.innerHTML = '';
  host.appendChild(canvas);
}
function renderSpinSwatches(){
  const host = $('#expSpinSwatches'); if(!host) return;
  const colors = harmonyColors(CL.current, 'triadic');
  host.innerHTML = colors.map(c =>
    '<div class="swatch md" data-color="' + rgbToHex(c) + '" style="background:' + rgbToHex(c) + '"></div>'
  ).join('');
}
function initExperiments(){
  $('#expBg').addEventListener('input', e=>{
    const sim = $('#expSimilar');
    if(sim) sim.style.background = e.target.value;
  });
  $('#expLevels').addEventListener('input', updateLevelsRamp);

  $('#expSpin').onclick = (e)=>{
    if(spinTimer){
      clearInterval(spinTimer); spinTimer = null;
      e.target.textContent = '▶ Play';
    } else {
      e.target.textContent = '⏸ Pause';
      spinTimer = setInterval(()=>{
        spinAngle = (spinAngle + 1) % 360;
        $('#expSpinLabel').textContent = spinAngle + '°';
        const base = hslToRgb(rgbToHsl(CL.current).h + 1, rgbToHsl(CL.current).s, rgbToHsl(CL.current).l);
        CL.current = base;
        renderSpinSwatches();
        $('#currentDot').style.background = rgbToHex(base);
        $('#currentHex').textContent = rgbToHex(base);
      }, 40);
    }
  };
  $('#expSpinStep').onclick = ()=>{
    spinAngle = (spinAngle + 15) % 360;
    $('#expSpinLabel').textContent = spinAngle + '°';
    const hsl = rgbToHsl(CL.current);
    CL.current = hslToRgb(hsl.h + 15, hsl.s, hsl.l);
    renderSpinSwatches();
    $('#currentDot').style.background = rgbToHex(CL.current);
    $('#currentHex').textContent = rgbToHex(CL.current);
  };

  $('#expFormulaRun').onclick = ()=>{
    const src = $('#expFormula').value;
    const c = CL.current;
    const hsl = rgbToHsl(c), hsv = rgbToHsv(c);
    let vars = { r:c.r, g:c.g, b:c.b, h:hsl.h, s:hsl.s, l:hsl.l, v:hsv.v, a:CL.alpha };
    const log = [];
    const lines = src.split('\n');
    let ok = true;
    for(const line of lines){
      const t = line.trim();
      if(!t || t.startsWith('//')) continue;
      const m = t.match(/^([a-zA-Z]+)\s*=\s*(.+)$/);
      if(!m){ log.push('skipped: ' + t); continue; }
      const name = m[1].toLowerCase();
      if(!(name in vars)){ log.push('unknown variable: ' + name); ok = false; continue; }
      try{
        // eslint-disable-next-line no-new-func
        const val = Function(...Object.keys(vars), 'return (' + m[2] + ')')(...Object.values(vars));
        if(typeof val !== 'number' || !isFinite(val)){ log.push(name + ' = ' + val + '  (ignored)'); continue; }
        vars[name] = val;
        log.push(name + ' = ' + round(val,3));
      }catch(err){
        log.push('error in: ' + t + '  —  ' + err.message);
        ok = false;
      }
    }
    // Rebuild the colour from the HSL values (the most natural for these formulas)
    const rgb = hslToRgb(vars.h, clamp(vars.s,0,100), clamp(vars.l,0,100));
    $('#expFormulaResult').style.background = rgbToHex(rgb);
    $('#expFormulaHex').textContent = rgbToHex(rgb).toUpperCase();
    const box = $('#expFormulaLog');
    box.style.display = 'block';
    box.textContent = log.join('\n') + '\n\nresult → ' + rgbToHex(rgb).toUpperCase();
  };
  $('#expFormulaReset').onclick = ()=>{
    $('#expFormulaResult').style.background = rgbToHex(CL.current);
    $('#expFormulaHex').textContent = rgbToHex(CL.current).toUpperCase();
  };

  // --- layer blending ---
  $('#layerBg').addEventListener('input', renderLayers);
  $('#layerAdd').onclick = ()=>{
    CL._layers.push({ color: rgbToHex(randomRGB()), alpha: 0.6, mode: 'normal' });
    renderLayers();
  };
  renderExperiments();
}
function renderLayers(){
  const list = $('#layerList'); if(!list) return;

  // Only rebuild the DOM if the number of layers changed. Rebuilding on every
  // `input` event destroys the element the user is currently dragging (the
  // native color picker closes, sliders jump to 0).
  const needRebuild = list.children.length !== CL._layers.length;

  if(needRebuild){
    list.innerHTML = CL._layers.map((l, i) =>
      '<div class="row" data-i="' + i + '" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px">' +
        '<input type="color" data-i="' + i + '" data-k="color" value="' + l.color + '">' +
        '<input type="range" min="0" max="100" value="' + Math.round(l.alpha*100) + '" data-i="' + i + '" data-k="alpha" style="flex:1;min-width:90px">' +
        '<span class="mono hint" data-i="' + i + '" data-k="alphaLabel" style="min-width:38px;text-align:right">' + Math.round(l.alpha*100) + '%</span>' +
        '<select data-i="' + i + '" data-k="mode">' +
          ['normal','multiply','screen','overlay','darken','lighten','difference','add'].map(m =>
            '<option value="' + m + '"' + (l.mode === m ? ' selected' : '') + '>' + m + '</option>').join('') +
        '</select>' +
        '<button class="btn small" data-i="' + i + '" data-k="del">✕</button>' +
      '</div>'
    ).join('');

    // Attach listeners once — they close over `i` and `k` and never rebuild the row.
    list.querySelectorAll('input, select, button').forEach(el=>{
      const i = +el.dataset.i;
      const k = el.dataset.k;
      if(k === 'del'){
        el.addEventListener('click', ()=>{
          CL._layers.splice(i, 1);
          renderLayers();                    // row count changed → rebuild once
        });
      } else if(k === 'color'){
        el.addEventListener('input', ()=>{
          CL._layers[i].color = el.value;
          drawLayers();                      // canvas only
        });
      } else if(k === 'alpha'){
        el.addEventListener('input', ()=>{
          CL._layers[i].alpha = +el.value/100;
          const label = list.querySelector('[data-k="alphaLabel"][data-i="' + i + '"]');
          if(label) label.textContent = el.value + '%';
          drawLayers();                      // canvas only
        });
      } else if(k === 'mode'){
        el.addEventListener('change', ()=>{
          CL._layers[i].mode = el.value;
          drawLayers();                      // canvas only
        });
      }
    });
  }

  drawLayers();
}

function drawLayers(){
  const cv = $('#layerCanvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = $('#layerBg').value;
  ctx.fillRect(0,0,W,H);

  CL._layers.forEach(l=>{
    ctx.globalAlpha = l.alpha;
    ctx.globalCompositeOperation = l.mode === 'add' ? 'lighter' : l.mode;
    ctx.fillStyle = l.color;
    ctx.fillRect(40, 40, W-80, H-80);
  });
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // marker
  ctx.strokeStyle = 'rgba(255,255,255,.8)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W/2 - 7, H/2); ctx.lineTo(W/2 + 7, H/2);
  ctx.moveTo(W/2, H/2 - 7); ctx.lineTo(W/2, H/2 + 7);
  ctx.stroke();

  const d = ctx.getImageData(W/2, H/2, 1, 1).data;
  const c = { r:d[0], g:d[1], b:d[2] };
  $('#layerResultSwatch').style.background = rgbToHex(c);
  $('#layerResultHex').textContent = rgbToHex(c).toUpperCase() + '  rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
}

/* =========================================================================
   SECTION 27 — SAVE / LOAD / EXPORT / IMPORT
   ========================================================================= */
function exportProject(){
  const data = {
    app: 'ColorLab',
    version: 1,
    exported: new Date().toISOString(),
    current: rgbToHex(CL.current),
    currentRGB: CL.current,
    favorites: CL.favorites,
    palettes: CL.palettes.map(p => ({ name: p.name, colors: p.colors.map(c => c.hex) })),
    history: CL.history,
    gradient: {
      type: CL.grad.type, angle: CL.grad.angle, mode: CL.grad.mode,
      stops: CL.grad.stops.map(s => ({ p: s.p, hex: rgbToHex(s.color) }))
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'colorlab-project.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  toast('Project exported');
}
function importProject(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(reader.result);
      if(d.favorites) CL.favorites = d.favorites;
      if(d.palettes){
        CL.palettes = d.palettes.map((p,i)=>({
          name: p.name || ('Palette ' + (i+1)),
          colors: (p.colors || []).map(h => ({ hex: typeof h === 'string' ? h : h.hex, locked:false }))
        }));
        CL.activePalette = 0;
      }
      if(d.history) CL.history = d.history;
      if(d.current){
        const c = hexToRgb(d.current);
        if(c){ pickerApplyHex(rgbToHex(c)); setCurrent(c); }
      }
      if(d.gradient && d.gradient.stops){
        CL.grad.type = d.gradient.type || 'linear';
        CL.grad.angle = d.gradient.angle || 90;
        CL.grad.mode = d.gradient.mode || 'rgb';
        CL.grad.stops = d.gradient.stops.map(s => ({ p:s.p, color: hexToRgb(s.hex) || {r:0,g:0,b:0} }));
      }
      refreshEverything();
      toast('Project imported');
    }catch(e){ toast('Could not read that file'); }
  };
  reader.readAsText(file);
}
function refreshEverything(){
  ensurePalette();
  renderHistory();
  renderFavorites();
  renderPalette();
  renderWheelSwatches();
  updateTheory();
  updateSpaces();
  renderMixer();
  renderMath();
  renderContrast();
  renderPerception();
  renderDistance();
  renderCompare();
  renderGradient();
  updateRandomPreview(CL.current);
  if(window.updateConverterOutputs) window.updateConverterOutputs();
  updatePickerUI();
  if($('#gradType')) $('#gradType').value = CL.grad.type;
  if($('#gradMode')) $('#gradMode').value = CL.grad.mode;
  if($('#gradAngle')){ $('#gradAngle').value = CL.grad.angle; $('#gradAngleLabel').textContent = CL.grad.angle + '°'; }
}

/* =========================================================================
   SECTION 28 — HEADER ACTIONS
   ========================================================================= */
function initHeader(){
  $('#currentChip').onclick = ()=>openColorModal(rgbToHex(CL.current));
  $('#modalClose').onclick = closeModal;
  $('#modalBackdrop').addEventListener('click', e=>{ if(e.target.id === 'modalBackdrop') closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });

    const qc = $('#quickColor');
  if(qc){
    qc.value = rgbToHex(CL.current);
    const applyQuick = ()=>{
      const c = hexToRgb(qc.value);
      if(!c) return;
      setPickerFromRGB(c, CL.alpha);
      setCurrent(c, CL.alpha);
    };
    // `input` fires continuously while dragging in the native picker (Chrome / Android);
    // `change` fires once on commit — needed on iOS Safari which only emits change.
    qc.addEventListener('input', applyQuick);
    qc.addEventListener('change', applyQuick);
  }

  $('#btnFavorites').onclick = ()=>{
    const body = $('#modalBody');
    body.innerHTML =
      '<h2>Favorites</h2>' +
      '<p class="hint">Saved in your browser. Click a color for the full breakdown.</p>' +
      '<div class="swatch-row" id="modalFavs"></div>';
    const host = $('#modalFavs');
    if(!CL.favorites.length){
      host.innerHTML = '<span class="hint">No favorites yet. Open any color and press ★ Favorite.</span>';
    } else {
      host.innerHTML = CL.favorites.map(h =>
        '<div class="swatch md" data-color="' + h + '" style="background:' + h + '"></div>'
      ).join('');
    }
    $('#modalBackdrop').classList.add('open');
  };

  $('#btnSave').onclick = ()=>{ saveState(); toast('Saved to this browser'); };
  $('#btnLoad').onclick = ()=>{ if(loadState()){ refreshEverything(); toast('Loaded saved state'); } else toast('Nothing saved yet'); };
  $('#btnExport').onclick = exportProject;
  $('#btnImport').onclick = ()=> $('#fileImport').click();
  $('#fileImport').addEventListener('change', e=>{
    if(e.target.files[0]) importProject(e.target.files[0]);
    e.target.value = '';
  });
  $('#btnReset').onclick = ()=>{
    showConfirm(
      'This clears favorites, palettes, history, gradients and saved settings from this browser. It cannot be undone.',
      ()=>{
        localStorage.removeItem(LS_KEY);
        CL.favorites = []; CL.history = []; CL.palettes = []; CL.activePalette = 0;
        ensurePalette();
        CL.current = { r:74, g:114, b:232 };
        CL.alpha = 1;
        P.h = 222; P.s = 68; P.v = 91; P.hs = 77; P.l = 60; P.a = 1;
        CL.grad = { type:'linear', angle:90, mode:'rgb',
          stops:[ {p:0, color:{r:255,g:87,b:51}}, {p:0.5, color:{r:106,g:90,b:205}}, {p:1, color:{r:51,g:102,b:255}} ] };
        refreshEverything();
        toast('Reset complete');
      },
      { title:'Reset ColorLab?', okText:'Reset', cancelText:'Keep my data' }
    );
  };
  $('#btnClearHistory').onclick = ()=>{ CL.history = []; renderHistory(); saveStateDebounced(); };
}

/* =========================================================================
   SECTION 29 — BOOTSTRAP
   ========================================================================= */
function init(){
  buildTabs();
  buildPanels();
  initHeader();
  initPicker();
  initMixer();
  initWheel();
  initTheory();
  initSpaces();
  initMath();
  initContrast();
  initPerception();
  initPalettes();
  initImageLab();
  initGradients();
  initRandom();
  initConverter();
  initExperiments();

  // Initial current color
  setPickerFromRGB(CL.current, CL.alpha);
  $('#currentDot').style.background = rgbToHex(CL.current);
  $('#currentHex').textContent = rgbToHex(CL.current).toUpperCase();
  renderHistory();
  renderFavorites();
  updateTheory();

  // Global refresh hooks
    onCurrentChange(()=>{
    // Only run the heavy renderers for the tab that is actually visible.
    if(isActiveTab('theory'))      updateTheory();
    if(isActiveTab('wheel'))       renderWheelSwatches();
    if(isActiveTab('spaces'))      updateSpaces();
    if(isActiveTab('convert'))     { if(window.updateConverterOutputs) window.updateConverterOutputs(); }
    if(isActiveTab('perception'))  renderPerception();
    if(isActiveTab('experiments')) renderExperiments();
  });

  // window resize → re-layout sort stage
  let rzTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(rzTimer);
    rzTimer = setTimeout(()=>{
      if(CL.sort.colors.length) layoutSort();
      if($('.panel[data-tab="gradients"]').classList.contains('active')) renderGradient();
    }, 150);
  });

  // Start on the saved tab
  showTab(CL.tab || 'picker');
  if(CL.tab === 'gradients') renderGradient();
}

document.addEventListener('DOMContentLoaded', init);

})();
</script>
