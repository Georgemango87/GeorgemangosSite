<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threadwright — Conversation Simulator &amp; Story Editor</title>
<style>
/* ============================================================
   THEME
   ============================================================ */
:root{
  --bg:#0f1216;
  --panel:#161a20;
  --panel2:#1c2129;
  --panel3:#232932;
  --border:#2a313a;
  --border2:#39424e;
  --text:#e5e9ef;
  --text2:#98a3b1;
  --text3:#6b7685;
  --accent:#4d8fd6;
  --accent-soft:rgba(77,143,214,.16);
  --danger:#d95c57;
  --ok:#4caf7d;
  --radius:10px;
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="light"]{
  --bg:#eceff3;
  --panel:#ffffff;
  --panel2:#f4f6f9;
  --panel3:#e8ecf1;
  --border:#dbe1e8;
  --border2:#c3ccd7;
  --text:#161b22;
  --text2:#5a6675;
  --text3:#8a95a3;
  --accent:#2f6fb5;
  --accent-soft:rgba(47,111,181,.12);
  --danger:#c0392b;
  --ok:#2e8b57;
  --shadow:0 10px 34px rgba(20,30,50,.14);
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text3);background-clip:padding-box;}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

.topbar{
  display:flex;align-items:center;gap:12px;
  height:52px;flex:0 0 auto;
  padding:0 14px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px;white-space:nowrap;}
.brand .logo{
  width:24px;height:24px;border-radius:7px;
  background:linear-gradient(150deg,var(--accent),#7b5cd6);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;
}
.brand small{font-weight:400;color:var(--text3);font-size:11px;margin-left:2px;}
.topbar .spacer{flex:1;}
.topbar .proj-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--text2);
  max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:pointer;
}
.topbar .proj-pill:hover{border-color:var(--border2);color:var(--text);}

/* ============================================================
   BUTTONS & INPUTS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--panel2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:7px 12px;
  cursor:pointer;font-size:13px;line-height:1;white-space:nowrap;
  transition:background .13s,border-color .13s,transform .05s;
}
.btn:hover{background:var(--panel3);border-color:var(--border2);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn.primary:hover{filter:brightness(1.1);}
.btn.danger{color:var(--danger);}
.btn.danger:hover{background:rgba(217,92,87,.12);border-color:rgba(217,92,87,.4);}
.btn.tiny{padding:4px 8px;font-size:11.5px;border-radius:6px;}

.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;
  background:transparent;border:1px solid transparent;color:var(--text2);
  cursor:pointer;font-size:14px;line-height:1;transition:all .13s;
  flex:0 0 auto;
}
.icon-btn:hover{background:var(--panel3);color:var(--text);border-color:var(--border);}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(77,143,214,.35);}
.icon-btn.play{background:var(--accent);color:#fff;width:38px;height:38px;font-size:15px;}
.icon-btn.play:hover{filter:brightness(1.1);background:var(--accent);}

.input,select.input,textarea.input{
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:7px 9px;outline:none;font-size:13px;
  transition:border-color .13s;
  width:100%;
}
.input:focus,select.input:focus,textarea.input:focus{border-color:var(--accent);}
select.input{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px;}
label.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);cursor:pointer;user-select:none;}
label.check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}

/* ============================================================
   WORKSPACE
   ============================================================ */
.workspace{flex:1;display:flex;min-height:0;overflow:hidden;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:270px;flex:0 0 auto;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;
}
.sb-section{padding:12px;border-bottom:1px solid var(--border);}
.sb-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--text3);font-weight:700;margin-bottom:9px;
}
.btn-col{display:flex;flex-direction:column;gap:6px;}
.btn-row{display:flex;gap:6px;margin-top:6px;}
.btn-row .btn{flex:1;}
.mini{
  background:transparent;border:1px solid var(--border);color:var(--text2);
  border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;text-transform:none;letter-spacing:0;
}
.mini:hover{color:var(--text);border-color:var(--border2);}

.char-list{display:flex;flex-direction:column;gap:5px;}
.char-item{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;
  background:var(--panel2);border:1px solid transparent;cursor:pointer;
  transition:all .12s;
}
.char-item:hover{border-color:var(--border2);}
.char-item .avatar{width:26px;height:26px;font-size:10.5px;}
.char-item .ci-main{flex:1;min-width:0;}
.char-item .ci-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.char-item .ci-desc{font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.char-item .ci-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s;}
.char-item:hover .ci-actions{opacity:1;}
.char-item .ci-actions button{
  background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;
  width:20px;height:20px;border-radius:4px;line-height:1;
}
.char-item .ci-actions button:hover{background:var(--panel3);color:var(--text);}

.chapter-list{display:flex;flex-direction:column;gap:4px;}
.chapter-item{
  text-align:left;background:var(--panel2);border:1px solid transparent;
  color:var(--text2);border-radius:7px;padding:6px 9px;font-size:12px;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chapter-item:hover{border-color:var(--border2);color:var(--text);}
.empty-small{font-size:11.5px;color:var(--text3);font-style:italic;padding:3px 2px;}

/* ---------- Editor panel ---------- */
.editor-panel{
  flex:1;display:flex;flex-direction:column;min-width:0;
  background:var(--bg);
}
.editor-toolbar{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:9px 12px;border-bottom:1px solid var(--border);
  background:var(--panel);flex:0 0 auto;
}
.editor-toolbar .spacer{flex:1;}
.editor-toolbar .input.search{width:150px;flex:0 1 150px;}
.editor-toolbar .input.jump{width:62px;flex:0 0 62px;text-align:center;}
.editor-toolbar select.input{width:auto;min-width:110px;flex:0 0 auto;}

.msg-list{flex:1;overflow-y:auto;padding:10px 12px 90px;}

.msg-row{
  display:flex;align-items:flex-start;gap:9px;
  padding:8px 9px;border-radius:9px;margin-bottom:5px;
  background:var(--panel);border:1px solid var(--border);
  cursor:grab;transition:border-color .12s,background .12s;
  position:relative;
}
.msg-row:hover{border-color:var(--border2);}
.msg-row.dragging{opacity:.4;}
.msg-row.drag-over{border-color:var(--accent);box-shadow:0 -2px 0 -1px var(--accent) inset;}
.msg-row.hl{animation:hlflash 1.1s ease;}
@keyframes hlflash{0%{background:var(--accent-soft);border-color:var(--accent);}100%{}}

.msg-row .drag-handle{
  color:var(--text3);font-size:13px;letter-spacing:-1px;line-height:1;
  padding-top:4px;cursor:grab;user-select:none;flex:0 0 auto;opacity:.5;
}
.msg-row:hover .drag-handle{opacity:1;}
.msg-row .num{
  flex:0 0 24px;font-size:10.5px;color:var(--text3);font-family:var(--mono);
  padding-top:4px;text-align:right;
}
.msg-row .avatar{width:24px;height:24px;font-size:10px;margin-top:1px;}
.msg-row .body{flex:1;min-width:0;}
.msg-row .head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px;}
.msg-row .nm{font-size:12px;font-weight:650;}
.msg-row .tm{font-size:10.5px;color:var(--text3);font-family:var(--mono);}
.badge{
  font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;
  border:1px solid var(--border2);color:var(--text3);
  padding:1px 5px;border-radius:4px;font-weight:600;
}
.badge.ev{color:#d8a03a;border-color:rgba(216,160,58,.4);background:rgba(216,160,58,.08);}
.msg-row .txt{
  font-size:13px;line-height:1.45;color:var(--text);white-space:pre-wrap;
  word-break:break-word;
}
.msg-row .txt.dim{color:var(--text3);font-style:italic;}
.msg-row .actions{
  display:flex;gap:1px;opacity:0;transition:opacity .12s;flex:0 0 auto;
}
.msg-row:hover .actions,.msg-row:focus-within .actions{opacity:1;}
.msg-row .actions button{
  width:24px;height:24px;border-radius:5px;background:transparent;border:none;
  color:var(--text3);cursor:pointer;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.msg-row .actions button:hover{background:var(--panel3);color:var(--text);}
.msg-row .actions button.del:hover{color:var(--danger);background:rgba(217,92,87,.12);}

.empty-state{
  text-align:center;color:var(--text3);padding:60px 20px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty-state .big{font-size:34px;opacity:.35;}
.empty-state h3{margin:0;font-size:15px;color:var(--text2);font-weight:600;}
.empty-state p{margin:0;font-size:12.5px;max-width:340px;line-height:1.55;}

/* ---------- Preview panel ---------- */
.preview-panel{
  width:420px;flex:0 0 auto;display:flex;flex-direction:column;
  background:var(--panel);border-left:1px solid var(--border);min-width:0;
}
.preview-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--border);flex:0 0 auto;
  font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--text3);font-weight:700;
}
.preview-head .spacer{flex:1;}
.preview-head select.input{width:auto;padding:4px 24px 4px 8px;font-size:11.5px;text-transform:none;letter-spacing:0;background-position:calc(100% - 13px) 10px,calc(100% - 8px) 10px;}
.preview-stage{flex:1;display:flex;justify-content:center;padding:12px;min-height:0;overflow:hidden;}

.device{
  display:flex;flex-direction:column;overflow:hidden;min-height:0;
  background:var(--chatbg);width:100%;
  border:1px solid var(--border2);
}
.device.phone{max-width:372px;border-radius:26px;box-shadow:var(--shadow);}
.device.desktop{max-width:100%;border-radius:11px;box-shadow:var(--shadow);}

.chat-header{
  display:flex;align-items:center;gap:9px;padding:10px 12px;
  background:var(--panel2);border-bottom:1px solid var(--border);flex:0 0 auto;
}
.chat-header .avatar{width:32px;height:32px;font-size:11px;}
.chat-header .ch-main{flex:1;min-width:0;}
.chat-header .ch-name{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-header .ch-sub{font-size:10.5px;color:var(--text3);}
.chat-header .ch-icons{display:flex;gap:12px;color:var(--text3);font-size:14px;}

.chat-body{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 16px;
  display:flex;flex-direction:column;gap:0;min-height:0;
  scroll-behavior:smooth;
}
.chat-input{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-top:1px solid var(--border);background:var(--panel2);flex:0 0 auto;
  pointer-events:none;user-select:none;
}
.chat-input .ci-field{
  flex:1;min-width:0;background:var(--panel3);border:1px solid var(--border);
  border-radius:16px;padding:7px 12px;font-size:12px;color:var(--text3);
  white-space:nowrap;overflow:hidden;text-overflow:clip;
  transition:color .15s,border-color .15s,background .15s;
}
.chat-input .ci-field.typing{
  border-color:var(--border2);
  background:var(--panel2);
}
.chat-input .ci-field .caret{
  display:inline-block;width:2px;height:13px;background:currentColor;
  vertical-align:-2px;margin-left:1px;border-radius:1px;
  animation:caretBlink 1.05s steps(1,end) infinite;
}
@keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
.chat-input .ci-send{
  width:28px;height:28px;border-radius:50%;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;
}

/* chat bubbles */
.avatar{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:.2px;
  text-shadow:0 1px 2px rgba(0,0,0,.25);
}
.msg-row.pv{display:flex;gap:8px;align-items:flex-end;background:none;border:none;padding:0;margin:0;cursor:default;}
.msg-row.pv:hover{border:none;}
.msg-row.pv.right{flex-direction:row-reverse;}
.msg-row.pv:not(.grouped){margin-top:11px;}
.msg-row.pv.grouped{margin-top:2px;}
.avatar-spacer{width:28px;flex:0 0 auto;}
.bubble-col{max-width:80%;display:flex;flex-direction:column;min-width:0;}
.msg-row.pv.right .bubble-col{align-items:flex-end;}
.sender-name{font-size:10.5px;font-weight:650;margin:0 0 3px 5px;letter-spacing:.2px;}
.bubble{
  padding:8px 12px;font-size:13px;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;max-width:100%;
  border-radius:var(--bub-r,15px);
  background:var(--bub-bg,rgba(77,143,214,0.3));
  border:var(--bub-bw,1px) solid var(--bub-bd,transparent);
}
.msg-row.pv:not(.grouped).left .bubble{border-top-left-radius:var(--bub-tail,5px);}
.msg-row.pv:not(.grouped).right .bubble{border-top-right-radius:var(--bub-tail,5px);}

/* ---------- Phone skins ---------- */
[data-skin="ios"]{background:#000;}
[data-skin="ios"] .chat-header{
  background:rgba(28,28,30,0.92);
  border-bottom-color:rgba(255,255,255,0.06);
  padding:12px 14px;
  backdrop-filter:blur(14px);
}
[data-skin="ios"] .chat-header .ch-sub{color:rgba(255,255,255,0.55);}
[data-skin="ios"] .chat-input{
  background:rgba(28,28,30,0.92);
  border-top-color:rgba(255,255,255,0.06);
}
[data-skin="ios"] .chat-input .ci-field{
  background:rgba(255,255,255,0.08);
  border:none;border-radius:18px;color:rgba(255,255,255,0.5);
}
[data-skin="ios"] .list-pane{background:#000;}
[data-skin="ios"] .list-header,
[data-skin="ios"] .list-row{border-color:rgba(255,255,255,0.08);}

[data-skin="android"]{background:#121212;}
[data-skin="android"] .chat-header{
  background:var(--accent);border-bottom:none;
}
[data-skin="android"] .chat-header .ch-name{color:#fff;}
[data-skin="android"] .chat-header .ch-sub{color:rgba(255,255,255,0.75);}
[data-skin="android"] .chat-header .ch-icons{color:rgba(255,255,255,0.9);}
[data-skin="android"] .chat-input{
  background:rgba(255,255,255,0.04);
  border-top-color:rgba(255,255,255,0.08);
}
[data-skin="android"] .chat-input .ci-field{
  background:rgba(255,255,255,0.07);
  border:none;border-radius:22px;
}
[data-skin="android"] .list-pane{background:#1a1a1a;}
[data-skin="android"] .list-title{color:#fff;}

[data-skin="retro"]{background:#0a1218;}
[data-skin="retro"] .chat-header{
  background:#1a2a3a;border-bottom-color:rgba(80,150,200,0.25);
  font-family:var(--mono);
}
[data-skin="retro"] .chat-header .ch-name{
  font-family:var(--mono);font-size:12px;letter-spacing:.5px;color:#7fd0a5;
}
[data-skin="retro"] .chat-header .ch-sub{
  font-family:var(--mono);font-size:10px;color:rgba(120,200,160,0.6);
}
[data-skin="retro"] .chat-body{font-family:var(--mono);}
[data-skin="retro"] .bubble{font-family:var(--mono);font-size:12px;}
[data-skin="retro"] .chat-input{background:#0f1a24;border-top-color:rgba(80,150,200,0.2);}
[data-skin="retro"] .chat-input .ci-field{
  background:#0a1218;border:1px solid rgba(80,150,200,0.3);
  border-radius:2px;color:rgba(120,220,150,0.7);font-family:var(--mono);
}
[data-skin="retro"] .list-pane{background:#0a1218;}
[data-skin="retro"] .list-header{border-bottom-color:rgba(80,150,200,0.2);}
[data-skin="retro"] .list-title{font-family:var(--mono);color:#7fd0a5;}
[data-skin="retro"] .list-row + .list-row{border-color:rgba(80,150,200,0.15);}
.bubble-meta{
  font-size:9.5px;color:var(--text3);margin-top:3px;padding:0 4px;
  display:flex;gap:5px;align-items:center;font-family:var(--mono);
}
.ticks{color:var(--accent);letter-spacing:-2px;font-size:10px;}

.date-sep{
  text-align:center;margin:14px 0 8px;
  display:flex;align-items:center;gap:10px;
}
.date-sep::before,.date-sep::after{content:"";flex:1;height:1px;background:var(--border);}
.date-sep span{
  font-size:10px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--text3);font-weight:600;white-space:nowrap;
}

/* events in chat */
.chat-event{
  align-self:center;max-width:92%;text-align:center;margin:10px 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.chat-event .ev-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;
  padding:4px 10px;border-radius:20px;border:1px solid var(--border2);
  background:var(--panel2);color:var(--text3);
}
.chat-event .ev-text{font-size:11.5px;color:var(--text2);line-height:1.45;}
.chat-event.ev-chapter .ev-pill{background:rgba(216,160,58,.12);border-color:rgba(216,160,58,.45);color:#d8a03a;}
.chat-event.ev-chapter .ev-text{font-size:13px;letter-spacing:2px;color:#d8a03a;font-weight:600;}
.chat-event.ev-system .ev-pill{color:var(--text2);}
.chat-event.ev-call .ev-pill{color:#4caf7d;border-color:rgba(76,175,125,.45);background:rgba(76,175,125,.1);}
.chat-event.ev-offline .ev-pill{color:var(--text3);}
.chat-event.ev-interrupt .ev-pill{color:#e2a33a;border-color:rgba(226,163,58,.45);background:rgba(226,163,58,.1);}
.chat-event.ev-join .ev-pill,.chat-event.ev-leave .ev-pill{color:#5aa9e6;border-color:rgba(90,169,230,.4);background:rgba(90,169,230,.08);}
.chat-event.ev-delete .ev-pill{color:var(--danger);border-color:rgba(217,92,87,.4);background:rgba(217,92,87,.08);}
.chat-event.ev-gap .ev-pill{background:transparent;border-style:dashed;}
.chat-event.ev-file .ev-text{
  font-family:var(--mono);font-size:11px;background:var(--panel2);

<script>
"use strict";
/* ================================================================
   THREADWRIGHT — Conversation Simulator & Story Editor
   Single-file vanilla JS application.
   ================================================================ */

/* ---------------------------------------------------------------
   0. SMALL UTILITIES
   --------------------------------------------------------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function uid(){ return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function hexToRgba(hex, a){
  hex = String(hex || '#888888').replace('#','').trim();
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const n = parseInt(hex, 16);
  if (isNaN(n)) return 'rgba(136,136,136,' + a + ')';
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}
function luminance(hex){
  hex = String(hex || '#888888').replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  if (isNaN(n)) return 0.5;
  const r = ((n>>16)&255)/255, g = ((n>>8)&255)/255, b = (n&255)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }

/* deterministic per-message pseudo-random in [0,1) */
function hash01(str){
  let h = 2166136261;
  const s = String(str || '');
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h ^= h >>> 13;
  h = Math.imul(h, 0x5bd1e995);
  h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

const DAY_BASE = 1e12; // offset added to "time-of-day only" timestamps

/* ---------------------------------------------------------------
   1. CONSTANTS / DEFINITIONS
   --------------------------------------------------------------- */
const EVENT_DEFS = {

/* ---------------------------------------------------------------
   2. DATA MODEL
   --------------------------------------------------------------- */
function makeSettings(){
  return {
    theme: 'dark',
    viewMode: 'phone',
    timingMode: 'sequential',
    timeScale: 60,          // script-seconds per real second (timestamp mode)
    defaultDelay: 1400,
    typing: true,
    typingDelay: 1100,
    readReceipts: true,
    sounds: false,
    autoScroll: true,
    pauseBetween: false,
    pauseBetweenMs: 600,
    longMessageDelay: true,
    groupName: '',
    chatBg: 'default',
    phoneSkin: 'default',
    showTimestamps: true,
    showAvatars: true
  };
}

function makeProject(name){
  return {
    id: uid(),
    name: name || 'Untitled Project',
    title: 'Conversation',
    subtitle: '',
    characters: [],
    messages: [],
    settings: makeSettings(),
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

function makeMessage(over){
  return Object.assign({
    id: uid(),
    kind: 'msg',
    senderId: null,
    text: '',
    time: '',
    delay: 1400,
    typing: true,
    read: true,
    eventType: null
  }, over || {});
}

function normalizeProject(p){
  if (!p || typeof p !== 'object') return makeProject();
  p.id = p.id || uid();
  p.name = p.name || 'Untitled Project';
  p.title = p.title || 'Conversation';
  p.subtitle = p.subtitle || '';
  p.characters = Array.isArray(p.characters) ? p.characters : [];
  p.messages = Array.isArray(p.messages) ? p.messages : [];
  p.settings = Object.assign(makeSettings(), p.settings || {});
  p.characters.forEach((c, i) => {
    c.id = c.id || uid();
    c.name = c.name || ('Character ' + (i + 1));
    c.initials = c.initials || initialsFor(c.name);
    c.color = c.color || PALETTE[i % PALETTE.length];
    c.side = c.side === 'right' ? 'right' : 'left';
    c.description = c.description || '';
  });
  p.messages.forEach(m => {
    m.id = m.id || uid();
    m.kind = m.kind === 'event' ? 'event' : 'msg';
    m.text = m.text == null ? '' : String(m.text);
    m.time = m.time == null ? '' : String(m.time);
    m.delay = typeof m.delay === 'number' ? m.delay : 1400;
    m.typing = !!m.typing;
    m.read = !!m.read;
    if (m.kind === 'event' && !EVENT_DEFS[m.eventType]) m.eventType = 'system';
  });
  return p;
}

function initialsFor(name){
  const words = String(name || '?').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return '?';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}

const STORE_KEY = 'threadwright.v1';
let db = { projects: [], currentId: null };
let saveTimer = null;

function loadDB(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.projects) && parsed.projects.length) {
        db = parsed;
      }
    }
  } catch (e) { console.warn('Could not read local storage', e); }

  if (!db.projects || !db.projects.length) {
    const p = sampleProject();
    db = { projects: [p], currentId: p.id };
  }
  db.projects = db.projects.map(normalizeProject);
  if (!db.projects.find(p => p.id === db.currentId)) db.currentId = db.projects[0].id;
}

function saveDB(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { console.warn('Save failed', e); }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDB, 400);
}

/* ---------------------------------------------------------------
   5. APP STATE
   --------------------------------------------------------------- */
const ui = { search: '', filter: 'all' };

const player = {
  playing: false,
  vTime: 0,
  revealed: 0,
  speed: 1,
  lastFrame: 0,
  rafId: null,
  lastRevealed: -1,
  nextReadAt: Infinity
};

let undoStack = [];
let redoStack = [];

let E = {}; // cached DOM elements

function current(){ return db.projects.find(p => p.id === db.currentId) || db.projects[0]; }

/* ---------------------------------------------------------------
   6. TIME / SCHEDULE
   --------------------------------------------------------------- */
function parseTime(str){
  if (!str) return null;
  const s = String(str).trim();
  if (!s) return null;

  let m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm|AM|PM)?$/);
  if (m) {
    let h = parseInt(m[1], 10);
    const mi = parseInt(m[2], 10);
    const se = parseInt(m[3] || '0', 10);
    const ap = m[4] ? m[4].toLowerCase() : null;
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    return DAY_BASE + ((h * 60 + mi) * 60 + se) * 1000;
  }

  const d = Date.parse(s);
  if (!isNaN(d)) return d;
  return null;
}

function dayKeyFor(str){
  const t = parseTime(str);
  if (t == null || t < DAY_BASE) return null;
  const d = new Date(t);
  if (isNaN(d.getTime())) return null;
  return d.toDateString();
}

/** Compute absolute reveal time (ms) for every message. */
function computeSchedule(){
  const p = current();
  const s = p.settings;
  const msgs = p.messages;
  const out = [];
  let t = 0;
  let lastTs = null;

  const charSide = {};
  p.characters.forEach(c => { charSide[c.id] = c.side || 'left'; });

  // The absolute time each sender's latest read receipt will land.
  const pendingReceipts = {};
  const RECEIPT_LEAD_MS = 400;

  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    const r = 0.86 + hash01(m.id) * 0.62;      // 0.86 – 1.48
    const len = m.kind === 'msg' ? (m.text || '').length : 0;

    const isRight = m.kind === 'msg' && m.typing && charSide[m.senderId] === 'right';
    const isLeftTyping = m.kind === 'msg' && m.typing && charSide[m.senderId] !== 'right';
    const typingMs = isRight ? composerDurationFor(m, s)
                             : isLeftTyping ? typingDurationFor(m, s) : 0;
    const typingWindowDur = isRight ? (typingMs + SEND_GAP_MS)
                                    : isLeftTyping ? (typingMs + 300) : 0;
    const readBuf = typingMs > 0 ? (700 + Math.min(1800, len * 18)) : 0;
    const sendGap = isRight ? SEND_GAP_MS : 0;

    if (s.timingMode === 'timestamp') {
      const ts = parseTime(m.time);
      if (ts != null && lastTs != null) {
        let d = Math.abs(ts - lastTs) / Math.max(1, s.timeScale);
        d = Math.min(d, 20000);
        t += Math.max(350, d * r);
      } else {
        t += (i === 0 ? 500 : 1200) * r;
      }
      if (ts != null) lastTs = ts;
      if (s.pauseBetween) t += s.pauseBetweenMs;
    } else {
      const base = (typeof m.delay === 'number' && isFinite(m.delay)) ? m.delay : s.defaultDelay;

      let d = base * 1.55 * r;
      if (s.longMessageDelay && m.kind === 'msg') {
        d += Math.min(5000, len * 45);
      }
      if (typingMs > 0) d = Math.max(d, typingMs + sendGap + readBuf);
      if (i === 0 && typingMs === 0) d = Math.min(d, 900);
      if (s.pauseBetween) d += s.pauseBetweenMs;
      t += Math.max(450, d);
    }

    // Read receipts must land before the NEXT sender starts typing.
    if (typingWindowDur > 0) {
      const mySender = m.senderId;
      let latestReceipt = 0;
      for (const sid in pendingReceipts) {
        if (sid !== mySender && pendingReceipts[sid] > latestReceipt) {
          latestReceipt = pendingReceipts[sid];
        }
      }
      if (latestReceipt > 0) {
        const earliestTypingStart = latestReceipt + RECEIPT_LEAD_MS;
        if (t - typingWindowDur < earliestTypingStart) {
          t = earliestTypingStart + typingWindowDur;
        }
      }
    }

    out.push(t);

    // Register this message's own read receipt as pending
    if (m.kind === 'msg' && m.read && s.readReceipts && charSide[m.senderId] === 'right') {
      pendingReceipts[m.senderId] = t + readDelayFor(m);
    }
  }
  return out;
}

function totalDuration(){
  const sched = computeSchedule();
  return sched.length ? sched[sched.length - 1] : 0;
}

/* ---------------------------------------------------------------
   7. UNDO / REDO
   --------------------------------------------------------------- */
function commit(fn){
  const before = JSON.stringify(current());
  fn();
  const p = current();
  p.updatedAt = Date.now();
  undoStack.push(before);
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  scheduleSave();
  clampPlayer();
  render();
}

function applySnapshot(snap){
  const obj = JSON.parse(snap);
  const idx = db.projects.findIndex(p => p.id === obj.id);
  if (idx >= 0) db.projects[idx] = normalizeProject(obj);
  else db.projects.push(normalizeProject(obj));
  db.currentId = obj.id;
  scheduleSave();
  clampPlayer();
  render();
}

function undo(){
  if (!undoStack.length) return;
  const snap = undoStack.pop();
  redoStack.push(JSON.stringify(current()));
  applySnapshot(snap);
}
function redo(){
  if (!redoStack.length) return;
  const snap = redoStack.pop();
  undoStack.push(JSON.stringify(current()));
  applySnapshot(snap);
}

/* ---------------------------------------------------------------
   8. AUDIO
   --------------------------------------------------------------- */
let audioCtx = null;
function beep(kind){
  const p = current();
  if (!p.settings.sounds) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    const now = audioCtx.currentTime;
    if (kind === 'in') { o.frequency.setValueAtTime(760, now); o.frequency.exponentialRampToValueAtTime(980, now + 0.06); }
    else { o.frequency.setValueAtTime(520, now); }
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.07, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
    o.start(now); o.stop(now + 0.15);
  } catch (e) { /* audio unavailable */ }
}

/* ---------------------------------------------------------------
   9. PLAYBACK ENGINE
   --------------------------------------------------------------- */
function clampPlayer(){
  const p = current();
  const total = p.messages.length;
  if (player.revealed > total) player.revealed = total;
  const dur = totalDuration();
  if (player.vTime > dur) player.vTime = dur;
  if (player.vTime < 0) player.vTime = 0;
}

function setPlayerTime(t){
  const dur = totalDuration();
  player.vTime = Math.max(0, Math.min(t, dur));
  const sched = computeSchedule();
  let n = 0;
  while (n < sched.length && sched[n] <= player.vTime + 0.5) n++;
  player.revealed = n;
  renderPreview();
  updatePlaybar();
}

function play(){
  const p = current();
  if (!p.messages.length) return;
  const dur = totalDuration();
  if (player.vTime >= dur - 1) { player.vTime = 0; player.revealed = 0; }
  player.playing = true;
  player.lastFrame = performance.now();
  startLoop();
  updatePlaybar();
}

function pause(){
  player.playing = false;
  updatePlaybar();
}

function togglePlay(){ player.playing ? pause() : play(); }

function restart(){
  player.playing = false;
  player.vTime = 0;
  player.revealed = 0;
  player.lastRevealed = -1;
  renderPreview();
  updatePlaybar();
}

function stepForward(){
  const p = current();
  const sched = computeSchedule();
  if (player.revealed >= p.messages.length) return;
  const idx = player.revealed;
  player.playing = false;
  player.vTime = sched[idx] != null ? sched[idx] : totalDuration();
  player.revealed = idx + 1;
  renderPreview();
  updatePlaybar();
  beep('in');
}

function stepBack(){
  if (player.revealed <= 0) return;
  const sched = computeSchedule();
  player.playing = false;
  player.revealed = player.revealed - 1;
  player.vTime = player.revealed > 0 ? (sched[player.revealed - 1] || 0) : 0;
  renderPreview();
  updatePlaybar();
}

function startLoop(){
  if (player.rafId) return;
  player.lastFrame = performance.now();
  const frame = (now) => {
    player.rafId = requestAnimationFrame(frame);
    if (!player.playing) return;

    const dt = now - player.lastFrame;
    player.lastFrame = now;
    player.vTime += dt * player.speed;

    const dur = totalDuration();

    if (player.vTime >= dur) {
      player.vTime = dur;
      player.revealed = current().messages.length;
      renderPreview();
      player.playing = false;
      updatePlaybar();
      stopLoop();
      return;
    }

    const sched = computeSchedule();
    let n = 0;
    while (n < sched.length && sched[n] <= player.vTime) n++;
    if (n !== player.revealed) {
      const grew = n > player.revealed;
      player.revealed = n;
      renderPreview();
      if (grew) {
        const last = current().messages[n - 1];
        if (last && last.kind === 'msg') beep('in');
      }
    }

    // Live typing animation (composer + dots) for both surfaces
    const proj = current();
    updateTypingUI(E.chatBody, E.composerField, proj);
    if (E.fsOverlay.classList.contains('open')) {
      updateTypingUI(E.fsBody, E.fsComposerField, proj);
    }

    // Read receipts arrive a random beat after the message lands.
    // Re-render only when one is actually due (scroll is preserved).
    if (player.vTime >= player.nextReadAt) {
      renderPreview();
    }

    updatePlaybar();
  };
  player.rafId = requestAnimationFrame(frame);
}

function stopLoop(){
  if (player.rafId) { cancelAnimationFrame(player.rafId); player.rafId = null; }
}

/* ---------------------------------------------------------------
   10. CHAT RENDERING
   --------------------------------------------------------------- */
function charMap(p){
  const map = {};
  p.characters.forEach(c => map[c.id] = c);
  return map;
}
function charName(p, id){
  const c = p.characters.find(x => x.id === id);
  return c ? c.name : 'Unknown';
}

function renderHeaderInto(el, p, active){
  let name, sub, avatarChar;

  if (active && active.name) {
    name = active.name;
    const participants = p.characters.filter(c => active.participantIds.includes(c.id));
    const receiving = active.receivingId
      ? p.characters.find(c => c.id === active.receivingId) : null;

    if (receiving && (!name || name === 'Conversation')) name = receiving.name;

    sub = active.subtitle || participants.map(c => c.name).join(', ') || 'online';

    // The avatar always reflects the person you're talking to,
    // never the sender of the most recent message.
    avatarChar = receiving || participants[0] || null;
  } else {
    const chars = p.characters;
    const usedIds = new Set(p.messages.filter(m => m.kind === 'msg' && m.senderId).map(m => m.senderId));
    const used = chars.filter(c => usedIds.has(c.id));
    const receiving = chars.find(c => c.side === 'left') || used[0] || null;

    if (used.length >= 3) {
      name = p.settings.groupName || p.title || 'Group chat';
      sub = used.map(c => c.name).join(', ');
      avatarChar = used[0];
    } else if (receiving) {
      name = receiving.name;
      sub = 'online';
      avatarChar = receiving;
    } else {
      name = p.settings.groupName || p.title || 'Conversation';
      sub = 'no messages yet';
      avatarChar = null;
    }
  }

  const av = avatarChar
    ? `<div class="avatar" style="background:${esc(avatarChar.color)}">${esc(avatarChar.initials)}</div>`
    : `<div class="avatar" style="background:#4a5563">?</div>`;

  el.innerHTML = `${av}
    <div class="ch-main">
      <div class="ch-name">${esc(name)}</div>
      <div class="ch-sub">${esc(sub)}</div>
    </div>
    <div class="ch-icons"><span>☎</span><span>⋮</span></div>`;
}

function renderEventHtml(m, p){
  const def = EVENT_DEFS[m.eventType] || EVENT_DEFS.system;
  const cls = 'ev-' + (m.eventType || 'system');
  let text = m.text || '';

  if (m.eventType === 'offline' && m.senderId) {
    text = text || (charName(p, m.senderId) + ' went offline');
  }
  if (m.eventType === 'join' && m.senderId) {
    text = text || (charName(p, m.senderId) + ' joined the conversation');
  }
  if (m.eventType === 'leave' && m.senderId) {
    text = text || (charName(p, m.senderId) + ' left the conversation');
  }
  if (m.eventType === 'chapter' || m.eventType === 'date') {
    return `<div class="chat-event ${cls}">
      <div class="ev-pill">${def.glyph} ${esc(def.label)}</div>
      <div class="ev-text">${esc(text || 'Untitled')}</div>
    </div>`;
  }
  if (m.eventType === 'gap') {
    return `<div class="chat-event ${cls}">
      <div class="ev-pill">${def.glyph} ${esc(text || 'Time gap')}</div>
    </div>`;
  }
  if (m.eventType === 'redacted') {
    return `<div class="chat-event ${cls}">
      <div class="ev-pill">${def.glyph} ${esc(def.label)}</div>
      <div class="ev-text" title="${esc(text)}">${esc(text ? text.replace(/[^\s]/g, '█') : '████████████')}</div>
    </div>`;
  }
  return `<div class="chat-event ${cls}">
    <div class="ev-pill">${def.glyph} ${esc(def.label)}</div>
    ${text ? `<div class="ev-text">${esc(text)}</div>` : ''}
  </div>`;
}

function bubbleStyleFor(skin, color, side){
  let alpha, bdA, radius, tailR, bdW;
  if (side === 'right') { alpha = 0.30; bdA = 0.55; }
  else { alpha = 0.14; bdA = 0.28; }
  radius = 15; tailR = 5; bdW = 1;

  switch (skin) {
    case 'ios':
      alpha = side === 'right' ? 0.92 : 0.20;
      bdA = side === 'right' ? 0.92 : 0.04;
      radius = 20; tailR = 20; bdW = 0;
      break;
    case 'android':
      alpha = side === 'right' ? 0.55 : 0.18;
      bdA = 0; radius = 8; tailR = 2; bdW = 0;
      break;
    case 'retro':
      alpha = side === 'right' ? 0.22 : 0.10;
      bdA = side === 'right' ? 0.7 : 0.4;
      radius = 2; tailR = 2; bdW = 1;
      break;
  }

  return {
    bg: hexToRgba(color, alpha),
    bd: hexToRgba(color, bdA),
    r: radius,
    tail: tailR,
    bw: bdW
  };
}

function renderBubbleHtml(m, c, side, grouped, p, isLastOfRun, index, revealTime){
  const s = p.settings;
  const name = c ? c.name : 'Unknown';
  const initials = c ? c.initials : '?';
  const color = c ? c.color : '#7f8fa6';

  const showAvatars = s.showAvatars;
  const avatarHtml = showAvatars
    ? (grouped ? '<div class="avatar-spacer"></div>'
               : `<div class="avatar" style="background:${esc(color)}">${esc(initials)}</div>`)
    : '';

  const nameHtml = (!grouped && showAvatars)
    ? `<div class="sender-name" style="color:${esc(color)}">${esc(name)}</div>` : '';

  const bs = bubbleStyleFor(s.phoneSkin || 'default', color, side);
  const vars = `--bub-bg:${bs.bg};--bub-bd:${bs.bd};--bub-r:${bs.r}px;--bub-tail:${bs.tail}px;--bub-bw:${bs.bw}px`;

  let meta = '';
  if (isLastOfRun) {
    const timePart = (s.showTimestamps && m.time) ? `<span>${esc(m.time)}</span>` : '';
    const readVisible = m.read && side === 'right' && s.readReceipts &&
                        revealTime != null &&
                        player.vTime >= revealTime + readDelayFor(m);
    const ticks = readVisible ? '<span class="ticks">✓✓</span>' : '';
    if (timePart || ticks) meta = `<div class="bubble-meta">${timePart}${ticks}</div>`;
  }

  return `<div class="msg-row pv ${side}${grouped ? ' grouped' : ''}" data-idx="${index}">
    ${avatarHtml}
    <div class="bubble-col">
      ${nameHtml}
      <div class="bubble" style="${vars}">${esc(m.text)}</div>
      ${meta}
    </div>
  </div>`;
}

function findActiveChat(p, count){
  const n = Math.min(count, p.messages.length);
  let startIdx = 0;
  let name = null;
  let subtitle = '';

  for (let i = n - 1; i >= 0; i--) {
    const m = p.messages[i];
    if (m.kind === 'event' && m.eventType === 'chatswitch') {
      const raw = (m.text || '').trim();
      const parts = raw.split('|').map(s => s.trim());
      name = parts[0] || 'Conversation';
      subtitle = parts[1] || '';
      startIdx = i + 1;
      break;
    }
  }

  const participantIds = new Set();
  let receivingId = null;

  for (let i = startIdx; i < n; i++) {
    const m = p.messages[i];
    if (m.kind === 'msg' && m.senderId) {
      participantIds.add(m.senderId);
      if (!receivingId) {
        const c = p.characters.find(x => x.id === m.senderId);
        if (c && c.side === 'left') receivingId = c.id;
      }
    }
  }

  // Look ahead if this segment hasn't revealed anyone yet (e.g. right after a switch).
  if (!receivingId) {
    for (let i = startIdx; i < p.messages.length; i++) {
      const m = p.messages[i];
      if (m.kind === 'event' && m.eventType === 'chatswitch') break;
      if (m.kind === 'msg' && m.senderId) {
        const c = p.characters.find(x => x.id === m.senderId);
        if (c && c.side === 'left') { receivingId = c.id; break; }
      }
    }
  }

  // Fallback: chatswitch text may name the character directly.
  if (!receivingId && name) {
    const match = p.characters.find(c => c.side === 'left' &&
      c.name.toLowerCase() === name.toLowerCase());
    if (match) receivingId = match.id;
  }

  // No chat switch has occurred yet — default to the first left-side character
  // so the conversation starts with that person, not a group chat title.
  if (!receivingId) {
    const firstLeft = p.characters.find(c => c.side === 'left');
    if (firstLeft) receivingId = firstLeft.id;
  }
  if (!name && receivingId) {
    const rc = p.characters.find(x => x.id === receivingId);
    if (rc) name = rc.name;
  }

  return { startIdx, name, subtitle, participantIds: Array.from(participantIds), receivingId };
}

function buildChatPartners(p){
  // Each left-side character is a "chat" — the person on the other end.
  return p.characters.filter(c => c.side === 'left').map(c => {
    let lastMsg = null;
    for (let i = p.messages.length - 1; i >= 0; i--) {
      const m = p.messages[i];
      if (m.kind === 'msg' && m.senderId === c.id) { lastMsg = m; break; }
    }
    return { char: c, lastMsg };
  });
}

function renderChatListInto(bodyEl, partners, targetIdx){
  bodyEl.innerHTML = partners.map((pt, i) => {
    const c = pt.char;
    const preview = pt.lastMsg ? (pt.lastMsg.text || '…') : 'No messages yet';
    const time = pt.lastMsg && pt.lastMsg.time ? pt.lastMsg.time : '';
    return `<div class="list-row" data-row="${i}">
      <div class="avatar" style="background:${esc(c.color)}">${esc(c.initials)}</div>
      <div class="lr-main">
        <div class="lr-name">${esc(c.name)}</div>
        <div class="lr-preview">${esc(preview)}</div>
      </div>
      <div class="lr-meta">${esc(time)}</div>
    </div>`;
  }).join('');
}

function paintChat(bodyEl, p, count, opts){
  opts = opts || {};
  const s = p.settings;
  const chars = charMap(p);
  const active = opts.activeChat || findActiveChat(p, count);
  const startIdx = active.startIdx;
  const endIdx = Math.max(startIdx, Math.min(count, p.messages.length));
  const sched = computeSchedule();

  let html = '';
  let prevSender = null;
  let prevKind = null;
  let lastDay = null;

  for (let abs = startIdx; abs < endIdx; abs++) {
    const m = p.messages[abs];

    if (m.kind === 'event') {
      if (m.eventType === 'chatswitch') continue; // never rendered in the bubble list
      html += renderEventHtml(m, p);
      prevSender = null;
      prevKind = 'event';
      continue;
    }

    const c = chars[m.senderId];
    const side = c ? (c.side || 'left') : 'left';

    const day = dayKeyFor(m.time);
    if (day && day !== lastDay) {
      html += `<div class="date-sep"><span>${esc(day)}</span></div>`;
      lastDay = day;
    }

    const grouped = (prevSender === m.senderId && prevKind === 'msg');
    const nextInRange = abs + 1 < endIdx;
    const next = nextInRange ? p.messages[abs + 1] : null;
    const isLastOfRun = !nextInRange || !next || next.kind !== 'msg' || next.senderId !== m.senderId;

    html += renderBubbleHtml(m, c, side, grouped, p, isLastOfRun, abs,
                             sched[abs] != null ? sched[abs] : 0);
    prevSender = m.senderId;
    prevKind = 'msg';
  }

  if (!html) {
    html = `<div class="chat-empty">No messages yet.<br>Add a message in the script editor to begin.</div>`;
  }

  const prevChatStart = bodyEl.dataset.chatStart ? parseInt(bodyEl.dataset.chatStart, 10) : -1;
  const prevScroll = bodyEl.scrollTop;
  bodyEl.innerHTML = html;

  if (active.startIdx === prevChatStart) {
    bodyEl.scrollTop = prevScroll;
  } else {
    bodyEl.scrollTop = 0;
    bodyEl.dataset.chatStart = String(active.startIdx);
  }
}

/* --- Typing state: dots first, then the text types into the composer --- */
/* --- Punctuation-aware typing weights, cached per message text --- */
const TYPE_CHAR_MS = 210;              // left-side dots window pace
const COMPOSER_MS_PER_WEIGHT = 120;    // right-side composer typing pace
const SEND_GAP_MS = 320;               // short beat from typing → send
const typingWeightCache = new Map();
const typingDurCache = new Map();
const composerDurCache = new Map();

function getTypingWeights(full){
  let entry = typingWeightCache.get(full);
  if (entry) return entry;

  const weights = new Array(full.length);
  let total = 0;
  let prev = '';
  for (let i = 0; i < full.length; i++) {
    const ch = full[i];
    let w = 0.92 + hash01(full + '#' + i) * 0.28;
    if (prev === '.' || prev === '!' || prev === '?' ||
        prev === ',' || prev === ';' || prev === ':') {
      w += 1.5;
    } else if (prev === '…') {
      w += 1.9;
    } else if (prev === '\n') {
      w += 1.6;
    } else if (prev === '—' || prev === '-') {
      w += 0.6;
    }
    weights[i] = w;
    total += w;
    prev = ch;
  }

  entry = { weights, total, dur: Math.min(26000, total * TYPE_CHAR_MS) };
  if (typingWeightCache.size > 300) typingWeightCache.clear();
  typingWeightCache.set(full, entry);
  return entry;
}

function normalizeTypingText(m){
  return (m && m.text ? String(m.text) : '').replace(/\s+/g, ' ').trim();
}

function typingDurationFor(m, s){
  if (!s || !s.typing) return 0;
  if (!m || m.kind !== 'msg' || !m.typing) return 0;
  const hit = typingDurCache.get(m.id);
  if (hit && hit.text === m.text) return hit.dur;
  const full = normalizeTypingText(m);
  const dur = full ? getTypingWeights(full).dur : 0;
  typingDurCache.set(m.id, { text: m.text, dur });
  if (typingDurCache.size > 500) typingDurCache.clear();
  return dur;
}

function composerDurationFor(m, s){
  if (!s || !s.typing) return 0;
  if (!m || m.kind !== 'msg' || !m.typing) return 0;
  const hit = composerDurCache.get(m.id);
  if (hit && hit.text === m.text) return hit.dur;
  const full = normalizeTypingText(m);
  const dur = full ? Math.min(18000, getTypingWeights(full).total * COMPOSER_MS_PER_WEIGHT) : 0;
  composerDurCache.set(m.id, { text: m.text, dur });
  if (composerDurCache.size > 500) composerDurCache.clear();
  return dur;
}

function readDelayFor(m){
  // Stable 400–2000 ms so read receipts land a beat after the message,
  // not all at once and never at the same instant as the message itself.
  return 400 + hash01((m && m.id ? m.id : '') + ':read') * 1600;
}

function computeTypingState(p){
  if (!p.settings.typing) return null;
  if (player.vTime <= 0) return null;

  const idx = player.revealed;
  if (idx >= p.messages.length) return null;

  const next = p.messages[idx];
  if (!next || next.kind !== 'msg' || !next.typing) return null;

  const full = normalizeTypingText(next);
  if (!full) return null;

  const sched = computeSchedule();
  const revealAt = sched[idx] != null ? sched[idx] : 0;
  const prevReveal = idx > 0 ? (sched[idx - 1] || 0) : 0;

  const { weights, total } = getTypingWeights(full);
  const char = p.characters.find(c => c.id === next.senderId) || null;
  const isRightSide = !!(char && char.side === 'right');

  // Left-side senders: bounce the dots bubble for the full window.
  if (!isRightSide) {
    const dur = typingDurationFor(next, p.settings) || getTypingWeights(full).dur;
    const win = dur + 300;
    const start = Math.max(prevReveal, revealAt - win);
    if (player.vTime < start || player.vTime >= revealAt) return null;
    return { char, phase: 'dots', shown: '', full };
  }

  // Right-side sender: type into the composer, then send soon after.
  const composerDur = composerDurationFor(next, p.settings);
  const typeStart = Math.max(prevReveal, revealAt - SEND_GAP_MS - composerDur);
  const typeEnd = typeStart + composerDur;

  if (player.vTime < typeStart || player.vTime >= revealAt) return null;

  if (player.vTime >= typeEnd) {
    return { char, phase: 'text', shown: full, full };
  }

  const prog = (player.vTime - typeStart) / Math.max(1, typeEnd - typeStart);
  const target = prog * total;
  let shown = 0, acc = 0;
  while (shown < full.length && acc + weights[shown] <= target) {
    acc += weights[shown];
    shown++;
  }
  return { char, phase: 'text', shown: full.slice(0, shown), full };
}

function updateTypingUI(bodyEl, fieldEl, p){
  if (!bodyEl || !fieldEl) return;
  const st = computeTypingState(p);
  let row = bodyEl.querySelector('.typing-row');

  /* Nothing typing — clear everything */
  if (!st) {
    if (row) row.remove();
    if (fieldEl.dataset.typing === '1') {
      fieldEl.classList.remove('typing');
      fieldEl.style.color = '';
      fieldEl.textContent = 'Message…';
      delete fieldEl.dataset.typing;
      delete fieldEl.dataset.shown;
    }
    return;
  }

  const color = st.char ? st.char.color : '#7f8fa6';
  const name = st.char ? st.char.name : 'Someone';

  /* Phase 1 — animated dots bubble */
  if (st.phase === 'dots') {
    if (fieldEl.dataset.typing === '1') {
      fieldEl.classList.remove('typing');
      fieldEl.style.color = '';
      fieldEl.textContent = 'Message…';
      delete fieldEl.dataset.typing;
      delete fieldEl.dataset.shown;
    }
    const sig = name + '|' + color;
    if (!row) {
      row = document.createElement('div');
      row.className = 'typing-row';
      bodyEl.appendChild(row);
    }
    if (row.dataset.sig !== sig) {
      row.innerHTML =
        '<div class="avatar" style="background:' + esc(color) + '">' +
          esc(st.char ? st.char.initials : '?') +
        '</div>' +
        '<div><div class="typing-name">' + esc(name) + ' is typing…</div>' +
        '<div class="typing-bubble"><i></i><i></i><i></i></div></div>';
      row.dataset.sig = sig;
      if (p.settings.autoScroll) scrollChatToBottom(bodyEl);
    }
    return;
  }

  /* Phase 2 — the message is being typed into the composer box */
  if (row) row.remove();

  fieldEl.dataset.typing = '1';
  fieldEl.classList.add('typing');
  fieldEl.style.color = color;

  if (fieldEl.dataset.shown !== st.shown) {
    fieldEl.dataset.shown = st.shown;
    fieldEl.innerHTML = '';
    const t = document.createElement('span');
    t.textContent = st.shown;
    const caret = document.createElement('span');
    caret.className = 'caret';
    fieldEl.appendChild(t);
    fieldEl.appendChild(caret);
    fieldEl.scrollLeft = fieldEl.scrollWidth;
  }
}

function scrollChatToBottom(el){
  if (!el) return;
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function computeNextReadAt(p, vTime, revealedCount){
  const sched = computeSchedule();
  let next = Infinity;
  for (let i = 0; i < revealedCount; i++) {
    const m = p.messages[i];
    if (!m || m.kind !== 'msg' || !m.read) continue;
    const c = p.characters.find(x => x.id === m.senderId);
    if (!c || c.side !== 'right') continue;
    const t = (sched[i] || 0) + readDelayFor(m);
    if (t > vTime && t < next) next = t;
  }
  return next;
}

let lastActiveChatStart = -1;
let navAnim = null;

function triggerNavAnim(ctx, oldHeader, oldBody, oldScroll, active, p){
  if (navAnim) return;
  const { stack, pane, listBody } = ctx;
  if (!stack || !pane || !listBody) return;

  // One row per receiving character.
  const partners = buildChatPartners(p);
  if (!partners.length) return;

  let targetIdx = -1;
  if (active.receivingId) {
    targetIdx = partners.findIndex(pt => pt.char.id === active.receivingId);
  }
  if (targetIdx < 0) targetIdx = 0; // safety fallback

  const speedScale = Math.max(0.35, 1 / Math.max(1, player.speed));

  // ---- Ghost of the outgoing chat ----
  const ghost = document.createElement('div');
  ghost.className = 'chat-pane ghost';
  ghost.innerHTML =
    '<div class="chat-header">' + oldHeader + '</div>' +
    '<div class="chat-body">' + oldBody + '</div>' +
    '<div class="chat-input"><div class="ci-field">Message…</div><div class="ci-send">➤</div></div>';
  stack.appendChild(ghost);

  // ---- Inbox: every receiving character ----
  renderChatListInto(listBody, partners, targetIdx);
  const targetRow = listBody.querySelector('.list-row[data-row="' + targetIdx + '"]');
  if (targetRow && targetRow.scrollIntoView) targetRow.scrollIntoView({ block: 'nearest' });

  // ---- Prepare the new chat pane off-screen right ----
  pane.style.transition = 'none';
  pane.style.transform = 'translateX(100%)';

  void ghost.offsetWidth;
  const ghostBody = ghost.querySelector('.chat-body');
  if (ghostBody) ghostBody.scrollTop = oldScroll;

  navAnim = { phase: 'out' };

  const T1   = Math.round(380 * speedScale);
  const HOLD = Math.round(700 * speedScale);
  const T2   = Math.round(420 * speedScale);

  ghost.style.transition = 'transform ' + T1 + 'ms cubic-bezier(0.4,0,0.2,1)';
  ghost.style.transform = 'translateX(100%)';

  setTimeout(() => {
    if (targetRow) targetRow.classList.add('tap');

    setTimeout(() => {
      pane.style.transition = 'transform ' + T2 + 'ms cubic-bezier(0.4,0,0.2,1)';
      pane.style.transform = 'translateX(0)';

      setTimeout(() => {
        if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
        pane.style.transition = '';
        pane.style.transform = '';
        if (targetRow) targetRow.classList.remove('tap');
        navAnim = null;
      }, T2 + 40);
    }, HOLD);
  }, T1 + 20);
}

function renderPreview(){
  const p = current();
  const count = player.revealed;

  const grew = player.revealed !== player.lastRevealed;
  player.lastRevealed = player.revealed;

  const active = findActiveChat(p, count);
  const chatChanged = active.startIdx !== lastActiveChatStart;
  const shouldAnimate = grew && chatChanged && !navAnim && active.startIdx > 0 && player.playing;
  const useFullscreen = E.fsOverlay.classList.contains('open');

  // Capture outgoing chat BEFORE we overwrite it
  let oldHeader = null, oldBody = null, oldScroll = 0;
  if (shouldAnimate) {
    const hSrc = useFullscreen ? E.fsHeader : E.chatHeader;
    const bSrc = useFullscreen ? E.fsBody   : E.chatBody;
    oldHeader = hSrc.innerHTML;
    oldBody   = bSrc.innerHTML;
    oldScroll = bSrc.scrollTop;
  }

  lastActiveChatStart = active.startIdx;

  // Normal rendering (safe even while the animation is running)
  paintChat(E.chatBody, p, count, { activeChat: active });
  renderHeaderInto(E.chatHeader, p, active);
  updateTypingUI(E.chatBody, E.composerField, p);

  const themeKey = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const bgSet = CHAT_BG[p.settings.chatBg] || CHAT_BG.default;
  E.device.style.setProperty('--chatbg', bgSet[themeKey]);
  E.device.className = 'device ' + (p.settings.viewMode === 'desktop' ? 'desktop' : 'phone');
  E.device.dataset.skin = p.settings.phoneSkin || 'default';
  if (E.fsOverlay) E.fsOverlay.dataset.skin = p.settings.phoneSkin || 'default';

  if (grew && p.settings.autoScroll) {
    scrollChatToBottom(E.chatBody);
  }

  if (useFullscreen) {
    paintChat(E.fsBody, p, count, { activeChat: active });
    renderHeaderInto(E.fsHeader, p, active);
    updateTypingUI(E.fsBody, E.fsComposerField, p);
    if (p.settings.autoScroll) scrollChatToBottom(E.fsBody);

    if (grew && player.revealed > 0) {
      const last = p.messages[player.revealed - 1];
      if (last && last.kind === 'event' && (last.eventType === 'chapter' || last.eventType === 'date')) {
        showIntertitle(last.text || 'Untitled');
      }
    }
  }

  // Fire the navigation animation for whichever surface is visible
  if (shouldAnimate) {
    if (useFullscreen) {
      triggerNavAnim({
        stack: E.fsChatStack,
        pane:  E.fsChatPane,
        listBody: E.fsListBody
      }, oldHeader, oldBody, oldScroll, active, p);
    } else {
      triggerNavAnim({
        stack: E.chatStack,
        pane:  E.chatPane,
        listBody: E.listBody
      }, oldHeader, oldBody, oldScroll, active, p);
    }
  }

  player.nextReadAt = computeNextReadAt(p, player.vTime, player.revealed);
}

let intertitleTimer = null;
function showIntertitle(text){
  E.itTitle.textContent = text;
  E.fsIntertitle.classList.add('show');
  clearTimeout(intertitleTimer);
  intertitleTimer = setTimeout(() => E.fsIntertitle.classList.remove('show'), 2400);
}

/* ---------------------------------------------------------------
   11. SIDEBAR RENDERING
   --------------------------------------------------------------- */
function renderCharacters(){
  const p = current();
  if (!p.characters.length) {
    E.charList.innerHTML = `<div class="empty-small">No characters yet. Add one to start writing.</div>`;
    return;
  }
  E.charList.innerHTML = p.characters.map(c => `
    <div class="char-item" data-cid="${esc(c.id)}">
      <div class="avatar" style="background:${esc(c.color)}">${esc(c.initials)}</div>
      <div class="ci-main">
        <div class="ci-name">${esc(c.name)}</div>
        <div class="ci-desc">${esc(c.description || (c.side === 'right' ? 'right side' : 'left side'))}</div>
      </div>
      <div class="ci-actions">
        <button data-act="edit" title="Edit character">✎</button>
        <button data-act="del" title="Delete character">✕</button>
      </div>
    </div>`).join('');
}

function renderChapters(){
  const p = current();
  const items = [];
  p.messages.forEach((m, i) => {
    if (m.kind === 'event' && (m.eventType === 'chapter' || m.eventType === 'date' || m.eventType === 'chatswitch')) {
      const glyph = m.eventType === 'chatswitch' ? '⇄ ' : '';
      items.push({ i, text: glyph + (m.text || 'Untitled') });
    }
  });
  if (!items.length) {
    E.chapterList.innerHTML = `<div class="empty-small">No chapter markers yet.</div>`;
    return;
  }
  E.chapterList.innerHTML = items.map(it =>
    `<button class="chapter-item" data-jump="${it.i}">${esc(it.text)}</button>`).join('');
}

function renderFilter(){
  const p = current();
  const cur = ui.filter;
  let html = `<option value="all">All senders</option>`;
  p.characters.forEach(c => {
    html += `<option value="${esc(c.id)}">${esc(c.name)}</option>`;
  });
  E.filterSelect.innerHTML = html;
  E.filterSelect.value = p.characters.some(c => c.id === cur) ? cur : 'all';
  ui.filter = E.filterSelect.value;
}

/* ---------------------------------------------------------------
   12. MESSAGE LIST RENDERING
   --------------------------------------------------------------- */
function renderMessages(){
  const p = current();
  const chars = charMap(p);
  const q = ui.search.trim().toLowerCase();
  const filter = ui.filter;

  if (!p.messages.length) {
    E.msgList.innerHTML = `<div class="empty-state">
      <div class="big">▤</div>
      <h3>Your script is empty</h3>
      <p>Add your first message, or open the <strong>Text Script Editor</strong> to paste a script in one go. You can also load the sample project from the sidebar.</p>
      <button class="btn primary" id="emptyAddBtn">+ Add first message</button>
    </div>`;
    const b = $('#emptyAddBtn');
    if (b) b.addEventListener('click', () => openMessageModal(null, null));
    return;
  }

  let html = '';
  let shown = 0;

  p.messages.forEach((m, i) => {
    const isEvent = m.kind === 'event';
    const c = chars[m.senderId];
    const senderName = isEvent ? 'Event' : (c ? c.name : 'Unknown sender');
    const color = c ? c.color : '#7f8fa6';

    if (filter !== 'all' && m.senderId !== filter) return;
    if (q) {
      const hay = ((m.text || '') + ' ' + senderName + ' ' + (m.time || '')).toLowerCase();
      if (!hay.includes(q)) return;
    }
    shown++;

    const av = isEvent
      ? `<div class="avatar" style="background:#4a4331;font-size:11px">${esc((EVENT_DEFS[m.eventType] || EVENT_DEFS.system).glyph)}</div>`
      : `<div class="avatar" style="background:${esc(color)}">${esc(c ? c.initials : '?')}</div>`;

    const badges = [];
    if (isEvent) badges.push(`<span class="badge ev">${esc((EVENT_DEFS[m.eventType] || EVENT_DEFS.system).label)}</span>`);
    if (!isEvent) {
      if (m.typing) badges.push('<span class="badge">typing</span>');
      if (m.read) badges.push('<span class="badge">read</span>');
    }
    if (m.delay) badges.push(`<span class="badge">${m.delay}ms</span>`);

    const textDisplay = m.text
      ? esc(m.text)
      : `<span class="dim">(no text)</span>`;

    html += `<div class="msg-row" draggable="true" data-index="${i}" data-id="${esc(m.id)}">
      <div class="drag-handle">⋮⋮</div>
      <div class="num">${i + 1}</div>
      ${av}
      <div class="body">
        <div class="head">
          <span class="nm" style="color:${isEvent ? 'var(--text2)' : esc(color)}">${esc(senderName)}</span>
          ${m.time ? `<span class="tm">${esc(m.time)}</span>` : ''}
          ${badges.join('')}
        </div>
        <div class="txt">${textDisplay}</div>
      </div>
      <div class="actions">
        <button data-act="up" title="Move up">▲</button>
        <button data-act="down" title="Move down">▼</button>
        <button data-act="insert" title="Insert after">＋</button>
        <button data-act="dup" title="Duplicate">⧉</button>
        <button data-act="edit" title="Edit">✎</button>
        <button data-act="del" class="del" title="Delete">✕</button>
      </div>
    </div>`;
  });

  if (!shown) {
    html = `<div class="empty-state">
      <div class="big">⌕</div>
      <h3>No messages match</h3>
      <p>Try clearing the search box or choosing a different sender filter.</p>
    </div>`;
  }

  E.msgList.innerHTML = html;
}

/* ---------------------------------------------------------------
   13. PLAYBAR RENDERING
   --------------------------------------------------------------- */
function updatePlaybar(){
  const p = current();
  const total = p.messages.length;
  const dur = totalDuration();
  const pct = dur > 0 ? (player.vTime / dur) : 0;

  if (document.activeElement !== E.progress) {
    E.progress.value = Math.round(pct * 1000);
  }
  if (E.fsProgress && document.activeElement !== E.fsProgress) {
    E.fsProgress.value = Math.round(pct * 1000);
  }

  E.pbCount.textContent = player.revealed + ' / ' + total;
  if (E.fsCount) E.fsCount.textContent = player.revealed + ' / ' + total;
  E.btnPlay.textContent = player.playing ? '⏸' : '▶';
  if (E.fsPlay) E.fsPlay.textContent = player.playing ? '⏸ Pause' : '▶ Play';

  E.tgAutoScroll.classList.toggle('on', !!p.settings.autoScroll);
  E.tgTyping.classList.toggle('on', !!p.settings.typing);
  E.tgSound.classList.toggle('on', !!p.settings.sounds);

  E.btnUndo.style.opacity = undoStack.length ? 1 : 0.35;
  E.btnRedo.style.opacity = redoStack.length ? 1 : 0.35;
}

/* ---------------------------------------------------------------
   14. MASTER RENDER
   --------------------------------------------------------------- */
function applyTheme(){
  const p = current();
  document.documentElement.setAttribute('data-theme', p.settings.theme === 'light' ? 'light' : 'dark');
}

function render(){
  const p = current();

  applyTheme();

  if (document.activeElement !== E.projName) E.projName.value = p.name;
  E.projPill.textContent = p.name;
  document.title = p.name + ' — Threadwright';

  renderCharacters();
  renderChapters();
  renderFilter();
  renderMessages();
  renderPreview();
  updatePlaybar();
}

let modalCloseFn = null;

function showModal(opts){
  const root = E.modalRoot;
  root.innerHTML = `<div class="modal-backdrop" data-backdrop>
    <div class="modal${opts.wide ? ' wide' : ''}" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>${esc(opts.title)}</h3>
        <button class="icon-btn" data-close title="Close">✕</button>
      </div>
      <div class="modal-body">${opts.body}</div>
      ${opts.footer ? `<div class="modal-foot">${opts.footer}</div>` : ''}
    </div>
  </div>`;
  root.classList.add('open');

  const close = () => {
    root.classList.remove('open');
    root.innerHTML = '';
    modalCloseFn = null;
  };
  modalCloseFn = close;

  root.querySelector('[data-close]').addEventListener('click', close);
  const bd = root.querySelector('[data-backdrop]');
  bd.addEventListener('mousedown', (e) => { if (e.target === bd) close(); });

  if (opts.onMount) opts.onMount(close);
  return close;
}

/* ---------------------------------------------------------------
   19. TEXT SCRIPT: SERIALIZE / PARSE
   --------------------------------------------------------------- */
function toTextScript(p){
  const lines = [];
  p.messages.forEach(m => {
    if (m.kind === 'event') {
      const rest = (m.text || '').replace(/\n/g, '\n  ');
      lines.push('!' + m.eventType + (rest ? ' ' + rest : ''));
      return;
    }
    const name = charName(p, m.senderId);
    const time = m.time ? `[${m.time}] ` : '';
    const body = (m.text || '').replace(/\n/g, '\n  ');
    lines.push(`${time}${name}: ${body}`);
  });
  return lines.join('\n');
}

function parseTextScript(text, baseProject){
  const p = clone(baseProject);
  const errors = [];
  const lines = String(text).split(/\r?\n/);
  let lastMsg = null;
  let parsed = 0;

  function findChar(name){
    return p.characters.find(c => c.name.toLowerCase() === name.toLowerCase());
  }
  function ensureChar(name){
    let c = findChar(name);
    if (!c) {
      c = {
        id: uid(),
        name: name,
        initials: initialsFor(name),
        color: PALETTE[p.characters.length % PALETTE.length],
        side: p.characters.length === 0 ? 'right' : 'left',
        description: ''
      };
      p.characters.push(c);
    }
    return c;
  }

  const newMessages = [];

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const lineNo = i + 1;

    if (!raw.trim()) continue;

    // continuation line (starts with whitespace)
    if (/^\s+\S/.test(raw)) {
      if (newMessages.length) {
        const prev = newMessages[newMessages.length - 1];
        prev.text = (prev.text ? prev.text + '\n' : '') + raw.replace(/^\s{1,2}/, '');
      } else {
        errors.push(`Line ${lineNo}: continuation line without a preceding message.`);
      }
      continue;
    }

    const trimmed = raw.trim();

    // Event line
    if (trimmed.startsWith('!')) {
      const m = trimmed.match(/^!(\w+)\s*([\s\S]*)$/);
      if (!m || !EVENT_DEFS[m[1]]) {
        errors.push(`Line ${lineNo}: unknown event type in "${trimmed}".`);
        continue;
      }
      const type = m[1];
      let rest = (m[2] || '').trim();
      let senderId = null;

      if (['join', 'leave', 'offline', 'delete', 'edit', 'file'].includes(type)) {
        const idx = rest.indexOf(':');
        if (idx > 0) {
          const maybeName = rest.slice(0, idx).trim();
          const ch = findChar(maybeName);
          if (ch) { senderId = ch.id; rest = rest.slice(idx + 1).trim(); }
        }
      }

      newMessages.push(makeMessage({
        kind: 'event',
        eventType: type,
        text: rest,
        senderId: senderId,
        delay: p.settings.defaultDelay,
        typing: false,
        read: false
      }));
      parsed++;
      continue;
    }

    // Message line: [time] Name: text
    let time = '';
    let rest = trimmed;
    const tm = trimmed.match(/^\[([^\]]*)\]\s*([\s\S]*)$/);
    if (tm) { time = tm[1].trim(); rest = tm[2]; }

    const nm = rest.match(/^([^:]{1,80}):\s*([\s\S]*)$/);
    if (!nm) {
      if (newMessages.length) {
        const prev = newMessages[newMessages.length - 1];
        if (prev.kind === 'msg') {
          prev.text = (prev.text ? prev.text + '\n' : '') + trimmed;
          continue;
        }
      }
      errors.push(`Line ${lineNo}: could not read "${trimmed.slice(0, 60)}". Expected "Name: message" or "[time] Name: message".`);
      continue;
    }

    const senderName = nm[1].trim();
    const bodyText = nm[2];

    if (!senderName) {
      errors.push(`Line ${lineNo}: missing character name.`);
      continue;
    }

    const ch = ensureChar(senderName);
    newMessages.push(makeMessage({
      kind: 'msg',
      senderId: ch.id,
      text: bodyText,
      time: time,
      delay: p.settings.defaultDelay,
      typing: p.settings.typing,
      read: p.settings.readReceipts
    }));
    parsed++;
  }

  return { project: p, messages: newMessages, errors, parsed };
}

      const root = E.modalRoot;
      $('[data-cancel]', root).addEventListener('click', close);

      $('#pNew', root).addEventListener('click', () => {
        const name = prompt('Project name:', 'New Project');
        if (name === null) return;
        const p = makeProject(name.trim() || 'New Project');
        p.characters = [
          { id: uid(), name: 'Me', initials: 'ME', color: PALETTE[0], side: 'right', description: '' },
          { id: uid(), name: 'Them', initials: 'TH', color: PALETTE[1], side: 'left', description: '' }
        ];
        db.projects.push(p);
        db.currentId = p.id;
        undoStack = []; redoStack = [];
        restart();
        saveDB();
        render();
        close();
      });

      $('#projList', root).addEventListener('click', (e) => {
        const openBtn = e.target.closest('[data-open]');
        const dupBtn  = e.target.closest('[data-dupe]');
        const delBtn  = e.target.closest('[data-del]');

        if (openBtn) {
          db.currentId = openBtn.dataset.open;
          undoStack = []; redoStack = [];
          restart();
          saveDB();
          render();
          close();
        }
        if (dupBtn) {
          const src = db.projects.find(x => x.id === dupBtn.dataset.dupe);
          if (!src) return;
          const copy = clone(src);
          copy.id = uid();
          copy.name = src.name + ' (copy)';
          copy.createdAt = Date.now();
          copy.updatedAt = Date.now();
          copy.messages.forEach(m => m.id = uid());
          copy.characters.forEach(c => c.id = uid());
          // remap sender ids
          const map = {};
          src.characters.forEach((c, i) => map[c.id] = copy.characters[i].id);
          copy.messages.forEach(m => { if (m.senderId) m.senderId = map[m.senderId] || null; });
          db.projects.push(copy);
          saveDB();
          $('#projList', root).innerHTML = buildBody();
          render();
        }
        if (delBtn) {
          const id = delBtn.dataset.del;
          if (db.projects.length <= 1) { alert('You must keep at least one project.'); return; }
          const target = db.projects.find(x => x.id === id);
          if (!confirm(`Delete project "${target.name}"? This cannot be undone.`)) return;
          db.projects = db.projects.filter(x => x.id !== id);
          if (db.currentId === id) {
            db.currentId = db.projects[0].id;
            undoStack = []; redoStack = [];
            restart();
          }
          saveDB();
          $('#projList', root).innerHTML = buildBody();
          render();
        }
      });
    }
  });
}

function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}

function safeName(s){
  return String(s || 'project').replace(/[^a-z0-9\-_ ]/gi, '').trim().replace(/\s+/g, '-') || 'project';
}

function exportJSON(){
  const p = current();
  download(safeName(p.name) + '.json', JSON.stringify(p, null, 2), 'application/json');
}

function importJSON(){
  const input = E.filePicker;
  input.value = '';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || !Array.isArray(obj.messages) || !Array.isArray(obj.characters)) {
          throw new Error('Not a Threadwright project file.');
        }
        const p = normalizeProject(obj);
        p.id = uid(); // avoid clobbering an existing project
        p.name = p.name || file.name.replace(/\.json$/i, '');
        db.projects.push(p);
        db.currentId = p.id;
        undoStack = []; redoStack = [];
        restart();
        saveDB();
        render();
      } catch (err) {
        alert('Could not import this file:\n' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function copyScript(){
  const text = toTextScript(current());
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => toast('Script copied to clipboard'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('Script copied to clipboard'); }
  catch (e) { alert('Copy failed — your browser blocked clipboard access.'); }
  document.body.removeChild(ta);
}

let toastTimer = null;
function toast(msg){
  let el = $('#toastEl');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toastEl';
    el.style.cssText = 'position:fixed;left:50%;bottom:78px;transform:translateX(-50%);' +
      'background:var(--panel3);border:1px solid var(--border2);color:var(--text);' +
      'padding:9px 16px;border-radius:9px;font-size:12.5px;z-index:500;' +
      'box-shadow:var(--shadow);opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.transform = 'translateX(-50%) translateY(-6px)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(0)';
  }, 1900);
}
