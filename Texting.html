function wireEvents(){
  /* ---- Top bar ---- */
  E.projName.addEventListener('input', () => {
    current().name = E.projName.value || 'Untitled Project';
    E.projPill.textContent = current().name;
    scheduleSave();
  });
  E.projName.addEventListener('blur', () => { if (!E.projName.value.trim()) { E.projName.value = 'Untitled Project'; current().name = 'Untitled Project'; E.projPill.textContent = 'Untitled Project'; scheduleSave(); } });

  E.projPill.addEventListener('click', openProjectsModal);
  $('#btnTheme').addEventListener('click', () => {
    commit(() => {
      const p = current();
      p.settings.theme = p.settings.theme === 'light' ? 'dark' : 'light';
    });
  });
  $('#btnHelp').addEventListener('click', openHelp);
  $('#btnSettingsTop').addEventListener('click', openSettings);
  $('#btnSettings').addEventListener('click', openSettings);

  /* ---- Mobile tabs ---- */
  $('#mobileTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    E.app.setAttribute('data-mtab', b.dataset.tab);
    $$('#mobileTabs button').forEach(x => x.classList.toggle('active', x === b));
  });

  /* ---- Sidebar ---- */
  $('#btnNewProject').addEventListener('click', () => {
    const name = prompt('Project name:', 'New Project');
    if (name === null) return;
    const p = makeProject(name.trim() || 'New Project');
    p.characters = [
      { id: uid(), name: 'Me', initials: 'ME', color: PALETTE[0], side: 'right', description: '' },
      { id: uid(), name: 'Them', initials: 'TH', color: PALETTE[1], side: 'left', description: '' }
    ];
    db.projects.push(p);
    db.currentId = p.id;
    undoStack = []; redoStack = [];
    restart();
    saveDB();
    render();
  });

  $('#btnDupProject').addEventListener('click', () => {
    const src = current();
    const copy = clone(src);
    copy.id = uid();
    copy.name = src.name + ' (copy)';
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    const map = {};
    copy.characters.forEach(c => { const nid = uid(); map[c.id] = nid; c.id = nid; });
    copy.messages.forEach(m => { m.id = uid(); if (m.senderId) m.senderId = map[m.senderId] || null; });
    db.projects.push(copy);
    db.currentId = copy.id;
    undoStack = []; redoStack = [];
    restart();
    saveDB();
    render();
  });

  $('#btnOpenProjects').addEventListener('click', openProjectsModal);

  $('#btnDeleteProject').addEventListener('click', () => {
    if (db.projects.length <= 1) { alert('You must keep at least one project.'); return; }
    const p = current();
    if (!confirm(`Delete project "${p.name}"? This cannot be undone.`)) return;
    db.projects = db.projects.filter(x => x.id !== p.id);
    db.currentId = db.projects[0].id;
    undoStack = []; redoStack = [];
    restart();
    saveDB();
    render();
  });

  $('#btnAddChar').addEventListener('click', () => openCharacterModal(null));

  E.charList.addEventListener('click', (e) => {
    const item = e.target.closest('[data-cid]');
    if (!item) return;
    const cid = item.dataset.cid;
    const act = e.target.closest('button');
    if (act && act.dataset.act === 'edit') { openCharacterModal(cid); return; }
    if (act && act.dataset.act === 'del') {
      const used = current().messages.filter(m => m.senderId === cid).length;
      const ch = current().characters.find(c => c.id === cid);
      if (used > 0) {
        if (!confirm(`"${ch.name}" has ${used} message${used > 1 ? 's' : ''}. Deleting leaves them without a sender. Continue?`)) return;
      } else {
        if (!confirm(`Delete character "${ch.name}"?`)) return;
      }
      commit(() => { current().characters = current().characters.filter(c => c.id !== cid); });
      return;
    }
    openCharacterModal(cid);
  });

  $('#btnAddChapter').addEventListener('click', () => {
    const title = prompt('Chapter title:', 'NEW CHAPTER');
    if (title === null) return;
    commit(() => {
      const p = current();
      p.messages.push(makeMessage({
        kind: 'event',
        eventType: 'chapter',
        text: title.trim() || 'NEW CHAPTER',
        delay: p.settings.defaultDelay,
        typing: false,
        read: false
      }));
    });
    E.app.setAttribute('data-mtab', 'script');
    $$('#mobileTabs button').forEach(x => x.classList.toggle('active', x.dataset.tab === 'script'));
  });

  E.chapterList.addEventListener('click', (e) => {
    const b = e.target.closest('[data-jump]');
    if (!b) return;
    const idx = parseInt(b.dataset.jump, 10);
    const sched = computeSchedule();
    player.playing = false;
    setPlayerTime((sched[idx] || 0) + 1);
    highlightEditorRow(idx);
  });

  $('#btnTextEditor').addEventListener('click', openTextEditor);
  $('#btnExportJson').addEventListener('click', exportJSON);
  $('#btnImportJson').addEventListener('click', importJSON);
  $('#btnExportText').addEventListener('click', () => {
    const p = current();
    download(safeName(p.name) + '-script.txt', toTextScript(p));
  });
  $('#btnCopyScript').addEventListener('click', copyScript);
  $('#btnLoadSample').addEventListener('click', () => {
    if (!confirm('Load the sample project? A copy will be added to your project list.')) return;
    const p = sampleProject();
    p.id = uid();
    p.name = p.name + ' (sample)';
    db.projects.push(p);
    db.currentId = p.id;
    undoStack = []; redoStack = [];
    restart();
    saveDB();
    render();
  });

  /* ---- Editor toolbar ---- */
  $('#btnAddMsg').addEventListener('click', () => openMessageModal(null, null));
  $('#btnAddEvent').addEventListener('click', () => {
    const p = current();
    if (!p.characters.length && !confirm('You have no characters yet. Create a special event anyway?')) return;
    const m = makeMessage({
      kind: 'event',
      eventType: 'system',
      delay: p.settings.defaultDelay,
      typing: false,
      read: false
    });
    commit(() => { current().messages.push(m); });
    openMessageModal(current().messages.length - 1, null);
  });

  E.btnUndo.addEventListener('click', undo);
  E.btnRedo.addEventListener('click', redo);

  E.searchInput.addEventListener('input', () => {
    ui.search = E.searchInput.value;
    renderMessages();
  });

  E.filterSelect.addEventListener('change', () => {
    ui.filter = E.filterSelect.value;
    renderMessages();
  });

  E.jumpInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const n = parseInt(E.jumpInput.value, 10);
    if (!isFinite(n) || n < 1) return;
    const idx = Math.min(n - 1, current().messages.length - 1);
    const sched = computeSchedule();
    player.playing = false;
    setPlayerTime((sched[idx] || 0) + 1);
    highlightEditorRow(idx);
    E.jumpInput.value = '';
    E.jumpInput.blur();
  });

  /* ---- Message list interactions ---- */
  E.msgList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    const row = e.target.closest('.msg-row');
    if (!row) return;
    const idx = parseInt(row.dataset.index, 10);
    if (!btn) { openMessageModal(idx, null); return; }

    const act = btn.dataset.act;
    const p = current();

    if (act === 'up') {
      if (idx <= 0) return;
      commit(() => {
        const arr = current().messages;
        const tmp = arr[idx - 1]; arr[idx - 1] = arr[idx]; arr[idx] = tmp;
      });
    } else if (act === 'down') {
      if (idx >= p.messages.length - 1) return;
      commit(() => {
        const arr = current().messages;
        const tmp = arr[idx + 1]; arr[idx + 1] = arr[idx]; arr[idx] = tmp;
      });
    } else if (act === 'insert') {
      openMessageModal(null, idx);
    } else if (act === 'dup') {
      commit(() => {
        const arr = current().messages;
        const copy = clone(arr[idx]);
        copy.id = uid();
        arr.splice(idx + 1, 0, copy);
      });
    } else if (act === 'edit') {
      openMessageModal(idx, null);
    } else if (act === 'del') {
      commit(() => { current().messages.splice(idx, 1); });
      toast('Message deleted — press Ctrl+Z to undo');
    }
  });

  /* drag & drop */
  let dragIndex = null;
  E.msgList.addEventListener('dragstart', (e) => {
    const row = e.target.closest('.msg-row');
    if (!row) return;
    dragIndex = parseInt(row.dataset.index, 10);
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', String(dragIndex)); } catch (err) {}
  });
  E.msgList.addEventListener('dragend', () => {
    dragIndex = null;
    $$('.msg-row', E.msgList).forEach(r => r.classList.remove('dragging', 'drag-over'));
  });
  E.msgList.addEventListener('dragover', (e) => {
    const row = e.target.closest('.msg-row');
    if (!row) return;
    e.preventDefault();
    $$('.msg-row', E.msgList).forEach(r => r.classList.remove('drag-over'));
    row.classList.add('drag-over');
  });
  E.msgList.addEventListener('drop', (e) => {
    const row = e.target.closest('.msg-row');
    if (!row) return;
    e.preventDefault();
    const to = parseInt(row.dataset.index, 10);
    if (dragIndex == null || dragIndex === to || isNaN(dragIndex)) return;
    const from = dragIndex;
    dragIndex = null;
    commit(() => {
      const arr = current().messages;
      const [m] = arr.splice(from, 1);
      arr.splice(to, 0, m);
    });
  });

  /* ---- Preview controls ---- */
  $('#viewModeSel').addEventListener('change', (e) => {
    commit(() => { current().settings.viewMode = e.target.value; });
  });
  $('#btnFullscreen').addEventListener('click', enterFullscreen);
  $('#btnFullscreen2').addEventListener('click', enterFullscreen);

  /* ---- Playbar ---- */
  E.btnPlay.addEventListener('click', togglePlay);
  $('#btnRestart').addEventListener('click', restart);
  $('#btnStepFwd').addEventListener('click', stepForward);
  $('#btnStepBack').addEventListener('click', stepBack);

  $('#speedSel').addEventListener('change', (e) => {
    player.speed = parseFloat(e.target.value) || 1;
  });

  E.progress.addEventListener('input', () => {
    const dur = totalDuration();
    const t = (parseInt(E.progress.value, 10) / 1000) * dur;
    player.playing = false;
    setPlayerTime(t);
  });

  E.tgAutoScroll.addEventListener('click', () => {
    commit(() => { const s = current().settings; s.autoScroll = !s.autoScroll; });
  });
  E.tgTyping.addEventListener('click', () => {
    commit(() => { const s = current().settings; s.typing = !s.typing; });
  });
  E.tgSound.addEventListener('click', () => {
    commit(() => { const s = current().settings; s.sounds = !s.sounds; });
    if (current().settings.sounds) beep('in');
  });

  /* ---- Fullscreen overlay controls ---- */
  $('#fsPlay').addEventListener('click', togglePlay);
  $('#fsRestart').addEventListener('click', restart);
  $('#fsExit').addEventListener('click', exitFullscreen);
  E.fsProgress.addEventListener('input', () => {
    const dur = totalDuration();
    const t = (parseInt(E.fsProgress.value, 10) / 1000) * dur;
    player.playing = false;
    setPlayerTime(t);
  });
  E.fsOverlay.addEventListener('click', (e) => {
    if (e.target === E.fsOverlay) togglePlay();
  });

  /* ---- Keyboard shortcuts ---- */
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

    // Escape closes modal / fullscreen
    if (e.key === 'Escape') {
      if (modalCloseFn) { modalCloseFn(); return; }
      if (E.fsOverlay.classList.contains('open')) { exitFullscreen(); return; }
    }

    const mod = e.ctrlKey || e.metaKey;

    if (mod && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if (mod && e.key.toLowerCase() === 's') {
      e.preventDefault();
      saveDB();
      toast('Project saved locally');
      return;
    }
    if (mod && e.key === 'Enter') {
      e.preventDefault();
      openMessageModal(null, null);
      return;
    }

    if (typing || modalCloseFn) return;

    switch (e.key) {
      case ' ':
        e.preventDefault();
        togglePlay();
        break;
      case 'r': case 'R':
        restart();
        break;
      case 'ArrowRight': case '.':
        e.preventDefault();
        stepForward();
        break;
      case 'ArrowLeft': case ',':
        e.preventDefault();
        stepBack();
        break;
      case 'Home':
        e.preventDefault();
        player.playing = false;
        setPlayerTime(0);
        break;
      case 'End':
        e.preventDefault();
        player.playing = false;
        setPlayerTime(totalDuration());
        break;
      case 'f': case 'F':
        if (E.fsOverlay.classList.contains('open')) exitFullscreen();
        else enterFullscreen();
        break;
      case 't': case 'T':
        commit(() => {
          const p = current();
          p.settings.theme = p.settings.theme === 'light' ? 'dark' : 'light';
        });
        break;
    }
  });

  /* ---- Save on unload ---- */
  window.addEventListener('beforeunload', () => { saveDB(); });
}

function highlightEditorRow(idx){
  const row = E.msgList.querySelector(`.msg-row[data-index="${idx}"]`);
  if (!row) return;
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.classList.remove('hl');
  void row.offsetWidth;
  row.classList.add('hl');
}

/* ---------------------------------------------------------------
   25. BOOT
   --------------------------------------------------------------- */
function boot(){
  cacheElements();
  loadDB();

  // migrate: make sure viewMode values are valid
  db.projects.forEach(p => {
    if (p.settings.viewMode !== 'desktop' && p.settings.viewMode !== 'phone') p.settings.viewMode = 'phone';
  });

  wireEvents();
  restart();
  render();
  startLoop();

  $('#viewModeSel').value = current().settings.viewMode || 'phone';
}

document.addEventListener('DOMContentLoaded', boot);
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  // in case DOMContentLoaded already fired
  setTimeout(() => { if (!E.app) boot(); }, 0);
}
</script>
</body>
